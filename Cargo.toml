[workspace]
resolver = "2"
members = [
    "crates/starter-spi",
    "crates/starter-config",
    "crates/starter-observability",
    "crates/starter-prefs",
    "crates/starter-i18n",
    "crates/starter-server",
    "crates/starter-store-sqlite",
    "crates/starter-store-postgres",
    "crates/starter-mcp",
    "crates/starter-grpc",
    "crates/starter-jsonrpc-stdio",
    "crates/starter-auth-token",
    "crates/starter-auth-users",
    "crates/starter-auth-oauth",
    "crates/starter-authz",
    "crates/starter-secrets-keyring",
    "crates/starter-secrets-file",
    "crates/starter-ai",
    "crates/starter-flow-spi",
    "crates/starter-skills",
    "crates/starter-flow",
    "crates/starter-flow-nodes",
    "crates/starter-flow-surfaces",
    "crates/starter-flow-watch",
    "crates/starter-client-rs",
    "crates/starter-cli",
    "crates/starter-tauri",
    "crates/starter-tool-slack",
    "crates/starter-service-slack",
    "crates/starter-tool-telegram",
    "crates/starter-service-telegram",
    "crates/starter-tool-gmail",
    "crates/starter-tool-github",
    "crates/starter-ui-ir",
    "crates/starter-ui-bindings",
    "crates/starter-ui-builder",
    "crates/starter-sdui-routes",
    "crates/starter-ui-theme",
    "crates/starter-port",
    "crates/smoke-tests",
    "examples/minimal",
    "examples/gh-report",
    "examples/notes",
    "examples/flow-agent",
]
# `starter-extensions/` is a sibling cargo workspace (see its Cargo.toml).
# `examples/notes` pulls a handful of its crates in via path dependencies
# (SCOPE.md R3), but the ext crates use `workspace = true` against their
# OWN root — so we must keep cargo from treating those manifests as
# members of *this* workspace.
exclude = ["starter-extensions"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/NubeDev/starter"
rust-version = "1.78"

[workspace.dependencies]
# Internal crates — every consumer crate picks what it needs.
starter-spi              = { path = "crates/starter-spi",              version = "0.1.0" }
starter-config           = { path = "crates/starter-config",           version = "0.1.0" }
starter-observability    = { path = "crates/starter-observability",    version = "0.1.0" }
starter-prefs            = { path = "crates/starter-prefs",            version = "0.1.0" }
starter-i18n             = { path = "crates/starter-i18n",             version = "0.1.0" }
starter-server           = { path = "crates/starter-server",           version = "0.1.0" }
starter-store-sqlite     = { path = "crates/starter-store-sqlite",     version = "0.1.0" }
starter-store-postgres   = { path = "crates/starter-store-postgres",   version = "0.1.0" }
starter-mcp              = { path = "crates/starter-mcp",              version = "0.1.0" }
starter-grpc             = { path = "crates/starter-grpc",             version = "0.1.0" }
starter-jsonrpc-stdio    = { path = "crates/starter-jsonrpc-stdio",    version = "0.1.0" }
starter-auth-token       = { path = "crates/starter-auth-token",       version = "0.1.0" }
starter-auth-users       = { path = "crates/starter-auth-users",       version = "0.1.0" }
starter-auth-oauth       = { path = "crates/starter-auth-oauth",       version = "0.1.0" }
starter-authz            = { path = "crates/starter-authz",            version = "0.1.0" }
starter-secrets-keyring  = { path = "crates/starter-secrets-keyring",  version = "0.1.0" }
starter-secrets-file     = { path = "crates/starter-secrets-file",     version = "0.1.0" }
starter-ai               = { path = "crates/starter-ai",               version = "0.1.0" }
starter-flow-spi         = { path = "crates/starter-flow-spi",         version = "0.1.0" }
starter-flow             = { path = "crates/starter-flow",             version = "0.1.0" }
starter-skills           = { path = "crates/starter-skills",           version = "0.1.0" }
starter-flow-nodes       = { path = "crates/starter-flow-nodes",       version = "0.1.0" }
starter-flow-surfaces    = { path = "crates/starter-flow-surfaces",    version = "0.1.0" }
starter-flow-watch       = { path = "crates/starter-flow-watch",       version = "0.1.0" }
starter-client-rs        = { path = "crates/starter-client-rs",        version = "0.1.0" }
starter-cli              = { path = "crates/starter-cli",              version = "0.1.0" }
starter-tool-slack       = { path = "crates/starter-tool-slack",       version = "0.1.0" }
starter-service-slack    = { path = "crates/starter-service-slack",    version = "0.1.0" }
starter-tool-telegram    = { path = "crates/starter-tool-telegram",    version = "0.1.0" }
starter-service-telegram = { path = "crates/starter-service-telegram", version = "0.1.0" }
starter-ui-ir            = { path = "crates/starter-ui-ir",            version = "0.1.0" }
starter-ui-bindings      = { path = "crates/starter-ui-bindings",      version = "0.1.0" }
starter-ui-builder       = { path = "crates/starter-ui-builder",       version = "0.1.0" }
starter-sdui-routes      = { path = "crates/starter-sdui-routes",      version = "0.1.0" }
starter-ui-theme         = { path = "crates/starter-ui-theme",         version = "0.1.0" }
starter-tool-gmail       = { path = "crates/starter-tool-gmail",       version = "0.1.0" }
starter-port             = { path = "crates/starter-port",             version = "0.1.0" }
starter-tool-github      = { path = "crates/starter-tool-github",      version = "0.1.0" }

# Common third-party deps. Per R5, no crate should pull these by default
# unless its job genuinely needs them.
serde       = { version = "1",   features = ["derive"] }
serde_json  = "1"
thiserror   = "1"
anyhow      = "1"
tracing     = "0.1"
async-trait = "0.1"
futures     = "0.3"
bytes       = "1"
uuid        = { version = "1", features = ["v4", "v5", "serde"] }
chrono      = { version = "0.4", default-features = false, features = ["serde", "clock"] }

# Hot-reload (DOCS/flow/scope/hot-reload.md):
# `blake3` hashes the canonicalised body for HR1's idempotent
# short-circuit. `arc-swap` is the wait-free swap primitive HR2
# uses for the per-flow `ActiveTopology` pointer (D-HR1).
blake3      = "1"
arc-swap    = "1"

# Server-only.
axum        = { version = "0.8", features = ["macros"] }
tokio       = { version = "1",   features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower       = "0.5"
tower-http  = { version = "0.6", features = ["cors", "trace"] }
utoipa      = { version = "5",   features = ["axum_extras", "uuid", "chrono"] }
http        = "1"

# Units of measurement — R4 of DOCS/user/scope/SCOPE.md authorises
# this single dependency on `starter-spi` so conversion factors are
# delegated to `uom` rather than hand-written. Used only by the
# `starter_spi::units` module.
uom         = { version = "0.36", default-features = false, features = ["f64", "si", "std"] }

# BCP-47 language-tag parsing for the `starter_spi::i18n::LanguageTag`
# newtype. Authorised by the SCOPE Library-choices table on
# `starter-spi`; used only by the `starter_spi::i18n` module.
icu_locale_core = { version = "2", default-features = false, features = ["alloc"] }

# Flow node-settings schema (DOCS/flow/scope/settings.md, Phase S-1).
# `schemars` derives JSON Schema from the kind's `Settings` Rust struct
# — the single source of truth, so the schema cannot drift from the
# `serde` deserialiser. `jsonschema` performs the publish-time
# validation. Both land in `starter-flow-spi` so kinds outside the
# workspace can implement `NodeBehavior::config_schema` without re-
# adding the deps. Default-features off on `jsonschema` to keep the
# SPI dep tree free of `reqwest` / TLS (we only need the in-process
# validator, never the remote `$ref` resolver).
schemars   = { version = "0.8", features = ["preserve_order"] }
jsonschema = { version = "0.18", default-features = false }

# Storage.
sqlx        = { version = "0.8", default-features = false, features = ["runtime-tokio", "macros"] }
base64      = "0.22"

# Crypto primitives — used by `starter-auth-token` for the claim flow,
# and `starter-auth-users` for password hashing + bearer tokens.
rand          = "0.8"
sha2          = "0.10"
subtle        = "2"
password-auth = "1"

# Observability.
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
prometheus  = "0.14"

# Secret material handling. Re-exported from `starter-spi` so provider
# crates don't pick up `secrecy` directly (SCOPE rule R5).
secrecy     = { version = "0.10", features = ["serde"] }

# Client / CLI.
reqwest     = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
clap        = { version = "4",    features = ["derive", "env"] }
rpassword   = "7"

# gRPC. Only the notes demo uses these — they prove a consumer can
# layer in surfaces (gRPC, GraphQL, anything tonic-compatible) that
# starter itself doesn't ship.
tonic       = "0.12"
tonic-build = "0.12"
prost       = "0.13"

# Config.
figment     = { version = "0.10", features = ["toml", "env"] }
toml        = "0.8"
