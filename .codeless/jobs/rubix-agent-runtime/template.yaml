name: rubix-agent-runtime
goal: |
  Make the rubix MCP demo a real LLM reasoning loop instead of the
  hand-rolled imposter currently in
  rubix/crates/rubix-agent/src/boot/mcp.rs (~250 lines of
  FlowBody::new() + fake com.rubix.diag-render NodeBehavior that
  returns hardcoded Spanish strings). Three blocks merged in one
  PR against codeless/rubix-agent-runtime, three REVIEW gates
  between them, strictly linear: Block A (rubix-side, YAML loader
  parses all six bundled flows into real FlowBody and deletes the
  hand-rolled flow + fake diag-render node kind), Block B (starter
  upstream — new crates starter-ai-agent providing the
  runner-agnostic AgentLoop primitive per the sketch in SCOPE.md
  and starter-flow-node-loop providing the thin NodeBehavior
  wrapper for the ai-agent kind, plus LONG-TERM.md documenting
  the deferred concerns: multi-turn sessions / cost cap /
  cancellation / streaming / skill enforcement), Block C
  (rubix-side, boot::ai::build_runner returns Arc<dyn AiRunner>
  via starter_ai::runners::claude::ClaudeRunner with config knob
  for AnthropicRunner, boot::mcp::build_mcp_surface registers an
  AiAgentNode wired with that runner + the host's tool registry
  so the bundled flows fire real Claude CLI reasoning loops). The
  six pre-answered decisions Q1 / loop scope / provider / cleanup
  / layering / PR shape are LOCKED in SCOPE.md §"What is already
  answered" — do NOT re-litigate. Do NOT redo anything from PR
  27 or PR 28 (six thin-slice PRs + the demo wiring are on
  master at 8d84235 — touching them creates conflicts). Thin
  v0 means single-turn LLM → tool dispatch → response; no
  SessionStore persistence, no cost-cap, no Cancel observation
  beyond outer tokio::time::timeout — the LONG-TERM.md doc is
  how the next extension job picks up from here. Three work
  stages, three REVIEW gates.

stages:
  - "stage 1 (block A, rubix YAML loader) — replace the hand-rolled flow in rubix/crates/rubix-agent/src/boot/mcp.rs with a real YAML loader: (1) add rubix/crates/rubix-flows/src/load.rs (verb file per FILE-LAYOUT, ~150 lines max) exposing `pub fn load_all() -> Result<Vec<(FlowId, FlowRevisionId, FlowBody)>, LoadError>` that walks rubix_flows::BUNDLED for every *.yaml file under flows/, deserialises each via serde_yaml into an intermediate typed struct (matches the shape of scheduled-system-check.yaml: id, description, trigger, nodes[{id, kind, config}], links[]), and converts each into a starter_flow::definition::body::FlowBody — the root node's kind must be `ai-agent` (the KIND_ID constant from starter-flow-node-loop which Block B introduces; during Block A development use the string literal `\"ai-agent\"` since the crate doesn't exist yet); a unit test in load.rs (`#[cfg(test)] mod tests`) parses each of the six bundled YAMLs and asserts flow_id, root node id, root node kind = `\"ai-agent\"`; (2) rewrite rubix/crates/rubix-agent/src/boot/mcp.rs::build_mcp_surface to delete the entire hand-rolled FlowBody::new() chain (lines roughly 82–356 today including the fake com.rubix.diag-render NodeBehavior + its NodeKindRegistry::register + the hardcoded Spanish Diagnostic), call rubix_flows::load_all() instead, and loop registering each (flow_id, rev, body) tuple via FlowRegistry::register followed by FlowAsTool::from_registry to land each as one MCP tool — the function still returns the assembled ToolRegistry + axum::Router; (3) grep -rn 'diag-render\\|diag_render\\|FlowBody::new' rubix/crates/rubix-agent/src/ must return empty after this stage (the fake kind + hand-rolled body are gone); (4) rewrite rubix/docs/design/flows/README.md from whatever stale or placeholder wording it carries today into present-tense: the loader is the contract, all six bundled YAMLs become MCP tools, the hand-rolled flow is gone — no 'PR 3 unblocked', no 'stub', no 'placeholder'; exit signals are `cargo build -p rubix-flows -p rubix-agent` green, the load.rs unit test passes against all six YAMLs, the boot startup log line shows `mcp_tools=6` (was 1 before this stage), and `./rubix/scripts/lint-doc-refs.sh` clean — note that during the A-only state attempting to *invoke* any registered flow fails because the ai-agent node kind still has no behaviour bound, which is expected and what Block C fixes"

  - "REVIEW block A — confirm `grep -rn 'diag-render\\|diag_render\\|FlowBody::new' rubix/crates/rubix-agent/src/` returns empty (hand-rolled flow + fake kind are gone); confirm the load.rs unit test exercises ALL six YAMLs not just one (use `for entry in BUNDLED.files()` or similar so adding a seventh YAML auto-tests); confirm boot::mcp::build_mcp_surface uses FlowRegistry::register + FlowAsTool::from_registry exclusively (no hand-rolled tool registration); confirm the startup log line moves from `mcp_tools=1` to `mcp_tools=6`; confirm docs/design/flows/README.md is present-tense with no 'PR 3', 'stub', 'placeholder', 'unblocked' wording; confirm `./rubix/scripts/lint-doc-refs.sh` returns clean; eyeball load.rs to confirm it's ≤150 lines and uses serde_yaml not a hand-rolled YAML parser; confirm the LoadError type carries enough context (filename + line if possible) to debug a malformed YAML"

  - "stage 2 (block B, starter upstream — starter-ai-agent + starter-flow-node-loop) — land two new upstream crates implementing the long-term architecture from SCOPE.md §The two-crate split — pre-drafted API sketch: (1) add crates/starter-ai-agent/ following the exact crate layout in SCOPE.md (Cargo.toml with starter-spi[ai, tool] + async-trait + thiserror + tracing; src/lib.rs barrel; src/error.rs AgentError enum with Runner/Tool/UnknownTool/Unparseable variants; src/tool_set.rs ToolSet struct holding Vec<Arc<dyn Tool>>; src/loop.rs AgentLoop struct + AgentLoop::new + AgentLoop::run — implement the run body per the sketch's numbered steps: build RunnerInput from prompt + ToolSet definitions, call self.runner.run, inspect tool_calls in RunResult, for each ToolCall look up the tool via self.tools.get and call tool.invoke().await mapping errors to AgentError::Tool / UnknownTool, if any tool calls happened build a follow-up RunnerInput carrying tool results and re-call runner, return final reply text; src/prompt.rs holding the prompt + tool-call serialisation conversions); add a starter-ai-agent::testing module exposing a MockAiRunner that returns canned RunResult values — used by the three unit tests under tests/: single_turn_no_tools_test.rs (runner returns final reply directly), single_turn_with_tools_test.rs (runner returns tool call → mock tool returns result → second runner call returns final reply), unknown_tool_test.rs (runner asks for a tool not in the ToolSet → AgentError::UnknownTool); (2) add crates/starter-flow-node-loop/ per the SCOPE.md sketch (Cargo.toml depending on starter-ai-agent + starter-flow-spi + starter-spi[ai, tool] + async-trait + thiserror; src/lib.rs barrel; src/node.rs AiAgentNode struct + AiAgentNode::new(Arc<dyn AiRunner>, Vec<Arc<dyn Tool>>) + AiAgentNode::KIND_ID = `\"ai-agent\"` + impl NodeBehavior for AiAgentNode reading prompt from input slot, filtering self.tools by allowed_tools from config slot if present, building a fresh AgentLoop, calling .run().await, mapping AgentError to NodeError, writing reply to `out` slot of the returned SlotMap); one integration test at tests/invoke_test.rs spinning up a minimal in-memory starter-flow engine, registering AiAgentNode under KIND_ID, firing a tiny flow whose root is ai-agent, asserting the reply lands in the out slot — uses MockAiRunner; (3) write crates/starter-ai-agent/LONG-TERM.md sectioning out the five deferred concerns: Multi-turn session persistence via SessionStore (names the future API: AgentLoop::with_session_store(...) and per-turn checkpoint blob shape), Cost cap (AgentLoop::with_cost_cap(usd), enforced between turns, AgentError::CostCapHit), Cooperative cancellation via starter_spi::ai::Cancel observed inside the loop with AgentError::Cancelled, Tool-call streaming (today loop returns only final reply; future shape returns AgentEvent::ToolStart/ToolComplete/Thinking stream matching rubix-spi's R13 SSE taxonomy), Skill enforcement (today caller filters allowed_tools upfront; future contract makes skill resolution first-class); (4) add both crates to starter's workspace Cargo.toml under [workspace.members] AND under [workspace.dependencies] with path entries; (5) update rubix/docs/design/starter-changes/README.md flipping the existing starter-flow-node-loop entry to `**landed (in-tree)**` and adding a new entry for starter-ai-agent describing the runner-agnostic primitive layer; exit signals are `cargo build -p starter-ai-agent -p starter-flow-node-loop` green, `cargo test -p starter-ai-agent` green with all three unit tests passing against MockAiRunner, `cargo test -p starter-flow-node-loop` green with the invoke_test integration test passing, `cargo clippy --workspace -- -D warnings` clean (touch starter-spi feature exposure if `tool` isn't already on the public surface), LONG-TERM.md exists with all five sections, the workspace lists both crates, and the starter-changes ledger entries are accurate"

  - "REVIEW block B — confirm `cargo tree -p starter-ai-agent --depth 1` shows NO starter-flow-spi dep (the primitive is runner-agnostic and engine-agnostic per the architectural commitment — if starter-flow-spi creeps in, the two-crate split has been violated); confirm `cargo tree -p starter-flow-node-loop --depth 1` shows BOTH starter-ai-agent AND starter-flow-spi (the wrapper crate correctly depends on both layers); confirm the three starter-ai-agent unit tests genuinely exercise the loop body (read each test, look for `MockAiRunner` returning a non-empty tool_calls vector, assert the loop dispatches and re-prompts — a test that just asserts `runner.run` was called is not a real round-trip test); confirm AgentLoop::run is `async fn` not a sync `fn` returning a Future-typed alias (must match the sketch); confirm AgentError carries all four variants from the sketch (Runner, Tool, UnknownTool, Unparseable) and no extras invented mid-implementation; confirm LONG-TERM.md has all five named sections with concrete API surface sketches (not just prose 'we should add sessions later'); confirm both crates appear in BOTH the workspace's [workspace.members] AND [workspace.dependencies]; confirm the starter-changes ledger marks starter-flow-node-loop as landed (in-tree) with the file paths; confirm `./rubix/scripts/lint-doc-refs.sh` returns clean across the new crates' source files"

  - "stage 3 (block C, rubix wire AiRunner + register node kind) — make the bundled flows fire real Claude CLI loops: (1) add rubix/crates/rubix-agent/src/boot/ai.rs (verb file per FILE-LAYOUT, ~80 lines max) exposing `pub fn build_runner(cfg: &AgentConfig) -> Result<Arc<dyn AiRunner>, AiError>` that defaults to ClaudeRunner from starter_ai::runners::claude::ClaudeRunner (zero-config; uses the operator's `claude` CLI on PATH) and reads cfg.ai_provider for a future Anthropic switch — for v0 only ClaudeCli is wired, the Anthropic branch returns AiError::Unimplemented with a localised message pointing at the LONG-TERM doc; (2) extend rubix/crates/rubix-agent/src/boot/config.rs::AgentConfig with an optional `ai_provider: Option<String>` field defaulting to `\"claude-cli\"` (parses any starter-spi Provider variant string); (3) update rubix/dev/agent.toml with a commented `# ai_provider = \"claude-cli\"` line documenting the default; (4) extend boot::mcp::build_mcp_surface (from Block A) to additionally: construct an AiAgentNode via AiAgentNode::new(runner, tool_registry_snapshot) where runner comes from boot::ai::build_runner and tool_registry_snapshot is the same Vec<Arc<dyn Tool>> already built by registry::build_tool_registry, then register the node behavior in the NodeKindRegistry under AiAgentNode::KIND_ID (`\"ai-agent\"`) — this is the line that makes the bundled flows actually invokable; (5) update the existing rubix/crates/rubix-agent/tests/mcp_disk_test.rs to assert the response Diagnostic carries real disk numbers (not the hardcoded Spanish strings from the deleted hand-rolled flow) — if the test currently asserts an exact Spanish string from the imposter, it needs to relax to assert structural properties (code = rubix.system.disk.{ok,warn,full}, params.percent is numeric, params.free is numeric); the test must use a recorded-LLM fixture via starter-server::testing — NO live LLM in CI; if no fixture exists yet, record one and check it in under rubix/crates/rubix-agent/tests/fixtures/; (6) same recorded-LLM treatment for tests/mcp_stdio_test.rs for both en-US and es-AR _meta.acceptLanguage values; (7) rewrite rubix/docs/design/agent/README.md describing the real runtime wiring path present-tense (ClaudeRunner → AgentLoop → AiAgentNode → bundled flow → MCP); rewrite rubix/docs/design/ai-providers/README.md from placeholder to present-tense documenting the boot::ai::build_runner contract + the config knob; exit signals are `cargo build -p rubix-agent` green, `cargo test -p rubix-agent --test mcp_disk_test` green against the recorded fixture, `cargo test -p rubix-agent --test mcp_stdio_test` green for both locales against fixtures, the boot startup log line confirms the AiAgentNode is registered (e.g. add a `node_kinds=N` field naming `ai-agent` in the list), a `tools/list` MCP call returns six tools (was one before A; still six after C but now actually invokable), `./rubix/scripts/lint-doc-refs.sh` clean, both design docs are present-tense"

  - "REVIEW block C — confirm boot::ai::build_runner defaults to ClaudeCli with zero config (no env vars, no API keys, no panic on missing config); confirm cfg.ai_provider = `\"anthropic-rest\"` returns AiError::Unimplemented not a partial implementation (an unimplemented branch is honest; a half-broken anthropic path is a trap); confirm AgentConfig.ai_provider has a sensible default that loads cleanly from rubix/dev/agent.toml (round-trip via the existing boot::config test); confirm AiAgentNode is the ONLY new node kind registered (no leftover diag-render or other fakes); confirm mcp_disk_test asserts STRUCTURAL properties of the Diagnostic (code matches the regex `rubix.system.disk.(ok|warn|full)`, params.percent is a numeric type) not literal strings (literal strings from the deleted hand-rolled flow are a regression vector); confirm the recorded-LLM fixture is checked in under rubix/crates/rubix-agent/tests/fixtures/ and is non-empty; confirm `cargo test -p rubix-agent --test mcp_disk_test` PASSES against current master (i.e. the recorded fixture matches the current loop output — if it doesn't, regenerate the fixture, do not loosen the assertions); confirm `cargo test -p rubix-agent --test mcp_stdio_test` covers both en-US AND es-AR; confirm the agent design doc names the four hops in the runtime path (ClaudeRunner → AgentLoop → AiAgentNode → bundled flow → MCP); confirm the ai-providers doc explains the config knob with at least one worked example (e.g. agent.toml `ai_provider = \"claude-cli\"`); confirm `./rubix/scripts/lint-doc-refs.sh` returns clean; confirm a `tools/list` MCP call (via the in-memory transport in mcp_disk_test's setup) returns six tool ids — the five other goal flows from Block A become real tools too even though their bundled YAMLs are simpler than scheduled-system-check's (they all still surface through FlowAsTool); document in the PR description the exact command sequence the human runs to smoke-test end-to-end against a live Claude CLI installation (the v0 demo path)"
