name: starter-prefs-spi
goal: |
  Land Phase 0 of DOCS/user/scope/SCOPE.md — the wire surface for
  preferences, units, and i18n inside starter-spi only. No storage,
  no routes, no middleware, no new crates. After this job
  starter-spi exposes three new modules — preferences (DTOs), units
  (Quantity / Unit / QuantityDef / UnitRegistry / StaticRegistry +
  normalize_for_storage), and i18n (LanguageTag, MessageKey,
  Diagnostic, DiagnosticParam) — so that downstream design (the
  starter-prefs and starter-i18n crates in Phases 1, 3) can begin
  without committing to the wire format twice. R4 of the SCOPE
  applies — Quantity and Unit are closed enums; new variants
  require a PR on starter-spi and the friction is intentional, so
  this job is the one chance to get the enum boundary right.

stages:
  - 'stage 1 — lock the Phase 0 wire boundary before code lands. Confirm: (a) the closed-enum Quantity variants for v1 are temperature, pressure, speed, length, mass; (b) the closed-enum Unit variants for v1 are exactly those listed in the SCOPE Preferences-model column comments — C, F, kPa, psi, bar, m/s, km/h, mph, knot, m, ft, kg, lb — plus any canonical-storage units the SCOPE Hard-rules R1 names (°C, kPa, m/s, m, kg) which are already covered; (c) the canonical SI unit per Quantity per R1 is C / kPa / m_per_s / m / kg; (d) money is i64 minor-units + ISO 4217 code (currency stays out of the Unit enum because R1 separates Money from physical quantities); (e) ratio canonical is 0.0..=1.0 per the Decisions-made block — Percent is display-only and the registry rejects the {quantity: Ratio, unit: Percent} slot pair (note: this enforcement lands in Phase 1 resolver code, but the v1 Quantity enum does NOT include Ratio yet because no field on the Preferences model needs it — defer the Ratio variant to a follow-up PR if a consumer surfaces a need); (f) Theme enum variants are Light, Dark, System and Theme is user-only (no org fallback); (g) DateFormat variants are Auto, IsoYMD (YYYY-MM-DD), DmySlash (DD/MM/YYYY), MdySlash (MM/DD/YYYY); (h) TimeFormat variants are Auto, H24, H12; (i) WeekStart variants are Auto, Monday, Sunday; (j) NumberFormat variants are Auto, CommaDot (1,234.56), DotComma (1.234,56), SpaceComma (1 234,56); (k) UnitSystem variants are Metric, Imperial. Record decisions in SCOPE.md under "Decisions" with the rule + revisit trigger. No code in this stage.'
  - 'REVIEW Phase 0 wire boundary — closed-enum membership for Quantity, Unit, Theme, DateFormat, TimeFormat, WeekStart, NumberFormat, UnitSystem locked. Stages 3 through 6 bind to these enums; R4 says renaming / removing a variant costs a major SemVer bump + a deprecation alias for at least one major. Get the list right here or pay the version-bump cost later.'
  - 'stage 3 — starter-spi::units module. Add crates/starter-spi/src/units/ as a directory module (mod.rs declares the public surface). Variants: pub enum Quantity (Temperature, Pressure, Speed, Length, Mass — all #[non_exhaustive] at the variant level is wrong because that defeats the closed-enum guarantee R4 names; instead the enum is closed and additions go via PR — the type carries a doc comment that quotes R4 verbatim). pub enum Unit with the variants locked in stage 1; both enums derive serde + clap-friendly Display + FromStr via the workspace style (UPPERCASE serde rename for codes like C / F / kPa / psi if the SCOPE wants lowercase string codes — confirmed lowercase: "celsius", "fahrenheit", "kilopascal", "psi", "bar", "meter_per_second", "kilometer_per_hour", "mile_per_hour", "knot", "meter", "foot", "kilogram", "pound" matching the SCOPE Per-series-unit-metadata example "fahrenheit"). pub struct QuantityDef { canonical: Unit, allowed_units: Vec<Unit> } (or &''static [Unit] if the registry stays compile-time). pub trait UnitRegistry with get(quantity) -> Option<&QuantityDef> and supports(quantity, unit) -> bool. pub struct StaticRegistry implementing UnitRegistry, constructed once and cached per starter-spi process. pub fn normalize_for_storage(quantity, value, source_unit) -> f64 returning the canonical-SI value via uom internally — never hand-written conversion factors per R4 ("Conversion factors are delegated to uom internally"). uom is a new dep on starter-spi but R4 explicitly authorises it; cargo tree before/after diff to confirm the dep land is bounded to uom + its transitive deps. Unit tests cover: StaticRegistry::get for every Quantity returns the SCOPE-mandated canonical Unit; supports() returns true for each {Quantity, Unit} pair the SCOPE enumerates and false for cross-quantity pairs (e.g. Quantity::Temperature + Unit::Pound); normalize_for_storage for fahrenheit -> celsius (72.4 F = 22.444... C ±epsilon) and psi -> kilopascal and mile_per_hour -> meter_per_second and foot -> meter and pound -> kilogram; canonical-equals-canonical is identity. cargo test for starter-spi green; clippy warnings-as-errors green.'
  - 'stage 4 — starter-spi::preferences module. Add crates/starter-spi/src/preferences/ (or single-file preferences.rs depending on stage-1 sub-decision on layout). Public types — pub enum UnitSystem (Metric, Imperial), pub enum Theme (Light, Dark, System), pub enum DateFormat (Auto, IsoYMD, DmySlash, MdySlash), pub enum TimeFormat (Auto, H24, H12), pub enum WeekStart (Auto, Monday, Sunday), pub enum NumberFormat (Auto, CommaDot, DotComma, SpaceComma). pub struct ResolvedPreferences with fields locked in stage 1 — timezone: String (IANA), locale: String (BCP-47), language: String (BCP-47 lang subtag), unit_system: UnitSystem, temperature_unit/pressure_unit/speed_unit/length_unit/mass_unit: Unit, date_format: DateFormat, time_format: TimeFormat, week_start: WeekStart, number_format: NumberFormat, currency: String (ISO 4217), theme: Theme. ResolvedPreferences has NO Option fields and NO "auto" string per R3 — the resolver in Phase 1 converts NULLs and "auto" placeholders into concrete values before this struct is constructed. pub struct PreferencesPatch — same fields, all Option<T>, used by PATCH endpoints (Phase 1) to express "set this, leave the rest alone, null reverts to inherit." All serde derives use #[serde(rename_all = "snake_case")] for enum variants matching the SCOPE wire format (the column-comment strings "metric" / "imperial" / "light" / "dark" / "system" / "monday" / "sunday" map directly). All types derive serde + utoipa::ToSchema (workspace R7: every public DTO appears in openapi.json). Unit tests cover JSON round-trip for ResolvedPreferences with every enum variant, PreferencesPatch serde with mixed Some/None, snake_case wire form matches the SCOPE column-comment strings byte-for-byte.'
  - 'stage 5 — starter-spi::i18n module. Add crates/starter-spi/src/i18n/ or i18n.rs. Public types — pub struct LanguageTag (BCP-47 string, validated on construction via icu_locale parsing — icu_locale is a new dep on starter-spi per the SCOPE Library-choices table; cargo tree diff confirms it lands here, not later); pub struct MessageKey (a reverse-DNS-style string like "flow.error" or "auth.token.expired", validated by a thin newtype constructor that rejects empty / whitespace / non-printable input — same validation friction as starter-flow-spi''s KindId from the merged sibling job); pub struct DiagnosticParam (an enum or struct holding the typed values a translation interpolates — at minimum String, i64, f64, bool, and a Timestamp variant carrying the UTC epoch ms per R1); pub struct Diagnostic { code: MessageKey, params: BTreeMap<String, DiagnosticParam> }. Serde + utoipa derives per workspace R7. Unit tests cover: LanguageTag accepts "en", "en-US", "en-AU", "zh-TW"; rejects "" and "not a tag" and "en_US" (underscore is wrong); MessageKey rejects empty / leading-dot / trailing-dot / double-dot; Diagnostic JSON round-trip preserves param order (BTreeMap not HashMap so the wire form is deterministic — same posture starter-flow-spi takes on SlotMap).'
  - 'stage 6 — lib.rs wiring + module visibility + dep-tree baseline. Update crates/starter-spi/src/lib.rs to declare pub mod preferences; pub mod units; pub mod i18n; in alphabetical order matching the existing mod declarations. Add uom and icu_locale to crates/starter-spi/Cargo.toml [dependencies] with default-features = [] and only the features each module actually uses (uom: si feature for SI units; icu_locale: no additional features beyond default-parsing). Commit a NEW baseline file at DOCS/user/scope/starter-spi-deps.baseline.txt generated via `cargo tree -p starter-spi --edges normal` — the analog of starter-flow-spi-deps.baseline.txt landed by the merged starter-flow-scaffold job. Verify the new baseline contains uom and icu_locale and their direct dependencies and nothing surprising (no tokio-runtime additions; no chrono; no time). The existing DOCS/flow/scope/starter-flow-spi-deps.baseline.txt is UNCHANGED — starter-flow-spi does not depend on starter-spi''s new modules so its tree should not move; verify with a diff-check at stage end.'
  - 'stage 7 — workspace verify + the Phase 0 SCOPE smoke. cargo build workspace all-features green; cargo clippy workspace all-targets warnings-as-errors green; cargo fmt check green. Run the "Headless appliance keeps working" smoke from the user SCOPE Smoke-tests block — confirm a binary built with starter-auth-token + starter-secrets-file and NOT depending on starter-prefs / starter-i18n still builds; this is structural in Phase 0 because the two new crates do not exist yet, but the smoke verifies starter-spi''s new modules do not pull middleware / routes / migrations into the headless build (no axum or tower deps slipped into starter-spi; cargo tree -p starter-spi --edges normal contains neither). Confirm the existing starter-flow-spi baseline is unchanged (diff DOCS/flow/scope/starter-flow-spi-deps.baseline.txt against current cargo tree -p starter-flow-spi --edges normal — must be byte-for-byte). Confirm no crate in the workspace gained an unintended dep on the new modules — only test code in starter-spi itself should import them at this phase.'
