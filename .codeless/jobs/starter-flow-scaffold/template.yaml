name: starter-flow-scaffold
goal: 'Lay the core dirs and files for starter-flow per DOCS/flow/scope/SCOPE.md — Phase 1 contracts in full (starter-flow-spi traits + types + re-exports, zero runtime logic, depends only on starter-spi) plus empty crate skeletons for starter-flow (the engine), starter-flow-nodes (built-in node kinds), and starter-flow-surfaces (FlowAsTool / FlowAsService wrappers). The workspace builds end-to-end; nothing executes yet. The starter-ext-flow adapter crate is deliberately NOT here — it lives in the separate starter-extensions/ workspace per the flow SCOPE Relationship-to-existing-crates block, and lands once that workspace exists. This job is the foundation the rest of the flow phases (engine, persistence, ai-agent node kind, remaining built-in kinds, three-level stop) build on; doing it first makes the agent-vs-flow decision moot because both folds into the same node-graph primitive.'

stages:
  - 'lock the scaffold-relevant decisions before code lands — confirm starter-flow / starter-flow-nodes / starter-flow-surfaces ship with default-features=[] (workspace minimal-by-default policy; a consumer who does not want flows pays nothing per the SCOPE Default-features stay empty line), confirm per-node-kind cargo features in starter-flow-nodes (transform, tool-call, ai-agent, branch, merge, gate, subflow, trigger-explicit, trigger-event, trigger-schedule, trigger-webhook, http-out, log, sleep — one feature per built-in kind so a consumer pulls only what it uses), pin the starter-flow-spi cargo-tree baseline at DOCS/flow/scope/starter-flow-spi-deps.baseline.txt (the workspace-builds-without-adk-rust smoke test compares against it; updated only when starter-flow-spi itself changes), confirm starter-ext-flow is OUT of scope here because it lives in the starter-extensions/ workspace (the adapter lands in its own job once that workspace exists, per the flow SCOPE relationship block). D1 (adk-rust vs lifted Codeless Runner) is Phase 4 and not pre-resolved here. Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions before any crate scaffolds land'
  - 'Phase 1 — starter-flow-spi contracts crate per the SCOPE What lands in starter-flow-spi block, in full. Add the crate at crates/starter-flow-spi/, Cargo.toml depending only on starter-spi, lib.rs with: pub mod node containing NodeBehavior trait (async invoke + on_lifecycle taking &self per R5), NodeId / KindId reverse-DNS newtypes that validate on construction per R10, SlotRef, SlotValue enum (Null/Bool/Int/Float/String/Bytes/Json) with #[non_exhaustive], SlotMap type alias as BTreeMap<String, SlotValue>; pub mod graph containing GraphStore trait (async write_slot / read_slot / subscribe) and WriteSlotOpts (carrying the replay: bool flag per R2 replay-does-not-re-fire-subscribers rule) and SubscribeOpts and SubscriptionStream associated type; pub mod flow containing FlowId / FlowRevisionId / RunId newtypes and FlowEvent enum (RunStarted / NodeStarted / NodeEmitted / NodeFailed / RunCompleted / RunFailed / RunCancelled) with #[non_exhaustive] and FlowStore / RunStore traits as empty seams (CRUD shapes documented but no methods required yet — flesh out in Phase 3); pub mod skill re-exporting starter_skills::SkillSelection (note in a doc-comment that starter-skills is not yet a workspace member — re-export resolves once it ships; the re-export line is feature-gated behind a default-off `skills` feature so the workspace still builds today). Re-export Cancel + Principal + SecretString from starter-spi at crate root. Apply #[non_exhaustive] discipline to every public enum and config struct per the SCOPE What-lands-in-starter-flow-spi block. Zero runtime logic, zero I/O, no tokio runtime in the dep tree beyond what starter-spi pulls. Commit DOCS/flow/scope/starter-flow-spi-deps.baseline.txt alongside, generated via cargo tree -p starter-flow-spi --edges normal'
  - 'starter-flow crate skeleton at crates/starter-flow/ — Cargo.toml depending on starter-flow-spi (default-features=[]) plus tokio with the rt-multi-thread feature, lib.rs declaring the module layout the engine will populate in Phases 2/3/7 with one-line doc comments referencing the SCOPE section that owns each: graph (the single write chokepoint per R2), registry (NodeKindRegistry + FlowRegistry per the SCOPE crate block), propagator (the synchronous tokio loop per R2 and the rubix live_wire.rs Decisions reference), engine (the Starting → Running → Pausing → Paused → Resuming → Stopping → Stopped state machine per R12), run (Cancel plumbing + RunState + checkpointing per R6), state (engine-typed RunState per R6 — the simplification that dissolved the adk-rust checkpoint blob). Each module is `pub mod x;` pointing at an empty `x.rs` (or `x/mod.rs`) containing only a module-level doc comment with the SCOPE section name and a Phase-N marker. cargo check -p starter-flow green'
  - 'starter-flow-nodes crate skeleton at crates/starter-flow-nodes/ — Cargo.toml depending on starter-flow-spi (default-features=[]), one cargo feature per built-in node kind exactly matching the list locked in stage 1 (transform, tool-call, ai-agent, branch, merge, gate, subflow, trigger-explicit, trigger-event, trigger-schedule, trigger-webhook, http-out, log, sleep), default-features = []. lib.rs declares one `#[cfg(feature = "<kind>")] pub mod <kind>;` per feature; each module file contains only the kind id constant (e.g. `pub const KIND_ID: &str = "starter.flow.transform";` matching R10 reverse-DNS in the `starter.flow.*` reserved namespace) and a module-level doc comment naming the SCOPE section that specifies its semantics. No NodeBehavior impl yet — those land in Phase 4 (ai-agent) and Phase 5 (the remainder). cargo check --features=all-kinds (a convenience aggregate feature that enables every kind feature) green'
  - 'starter-flow-surfaces crate skeleton at crates/starter-flow-surfaces/ — Cargo.toml depending on starter-flow-spi + starter-spi (default-features=[]), lib.rs declares pub struct FlowAsTool { /* TODO Phase 3 — fields per R8 */ } and pub struct FlowAsService { /* TODO Phase 3 — fields per R9 */ } as empty structs with doc comments naming the SCOPE sections that specify their semantics (R8 Nodes-are-not-Tools-Tools-are-one-node-kind for FlowAsTool, R9 Flows-are-first-class-Tools-and-first-class-Services for FlowAsService). No trait impls — the Tool / Service impls land in Phase 3 after the engine exists. The crate compiles as a public-API placeholder; per CLAUDE.md no-half-finished-implementation rule the bodies are absent rather than todo!() so a half-built impl cannot escape into a consumer accidentally. cargo check -p starter-flow-surfaces green'
  - 'workspace wiring and smoke — add starter-flow-spi, starter-flow, starter-flow-nodes, starter-flow-surfaces to the workspace [workspace.members] list in starter/Cargo.toml, cargo build --workspace --all-features green, cargo clippy --workspace --all-targets -- -D warnings green, cargo fmt --check green, snapshot test passes (cargo tree -p starter-flow-spi --edges normal matches the committed DOCS/flow/scope/starter-flow-spi-deps.baseline.txt — zero non-starter-spi crates appear), workspace-builds-without-adk-rust check passes (cargo tree -p starter-flow --edges normal and cargo tree -p starter-flow-nodes --edges normal contain no adk-rust entry — D1 is unresolved but the scaffolds must not bake in the answer either way), and the four new crates appear in the workspace dep graph without any of them depending on starter-mcp / starter-server / starter-cli (R8 + R9 only matter once Phase 3 surfaces ship)'
