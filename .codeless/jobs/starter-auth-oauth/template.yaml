name: starter-auth-oauth
goal: 'Build the starter-auth-oauth crate per DOCS/auth/scope/SCOPE.md — third-party sign-up / sign-in via OAuth 2.0 / OIDC providers (GitHub + Google in v0.1, extensible via one OAuthProvider trait). Sits next to starter-auth-users, reuses its SessionStore, mints the same sas_* session cookies, adds one new table (oauth_identities) linking provider accounts to user records. OAuth is a sign-in path, not a new Authenticator — once the callback resolves an identity into a UserRecord, every downstream auth check (Principal, Role, Scope, CSRF) is unchanged. Ship in four ordered phases; Phase 5 (generic OIDC) and Phase 6 (delegated access) are reserved slots that land only when a consumer needs them.'

stages:
  - 'resolve open questions in DOCS/auth/scope/SCOPE.md — callback rate-limiting (defer to starter-server when it grows a rate limiter), audit log of identity changes (tracing info-level events now; durable audit table deferred to starter-observability audit-sink), email-change-as-security-event (emit a separate high-severity tracing event on change vs initial set, structured shape deferred to audit sink), first-time-signup consent screen (skip in v0.1, provider display name becomes initial display name, reserve OAUTH_REQUIRE_ONBOARDING flag for later). Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions before any code lands'
  - 'Phase 1a — breaking change to starter-auth-users (the SemVer-major bump that R8 forces): add LinkedProvidersLookup trait + NoLinkedProviders default impl, AuthState gains Arc<dyn LinkedProvidersLookup> field defaulting to NoLinkedProviders, UserRecord.password_hash becomes Option<String>, UserStore::create signature updated to take Option<&str> for password_hash, sqlite and postgres UserStore impls updated, every call site updated (login verify, admin create, tests), POST /auth/login on NULL hash returns HTTP 400 with body error=password_not_set and providers=[] from the trait (no-op returns empty). Migration 0002_users_password_optional ships in starter-auth-oauth (NOT in starter-auth-users) so OAuth-disabled consumers never run it — sqlite path is the 12-step rebuild with PRAGMA foreign_key_check assertion before COMMIT; postgres path is one ALTER COLUMN DROP NOT NULL'
  - 'Phase 1b — starter-auth-oauth crate scaffold: Cargo.toml depending on starter-auth-users + starter-spi + oauth2 + reqwest 0.12, lib.rs, OAuthProvider trait + ProviderIdentity in provider.rs (provider_sub, email, email_verified, display_name), OAuthFlowState in state_store/mod.rs (provider, state, pkce_verifier, return_to, link_mode_user_id, created_at), OAuthStateStore trait + MemoryStateStore impl (HashMap<state,Flow> behind Mutex, 10-minute TTL, eviction on read), IdentityStore trait + sqlite impl in identity_store/, migration 0001_oauth_identities.sql with composite PK (provider, provider_sub) and FK to starter_auth_users_users(id) ON DELETE CASCADE + idx_oauth_identities_user index, OAuthLinkedProviders impl that satisfies LinkedProvidersLookup by querying oauth_identities. config.rs loads OAUTH_BASE_URL / OAUTH_<PROVIDER>_CLIENT_ID / OAUTH_<PROVIDER>_CLIENT_SECRET / OAUTH_STATE_STORE / OAUTH_SIGNUP_DEFAULT_ROLE / OAUTH_SIGNUP_ENABLED via starter-secrets-* with env-var fallback; presence of client_id+secret enables a provider (no separate enabled flag)'
  - 'Phase 1c — GitHub provider impl + routes: providers/github.rs with compile-time scopes (read:user user:email — the user:email scope is load-bearing for R3 because /user/emails returns the per-email verified flag) + compile-time authorize/token/userinfo endpoints, fetch_identity calls /user then /user/emails and only counts addresses with verified=true (the public /user.email field is user-edited and never used for linking). routes/router.rs exposes oauth_router::<S>(state) -> Router<S> generic over consumer AppState. routes/start.rs handles GET /auth/oauth/{provider}/login (302 to authorize URL, stash OAuthFlowState by state value with return_to validation rejecting absolute URLs). routes/callback.rs handles GET /auth/oauth/{provider}/callback per the source SCOPE flow: parse state+code, atomic remove from state store, exchange_code, fetch_identity, IdentityStore::find branching on hit/miss × sign-in/link × verified-email-match / collision / signup-disabled, then session_bridge mints sas_* via existing SessionStore and 302s to return_to. Error mapping is deliberate — user sees sign-in failed plus correlation id, server logs underlying reason. FakeProvider testing seam + MemoryEverything one-call factory in starter-auth-oauth::testing'
  - 'REVIEW Phase 1 — Sign-in-with-GitHub works end-to-end (verified email auto-links to existing user; unverified email collision refuses with HTTP 409 email_already_registered; signup creates new user with role from OAUTH_SIGNUP_DEFAULT_ROLE; sas_* session cookie minted; subsequent requests authenticate via existing AuthAuthenticator unchanged); smoke tests pass: GitHub-unverified-email-cannot-hijack, Abandoned-flow-leaves-no-DB-trace, Password-login-error-message-includes-provider-list, Provider-access-token-never-persists (static grep CI guard plus runtime test asserting the FakeProvider sentinel appears in zero tracing fields and zero SQL parameters), sqlite-rebuild-preserves-FKs against a populated fixture with active sessions and tokens'
  - 'Phase 2 — Google provider: providers/google.rs with compile-time scopes (openid email profile) + compile-time endpoints, fetch_identity uses /userinfo and trusts email_verified claim per R3, no new infrastructure (reuses everything from Phase 1). Smoke test: Same-human-two-providers-one-user (Alice signs up via Google with verified alice@example.com, later signs in via GitHub which returns the same verified address from /user/emails, the callback finds no (github, gh_sub) identity but matches the verified email and links GitHub to her existing user; if a second user is created instead the linking rule has slipped)'
  - 'Phase 3 — linking, unlinking, identity listing: POST /auth/oauth/{provider}/link starts the link flow for the current user (session+CSRF), stashes link_mode_user_id=Some(current_user) in the state store entry so the callback handler routes to the link branch instead of sign-in. DELETE /auth/oauth/{provider} (session+CSRF) refuses to remove the last sign-in method (no password set AND no other identities → 409 with clear message; identity row remains; user stays signed in). GET /auth/oauth/identities (session) returns the current user list of (provider, email, display_name, last_login_at). Smoke test: Unlinking-last-sign-in-method-is-refused'
  - 'Phase 4 — shared state store + signup gating + role domain map: SqliteStateStore and PostgresStateStore behind cargo features so multi-node deployments are a config change not a refactor. OAUTH_SIGNUP_ENABLED=false path returns HTTP 403 with sign-up-is-disabled message on first-time callbacks. Role domain map per the source SCOPE decision: ProviderConfig.role_domain_map HashMap<String,Role> populated from OAUTH_<PROVIDER>_ROLE_DOMAIN_MAP env (comma-separated domain=Role pairs); on new-user creation the crate checks the verified email domain against the map and assigns the matched role, falling back to OAUTH_SIGNUP_DEFAULT_ROLE on no match / empty map / unverified email. Smoke tests: Callback-survives-wrong-instance-routing (with sqlite state store start the flow on instance A and callback on instance B completes; with memory the same scenario fails fast with state-not-found not a 500), Domain-map-assigns-Writer-to-acme-signups'
  - 'smoke tests — full sweep against CI: GitHub-unverified-email-cannot-hijack, Same-human-two-providers-one-user, Unlinking-last-sign-in-method-is-refused, Abandoned-flow-leaves-no-DB-trace, Callback-survives-wrong-instance-routing, Password-login-error-message-includes-provider-list, Provider-access-token-never-persists (static CI grep guard plus the recording-subscriber runtime assertion). Plus: sqlite-rebuild-preserves-FKs replay against a fixture mimicking production shape (users with active sessions, API tokens, and existing oauth identities) so the highest-risk migration is exercised end-to-end before merge'
