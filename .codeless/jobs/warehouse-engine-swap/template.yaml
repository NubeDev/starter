name: warehouse-engine-swap
goal: |
  Swap the time-series warehouse engine from ClickHouse to TimescaleDB
  and rename the surface to be vendor-neutral (`warehouse` instead of
  `clickhouse`). Pre-production, so no migration, no backfill, no
  deprecation aliases — hard delete is fine. After this job the
  ClickHouse service is gone from compose and CI; all warehouse verbs,
  traits, crates, modules, and flow YAML use the `warehouse` name; the
  TimescaleDB backend implements writes, mart continuous-aggregate
  DDL, retention via `add_retention_policy`, and the
  `entities_dict` materialized dictionary is replaced by direct JOINs.
  Authoritative design lives in
  rubix/docs/proposal/warehouse-engine-swap.md.

stages:
  - "stage 1 — rename + decouple: rename ChWriter → WarehouseWriter, Ch{Rule,Mart,Retention}Reversible → Warehouse{Rule,Mart,Retention}Reversible, starter-store-clickhouse crate → starter-store-warehouse (engine-specific impls live behind it), rubix.clickhouse.* verbs → rubix.warehouse.*, clickhouse-ruler skill + flow YAML → warehouse-ruler, rubix_tools::clickhouse::mart module → rubix_tools::warehouse::mart, clickhouse-ruler.yaml → warehouse-ruler.yaml; delete the old names outright — no deprecated aliases, no forwarding shims (pre-production, no callers to protect); extract MartSpec DDL generation behind a DdlDialect trait with a ClickHouse impl so stage 2 is additive rather than a rewrite; decide chunk_time_interval per hypertable (starting point: L1 monthly, L2 weekly) and bake values into migration constants; swap the dev compose stack so TimescaleDB + timescaledb_toolkit replaces the ClickHouse service (no parallel running); audit every existing MartSpec definition against continuous-aggregate constraints (no subqueries, no CTEs, single source hypertable, late-arrival tolerance) and reshape any that won't translate; cargo build --workspace + cargo clippy --workspace --all-features -- -D warnings + cargo fmt --check + mani run build --all all green at stage end; existing test suite still passes against the ClickHouse dialect because the swap is gated behind the new DdlDialect seam"
  - "stage 2 — TimescaleDB implementation: wire starter-store-warehouse to a sqlx PgPool backend (likely already present from starter-store-postgres — reuse the pool); implement WarehouseWriter against TimescaleDB with COPY-based batch write paths for raw_events (L1), samples / events / documents (L2) into hypertables sized per stage 1's chunk_time_interval decisions; add DdlDialect::TimescaleDb impl that emits continuous-aggregate DDL for MartSpec — CREATE MATERIALIZED VIEW WITH (timescaledb.continuous) AS SELECT time_bucket(...) ... GROUP BY bucket, tenant_id, <group_by_cols> WITH NO DATA + SELECT add_continuous_aggregate_policy(...) with the standard start_offset/end_offset/schedule_interval shape from the proposal; ensure tenant_id is in the GROUP BY of every cagg (ADR-003) and the cagg is created with security_invoker = true so RLS works; port the retention verb to add_retention_policy / remove_retention_policy with snapshot read from timescaledb_information.jobs WHERE proc_name = 'policy_retention'; port the rule verb snapshot path to read view DDL from timescaledb_information.continuous_aggregates joined with pg_get_viewdef; replace entities_dict dictionary references in mart queries with direct JOINs against the dimension tables in the same database (kill the refresh job and any timer-based lag observers); for quantile aggregations switch to percentile_cont or pull in timescaledb_toolkit; end-to-end smoke tests for ingest → mart cagg → query → retention drop all pass against a TimescaleDB testcontainer"
  - "stage 3 — delete ClickHouse: remove the ClickHouse dialect from starter-store-warehouse and any remaining ClickHouse-specific impls; remove the ClickHouse docker service, env vars, healthcheck wiring, migration runner config entries, and CI matrix entries; remove the entities_dict materialized dictionary, its refresh job, and any timer-based lag observers; remove the async_insert=1 / wait_for_async_insert=1 discipline from any remaining write helpers and the CI lint that enforced it (the discipline is engine-specific and no longer applicable); update README, setup docs, and any architecture diagrams that reference ClickHouse; grep the repo for `clickhouse` / `ClickHouse` / `CH` (case-insensitive) — after this stage the only matches outside the proposal doc itself should be in git history or comments explaining the historical context, never in live code; cargo build --workspace + cargo clippy --workspace --all-features -- -D warnings + cargo fmt --check + mani run build --all + mani run test --all all green"
