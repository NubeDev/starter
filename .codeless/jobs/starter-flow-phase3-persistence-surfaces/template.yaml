name: starter-flow-phase3-persistence-surfaces
goal: |
  Land Phase 3 of DOCS/flow/scope/SCOPE.md with 24/7 supervisory-
  runtime rigor (Niagara-style: years of uptime, crash-safe,
  backend-disruption-tolerant, bounded resource growth). The merged
  starter-flow-engine-finish job (PR #6) closed Phase 2 honestly —
  transform and tool_call bodies, the two SCOPE smoke tests, the R3
  grep-contract test, and the dep-tree gates all landed and stay
  green. Phase 3's deliverables have not: FlowStore / RunStore /
  SessionStore trait method shapes are still empty seams in
  starter-flow-spi; no SQLite-backed impls exist for any of the three
  under a flow feature in starter-store-sqlite; run checkpointing on
  slot writes is not wired into the engine; no resume-from-checkpoint
  path after a process restart; starter-flow-surfaces still ships
  FlowAsTool and FlowAsService as empty public-API placeholder
  structs; the three Phase 3 SCOPE smoke tests do not exist; and no
  24/7 durability proofs exist (no crash-and-resume smoke, no
  checkpoint pruning, no degraded-mode posture on backend outage, no
  FlowAsService event dedup, no backpressure handling for lagging
  FlowEvent subscribers). This is a phase-completion job scoped to
  exactly those five pieces plus the durability hardening that makes
  the result fit for continuous operation. No engine refactors
  beyond the checkpoint + durability wiring, no new node kinds
  (Phase 5), no ai-agent body (Phase 4), no extension-side
  contributes.nodes parsing (Phase 6). After this job lands Phase 3
  of the flow SCOPE is honestly green and the runtime is rated for
  24/7 deployment: a SIGKILL-mid-tick process restart resumes from
  the last atomic checkpoint with no slot-corruption, the engine
  continues serving in-flight runs when the RunStore backend goes
  away and recovers cleanly when it returns, lagging stream
  subscribers see surfaced Lagged events without blocking the
  producer, re-delivered events short-circuit to the prior run's
  outcome via dedup, and the run_checkpoints table size is bounded
  by an explicit pruning policy.

stages:
  - 'stage 1 — lock the Phase 3 + 24/7 durability boundary before code lands. Confirm the twelve D-F3 decisions and the one open-question resolution: (D-F3.1) FlowStore / RunStore / SessionStore trait method shapes match the In-scope SPI trait fleshout block verbatim — all async, &self, Result<T, FlowError> with FlowError extended additively with NotFound { kind, id }; RunStore::checkpoint takes &[(SlotRef, SlotValue)] (borrowed, not owned); RunStore gains find_by_dedup_key(service_name, dedup_key) for D-F3.12 short-circuit lookup; (D-F3.2) checkpoint cadence is once per propagator tick, not once per write_slot call — the propagator''s tick counter is the (run_id, seq) key into run_checkpoints; (D-F3.3) the three SQLite impls live in crates/starter-store-sqlite/src/flow/ behind a new default-off flow cargo feature with migrations in crates/starter-store-sqlite/migrations/flow/; (D-F3.4) FlowAsTool.input_schema and FlowAsTool.output_schema are explicit constructor args, not derived from the flow revision body; (D-F3.5) FlowAsService subscribes to its EventSink on Service::start (not at construction time), unsubscribes and joins on Service::stop; (D-F3.6) the four Phase 3 SCOPE smokes live under crates/smoke-tests/tests/ — the D1d revisit-trigger from the Phase 2 SCOPE fires here precisely because each smoke needs starter-mcp / starter-store-sqlite / the four-transport harness / a process-spawn harness, which starter-flow cannot depend on without a cycle; (D-F3.7) the Phase 1 SPI baseline file DOCS/flow/scope/starter-flow-spi-deps.baseline.txt is regenerated once in stage 3''s single commit even if the fleshout adds no new deps, with stages 4-10 that produce baseline diffs being stage-fails; (D-F3.8) SqliteRunStore::checkpoint wraps in BEGIN IMMEDIATE transactions with journal_mode=WAL, synchronous=NORMAL, busy_timeout=5000, foreign_keys=ON applied at pool connection init (extend, not replace, the existing crates/starter-store-sqlite/src/pool/ init path) so SIGKILL-mid-tick either leaves the prior checkpoint visible or commits the new one atomically — never partial; (D-F3.9) run_checkpoints table kept bounded by in-transaction pruning at the end of each checkpoint write: default keep last 100 per open run plus final per finished run, configurable via RunOpts.checkpoint_retention, no background sweep needed; (D-F3.10) FlowEvent per-run broadcast is tokio::sync::broadcast::Sender with capacity from RunOpts.event_broadcast_capacity (default 1024) — producers never block, slow consumers see RecvError::Lagged on next recv (standard tokio semantics), engine attaches its own Lagged-watcher that increments RunMetrics.subscriber_lagged_count surfaced via Engine::run_metrics(run_id); (D-F3.11) RunStore backend-failure posture is retry-with-backoff 50→100→200→400→800ms capped at 5 attempts emitting FlowEvent::CheckpointFailed per attempt; after 5 consecutive failures engine transitions to EngineHealth::Degraded, in-flight runs continue serving from in-memory state with per-run queue bounded by RunOpts.degraded_queue_capacity (default 1024, evict-oldest), Engine::start returns EngineError::BackendUnavailable; successful checkpoint drains the queue in (run_id, seq) order and transitions back to Healthy; process exit during Degraded is non-destructive (in-memory queue lost, last durable checkpoint intact); (D-F3.12) FlowAsService writes per-event dedup key to runs.dedup_key under UNIQUE (service_name, dedup_key) partial index, resolves key via EventSink::dedup_key() optional accessor (additive default-None method) first then blake3(service_name, event_id, payload) fallback, re-delivered events short-circuit to prior run outcome and emit FlowEvent::DedupShortCircuit. Resolve open question 4 by inspecting crates/smoke-tests/tests/ for an existing four-transport smoke file: extend it with a FlowEvent source row + lagging-consumer sub-row if found; otherwise land a standalone flow_event_stream_over_four_transports.rs covering the same matrix. Record decisions in SCOPE.md "Decisions" with the rule + revisit trigger. No code in this stage.'
  - 'REVIEW Phase 3 + 24/7 durability boundary — SPI trait method shapes confirmed (additive, async, borrowed-batch checkpoint, EngineHealth/EngineError/RunMetrics/RunOpts durability fields, EventSink::dedup_key default-None method, find_by_dedup_key on RunStore); checkpoint cadence per-tick confirmed; SQLite store layout + feature gating confirmed (default-off flow feature, migrations in flow/ subdir, WAL pragmas at pool-init, BEGIN IMMEDIATE atomic-tx checkpoint, in-tx pruning, UNIQUE dedup partial index); FlowAsTool explicit schemas confirmed; FlowAsService subscribe-on-start lifecycle + dedup-key resolution confirmed; smoke location under crates/smoke-tests/ confirmed per D1d revisit-trigger; SPI baseline regeneration discipline confirmed (one regeneration in stage 3, zero diffs in stages 4-10); atomic-checkpoint + WAL posture confirmed; bounded-checkpoint-history retention default 100 confirmed; broadcast evict-oldest backpressure confirmed; retry-with-backoff + Degraded-mode backend-failure posture confirmed; at-least-once + dedup delivery semantics confirmed; four-transport smoke extend-vs-standalone call recorded. Stages 3 through 9 bind to these; do not advance until the gate passes.'
  - 'stage 3 — SPI trait fleshout in crates/starter-flow-spi/src/flow.rs (and possibly a new session.rs) per D-F3.1 plus the additive durability extensions. FlowStore gains: async fn load(&self, flow_id: FlowId, revision: Option<FlowRevisionId>) -> Result<FlowRevision, FlowError>; async fn put(&self, revision: FlowRevision) -> Result<FlowRevisionId, FlowError>; async fn list(&self) -> Result<Vec<FlowId>, FlowError>; async fn revisions(&self, flow_id: FlowId) -> Result<Vec<FlowRevisionId>, FlowError>; async fn head(&self, flow_id: FlowId) -> Result<Option<FlowRevisionId>, FlowError>. RunStore gains: async fn start(&self, run_id: RunId, flow_revision: FlowRevisionId, opts: RunOpts, principal: Principal) -> Result<(), FlowError>; async fn checkpoint(&self, run_id: RunId, state: RunState, writes: &[(SlotRef, SlotValue)]) -> Result<(), FlowError>; async fn load(&self, run_id: RunId) -> Result<Option<RunCheckpoint>, FlowError>; async fn finish(&self, run_id: RunId, outcome: RunOutcome) -> Result<(), FlowError>; async fn list_open(&self) -> Result<Vec<RunId>, FlowError>; plus async fn find_by_dedup_key(&self, service_name: &str, dedup_key: &str) -> Result<Option<RunId>, FlowError> for D-F3.12 short-circuit lookup. SessionStore net-new with: async fn get(&self, session_id: SessionId) -> Result<Option<SessionRecord>, FlowError>; async fn put(&self, session_id: SessionId, record: SessionRecord) -> Result<(), FlowError>; async fn list(&self, principal: Principal) -> Result<Vec<SessionId>, FlowError>. FlowError extended additively with NotFound { kind: &''static str, id: String }. Add additive FlowEvent variants: CheckpointFailed { run_id, error: String, attempt: u32 }; DedupShortCircuit { prior_run_id: RunId }. Add new types: pub enum EngineHealth { Healthy, Degraded } (#[non_exhaustive]); pub struct RunMetrics { pub subscriber_lagged_count: u64, pub degraded_dropped_count: u64 } (#[non_exhaustive], additive fields land in follow-up jobs); extend EngineError additively with BackendUnavailable. Extend RunOpts additively with: checkpoint_retention: CheckpointRetention (enum Bounded(usize) | Unbounded, default Bounded(100)); event_broadcast_capacity: usize (default 1024); degraded_queue_capacity: usize (default 1024). Add optional method to EventSink trait: fn dedup_key(&self, _event: &Event) -> Option<String> { None } (default impl keeps existing implementations source-compatible). The associated value types (FlowRevision, RunCheckpoint, RunOutcome, SessionId, SessionRecord) land in the same commit as plain Serialize/Deserialize structs — no logic, just shape. Every new public enum + config struct gets #[non_exhaustive]. Per D-F3.7 the file DOCS/flow/scope/starter-flow-spi-deps.baseline.txt is regenerated in the same commit even if the fleshout adds no new deps; the commit message explicitly names the regeneration. The existing workspace_dep_tree_gates integration test must still pass against the regenerated baseline. cargo test -p starter-flow-spi green; cargo clippy --workspace --all-targets -- -D warnings green; cargo fmt --check green.'
  - 'stage 4 — three SQLite store impls in crates/starter-store-sqlite/src/flow/ behind a new default-off flow cargo feature on starter-store-sqlite. Three files: flow_store.rs (SqliteFlowStore impl), run_store.rs (SqliteRunStore impl, with BEGIN IMMEDIATE atomic-tx checkpoint + in-tx pruning per D-F3.8 + D-F3.9), session_store.rs (SqliteSessionStore impl), plus a sibling schema module that holds the JSON-envelope serializers shared across the three. WAL pragmas (journal_mode=WAL, synchronous=NORMAL, busy_timeout=5000, foreign_keys=ON) applied in the existing crates/starter-store-sqlite/src/pool/ connection-init path (extend; do not replace). Migrations in crates/starter-store-sqlite/migrations/flow/ following the existing NNNN_<name>.sql shape: flow_revisions (flow_id, revision_id, body_json, created_at), flow_heads (flow_id PRIMARY KEY, revision_id, updated_at), runs (run_id, flow_revision_id, principal_json, run_opts_json, status, dedup_key TEXT NULL, service_name TEXT NULL, created_at, finished_at) plus a UNIQUE partial index on (service_name, dedup_key) WHERE service_name IS NOT NULL AND dedup_key IS NOT NULL — dedup_key irrelevant when not a service-driven run; run_checkpoints (run_id, seq, run_state_json, slot_writes_json, created_at with (run_id, seq) primary key); sessions (session_id, principal_json, body_json, created_at, updated_at). The first migration file carries a header comment naming the forward-only convention (D-F3 durability hardening block: never destructively rewrite existing rows; backfills land as a second migration that adds a new column and reads the old). Each impl ships with unit tests using the existing crates/starter-store-sqlite/src/testing/ helpers (in-memory :memory: connections, migration application in test setup). Cover happy-path CRUD per method; NotFound surfacing as FlowError::NotFound for missing ids; for SqliteRunStore::checkpoint: (a) BEGIN IMMEDIATE atomicity via injected fault between insert and commit (wrapped connection panics on the second statement; assert prior checkpoint is still latest visible state); (b) in-tx pruning: 200 checkpoints on a run with retention=100 leaves exactly 100 rows with min(seq)=101; (c) SqliteRunStore::finish keep-final-row pruning leaves exactly one row for finished runs; (d) dedup uniqueness: two runs with the same (service_name, dedup_key) collide on the UNIQUE partial index (the engine layer translates this to short-circuit via find_by_dedup_key; the store surfaces the collision as a typed FlowError); (e) WAL-pragma application: PRAGMA journal_mode returns wal and PRAGMA synchronous returns 1 (NORMAL) on a fresh connection from the pool. cargo test -p starter-store-sqlite --features flow green; cargo test -p starter-store-sqlite (no flow feature) still green; the workspace_dep_tree_gates test still passes; clippy + fmt green.'
  - 'stage 5 — wire checkpointing into the engine. Add Engine::with_run_store(self, store: Arc<dyn RunStore>) -> Self builder hook in crates/starter-flow/src/engine.rs (Self-by-value transform, not &mut self per R5 builder convention). Add Propagator::maybe_checkpoint(&self, tick_writes: &[(SlotRef, SlotValue)]) called once at the end of every propagator tick with the batch of slot writes that occurred during the tick — not once per write_slot call (D-F3.2). When no RunStore is attached the method is a no-op and the engine behaves exactly as today. Add the resume-from-checkpoint path: on Engine::start with a known RunId, load the latest checkpoint via RunStore::load(run_id) (using MAX(seq) at the store level), replay the slot writes through the same GraphStore::write_slot chokepoint — R2 unchanged: the resume path is not a second writer; the propagator''s idempotent-write short-circuit from D1a absorbs no-op writes that already-current slots produce. Use the propagator''s tick counter (private Propagator::current_tick() accessor) as the (run_id, seq) key. The tick counter is u64 with a compile-time assertion const _: () = assert!(std::mem::size_of::<TickCounter>() == 8); to prevent regression to a smaller width (u64 at 1kHz wraps in ~584M years — the right shape for 24/7 ops). New unit test in crates/starter-flow/src/ asserts the resume path writes via GraphStore::write_slot by attaching a tracing subscriber and counting span entries; the count equals the checkpoint''s slot-writes batch size. The existing Phase 2 smokes smoke_one_write_chokepoint, smoke_engine_is_reader_of_policies, and r3_no_policy_match_arms must all still pass (run locally before commit — the checkpoint wiring is the change most likely to regress them, and the R3 grep test will fail loudly if Propagator::maybe_checkpoint accidentally matches on a policy slot name). cargo test -p starter-flow green; cargo test -p starter-flow-spi green; clippy + fmt green.'
  - 'stage 6 — durability hardening for 24/7 operation. Five things land together because they share state on the engine and propagator: (a) retry-with-backoff on RunStore::checkpoint errors per D-F3.11: on first error emit FlowEvent::CheckpointFailed { run_id, error, attempt: 1 } on the run''s broadcast and sleep 50ms; subsequent attempts at 100/200/400/800ms; on the 6th attempt the propagator gives up retrying this batch and the engine transitions to Degraded mode; (b) EngineHealth state machine: introduce Healthy/Degraded states backed by an AtomicU8 on the engine; add pub fn Engine::health(&self) -> EngineHealth (lock-free atomic read); after 5 consecutive checkpoint failures across any open run transition to Degraded; on a successful checkpoint transition back to Healthy and drain the in-memory queue in (run_id, seq) order; (c) Engine::start refuses new runs with EngineError::BackendUnavailable when Degraded; in-flight runs continue serving from in-memory state with their checkpoint queue bounded by RunOpts.degraded_queue_capacity (default 1024 batches, evict-oldest on overflow, RunMetrics.degraded_dropped_count incremented per evict); (d) per-run broadcast capacity hook: replace the hardcoded broadcast capacity from Phase 2 with RunOpts.event_broadcast_capacity (default 1024); attach an engine-owned per-run subscriber that ignores all event variants except RecvError::Lagged(n) and increments RunMetrics.subscriber_lagged_count by n; expose Engine::run_metrics(run_id) -> Option<RunMetrics> as a sync accessor; (e) monotonic tick-counter invariants: confirm Propagator''s tick counter is u64, add the compile-time size assertion, and add a unit test that asserts 10000 sequential ticks produce strictly increasing tick values. Unit tests cover each invariant in isolation: (a) a wrapped RunStore that fails N times then succeeds drives exactly N FlowEvent::CheckpointFailed events with attempt counts 1..=N for N in 1..=5; (b) Healthy → Degraded transition fires at exactly the 5th failure not the 4th; (c) Engine::start returns BackendUnavailable when health()==Degraded and Ok when health()==Healthy; (d) a producer ticking 10000 events into a broadcast with capacity 100 and a consumer that sleeps 10ms per recv accumulates a non-zero subscriber_lagged_count while the producer itself observes no blocking (tick-latency stays under 1ms — assert via tracing latency span quantile); (e) the size_of assertion compiles and the monotonicity test passes. The three Phase 2 smokes still green. cargo test -p starter-flow green; cargo test -p starter-flow-spi green; clippy + fmt green.'
  - 'stage 7 — FlowAsTool body in crates/starter-flow-surfaces/src/lib.rs per D-F3.4. Fields: flow_id: FlowId, engine: Arc<Engine>, tool_id: KindId, name: String, description: String, input_schema: serde_json::Value, output_schema: serde_json::Value. Constructor: FlowAsTool::new(flow_id, engine, tool_id, name, description, input_schema, output_schema). impl starter_spi::tool::Tool for FlowAsTool: Tool::call(args, principal, cancel, sink) forwards into Engine::run(flow_id, args, principal, cancel) and yields the flow''s terminal output slot value as the tool''s return value. Errors from the engine (including EngineError::BackendUnavailable when Degraded) map to a typed ToolError per the starter-spi contract — surface the Degraded posture distinctly so MCP/REST clients can retry rather than treat it as a permanent failure. tracing span on flow_as_tool.call records (flow_id, tool_id, principal_id_hash, run_id). Tool::name() returns the tool_id; Tool::description() returns description; Tool::input_schema() / Tool::output_schema() return the constructor-provided values. starter-flow-surfaces depends only on starter-flow-spi + starter-spi + starter-flow — no new dep on starter-store-sqlite (the host wires the store). Unit tests cover: a wrapped flow surfaces Tool::call returning the flow''s terminal output (use the Phase 2 transform body for a deterministic toy flow); a flow that errors surfaces a typed ToolError (not a panic); a Cancel fired during the call propagates into the engine''s per-run cancel and the run reports Cancelled within 200ms; the tool_id validates as a KindId per R10 at construction time and surfaces a typed construction error for malformed ids; no tokio task leaks (tracing-span open/close balance across a full call cycle). cargo test -p starter-flow-surfaces green; the workspace_dep_tree_gates test still passes (confirms no surfaces -> sqlite dep); clippy + fmt green.'
  - 'stage 8 — FlowAsService body in crates/starter-flow-surfaces/src/lib.rs per D-F3.5 + D-F3.12. Fields: flow_id: FlowId, engine: Arc<Engine>, service_name: String, event_sink: Arc<dyn EventSink>, default_principal: Option<Principal>. impl starter_spi::service::Service for FlowAsService: Service::start spawns a tokio task that subscribes to the EventSink and loops on event receipt — for each event resolve a dedup key (D-F3.12: EventSink::dedup_key() optional accessor first, otherwise blake3 of (service_name, event_id, blake3(event_payload_bytes)) hex-encoded); call RunStore::find_by_dedup_key(service_name, dedup_key); if Some(prior_run_id), emit FlowEvent::DedupShortCircuit { prior_run_id } on the service''s observer and return the prior run''s outcome without starting a new run; otherwise invoke the engine via Engine::run with the dedup key recorded at Engine::start time and emit the run id on the existing service-side observer; Service::stop cancels the task via the engine''s Cancel seam, awaits the task''s join handle to drain in-flight, and unsubscribes from the EventSink. An event with no principal under a None default_principal surfaces a typed invocation error rather than running anonymously (R3 + workspace auth posture). service_name validates per the reverse-DNS convention applied to service names elsewhere in the workspace (R10 analogue). tracing span on flow_as_service.invoke records (flow_id, service_name, event_id, dedup_key_hash, run_id_or_prior_run_id). Unit tests cover: three events drive three runs to Finished against a fake EventSink; Service::stop cancels in-flight runs and the spawned task joins cleanly (no leaked tokio task — verify via tracing span closure count if no test helper exists); an event with no principal under a None default surfaces an invocation error and the service continues processing subsequent events; re-delivery of an event with the same dedup key short-circuits to the prior run''s outcome, emits exactly one FlowEvent::DedupShortCircuit, and leaves exactly one runs row in the fake RunStore; an event that carries its own dedup_key via the optional EventSink accessor uses that key in preference to the blake3 fallback. cargo test -p starter-flow-surfaces green; the workspace_dep_tree_gates test still passes; clippy + fmt green.'
  - 'stage 9 — Phase 3 SCOPE smoke tests under crates/smoke-tests/tests/ per D-F3.6, including the 24/7 durability smoke. WORKFLOW pins ordering: first flow_via_mcp.rs (build a toy flow with a transform body returning the input doubled; wrap it via FlowAsTool with explicit input/output schemas; register the tool with starter-mcp''s ToolRegistry using the in-process MCP test harness starter-mcp''s own tests use; an MCP client calls the tool by its tool_id and asserts the doubled output AND asserts that the SqliteRunStore behind the engine records the run with a non-empty checkpoint history at the expected (run_id, seq) keys); then flow_as_service.rs (wrap a toy flow via FlowAsService whose event source is a tokio::sync::mpsc channel the test owns; push three events, assert three runs land in SqliteRunStore all reaching Finished; call Service::stop and assert clean drain with no leaked tokio task; second sub-case: push the same event twice with the same dedup key and assert exactly one runs row, the second EventSink::recv returns the first run''s outcome, and a FlowEvent::DedupShortCircuit is emitted); then either an extension to the existing crates/smoke-tests/tests/<four-transport-file>.rs adding a FlowEvent source row to the parameterised transport matrix (REST SSE, MCP streaming, gRPC streaming, JSON-RPC stdio) plus a lagging-consumer sub-row per transport that asserts non-zero RunMetrics.subscriber_lagged_count while the run still finishes successfully — or a standalone crates/smoke-tests/tests/flow_event_stream_over_four_transports.rs covering the same matrix with FlowEvent as the only source — per the stage-1 resolution to open question 4. The four-transport smoke asserts FlowRun::subscribe() multi-consumer cardinality (D1c) survives the transport layer: two concurrent transport clients on the same run each see the full FlowEvent sequence. Then crates/smoke-tests/tests/flow_crash_and_resume.rs (the 24/7 durability proof, three sub-cases): (a) SIGKILL-mid-tick resume — build a flow that ticks 50 times and checkpoints per-tick via SqliteRunStore on a file-backed database (not :memory:); at tick 25 the test spawns a child process that runs the flow, sends SIGKILL after the 25th checkpoint commits (verified by polling run_checkpoints for seq=25), then on the parent opens the same database and resumes via Engine::start(known_run_id); assert the run finishes at tick 50 with no slot-corruption and exactly 25 additional checkpoints written; (b) backend-outage Degraded recovery — inject a 10-second RunStore backend outage mid-tick via a wrapped RunStore that returns errors during the window; assert the engine emits FlowEvent::CheckpointFailed per retry attempt 1..=5, transitions to EngineHealth::Degraded after the 5th, keeps producing SlotChanged events for in-flight runs, rejects new Engine::start calls with EngineError::BackendUnavailable, drains queued checkpoint batches in (run_id, seq) order on outage clear, and transitions back to EngineHealth::Healthy; sub-sub-case: kill the process during Degraded and assert the resume path picks up the last durable (pre-outage) checkpoint without seeing the queued-in-memory writes; (c) 10000-tick soak — tick a small flow 10000 times in-memory and assert Propagator::current_tick() returns strictly increasing u64 values across all ticks, no tokio task leaks (span open/close balance), and bounded resident-set-size growth (within 2× the per-tick allocation count measured at tick 100). One commit per smoke file; bundling is a stage-fail. cargo test -p starter-smoke-tests green; each smoke fails loudly when its contract is broken (verify by manually breaking in a scratch branch, confirm detection, revert); clippy + fmt green.'
  - 'stage 10 — workspace verify + dep-tree gates re-confirm. No code changes; just running the gates and confirming green. cargo build --workspace --all-features green; cargo clippy --workspace --all-targets -- -D warnings green; cargo fmt --check green. The existing crates/starter-flow/tests/workspace_dep_tree_gates.rs integration test passes: the SPI baseline (regenerated in stage 3) holds byte-for-byte; cargo tree -p starter-flow --edges normal piped through grep adk-rust returns zero matches; cargo tree -p starter-flow-nodes --edges normal piped through grep adk-rust returns zero matches; cargo tree -p starter-flow-surfaces --edges normal contains no path-dep onto starter-mcp / starter-server / starter-cli / starter-store-sqlite; the same gate holds for starter-flow and starter-flow-spi. The three Phase 2 smokes (smoke_one_write_chokepoint, smoke_engine_is_reader_of_policies, r3_no_policy_match_arms) still pass under cargo test --workspace --tests. The four Phase 3 smokes from stage 9 pass under cargo test --workspace --tests. After this stage the Phase 3 flow-SCOPE exit criteria are honestly met and the runtime is rated for 24/7 supervisory deployment (Niagara-style: years of uptime, crash-safe, backend-disruption-tolerant, bounded resource growth) and Phase 4 (ai-agent body + D1 resolution) can begin on a persistent operationally-rated engine.'
