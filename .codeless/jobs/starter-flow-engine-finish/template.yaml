name: starter-flow-engine-finish
goal: |
  Close the Phase 2 gap from DOCS/flow/scope/SCOPE.md. The merged
  starter-flow-engine job (PR #5) shipped the engine substrate end-to-
  end (graph + propagator + registries + engine state machine + run
  lifecycle), but the two Phase 2 deliverables that prove the engine
  actually works did not land — transform and tool_call NodeBehavior
  bodies plus the two SCOPE Smoke tests "One write chokepoint" and
  "Engine is reader of policies", plus the R3 grep-contract test. This
  is a catch-up job, scoped to exactly those four pieces. After it
  lands, Phase 2 of the flow SCOPE is honestly green and Phase 3
  (persistence + surface wrappers) has a real flow to test through
  starter-mcp instead of a synthetic stub. No engine refactors, no
  new node kinds beyond the two Phase 2 already names, no dep changes
  beyond what the bodies legitimately need.

stages:
  - 'stage 1 — lock the catch-up boundary before code lands. Confirm: (a) the smoke tests live under crates/starter-flow/tests/ as integration tests on the engine crate, NOT under crates/smoke-tests/ which is owned by the tools SCOPE Stage 9 work and would collide; (b) the transform body uses the Rust-closure substrate decided in the starter-flow-engine job stage 1 sub-decision (a registered closure indexed by a config.fn_id slot value — no rhai dep on starter-flow-nodes); (c) the tool_call body looks up the Tool via an Arc<dyn ToolRegistry> threaded through the run, not via a global static, matching the same substrate locked in starter-flow-engine stage 1; (d) the R3 grep-contract test lives in crates/starter-flow/tests/r3_no_policy_match_arms.rs and asserts on the crate''s own src/ that no code path performs a literal match arm on the policy slot names (session_policy, on_failure, cost_cap, safe_state, trigger, auth, timeout) — hits in doc comments are fine, hits in match expressions are a stage-fail. Record decisions in SCOPE.md "Decisions" with the rule + revisit trigger. No code in this stage.'
  - 'REVIEW catch-up boundary — smoke-test location confirmed (engine crate''s tests/ dir, not the tools smoke-tests crate); transform substrate (Rust closure registry indexed by config slot) confirmed; tool_call ToolRegistry injection shape confirmed; R3 grep-test contract locked. Stages 3 through 6 bind to these; do not advance until the gate passes.'
  - 'stage 3 — transform node-kind body in crates/starter-flow-nodes/src/transform.rs behind the existing transform feature flag. impl NodeBehavior for Transform with &self per R5; reads its input slot via the run-provided context; resolves a registered closure from a TransformFunctionRegistry keyed on the config.fn_id slot value (the registry is constructed by the host at engine-build time and threaded through to invoke); applies the closure to the SlotValue; writes the result through GraphStore::write_slot — never bypassing R2''s single chokepoint; opens a tracing span on transform.invoke recording (node_id, fn_id, input_kind, output_kind). The KIND_ID constant stays verbatim. The function-registry seam is exposed as a public TransformFunctionRegistry trait + StaticTransformFunctionRegistry impl in this crate; the test suite registers identity/sum/panic functions against it. Unit tests cover: identity transform emits its input verbatim on output; arithmetic transform sums two input slots into one output; transform that panics surfaces the failure as FlowEvent::NodeFailed (not as a crash); a transform whose fn_id is unregistered returns a typed NodeBehaviorError on invoke and surfaces as FlowEvent::NodeFailed. cargo test -p starter-flow-nodes --features transform green; clippy + fmt green.'
  - 'stage 4 — tool_call node-kind body in crates/starter-flow-nodes/src/tool_call.rs behind the existing tool-call feature flag. impl NodeBehavior for ToolCall with &self per R5; reads tool-id from a config slot (validated as a KindId per R10 reverse-DNS — the same Tool id starter-mcp will list); reads tool-input-json from its input slot; looks up the Tool from an Arc<dyn ToolRegistry> threaded through the run by the engine''s construction args (matching the substrate from starter-flow-engine stage 1); invokes the tool with the run''s Principal + Cancel + EventSink; writes the tool''s result JSON to the output slot through GraphStore::write_slot. Auth is applied by the surface adapter not by the node body per extensions R13 — this crate trusts the Principal it receives. Tracing span on tool_call.invoke records (node_id, tool_id, principal_id_hash, cancel_observed). KIND_ID stays verbatim. Unit tests use a MockTool that records its call arguments and cover: successful invocation propagates the tool''s output JSON; a tool returning a typed error surfaces as FlowEvent::NodeFailed; a Cancel firing mid-invocation causes the tool''s in-flight call to abort (within bounded time — under 200ms — and the node emits NodeFailed with reason cancelled); a tool_id not in the ToolRegistry returns a typed error and surfaces as NodeFailed. cargo test -p starter-flow-nodes --features tool-call green; clippy + fmt green.'
  - 'stage 5 — Phase 2 SCOPE smoke tests as integration tests on the starter-flow crate. Add crates/starter-flow/tests/smoke_one_write_chokepoint.rs implementing the SCOPE Smoke-tests block "One write chokepoint" test verbatim: three writers (a REST-style handler stub making a direct write_slot call from a thin tokio task, a CLI-style synchronous call from the test thread, and an internal propagator tick triggered by a fed-input transform node) all enter GraphStore::write_slot for the same NodeId/slot; the test attaches a tracing subscriber that counts spans on the write_slot path and asserts exactly three; the test attaches a subscribe() receiver to the GraphStore and asserts exactly three SlotChanged envelopes (or fewer if R2 idempotent-write short-circuits one of them — the test uses three distinct values so all three propagate). Add crates/starter-flow/tests/smoke_engine_is_reader_of_policies.rs implementing the "Engine is reader of policies" test: build a flow with two writable output nodes (fake WritableOutput impls that record their writes), one carrying safe_state: fail-safe(0) and one carrying safe_state: hold-last (semantically expressed as the value they hold at stop time); call Engine::stop(); subscribe to the GraphStore before stop and assert both outputs received exactly one engine-driven write to their declared safe state during the stop walk; grep-assert (separate from the previous one — this is the SCOPE test, not the R3 contract test) that starter-flow''s src/ contains no hardcoded policy-slot match arms by walking the src/ directory at test time and refusing any line matching `^\s*\"safe_state\"|^\s*\"session_policy\"|…` outside doc comments. Both smoke tests pass under cargo test -p starter-flow --tests --features <whatever is needed to compile the tests>; both fail loudly if the chokepoint is bypassed or a hardcoded policy registry is introduced. cargo test green; clippy + fmt green.'
  - 'stage 6 — R3 grep-contract test as a separate integration test crates/starter-flow/tests/r3_no_policy_match_arms.rs. The test reads every .rs file under crates/starter-flow/src/ (relative to CARGO_MANIFEST_DIR), strips // and /// and //! comments and string literals (a small line-by-line tokeniser; a real Rust lexer is overkill), then searches for any literal match-arm or expression matching session_policy|on_failure|cost_cap|safe_state|trigger|auth|timeout as an exact identifier (not a substring; matching the bare word with word-boundary regex). The expected match count is zero. The single legitimate hit is the safe_state trait method name in engine.rs — the grep-test allows-lists it explicitly with a justification comment in the test source (R12 names safe_state as a WritableOutput hook method, not a policy slot match). Every other hit is a stage-fail. Tracing spans named with these words are fine (they are span names, not match-arm patterns). The R3 grep-test stays in-tree so future engine changes that introduce a policy-name match arm fail CI immediately. cargo test -p starter-flow --test r3_no_policy_match_arms green; clippy + fmt green.'
  - 'stage 7 — workspace verify + the Phase 2 dep-tree gates that the original starter-flow-engine job promised but did not land an automated test for. cargo build workspace all-features green; cargo clippy workspace all-targets warnings-as-errors green; cargo fmt check green. cargo tree -p starter-flow --edges normal piped through grep adk-rust must return zero matches (workspace-builds-without-adk-rust smoke). cargo tree -p starter-flow-nodes --edges normal piped through grep adk-rust must return zero matches. cargo tree -p starter-flow-spi --edges normal diffed against DOCS/flow/scope/starter-flow-spi-deps.baseline.txt must be empty (Phase 1 baseline holds). Confirm no path-dep from the four flow crates to starter-mcp / starter-server / starter-cli (Phase 3 surfaces wiring is the next job, not here). The two Phase 2 SCOPE smokes from stage 5 pass green under cargo test workspace tests. The R3 grep-test from stage 6 passes green. After this stage the Phase 2 flow-SCOPE exit criteria are honestly met and Phase 3 can begin.'
