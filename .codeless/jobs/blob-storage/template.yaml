name: blob-storage
goal: |
  Land the starter blob-storage capability described in
  starter/DOCS/storage/SCOPE.md: a BlobStore trait on starter-spi
  plus five new engine crates (starter-blob-memory, starter-blob-fs,
  starter-blob-s3, starter-blob-garage, starter-blob-compose) plus a
  docker/ reference Garage compose and an examples/blobs walkthrough.
  After this job a consumer adds one engine crate to Cargo.toml,
  optionally a combinator stack from starter-blob-compose, and gets
  the canonical put/get/head/delete/list/presign surface with
  BlobRef as the opaque durable handle. The hard rules B1-B3 hold
  by construction (no domain leaks, BlobRef opaque, no silent
  durability shifts). All five smoke tests in the SCOPE pass.

stages:
  - "stage 1 — starter-spi additions (R-blob-spi): land BlobStore trait + BlobKey (validated, no .., no leading /, UTF-8, length-bounded) + BlobRef (opaque, backend_id/etag/size accessors only, serde round-trip, NO public locator field — B2 by construction) + BlobMeta + BlobRange + PresignedUrl + the full typed BlobError enum (NotFound, Unauthorized vs Forbidden distinct, AlreadyExists, PreconditionFailed, PayloadTooLarge, Throttled{retry_after}, Timeout, Unsupported, Backend(BoxError) as last-resort residual); the trait carries put_bytes + put_stream + get(BlobRef, Option<BlobRange>) + head + delete + list(prefix, cursor) + presign + copy_server_side (errors Unsupported, never silent fallback); free function copy_via_client lives in starter-spi alongside; observability contract documented (spans emit from engines under starter_blob::<engine>, metrics opt-in per engine, no spi-level emission). One new module starter-spi::blob; nothing existing in starter-spi changes shape. Audit grep for collisions on Blob* symbols across the 30+ downstream crates before landing"
  - REVIEW stage 1 — confirm the spi additions are purely additive (no existing public symbol shape changed, no pub use sweep), confirm BlobRef has no public locator accessor (B2 compile-time), confirm BlobError variants are exhaustive per the SCOPE (Throttled has retry_after, Unauthorized and Forbidden are distinct), confirm copy_server_side returns Unsupported rather than falling back
  - "stage 2 — starter-blob-memory + starter-blob-fs (the test+dev engines): starter-blob-memory uses HashMap<BlobKey, Bytes> behind a RwLock, presign returns a process-signed HMAC token honoured by a feature-gated axum router shipped in the same crate (so the presign contract is testable without real S3), HMAC key is process-local random rotating per restart with documented behaviour. starter-blob-fs writes atomic via tempfile-rename, conditional via O_EXCL, lists via walkdir with configurable max-depth, presign HMAC over a SecretStore-supplied PresignKey (constructor takes Store::open(path, PresignKey) — never generates implicitly; PresignKey::ephemeral() exists for tests with documented die-with-process semantics), the feature-gated axum router lives in the same crate. Both crates ship the smoke tests called out in the SCOPE: swap-test fixture, compose-test fixture (wraps in Namespaced + Tiered later in stage 4 — leave a TODO marker referencing stage 4), test-without-network test passes against starter-blob-memory"
  - REVIEW stage 2 — confirm starter-blob-memory and starter-blob-fs both pass the trait test suite, confirm the presign router contract is honoured (a presigned URL from -memory works against the -memory crate's router; same for -fs), confirm B1 holds (no domain words like avatar/attachment leaked into either crate's public API), confirm B2 holds (no consumer code in the smoke tests can construct a BlobRef out of a string)
  - "stage 3 — starter-blob-s3 + starter-blob-garage (the production engines): starter-blob-s3 wraps aws-sdk-s3 with force_path_style configurable (required for MinIO/Garage/on-prem), credentials sourced via SDK chain OR via starter-spi::SecretStore, multipart implementation of put_stream, S3 conditional headers wired for PutOptions::if_none_match / if_match (PreconditionFailed surface), S3 403 → Forbidden and 404 → NotFound never collapsed, SlowDown → Throttled with retry_after from the Retry-After header. starter-blob-garage layers on top: bucket lifecycle via Garage admin API (POST /v1/bucket, DELETE /v1/bucket/{id}), per-bucket access-key minting, cluster health via GET /v1/health surfaced as typed status, layout introspection at startup. Integration tests use a docker-compose Garage spun up in CI per the SCOPE Repo-layout § (docker/garage.example.toml + docker-compose.garage.yml ship in this stage). Licensing note in each crate's README per the SCOPE — Garage is AGPL but starter consumers reach it over the wire, no source linkage"
  - REVIEW stage 3 — confirm Garage docker-compose recipe boots cleanly in CI, confirm SwapTest passes (one-line wiring change from -fs to -garage and the consumer compiles), confirm credentials path for both crates routes through SecretStore as documented, confirm the AGPL boundary is honoured (no Garage source files imported, only HTTP calls to its API)
  - "stage 4 — starter-blob-compose (combinators): land Namespaced { inner, prefix } that prepends prefix on every op and STRIPS self.prefix from list() entries before yielding (consumer observes a clean view rooted at their namespace); Tiered { hot, cold, policy } with write-to-hot + demote-per-policy (size/age/on-eviction) + read tries hot then cold then optional promote-back; Mirrored { primary, mirrors, mode } where mode=Sync fails on any mirror failure and mode=AsyncBackground returns on primary success with best-effort fan-out (the names load-bear B3); ReadThroughCache { source, cache, ttl } kept SEPARATE from Tiered because write semantics differ (cache populates lazily on read, source is the only write target — folding into Tiered would force a WriteTarget enum no current consumer needs). All four combinators implement BlobStore so they nest. list() returns (BlobRef, BlobMeta) pairs not raw keys; combinators rewrite BlobRefs on the way out the same way they rewrite on put. The list_keys()-returns-strings shape is deliberately NOT on the trait. Document failure modes in type-level rustdoc per B3. Add the missing compose-test smoke fixture stage 2 left a TODO for"
  - REVIEW stage 4 — confirm all four combinators nest (test fixture Namespaced wrapping Tiered of local Fs and remote Garage with prefix tenant-7), confirm B3 holds (Mirrored::AsyncBackground name and rustdoc both signal the durability shift; ReadThroughCache rustdoc says cache is never source-of-truth on read-after-delete), confirm the Namespaced strip behaviour by listing through the combinator and asserting no consumer-visible self.prefix
  - "stage 5 — examples/blobs walkthrough + the five SCOPE smoke tests assembled at workspace level: write examples/blobs/ — minimal axum route that accepts an upload, persists a BlobRef in sqlite (using existing starter-store-sqlite, no new feature work), serves a presigned GET. Run the five SCOPE 'Smoke tests' as workspace-level integration tests: (1) SwapTest — consumer changes one line from starter_blob_fs::Store::open(path) to starter_blob_garage::Store::connect(cfg) and every domain function compiles + behaves identically for the trait surface; (2) ComposeTest — wrapping any engine in Namespaced or Tiered requires no change to BlobRef consumers and no SQL migration; (3) TestWithoutNetwork — full integration suite runs against starter-blob-memory with no feature-flag gymnastics; (4) CostToSkip — a consumer who never touches blobs pays zero; cargo tree shows none of these crates as a transitive dep of starter-server's default feature set; (5) R8 — every public item in starter-spi's blob additions has a doc-comment explaining the WHY (especially BlobRef-vs-BlobKey split). Cap stays at 30000¢ / 4h for this stage too"
