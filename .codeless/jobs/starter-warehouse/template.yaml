name: starter-warehouse
goal: |
  Implement the starter-warehouse capability per DOCS/Warehouse/SCOPE.md,
  DOCS/Tags/SCOPE.md, and DOCS/storage/ADR-003-clickhouse-warehouse.md
  (all just landed on master after a two-pass peer review). Five
  slices, two REVIEW gates: (A) starter-tags crate with PG+CH+match
  compile targets and prefix registry; (B) starter-store-postgres
  dimensions feature with entities/refs/tag_definitions/
  tag_prefix_registry/marts/cleaners/sandboxes/ext_manifest_approvals
  catalogs; (C) starter-store-clickhouse crate with raw_events/
  samples/events/documents tables, entities_dict dictionary, async
  insert discipline; (D) starter-warehouse crate with all node kinds
  (tap.write, curate.write, bulk.import, sandbox.define/redefine/drop,
  cleaner.define/promote/drop, mart.define/read/promote/drop), REST
  surface, dimension_freshness contract, W14 filter validation, W15
  catalog GC, W16 read-after-write semantics; (E) flow-agent example
  smoke + an iot-anomaly-detector port that demonstrates the worked
  example end-to-end (MQTT flow + cleaner.define + mart.define +
  mart.read), then final sweep. Hard rules W1-W16 hold by
  construction.

stages:
  - "stage 1 (slice A) — starter-tags crate: scaffold crates/starter-tags/ (Cargo.toml with serde, serde_json, thiserror, nom only — no DB drivers, no tokio, sync); land src/set.rs (TagSet, TagValue with Bool|Str variants only per T2 — NO Num variant; tag_value_to_ch_string canonical fn; TagSet::insert rejects Str(\"true\"/\"false\") and case variants per the Bool/Str reserved-string rule that closes M-2 from the second peer review; NaN/Inf rejection at TagSet construction for any JSON number input that doesn't coerce to exact integer string); src/query.rs (TagQuery AST + nom parser implementing T7 grammar; integer literals only — reject float literals at parse time with typed error per T2); src/compile_pg.rs (T8a: produces jsonb @> '…' fragments only, no ->>, no array ops); src/compile_ch.rs (T8b: produces tags['k'] = ? fragments only, no JSONExtract, no mapContains nesting); src/compile_match.rs (T8c in-process matcher); src/definition.rs (TagDefinition with kind enum 'bool'|'str'|'ref'|'num_discriminant' per the T5 reconciliation — NO bare 'num'); src/reserved.rs (T6 table as code); src/error.rs; src/lib.rs prelude; tests/parser.rs, tests/pg.rs, tests/ch.rs, tests/match.rs, tests/roundtrip.rs, tests/semantic_parity.rs (the D6 invariant: integer-as-string discriminant fixture, Bool fixture, bare-tag sugar fixture, float-literal-rejection fixture, Bool/Str reserved-string rejection fixture); file-size budget per Tags SCOPE 'File-size budget' section; add starter-tags = { workspace = true } to root Cargo.toml workspace.members; the entire crate must compile, all unit tests must pass, and the semantic-parity fixture must pass without contacting any database (T8c is the oracle for T8a and T8b)"

  - "stage 2 (slice B) — starter-store-postgres dimensions feature: add a 'dimensions' feature on crates/starter-store-postgres/Cargo.toml that enables sqlx/json + sqlx/chrono + serde_json + starter-tags (workspace); land crates/starter-store-postgres/migrations/dimensions/0001_entities.sql through 0008_ext_manifest_approvals.sql exactly matching the schema listed in Warehouse SCOPE 'Migrations' section (0001 entities with JSONB tags + GIN jsonb_path_ops index, 0002 entity_refs with PK (from_id, rel, to_id) + FK CASCADE, 0003 tag_definitions per Tags T5 schema with the 4-value kind CHECK, 0004 tag_prefix_registry per Tags T6 BI-4 with prefix PRIMARY KEY, 0005 marts catalog per W5 with promoted_columns TEXT[] field + status CHECK + created_by CHECK + the partial-index-backed live-quota trigger per W12, 0006 cleaners catalog with backfill enum + validate_entity enum + mv_live_at + backfill_window_end + frozen_at_revision-mirroring fields, 0007 sandboxes catalog per RF-4 with columns_revision + frozen_at_revision + status CHECK, 0008 ext_manifest_approvals per W12 with composite PK); use _sqlx_migrations_dimensions as the version table (non-default sqlx convention — W1 names this explicitly); land src/dimensions/ module behind #[cfg(feature = \"dimensions\")] with submodules for entities, entity_refs, tag_definitions, tag_prefix_registry, marts, cleaners, sandboxes, ext_manifest_approvals, plus a small catalog_gc module for W15 and a catalog_audit module for the W5 drift check; each submodule exposes typed CRUD plus the partial-index/CHECK enforcement helpers; export DIMENSIONS_MIGRATION_SOURCE; integration tests under crates/starter-store-postgres/tests/dimensions_*.rs using the existing testing::with_database helper, including a test that two pack inserts claiming the same prefix fail the txn (T6 BI-4 enforcement) and a test that the live-mart quota trigger only scans live rows; do NOT touch the existing OLTP migration namespace; do NOT touch starter-store-sqlite"

  - "REVIEW slice A+B — confirm starter-tags ships with all three compile targets and a green semantic_parity.rs (the D6 invariant is the load-bearing correctness property of the whole tag layer); confirm starter-store-postgres --features 'dimensions testing' -- --ignored is green and that the dimensions migrations apply cleanly against an empty Postgres; read the handover's 'tag/dialect translation notes' section (anything subtle in PG dialect of the three compile targets) and verify each entry is sound; confirm starter-store-sqlite is unchanged (git diff against master on that crate is empty); confirm the prefix-conflict test and the live-quota trigger test both pass; this gate is the cheap defence against tag-layer or schema drift compounding through slice C/D — do not advance without explicit approval"

  - "stage 3 (slice C) — starter-store-clickhouse crate: scaffold crates/starter-store-clickhouse/ (Cargo.toml using the official 'clickhouse' Rust crate per ADR-003 pinning — NOT klickhouse; tokio, reqwest, serde, serde_json, chrono, uuid, starter-tags workspace, plus testcontainers under a 'testing' feature); land migrations/0001_raw_events.sql through 0005_entities_dict.sql exactly matching the Warehouse SCOPE 'L1', 'L2', 'L2-dim' sections including: id UInt64 DEFAULT generateSnowflakeID() on raw_events and events per M-1, ZSTD codec on payload columns for parts >3 days, PARTITION BY toYYYYMMDD(received_at) on raw_events with TTL 14 DAY, samples with PARTITION BY toYYYYMM(ts) + ORDER BY (entity_id, ts) + TTL to s3_cold 90 DAY + 2 YEAR DELETE, events with ORDER BY (kind, entity_id, ts) + 1 YEAR TTL + the LowCardinality cardinality-cap comment per M-5, documents with caller-supplied id, every history table getting a bloom_filter skip index on tags, and 0005 CREATE DICTIONARY entities_dict with SOURCE(POSTGRESQL(…)) + LIFETIME(MIN 300 MAX 600) + invalidate_query SELECT max(updated_at) FROM entities + LAYOUT(HASHED()); land a small in-crate migration runner (the ecosystem has no sqlx::migrate equivalent for CH); each .sql file is a single DDL statement and uses IF NOT EXISTS everywhere (CH DDL is non-transactional); src/store/raw_events.rs and src/store/samples.rs and src/store/events.rs and src/store/documents.rs implementing the typed write paths per W8 (async_insert=1, wait_for_async_insert=1 set on every connection — lint-enforced in code, raw INSERT strings outside the store crate are forbidden); src/dim_freshness.rs implementing the W11 status enum (fresh|stale_within_bound|stale_beyond_bound|failed_refresh) querying system.dictionaries with the 5s server-side cache per W11; src/testing/ with_clickhouse helper mirroring starter-store-postgres::testing::with_database (uses a CH testcontainer); integration tests under tests/ covering insert/read roundtrip per table, the dimension_freshness status transitions, the async_insert flush bound (this proves W16's ≤ 1.5s read-after-write claim is real, not aspirational), and the W13 dictGetOrNull contract (an orphaned entity_id surfaces as NULL); add to workspace.members; cargo test -p starter-store-clickhouse --features testing -- --ignored must be green; do NOT add any flow-engine glue here — this crate is store-only, the warehouse crate consumes it"

  - "stage 4 (slice D) — starter-warehouse capability crate: scaffold crates/starter-warehouse/ (Cargo.toml with starter-flow-spi, starter-flow-nodes, starter-tags, starter-store-postgres feature 'dimensions', starter-store-clickhouse, axum or starter-server for the REST surface, behind a 'warehouse' cargo feature default-off); implement EVERY node kind from the W9 enumeration as a NodeBehavior impl with descriptor registration via starter-flow-nodes — tap.write, curate.write (per-row PG entity lookup, per W7 never refuses payload structure), bulk.import (target enum 'samples'|'sandbox:<name>'|'raw_events' REQUIRED, no default; async_insert=0 + 10k batch per W8a), sandbox.define + sandbox.redefine (requires confirm: true, refused if frozen_at_revision IS NOT NULL per RF-4) + sandbox.drop, cleaner.define (backfill enum none|sync|async; validate_entity enum none|best_effort|strict_via_postgres per BI-2; sync backfill auto-promotes to async beyond cleaner.sync_backfill_max_rows default 1M with 5-min wall-clock cap per RF-6; sets sandboxes.frozen_at_revision when source is a sandbox; ReplacingMergeTree(version) or deterministic-key requirement enforced at define time per the rewritten W9 idempotency rule) + cleaner.promote + cleaner.drop (clears frozen_at_revision on source sandbox), mart.define (writes promoted_columns to catalog after DDL succeeds per RF-1; ORDER BY (<first group_by>, bucket, <rest>) per W5/D7; AggregatingMergeTree target; per-insert MV; ext_manifest_approvals hash check per W12 RF-5 — manifest hash change re-quarantines ALL of that extension's live marts/cleaners in the same txn) + mart.promote (admin-gated; inserts approval row for ext) + mart.read (filter validation reads catalog.promoted_columns per W14 — NOT group_by; HTTP 400 with structured body naming promoted_columns when an unsupported key is referenced; range parameter typed as { from: Timestamp, to: Timestamp } with max_buckets cap default 20000 per M-4; hide_unknown=false default per W13; envelope carries dimension_freshness block per W11 with status enum populated from starter-store-clickhouse's dim_freshness module) + mart.drop; implement the REST surface from the 'REST and SSE surface' table exactly as written including /api/warehouse/status (returns HTTP 503 when any dictionary status='failed_refresh') and /api/warehouse/gc (W15 manual trigger) and /api/warehouse/audit (W5 drift check); SSE handlers for /api/marts/events and /api/entities/events using starter-server's sse::keepalive(15s); implement W15 catalog GC as a daily background task with the two-window policy (90 days quarantined/failed, 365 days promoted sandboxes); implement W5 catalog-audit job runnable at boot and via /api/warehouse/audit; file-size budget per the 'File-size budget' table; integration tests under crates/starter-warehouse/tests/ covering every node kind happy path + the load-bearing rejection paths (W14 400 with the structured body, W12 manifest-hash re-quarantine, RF-4 sandbox.redefine refusal when frozen, RF-6 sync→async auto-promotion, W11 dimension_freshness status transitions including the 503 path, W16 read-after-write bound observable via /api/warehouse/status.ingest.async_insert_oldest_age_ms); MCP tool surface per the 'AI agent / MCP' section (query_entities, tag_entity, define_mart, drop_mart, read_mart, define_sandbox, peek_sandbox) implemented behind an 'mcp' sub-feature; cargo test -p starter-warehouse --features 'warehouse testing' -- --ignored green"

  - "REVIEW slice D — confirm starter-warehouse exposes every node + every REST endpoint from the spec; confirm the dimension_freshness envelope is observable on a real mart.read against a populated CH testcontainer with an entities_dict in fresh/stale/failed_refresh states (capture transcripts of all three); confirm W14 rejects an unsupported filter key with the structured body (transcript); confirm W12 manifest-hash change re-quarantines an existing live ext-authored mart (transcript covers: install ext at hash A, mart goes live; bump ext to hash B without re-approval, observe the previously-live mart is now quarantined and reads error); confirm W15 GC actually deletes a 90-day-old quarantined row in dry-run + real-run (transcript); confirm W16 read-after-write boundary works as specified — a tap.write followed by polling /api/warehouse/status for ingest.async_insert_oldest_age_ms = 0 then mart.read sees the row in under 1.5s (transcript); confirm the cleaner sandbox-freeze and sandbox.redefine refusal flows (transcript); this gate is the load-bearing defence before flow-agent and the iot example bind to the surface — every claim that lives as English in the spec must show up as a passing test transcript here; do not advance to slice E without explicit approval"

  - "stage 5 (slice E) — flow-agent smoke + iot-anomaly-detector port + final sweep: wire the warehouse feature into examples/flow-agent (under a flag, since flow-agent is Postgres-only for OLTP per ADR-001 but it can opt into the warehouse capability for tagged history) and run a manual smoke: ingest a few rows via tap.write, define a mart, read it, observe dimension_freshness in the envelope, capture transcript; port examples/iot-anomaly-detector to the worked-example shape from the post-review walkthrough (MQTT subscribe → tap.write per ingest; an inline starter-ext-iot extension with a cleaner.define from raw_events to samples and a mart.define for mart_iot_1m and mart_iot_1h; the anomaly detector becomes two mart.read calls + a compute.zscore flow node emitting Verdicts — NO direct ClickHouse SQL anywhere in the binary; the binary becomes a thin flow driver, not a polling loop); examples/iot-anomaly-detector/README.md updated to reflect the architecture (call out the manifest-hash trust gate, the dimension_freshness badge, the W14 filter contract); confirm cargo run -p iot-anomaly-detector against a docker-compose stack (the existing docker/docker-compose.clickhouse.yml plus a postgres and a mosquitto) boots, ingests, computes verdicts; cargo tree -p iot-anomaly-detector | grep -i clickhouse must show clickhouse reachable only via starter-store-clickhouse (no direct dependency); cargo test --workspace green; cargo clippy --workspace --all-features -- -D warnings green; cargo fmt --check green; the final handover doubles as the job's exit summary — what landed, what tests cover each W-rule (the W-rule ↔ test matrix), what was deferred (e.g. ReplicatedMergeTree multi-replica testing, klickhouse evaluation, the future entity_refs_dict per M-3), and an honest note on which spec claims are now mechanically enforced vs which still live only as prose"
