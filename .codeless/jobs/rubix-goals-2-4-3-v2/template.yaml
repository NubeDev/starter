name: rubix-goals-2-4-3-v2
goal: |
  Light up three more rubix backend goals end-to-end through the now-real
  agent loop: Goal 2 (user-admin), Goal 4 (clickhouse-ruler), Goal 3
  (flow-programmer). Every write is reversible via rubix.undo.last; Goal 3
  flow definitions live in PG (flows_definitions dimension table) with
  cross-instance NOTIFY; Goal 4 CH DDL writes snapshot prior state into a
  bounded undo_snapshots table. Goals 1 and 6 stay deferred. At the end,
  four of six bundled MCP tools invoke real loops dispatching real domain
  tools with full audit + undo + i18n round-trip, evidenced by per-goal
  integration tests and a closing smoke session note.

stages:
  - "phase A.1 — undo dispatch registry — read crates/starter-undo/ to confirm whether a Reversible-aware dispatch wrapper already exists; if not, add starter-undo::dispatch::record_if_reversible upstream per R2 with a unit test that round-trips a fake Reversible through it, then add rubix/crates/rubix-tools/src/undo/dispatch.rs (~100 lines) that wraps Tool::invoke to call record_if_reversible after a successful invoke and adds rubix-tools/src/undo/last.rs implementing the rubix.undo.last verb that calls starter_undo::undo_last(actor, scope); add docs/design/undo/README.md present-tense; integration test in rubix-agent/tests/undo_dispatch_test.rs registers a fake reversible tool, dispatches it, asserts the inverse was recorded; commit feat(starter-undo) + feat(rubix-tools) + feat(rubix-agent) in dependency order"
  - "phase A.2 — undo_snapshots migration + retention sweep — add rubix/crates/rubix-store-postgres/migrations/<NNNN>_undo_snapshots.sql with the columns listed in SCOPE Phase A; add rubix-agent/src/boot/undo_sweep.rs (~150 lines) that runs at boot and on a 24h tokio timer, pruning per (tenant_id, resource_kind, resource_id) to keep the most recent N rows (default 50, configurable in agent.toml [undo] section) or rows newer than X days (default 90, configurable), whichever is smaller; extend AgentConfig with [undo] section in boot/config.rs; integration test in tests/undo_sweep_test.rs inserts 100 snapshots for one resource, runs the sweep, asserts ≤50 remain; commit feat(rubix-store-postgres) + feat(rubix-agent) in two commits"
  - "phase A.3 — bundled-flow allowed_tools[] population — extend rubix-flows/src/yaml.rs RubixFlowYaml to read the full allowed_tools[] list (currently only [0] is consumed per PR #31); extend rubix-flows/src/convert.rs to write the list into the AiAgentNode config so AgentLoop's ToolSet filter scopes per flow; integration test in rubix-flows/tests/load_test.rs asserts a multi-tool allowed_tools list round-trips; commit feat(rubix-flows) one commit"
  - "REVIEW gate — confirm Phase A infrastructure is sound — handover lists the four Phase A commits with cargo test counts, undo dispatch test green, sweep test green, allowed_tools test green; present SCOPE Open Question 1 evidence to the operator (whether the upstream-first starter-undo change was needed) and wait for confirmation to proceed to Phase B"
  - "phase B.1 — Goal 2 verbs (writes first) — fill rubix-tools/src/user/create.rs, user/disable.rs, team/create.rs, team/assign.rs per the SCOPE Phase B contract; each implements Reversible with snapshot shape documented in the design doc; each emits a Diagnostic with the listed MessageKeys; add entries to rubix-spi/catalogues/en.json + es.json in the same commit; commit feat(rubix-tools) user-admin write verbs with body listing the five MessageKeys"
  - "phase B.2 — Goal 2 reads + skill + flow YAML — fill rubix-tools/src/user/list.rs and tenant/list.rs (read-only, no Reversible); update rubix-skills/skills/user-admin/SKILL.md present-tense; populate flows/user-admin.yaml allowed_tools = [user.create, user.disable, user.list, team.create, team.assign, tenant.list, rubix.undo.last]; commit feat(rubix-tools+rubix-skills+rubix-flows)"
  - "phase B.3 — Goal 2 integration test + design doc — add rubix-agent/tests/goal_2_user_admin_test.rs with the two-scenario test (create user via MCP + assert PG row + Diagnostic code; undo + assert disabled); add docs/design/user-admin/README.md present-tense; cargo test -p rubix-agent green; lint-doc-refs clean; commit test(rubix-agent) + docs(design)"
  - "REVIEW gate — Goal 2 demo — handover summarises the three Phase B commits, the integration test evidence, and one operator-runnable manual flow (curl tools/call user-admin → assert user row appears in PG → curl rubix.undo.last → assert disabled); wait for operator confirmation before Phase C"
  - "phase C.1 — Goal 4 verbs — fill rubix-tools/src/clickhouse/rule_write.rs, mart_create.rs, retention_set.rs per SCOPE Phase C; each implements Reversible with snapshot taken via SHOW CREATE TABLE or system.tables retention query before the write; mart_create's empty-snapshot case maps to DROP TABLE IF EXISTS on undo with the data-loss caveat documented; add the six MessageKeys to en.json + es.json; commit feat(rubix-tools) clickhouse-ruler verbs"
  - "phase C.2 — Goal 4 skill + flow YAML + integration test + design doc — update rubix-skills/skills/clickhouse-ruler/SKILL.md present-tense; populate flows/clickhouse-ruler.yaml allowed_tools = [clickhouse.rule.write, clickhouse.mart.create, clickhouse.retention.set, rubix.undo.last]; add rubix-agent/tests/goal_4_clickhouse_ruler_test.rs (set retention via MCP, assert ALTER ran, snapshot row exists, undo restores prior); add docs/design/clickhouse-rules/README.md present-tense including the mart.create undo data-loss caveat; commit feat(rubix-skills+rubix-flows) + test(rubix-agent) + docs(design) in two commits"
  - "REVIEW gate — Goal 4 demo — handover summarises Phase C commits, integration test counts, and one operator-runnable manual flow (curl tools/call clickhouse-ruler set retention → assert system.tables shows new TTL → curl undo → assert prior TTL restored); confirm before Phase D"
  - "phase D.1 — flows_definitions migration + FlowRegistry refactor — add rubix-store-postgres/migrations/<NNNN>_flows_definitions.sql with the SCOPE Phase D shape (ULID PK, tenant_id, flow_id, revision_id, body_yaml, created_at, created_by, superseded_at NULL, UNIQUE constraint); refactor rubix-agent::boot::flows::build_flow_registry to seed bundled YAMLs into the table on first boot per (tenant_id, flow_id) miss, then load all rows where superseded_at IS NULL; add pg_notify('rubix_flows_definitions', ...) trigger on insert/update; add rubix-agent/src/boot/flow_notify.rs (~120 lines) listening on the channel and calling FlowRegistry::reload(flow_id, body) on receipt; integration test in tests/flow_definitions_seed_test.rs asserts bundled YAMLs land in PG on first boot, second boot is no-op; commit feat(rubix-store-postgres) + feat(rubix-agent) in two commits"
  - "phase D.2 — Goal 3 verbs — fill rubix-tools/src/flow_ops/deploy.rs (validates via rubix_flows::yaml::RubixFlowYaml, writes new revision, marks prior superseded), lint.rs (parse + structured Diagnostic with line-numbered errors, read-only), list.rs (SELECT distinct flow_ids where superseded_at IS NULL, read-only), duplicate.rs (read latest revision of source, write new revision under target flow_id); deploy and duplicate implement Reversible (undo marks new revision superseded + clears prior's superseded_at); add the six MessageKeys to en.json + es.json; commit feat(rubix-tools) flow-programmer verbs"
  - "phase D.3 — Goal 3 skill + flow YAML + integration test + design doc — update rubix-skills/skills/flow-programmer/SKILL.md present-tense; populate flows/flow-programmer.yaml allowed_tools = [flow.deploy, flow.lint, flow.list, flow.duplicate, rubix.undo.last]; add rubix-agent/tests/goal_3_flow_programmer_test.rs (duplicate scheduled-system-check via MCP, assert new revision row, tools/list surfaces both, undo supersedes new revision and tools/list reverts); add docs/design/flow-programmer/README.md present-tense including the NOTIFY mechanism and the deploy contract; commit feat(rubix-skills+rubix-flows) + test(rubix-agent) + docs(design) in two commits"
  - "REVIEW gate — Goal 3 demo — handover summarises Phase D commits, the integration test evidence, one operator-runnable manual flow (curl tools/call flow-programmer duplicate → assert PG row → assert tools/list grew → curl undo → assert tools/list shrunk); confirm before Phase E"
  - "phase E — closing docs + smoke session note + PR — add the deferred Goals 1 and 6 stub-output verbs (com.rubix.dashboard-assistant and com.rubix.weekly-report return Diagnostic with code=rubix.goal.not_wired linking the design doc); update rubix/docs/scope/THIN-SLICE.md with the new \"Goals lit up beyond the thin slice\" section listing goals 2, 3, 4, 5 as real and goals 1, 6 as stubbed with unblock criteria; add rubix/docs/sessions/<today>-goals-2-4-3-landed.md documenting verification per goal (one tools/call, one undo, one test count, the i18n_keys boot log line, the snapshot sweep evidence); confirm with operator that the PR shape is one PR off codeless/rubix-goals-2-4-3 reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-goals-2-4-3 with title \"feat: light up goals 2, 4, 3 end-to-end with undo + PG flow definitions\" and body summarising each phase; commit chore(docs) close out goals 2 4 3 + open PR"
