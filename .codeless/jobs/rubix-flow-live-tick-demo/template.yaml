name: rubix-flow-live-tick-demo
goal: |
  Ship the smallest end-to-end proof of Niagara-shape always-on flow
  runtime: a bundled trigger.schedule (every 5s) -> counter (++) ->
  log flow that fires from boot, persists count across restarts via
  the new NodeStateStore seam in starter-flow-spi, streams slot values
  to /flows/<id> over SSE, and lets the operator hot-edit cron and
  step without restarting rubix-agent. Lands NodeStateStore +
  in-mem + sqlite impls + starter.flow.counter upstream first (R2),
  then rubix-side SSE route + always-on mounter + bundled flow +
  frontend live view + settings sidebar.

stages:
  - "phase A+B.1 — NodeStateStore trait + in-mem + sqlite + ctx wiring + docs — add starter-flow-spi/src/state.rs (~150 lines) with NodeStateStore trait + NodeStateKey + NodeStateValue + NodeStateError; extend starter-flow-spi/src/node.rs NodeCtx with pub state: &'a dyn NodeStateStore (this is the load-bearing API addition — every existing NodeCtx call site must update); add starter-flow/src/state/in_memory.rs InMemoryNodeStateStore over RwLock<HashMap>; add starter-store-sqlite/src/node_state.rs SqliteNodeStateStore + migration with (flow_id,node_id,key) PK + version column for CAS; add starter-flow/tests/node_state_in_memory_test.rs and starter-store-sqlite/tests/node_state_sqlite_test.rs running the same parameterised matrix (get-missing/get-after-put/put-overwrites/cas-success/cas-mismatch/delete-then-get-missing); add DOCS/flow/scope/node-state.md (~200 lines) covering R5 reconciliation + keying scheme + CAS semantics + two-impl pattern + size caps (key <= 256 bytes value <= 64 KiB) + reset_on_redeploy semantics; cargo test -p starter-flow-spi -p starter-flow -p starter-store-sqlite green; commit feat(starter-flow) NodeStateStore trait + in-mem + sqlite impls + NodeCtx.state + node-state.md"
  - "phase A+B.2 — starter.flow.counter node + UI spec + tests — add crates/starter-flow-nodes/src/counter.rs (~180 lines) with KIND_ID starter.flow.counter + CounterSettings (step=1 default, initial=0 default, reset_on_redeploy=false default) deriving Deserialize+JsonSchema; invoke reads ctx.state.get for key 'count' (None falls back to settings.initial), computes next=current+step, ctx.state.put then returns SlotMap with out=next; implement the on_redeploy hook trait (if SCOPE OQ-3 confirms the engine has a hook point — otherwise add the hook in this commit as a small starter-flow-spi addition) so reset_on_redeploy=true clears state on EditKind::Settings|Topology|Both; emit a counter.invoke tracing span recording (node_id, run_id, prior, next); R13 cancel check before reading state; tests/counter_invoke_test.rs covering initial-fire-emits-initial-plus-step + second-fire-emits-prior-plus-step + settings-change-respects-new-step + reset_on_redeploy=true-clears-state + reset_on_redeploy=false-preserves-state using InMemoryNodeStateStore; add COUNTER_SPEC to packages/starter-ui-flow/src/nodes/builtins.tsx mirroring existing built-ins (category=data, icon=hash, one input 'in:any' one output 'out:i64') and append to BUILTIN_NODE_KINDS export; cargo test -p starter-flow-nodes + pnpm --filter @nube/starter-ui-flow typecheck green; commit feat(starter-flow-nodes) counter — first consumer of NodeStateStore"
  - "phase A+B.3 — present-tense rewrite of hot-reload.md + settings.md — rewrite DOCS/flow/scope/hot-reload.md replacing the stale 'Today (Phase 2-5)' section with present-tense covering: every flow_ops.deploy is a publish through DefinitionManager::publish; publish path classifies the edit via classifier.rs (Initial/NoOp/Settings/Topology/Both); settings edits short-circuit to slot writes via definition::manager; topology edits atomically swap Arc<FlowTopology> in definition::active so in-flight runs finish on prior snapshot and new runs pick the new revision; cite resolver.rs + active.rs + classifier.rs + manager.rs line numbers; rewrite DOCS/flow/scope/settings.md replacing its 'Today (Phase 2-5)' section with present-tense covering: starter-flow-spi/src/settings.rs ships SettingsField + SettingsKind enums; node kinds (trigger_explicit/trigger_schedule/log/ai_agent/http_out) derive Settings: Deserialize+JsonSchema; the trait gains config_schema() returning &'static RootSchema; DefinitionManager::publish validates each node's settings against the kind's schema before writing a revision; lint-doc-refs upstream-style clean; commit docs(flow) present-tense hot-reload + settings rewrites"
  - "REVIEW gate — Phase A+B landed — handover names three A+B commits + cargo test counts across starter-flow-spi/-flow/-flow-nodes/-store-sqlite + pnpm test count for starter-ui-flow + present-tense doc evidence (the rewritten 'Today' sections); confirm SCOPE OQ-1 (size cap), OQ-2 (CAS vs put), OQ-3 (on_redeploy hook); wait for operator confirmation before Phase C"
  - "phase C.1 — verify flow_ops.deploy publishes through DefinitionManager — grep rubix/crates/rubix-tools/src/flow_ops/deploy.rs for DefinitionManager + publish; if deploy only writes the PG row without publishing through the engine commit fix(rubix-tools) flow_ops.deploy publishes through DefinitionManager for hot-reload with the necessary one-or-two-line wiring; otherwise mark git as skipped — verification only and document the existing call chain in the handover (the publish path likely already runs via the rubix-side store + NOTIFY listener that lands the body in DefinitionManager::publish on the listener side per goals-2-4-3 PR #32 — confirm)"
  - "phase C.2 — SSE flow-events route + always-on mounter — add rubix/crates/rubix-agent/src/routes/flow_events.rs (~150 lines) GET /api/v1/flows/{flow_id}/events returning Sse<Stream<Event>> subscribed via a shared FlowSubscriptionRegistry to RunHandle::events_tx; project each FlowEvent through starter_flow_spi::event_dto::NodeSlotValue into Event::data JSON; heartbeat every 15s; CSRF-exempt per existing SSE pattern; add rubix/crates/rubix-agent/src/boot/flow_runtime.rs (~200 lines) the always-on mounter iterating every live revision in FlowRegistry after flows_seed populates it, constructing FlowRunner instances, for every node with kind starter.flow.trigger.schedule reading the cron from the resolved topology and calling FlowAsService::register_schedule (generalises the weekly-report wiring from PR #32 — refactor boot/scheduler.rs to consume this module rather than duplicate), wiring SqliteNodeStateStore against ~/.rubix/node_state.db when RUBIX_DATABASE_URL is set otherwise InMemoryNodeStateStore; extend AgentConfig with [flow_runtime] state_db_path; wire both into main.rs alongside the existing extensions SSE route; commit feat(rubix-agent) SSE flow-events route + always-on flow_runtime + NodeStateStore wiring"
  - "phase C.3 — live tick + hot-edit + restart-persistence integration test — add rubix/crates/rubix-agent/tests/flow_live_tick_test.rs against testcontainers PG + tempdir sqlite; boots the agent, deploys a tick-counter flow with cron '*/1 * * * * *' every second, sleeps 3s, asserts node_state.count >= 3 AND the SSE stream emitted at least three NodeEmitted events; hot-edit test deploys a new revision with step=10 and asserts the next tick's count jumps by 10; restart test drops the FlowRunner reconstructs from the same sqlite db and asserts the new runner picks up the prior count from state; cargo test -p rubix-agent --test flow_live_tick_test green; commit test(rubix-agent) live tick + hot-edit + restart-persistence"
  - "REVIEW gate — Phase C landed — handover names two-or-three C commits + test counts + one operator-runnable manual flow (curl POST /api/v1/tools/rubix.flow_ops.deploy with the test YAML body -> curl GET /api/v1/flows/com.test.tick/events -> see slot value events arriving every second -> docker exec sqlite SELECT count from node_state -> see climbing); confirm SCOPE OQ-5 (subscription registry shape) before Phase D"
  - "phase D — bundled com.rubix.tick-counter flow YAML — add rubix/crates/rubix-flows/flows/tick-counter.yaml with the three-node graph per SCOPE Phase D (trigger.schedule cron '*/5 * * * * *' -> counter step=1 initial=0 reset_on_redeploy=false -> log level=info message_template='tick {value}') and links tick.fire -> count.in and count.out -> emit.value; verify the existing flows_seed picks it up on next boot landing it as a non-superseded flows_definitions row; add a sanity test in rubix/crates/rubix-flows/tests/load_test.rs asserting the YAML parses and converts to a FlowBody with three nodes and two edges; cargo test -p rubix-flows green; commit feat(rubix-flows) bundled com.rubix.tick-counter live demo flow"
  - "REVIEW gate — Phase D landed — handover names the one D commit + one operator-runnable manual flow (make restart -> curl GET /api/v1/tools/rubix.flow_ops.list to see com.rubix.tick-counter listed -> curl GET /api/v1/flows/com.rubix.tick-counter/events -> see ticks arriving every 5s -> psql to inspect node_state row for count climbing); wait before Phase E"
  - "phase E.1 — flow_ops.list returns body_yaml + flow_ops.kinds endpoint — extend the FlowListItem Rust DTO in rubix-spi to carry body_yaml: String alongside the existing flow_id + revision_id; extend the handler at rubix/crates/rubix-tools/src/flow_ops/list.rs to include the body in the SELECT (same row, no extra round-trip); extend FlowListItem in rubix-client-ts/src/endpoints/flow_ops.ts to match; add a new flow_ops.kinds verb returning [{kind_id, config_schema, default_label}] for every registered kind (sources from the NodeKindRegistry; one cheap SELECT-free endpoint); add hook useFlowKinds() to rubix-client-react/src/hooks/flow-ops.ts caching under ['rubix','flow_ops','kinds']; sibling tests in both packages; commit feat(rubix-spi+rubix-tools+rubix-client-ts+rubix-client-react) flow_ops.list includes body_yaml + flow_ops.kinds endpoint"
  - "phase E.2 — useFlowEvents hook — add rubix/packages/rubix-client-react/src/hooks/flow-events.ts useFlowEvents(flowId, opts?) calling useEventStream from @nube/starter-client-react against /api/v1/flows/${flowId}/events; returns { events: NodeSlotValue[], status, reconnect, runOverlay } where runOverlay aggregates NodeStarted=running NodeEmitted=ok+stash-latest-slot-value NodeFailed=error suitable for passing to <FlowCanvas overlay>; sibling .test.tsx using MSW or fetch-mock; pnpm --filter @nube/rubix-client-react typecheck + test green; commit feat(rubix-client-react) useFlowEvents hook"
  - "phase E.3 — live values overlay + settings sidebar on /flows/$flowId — extend rubix/frontend/src/routes/flows/$flowId.tsx: replace the synthetic placeholder graph in useFlowDefinition with the real body_yaml read from useFlowsList() via queryClient.getQueryData(FLOW_LIST_KEY); subscribe to useFlowEvents(flowId); pass runOverlay to <FlowCanvas overlay={runOverlay}> and slotValues=latest-per-node to each node; add rubix/frontend/src/routes/flows/settings-sidebar.tsx (~250 lines split if needed) reading selected node from xyflow selection state looking up the node's kind in flowRegistry fetching the kind's config_schema via useFlowKinds() rendering a minimal hand-rolled JSON-Schema form for string/number/boolean/enum primitives (more complex schemas fall back to a <textarea> of raw JSON with validation feedback per SCOPE out-of-scope); Save button calls flowDeploy with the updated YAML (the engine's hot-reload classifies as Settings and short-circuits to slot writes); conflict-toast if deploy fails because revision moved; pnpm --filter @nube/rubix-frontend typecheck + test green; commit feat(rubix-frontend) live values overlay + settings sidebar"
  - "phase E.4 — playwright live-tick spec — add rubix/frontend/e2e/flow-live-tick.spec.ts: log in, navigate to /flows/com.rubix.tick-counter, wait 6s, assert displayed count > 0; click counter node, change step to 10, click Save, wait 5s, assert next count reflects +10; refresh page, assert count is preserved; pnpm --filter @nube/rubix-frontend e2e green against a running backend; commit test(rubix-frontend) playwright live tick + hot-edit + restart"
  - "REVIEW gate — Phase E landed — handover names four E commits + total e2e count + one operator-runnable manual flow (boot make start -> open http://127.0.0.1:5185/flows/com.rubix.tick-counter -> see count climb every 5s -> click counter node -> change step to 10 -> save -> see count jump +10 on next tick -> change cron to '*/2 * * * * *' on the trigger -> see ticks accelerate to every 2s -> refresh browser -> count preserved -> make restart -> count restored from sqlite resumes climbing); wait before Phase F"
