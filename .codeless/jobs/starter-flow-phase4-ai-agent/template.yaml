name: starter-flow-phase4-ai-agent
goal: |
  Land Phase 4 of DOCS/flow/scope/SCOPE.md — the `ai-agent` node kind
  body — with the D1 resolution already locked at stage 1 of the
  merged Phase 3 sibling job: `starter-flow-node-loop` shape wins;
  adk-rust stays out of the workspace dep tree. Every LLM call from
  any `ai-agent` node routes through `starter_spi::ai::AiRunner` (the
  existing `starter-ai` impls satisfy this seam). Skill selection
  runs once per outer flow run and threads through every `ai-agent`
  node as a frozen `SkillSelection`; the per-node `skill_hint` config
  slot is the only override. The tools allowlist for an ai-agent
  invocation is the intersection of (host `ToolRegistry` ∩ skill
  `allowed_tools` ∩ node `config.allowed_tools`). Phase 4 ships the
  trait + a default `NullSkillSelector` returning
  `SkillSelection::None`; the real `starter-skills` crate that ships
  a content-hash-backed selector is its own follow-up under the
  agent SCOPE. The two Phase 4 SCOPE smokes ("AI agent is just a
  node kind" + "skill quarantine survives bundle update through a
  flow") pass; the five existing workspace dep-tree gates stay
  green, and a sixth gate is added to confirm enabling the new
  default-off `ai-agent` cargo feature on `starter-flow-nodes` does
  not pull `adk-rust` into the dep tree on the opt-in path either.
  No engine refactors beyond two additive builder hooks
  (`Engine::with_ai_runner_registry`, `Engine::with_skill_selector`)
  and one additive `NodeCtx` field carrying the frozen
  `SkillSelection`. No new surfaces (Phase 3 shipped FlowAsTool +
  FlowAsService — they already let MCP / REST / CLI / JSON-RPC
  clients drive an ai-agent flow end-to-end). No remaining built-in
  node kinds (Phase 5). After this job lands Phase 4 of the flow
  SCOPE is honestly green and the engine can run agentic flows
  end-to-end on a 24/7-rated persistent runtime.

stages:
  - 'stage 1 — lock the Phase 4 boundary before code lands. Confirm the twelve D-F4 decisions in DOCS/flow/scope/SCOPE.md under "Decisions" (precedent: Phase 3 stage 1). (D-F4.1) `ai-agent` body lives in crates/starter-flow-nodes/src/ai_agent.rs (the existing 14-line stub gets the full body), behind a new default-off cargo feature `ai-agent` on starter-flow-nodes, mirroring how Phase 3 stage 4 used a `flow` feature on starter-store-sqlite — keeps the adk-rust-free dep-tree gate trivially green for consumers who don''t enable the feature and satisfies the headless-appliance posture. (D-F4.2) D1 resolved: `starter-flow-node-loop` shape wins; the body lifts Codeless''s `Runner` (turn-based LLM-loop with tool-dispatch) and routes every model call through `starter_spi::ai::AiRunner`. No adk-rust dep ever; the `starter-flow-node-adk` opt-in alternative is deferred indefinitely with the revisit trigger named verbatim in SCOPE.md ("a consumer surfaces a hard, documented need for adk-rust planner heuristics that neither Codeless''s `Runner` shape nor Rubix''s reactive propagator provides"). (D-F4.3) AiRunnerRegistry trait lives in starter-flow-spi next to node.rs, mirroring ToolRegistry shape: `pub trait AiRunnerRegistry: Send + Sync + 'static { fn lookup(&self, provider_id: &KindId) -> Option<Arc<dyn AiRunner>>; }`. Hosted via `Engine::with_ai_runner_registry(self, registry: Arc<dyn AiRunnerRegistry>) -> Self` builder hook in crates/starter-flow/src/engine.rs (Self-by-value transform, matches the stage-5 Phase-3 builder convention). Concrete impl `StaticAiRunnerRegistry` lives in crates/starter-flow-nodes/src/ai_agent.rs (the body''s home crate) per the same posture as `StaticToolRegistry` in tool_call.rs. (D-F4.4) Skill selection seam: `pub trait SkillSelector: Send + Sync + 'static { async fn select(&self, input: &SlotMap, principal: &Principal) -> Result<SkillSelection, SkillError>; }` in starter-flow-spi. `SkillSelection` is `#[non_exhaustive]` enum `None` | `Selected { skill_id: SkillId, allowed_tools: Vec<KindId>, resources: Vec<ResourceRef>, content_hash: String }`. Engine builder gains `with_skill_selector(Arc<dyn SkillSelector>)`; default is a `NullSkillSelector` constant in starter-flow returning `SkillSelection::None`. Per-node `skill_hint` config slot is the only override (string KindId; non-empty skill_hint short-circuits the selector for that node). The real starter-skills crate that ships a content-hash-backed selector is explicitly NOT in Phase 4 scope; its addition is its own follow-up job under the agent SCOPE. (D-F4.5) Tools allowlist for any ai-agent invocation = intersection of (host `ToolRegistry` keyset ∩ skill `allowed_tools` if `SkillSelection::Selected` ∩ node `config.allowed_tools` if declared). If any intersection layer is empty the body errors with `NodeError::Domain { code: "no_tools_visible", message }` rather than silently running with zero tools — explicit beats silent (matches the "no implicit default provider" posture below). The intersection is computed once at invocation entry and frozen for the duration of the LLM loop; mid-loop skill bundle updates do not change the allowlist within an invocation (the skill_quarantine smoke proves this end-to-end). (D-F4.6) Sessions: per-node config slot `session_mode: enum SessionMode { FreshPerInvocation, ReuseAcrossRun, ReuseAcrossFlow }` (#[non_exhaustive]). Default `FreshPerInvocation` (cheapest + most predictable). ReuseAcrossRun keys on `(node_id, run_id)`; ReuseAcrossFlow keys on `(node_id, flow_id, blake3(principal_id))`. SessionStore from Phase 3 holds the transcripts; new `SessionId::for_ai_agent_node(mode, node_id, run_id, flow_id, principal) -> SessionId` constructor produces a stable reverse-DNS-shaped id deterministic in its inputs. (D-F4.7) Cancellation: `NodeCtx::cancel` is wrapped at the call site by a private `CancelAdapter` that implements `starter_spi::ai::Cancel` by delegating to the engine''s Cancel seam. The LLM loop selects against `cancel.cancelled().await` inside a `tokio::select!` between turns and inside tool-dispatch. Bounded cancel-to-exit ≤ 200 ms (same budget as `tool-call`). (D-F4.8) AiRunner provider id binding: node config slot `provider_id` is mandatory (string parsed to `KindId`); empty registry lookup surfaces `NodeError::Domain { code: "provider_not_registered", message: "no AiRunner registered for {provider_id}" }`. No "default provider" fallback — explicit beats implicit, matches R10 + the headless-appliance posture. (D-F4.9) Tool-call dispatch within the LLM loop — when the model emits a tool-call, the ai-agent body resolves it via the same `ToolRegistry::lookup` chokepoint that `tool-call` body uses; the tool''s return is appended to the conversation as a tool-result message and the loop continues with one more turn. No second tool-dispatch path; one chokepoint, R8 verbatim. (D-F4.10) Smoke test home — Phase 4 smokes live under crates/smoke-tests/tests/ per D-F3.6 precedent (each smoke needs starter-ai providers and a fake AiRunner harness which starter-flow cannot depend on without a cycle). Two files, one commit per file: `ai_agent_is_just_a_node_kind.rs` (R1+R2: a flow with an ai-agent root invokes through the engine via the standard NodeBehavior::invoke entry and writes its output through the same GraphStore::write_slot chokepoint — proved by attaching a tracing subscriber and counting `write_slot` span entries equals the body''s declared output slot writes) and `skill_quarantine_survives_bundle_update_through_a_flow.rs` (skill selection runs once per flow run; the same SkillSelection threads through three ai-agent nodes; swapping the underlying skill bundle mid-flow via the test SkillSelector does not change the SkillSelection mid-run for the in-flight invocations). (D-F4.11) Recording-fake AiRunner test harness lives in crates/starter-ai/src/testing.rs behind the existing `testing` cargo feature mirror — keeps the harness close to the real impls; the two Phase 4 smokes import `starter-ai` with `--features testing` per the established pattern. `RecordingAiRunner` records every call with `(input, tools_visible, session_id, principal_id_hash)` and replays a configurable script of `(text, tool_calls)` per turn. (D-F4.12) Dep-tree gates extension — add one new integration test to crates/starter-flow/tests/workspace_dep_tree_gates.rs: `starter_flow_nodes_with_ai_agent_feature_does_not_pull_adk_rust` runs `cargo tree -p starter-flow-nodes --features ai-agent --edges normal` and asserts zero `adk-rust` substring matches. The existing four `*_contains_no_adk_rust` gates cover the default-feature path; this one covers the opt-in feature path so the D1 invariant holds whether or not consumers enable the feature. Record decisions in SCOPE.md "Decisions" with rule + revisit trigger per Phase 3 stage 1 precedent. No code in this stage.'
  - 'REVIEW Phase 4 boundary — D1 resolution re-confirmed (loop shape wins, adk-rust stays out, revisit trigger named); ai-agent body home + default-off feature flag confirmed; AiRunnerRegistry trait shape + Engine builder hook confirmed; SkillSelector trait + SkillSelection enum + NullSkillSelector default confirmed; tools-intersection rule (host ∩ skill ∩ node) with explicit empty-intersection error confirmed; SessionMode enum + default FreshPerInvocation + SessionId constructor confirmed; cancellation adapter + ≤200ms budget confirmed; mandatory provider_id (no implicit default) confirmed; one-chokepoint tool-dispatch within the LLM loop confirmed; smoke home under crates/smoke-tests/ per D-F3.6 precedent confirmed; RecordingAiRunner home in starter-ai testing feature confirmed; sixth dep-tree gate for the ai-agent feature path confirmed. Stages 3 through 9 bind to these; do not advance until the gate passes.'
  - 'stage 3 — SPI shape in crates/starter-flow-spi/src/. Three additions, all additive, all #[non_exhaustive]. (a) New module ai_runner.rs: `pub trait AiRunnerRegistry: Send + Sync + 'static { fn lookup(&self, provider_id: &KindId) -> Option<Arc<dyn starter_spi::ai::AiRunner>>; }`. Re-exports `Arc<dyn AiRunner>` through the local module so consumers don''t need a direct starter-spi dep. (b) New module skill.rs (replacing the existing 19-line placeholder): `pub trait SkillSelector: Send + Sync + 'static { async fn select(&self, input: &SlotMap, principal: &Principal) -> Result<SkillSelection, SkillError>; }` + `#[non_exhaustive] pub enum SkillSelection { None, Selected { skill_id: SkillId, allowed_tools: Vec<KindId>, resources: Vec<ResourceRef>, content_hash: String } }` + `SkillId(String)` newtype validating reverse-DNS at construction + `ResourceRef { uri: String, content_hash: String }` (only the fields the engine needs to thread the selection through; the full schema lives in the future starter-skills crate) + `SkillError { code: &''static str, message: String }`. (c) Additive `NodeCtx` field: `skill: &'a SkillSelection`. NodeCtx::new gains a fourth arg; the four existing call sites in starter-flow (propagator + tests) are updated to pass `&SkillSelection::None` for the no-selector default. (d) New `SessionMode` enum in flow.rs: `#[non_exhaustive] pub enum SessionMode { FreshPerInvocation, ReuseAcrossRun, ReuseAcrossFlow }` + `impl Default for SessionMode { fn default() -> Self { Self::FreshPerInvocation } }` + `SessionId::for_ai_agent_node(mode: SessionMode, node_id: &NodeId, run_id: RunId, flow_id: FlowId, principal: &Principal) -> SessionId`. The associated value types compile as plain Serialize/Deserialize structs; no logic, just shape. Per D-F3.7 the file DOCS/flow/scope/starter-flow-spi-deps.baseline.txt is regenerated in the same commit if the new types pull any transitive deps (likely they will not — everything is plain string/Vec/Option); the commit message names the regeneration if performed. cargo test -p starter-flow-spi green; cargo clippy -p starter-flow-spi --all-targets -- -D warnings green; cargo fmt --check green. The five existing workspace_dep_tree_gates tests still pass.'
  - 'stage 4 — `ai-agent` body in crates/starter-flow-nodes/src/ai_agent.rs behind a new default-off cargo feature `ai-agent` on starter-flow-nodes. The file currently is a 14-line stub; this stage replaces it with a ~600-line body matching tool_call.rs in shape (`tool_call.rs` is the closest precedent — registry-injected, registry-lookup-on-invoke, R8 chokepoint, R12 tracing, R13 cancellation, one impl per kind). Structure: `pub struct AiAgent { tools: Arc<dyn ToolRegistry>, runners: Arc<dyn AiRunnerRegistry>, sessions: Option<Arc<dyn SessionStore>> }`; constructor `AiAgent::new(tools, runners) -> Self` + builder `with_session_store(self, sessions) -> Self`. Five config slot constants: `PROVIDER_ID_SLOT` (mandatory), `SYSTEM_PROMPT_SLOT` (optional), `ALLOWED_TOOLS_SLOT` (optional, defaults to all visible after intersection), `SESSION_MODE_SLOT` (optional, defaults to SessionMode::FreshPerInvocation), `SKILL_HINT_SLOT` (optional, non-empty value overrides skill selector for this node). Three I/O slots: `INPUT_SLOT` (user message + optional structured fields), `OUTPUT_SLOT` (model''s final text + structured outputs), `TURN_COUNT_SLOT` (u64 the body writes for observability). impl NodeBehavior: invoke walks (1) read + validate config slots, error with NodeError::Domain on missing provider_id or invalid slot shapes; (2) resolve effective skill (ctx.skill if no skill_hint, else lookup via skill_hint short-circuit — Phase 4 ships only the no-op short-circuit since starter-skills isn''t a workspace member yet, so a non-empty skill_hint falls back to ctx.skill with a warn trace); (3) compute tools intersection per D-F4.5, error NodeError::Domain { code: "no_tools_visible" } if empty; (4) resolve session via SessionId::for_ai_agent_node + sessions.get if Some, else fresh empty transcript; (5) wrap NodeCtx::cancel as starter_spi::ai::Cancel via a private CancelAdapter; (6) LLM loop body: a `loop { ... break Ok(SlotMap) }` that calls runner.run(input, cancel) once per turn, parses the response, dispatches any tool-calls via the resolved ToolRegistry, appends results, and increments the turn counter; loop budget is hardcoded MAX_TURNS=64 with NodeError::Domain { code: "turn_budget_exhausted" } on overflow (a follow-up makes this a config slot — same posture as Phase 3 D1a hop budget). Unit tests in tests/stage4_ai_agent.rs (or inline #[cfg(test)] mod tests, matching tool_call.rs precedent): (a) missing provider_id surfaces NodeError::Domain { code: "provider_id_required" }; (b) provider_id present but no AiRunner registered surfaces NodeError::Domain { code: "provider_not_registered" }; (c) tools intersection empty surfaces NodeError::Domain { code: "no_tools_visible" }; (d) a recording AiRunner that emits one tool_call then one final text drives exactly two turns and the tool dispatch hits the registered ToolRegistry; (e) cancel fired mid-turn surfaces NodeError::Cancelled within 200ms; (f) ReuseAcrossRun mode loads the session via SessionStore::get and persists the appended turns via put on completion; (g) the R12 span shape (`ai_agent.invoke`) is recorded once per invoke with the documented fields. cargo test -p starter-flow-nodes --features ai-agent green; cargo test -p starter-flow-nodes (no ai-agent feature) still green (the stub-equivalent compiles); cargo clippy -p starter-flow-nodes --features ai-agent --all-targets -- -D warnings green; cargo fmt --check green. The five existing workspace_dep_tree_gates tests still pass.'
  - 'stage 5 — engine wiring in crates/starter-flow/src/engine.rs. Two additive Self-by-value builder hooks: `pub fn Engine::with_ai_runner_registry(self, registry: Arc<dyn AiRunnerRegistry>) -> Self`; `pub fn Engine::with_skill_selector(self, selector: Arc<dyn SkillSelector>) -> Self`. Engine.fields gain `ai_runners: Option<Arc<dyn AiRunnerRegistry>>` + `skill_selector: Arc<dyn SkillSelector>` (the latter defaults to `Arc::new(NullSkillSelector)` so a non-configured engine still constructs cleanly). Accessor: `Engine::ai_runners() -> Option<Arc<dyn AiRunnerRegistry>>` (Option mirrors the existing `run_store()` shape). `FlowRunner::start` (in crates/starter-flow/src/run.rs) calls `engine.skill_selector.select(input, principal).await?` once at run-start; the returned SkillSelection is stored on the RunHandle and threaded into every NodeCtx::new call inside the propagator (one additive field per Phase 3 stage 3 NodeCtx::new precedent). The selection is frozen for the duration of the run — re-running the selector mid-run is forbidden (the skill_quarantine smoke proves this end-to-end). Unit tests in tests/stage5_skill_threading.rs: (a) default engine has SkillSelection::None at NodeCtx::skill; (b) custom SkillSelector returning a Selected selection threads it through three sequential node invocations and each sees the same skill_id + content_hash; (c) a SkillSelector that returns SkillError surfaces it as FlowError at FlowRunner::start (the run never enters Running); (d) AiRunnerRegistry attached via with_ai_runner_registry is reachable from a node body via engine.ai_runners(). The three Phase 2 smokes + the four Phase 3 smokes still green (the additive NodeCtx field is the change most likely to regress them; run locally before commit). cargo test -p starter-flow green; cargo test -p starter-flow-spi green; cargo test -p starter-flow-surfaces green; clippy + fmt green.'
  - 'stage 6 — sixth dep-tree gate in crates/starter-flow/tests/workspace_dep_tree_gates.rs: `starter_flow_nodes_with_ai_agent_feature_does_not_pull_adk_rust` runs `cargo tree -p starter-flow-nodes --features ai-agent --edges normal` and asserts the output contains zero `adk-rust` substring matches. Test shape mirrors the existing four `*_contains_no_adk_rust` tests verbatim — same Command::new("cargo") + same grep + same assert; only the `--features ai-agent` arg differs. The existing five gates stay green. This stage adds no production code and no SPI/body edits; it only adds the gate. Verify by running the test against stage-4''s ai-agent body (must pass) and against a scratch-branch experiment that adds `adk-rust = "*"` to starter-flow-nodes''s `ai-agent` feature deps (must fail loudly). Revert the scratch experiment before commit. cargo test -p starter-flow --test workspace_dep_tree_gates green; clippy + fmt green.'
  - 'stage 7 — Phase 4 SCOPE smoke 1 in crates/smoke-tests/tests/ai_agent_is_just_a_node_kind.rs per D-F4.10. Lands the RecordingAiRunner harness in crates/starter-ai/src/testing.rs in the same commit (gated on the existing `testing` cargo feature; if the testing module doesn''t exist yet, create it next to lib.rs and re-export `pub use testing::RecordingAiRunner;` under #[cfg(feature = "testing")]). RecordingAiRunner records every call with (input, tools_visible, session_id_or_none, principal_id_hash, turn_number) and replays a configurable script of (text, tool_calls) per turn. The smoke builds a single-node flow whose root is an ai-agent with a RecordingAiRunner script of `[(text="ok done", tool_calls=[])]` — one turn, no tool dispatch, terminal text. Two #[tokio::test]s: (1) `ai_agent_writes_output_through_graph_store_write_slot_chokepoint` — attach a tracing subscriber, run the flow, count `write_slot` span entries, assert exactly one (for the OUTPUT_SLOT write) — proves R2 verbatim, the ai-agent body never bypasses the propagator; (2) `ai_agent_invocation_records_full_r12_span_shape` — capture the `ai_agent.invoke` span fields, assert all eight documented fields are present (node_id, provider_id, principal_id_hash, run_id, skill_id_or_none, turn_count, tool_call_count, cancel_observed) with the expected values. cargo test -p starter-smoke-tests --test ai_agent_is_just_a_node_kind green. The five workspace_dep_tree_gates + the new sixth one + the three Phase 2 + four Phase 3 smokes all stay green. clippy + fmt green. Single commit; bundling smoke 1 and smoke 2 is a stage-fail (precedent: Phase 3 stage 9).'
  - 'stage 8 — Phase 4 SCOPE smoke 2 in crates/smoke-tests/tests/skill_quarantine_survives_bundle_update_through_a_flow.rs per D-F4.10. The smoke builds a three-node flow: three sequential ai-agent nodes (gather → review → summarise) chained by output→input slots, each backed by a RecordingAiRunner with a one-turn no-tool-call script. A test-local SkillSelector `MutatingSkillSelector` returns `SkillSelection::Selected { skill_id: "test.bundle", allowed_tools: ["test.tool.read"], resources: vec![], content_hash: "v1" }` on first call, then on a subsequent select call (simulating an out-of-band bundle update) returns the same skill_id with content_hash: "v2" and a different allowed_tools. Two #[tokio::test]s: (1) `same_skill_selection_threads_through_all_three_ai_agent_nodes_in_one_run` — assert each of the three RecordingAiRunner.calls()[i].skill_id_or_none matches the first selection''s skill_id AND each tools_visible is the intersection against `["test.tool.read"]`, even though the MutatingSkillSelector would have served a different selection on a fresh call mid-run; (2) `bundle_update_mid_run_does_not_change_in_flight_selection` — start the flow with a Barrier blocking the second node; flip the MutatingSkillSelector state mid-run; release the barrier; assert nodes 2 and 3 still see content_hash="v1" (the selection is frozen at FlowRunner::start time per D-F4.4 + stage 5). cargo test -p starter-smoke-tests --test skill_quarantine_survives_bundle_update_through_a_flow green. All prior gates + smokes still green. clippy + fmt green. Single commit.'
  - 'stage 9 — workspace verify + dep-tree gates re-confirm (Phase 3 stage 10 shape). No code changes; just running the gates and confirming green. The six workspace dep-tree gates all hold (the five from Phase 3 + the new ai-agent-feature gate from stage 6). The three Phase 2 smokes still pass under cargo test -p starter-flow. The four Phase 3 smokes (13 tests) still pass under cargo test -p starter-smoke-tests --test flow_via_mcp --test flow_as_service --test flow_event_stream_over_four_transports --test flow_crash_and_resume. The two new Phase 4 smokes from stages 7 + 8 pass under cargo test -p starter-smoke-tests --test ai_agent_is_just_a_node_kind --test skill_quarantine_survives_bundle_update_through_a_flow. cargo test -p starter-flow-nodes --features ai-agent green; cargo test -p starter-flow green; cargo test -p starter-flow-spi green; cargo test -p starter-flow-surfaces green; cargo test -p starter-store-sqlite --features flow,testing green; cargo clippy -p starter-flow -p starter-flow-spi -p starter-flow-surfaces -p starter-flow-nodes -p starter-smoke-tests --all-targets --features ai-agent -- -D warnings green (the --features flag applies to starter-flow-nodes; clippy handles unused-feature warnings on the other crates cleanly); cargo fmt --check on the flow-scoped globs (extended to include crates/starter-flow-nodes/src/ai_agent.rs + crates/starter-ai/src/testing.rs + crates/smoke-tests/tests/ai_agent_*.rs + crates/smoke-tests/tests/skill_quarantine_*.rs). After this stage the Phase 4 ai-agent SCOPE exit criteria are honestly met; the engine can run agentic flows end-to-end on a 24/7-rated persistent runtime; Phase 5 (remaining built-in node kinds) is unblocked.'
