name: comprehensive-extension-management
goal: |
  Make the rubix extensions admin surface comprehensive: a consolidated
  issues view, live PID + process stats, sampled per-extension metrics,
  and complete data cleanup on uninstall (warehouse tables, enablement
  row, UI/sidebar cache, skills). As much logic as possible lands in the
  reusable starter-ext-* crates; rubix only wires the warehouse + skill
  cleanup providers and projects responses into its admin envelope and UI.
  Authoritative design lives in
  rubix/docs/scope/extensions/comprehensive-extension-management.md — the
  scope is locked, no open questions.

stages:
  - "stage 1 — Issues read-model: add ExtensionIssue / IssueCode / Severity / IssueSource to starter-ext-spi (new src/issue.rs); add SupervisorHandle::issues() to starter-ext-supervisor deriving issues from the event ring + capability-violation counter + worker states it already owns; add ExtensionRecord::issues() to starter-ext-host returning the manifest-validation failure as a single Fatal issue for the no-live-supervisor path; add GET /extensions/{id}/issues to starter-ext-server (new issues.rs) merging record + handle issues, sorted by `at` desc, with ?severity= and ?since=<seq> filters; every issue carries a stable code string, no English in the API; unit tests for the derivation (crash → Crashed issue, cap-violation counter → CapabilityViolation issue, failed record → ManifestInvalid Fatal); cargo build + clippy -D warnings + fmt --check green for the starter-extensions workspace"
  - "stage 2 — PID + process stats: add ProcessStats (pid, started_at, uptime, rss_bytes, cpu_pct, restarts) and a flavour discriminator to starter-ext-spi (new src/process.rs); store the live child pid in a cell on SupervisorHandle updated next to the existing EventKind::Spawned push and cleared on exit; add SupervisorHandle::pid() -> Option<u32> and process_stats() -> Option<ProcessStats>; sample RSS/CPU from /proc/<pid>/stat + /statm on Linux on the EXISTING health tick only while Running (no new timer), other platforms return None; add GET /extensions/{id}/process returning ProcessStats or 404 ext.process.not_running for builtin/wasm/stopped; process is process-flavour only — builtin/wasm report null and the UI hides the tab (host pid is never reported for builtin); tests for pid set-on-spawn / clear-on-exit and the /proc parse; starter-extensions workspace build + clippy + fmt green"
  - "stage 3 — Metrics: add a new leaf crate starter-ext-metrics holding a MetricsRegistry (DashMap<ExtensionId, Counters>) with atomic increments and an ExtensionMetrics aggregate shape (in starter-ext-spi src/metrics.rs) covering process stats, lifecycle_state, restarts_total, capability_violations_total, tool_calls_total/tool_errors_total, rest_requests_total, worker_runs_total/worker_failures_total, events_dropped_total; wire cheap &MetricsRegistry counter bumps into starter-ext-mcp (tool calls/errors), starter-ext-server REST dispatch (rest requests), and starter-ext-workers (worker runs/failures) — adapters depend on the leaf crate, never on the supervisor; supervisor reads the same registry to fill process gauges; add GET /extensions/{id}/metrics serving the merged view; tests for counter increments and the merged projection; new crate added to the starter-extensions workspace members; build + clippy + fmt green"
  - "REVIEW — before destructive data cleanup lands: confirm the CleanupProvider trait shape, the namespace-scoping guarantees (an extension's data can only be removed within com_<id>__* tables / its own enablement row / its own UI+i18n cache keys), the dry-run-first contract, and that purge is idempotent (no-op 200, never 404). The next stage deletes warehouse data — pause here for operator sign-off"
  - "stage 4 — Cleanup providers + purge: add CleanupItem / CleanupKind / CleanupError and the async CleanupProvider trait (discover + purge) to starter-ext-server (new cleanup.rs); ship built-in providers needing no rubix knowledge — EnablementRowProvider (DELETE the row, not flip to disabled, killing the ghost row left by today's uninstall at lifecycle.rs:260) and UiCacheProvider / I18nCacheProvider (evict the ETag/byte caches in ui.rs for the extension's path prefix — this is the literal sidebar cleanup so an uninstalled panel does not linger); add DELETE /extensions/{id}?purge=true running uninstall then every registered provider's purge (purge=false keeps today's behaviour) and GET /extensions/{id}/cleanup running only discover to return the dry-run manifest with best-effort byte sizes; purge is idempotent — already-uninstalled ids return 200 cleanup.succeeded with whatever leftovers were removed; every purge step logs target=starter_ext_server::cleanup with the caller principal; surface restart_required on the list projection for freshly-installed (next-boot) extensions; tests covering discover/purge per provider, idempotent purge on a ghost row, and namespace-scope enforcement; starter-extensions workspace green"
  - "stage 5 — Rubix wiring + frontend: register the rubix-supplied cleanup providers on the ExtensionAdminBuilder in rubix-agent boot/extensions.rs — WarehouseCleanupProvider (list + drop com_<id>__* tables and their continuous aggregates, strictly namespace-scoped, mirroring extension_tables.rs) and SkillCleanupProvider (SkillRegistry::remove for the bundle's skills); built-in starter providers auto-register; project the new responses into the admin-console envelope in rubix-agent admin/extensions.rs, mapping IssueCode -> rubix.extension.issue.* MessageKeys and exposing issues/process/metrics on the detail view; add frontend tabs to extensions.$extId.$.tsx — Issues (severity-coloured), Process (pid/uptime/mem/cpu), Metrics (counters) — and an Uninstall dialog that calls the cleanup dry-run and shows the purge manifest before confirming; add hooks useExtensionIssues/useExtensionProcess/useExtensionMetrics/useExtensionCleanupPreview/useExtensionPurge; rust build + clippy + fmt green for the rubix workspace and frontend tsc -b + vite build + lint green"
