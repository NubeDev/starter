name: starter-flow-phase5-demo
goal: |
  Ship an end-to-end demo of the Phase 4 `ai-agent` node on the
  `examples/notes` host by landing the two cheapest companion node
  kinds — `trigger.explicit` and `log` — and wiring a one-button
  demo flow (`trigger.explicit → ai-agent → log`) against the
  Claude runner that already lives in `starter-ai`. The demo
  proves the Codeless shape on one engine end-to-end in the same
  host where Phase 1 i18n + Phase 3 prefs already ship. The
  remaining eight Phase 5 node kinds (`branch`, `merge`,
  `subflow`, `gate`, `trigger.{event, schedule, webhook}`,
  `http-out`, `sleep`) stay stubbed at 14 lines each; their D-F5
  decisions land in a follow-up job when a real consumer surfaces
  a need. Phase 5's full "Codeless and Rubix shape on one engine"
  smoke is **not** in scope here — the Rubix shape needs `branch`
  + `merge` + `http-out` which this job does not ship. This job
  ships the Codeless half of that smoke as the end-to-end demo.
  No engine refactors — `AiAgent::with_provider_id` workaround
  stays in place. No real Claude API calls in CI — the
  end-to-end smoke uses `RecordingAiRunner`; the notes host
  runs the real Claude runner only when a user fires the button
  locally. After this job lands the Codeless half of Phase 5 is
  honestly green and a future job picks up the remaining eight
  node kinds + the Rubix half of the Phase 5 smoke.

stages:
  - 'stage 1 — lock the demo boundary before code lands. Confirm the five D-F5 decisions in DOCS/flow/scope/SCOPE.md under "Decisions" (precedent: Phase 4 stage 1). (D-F5.1) `trigger.explicit` body lives in crates/starter-flow-nodes/src/trigger_explicit.rs behind a new default-off cargo feature `trigger-explicit` on starter-flow-nodes (mirrors the Phase 4 `ai-agent` feature posture — feature-off path stays adk-rust-free trivially). Body exposes a host-side `fire(payload: SlotMap)` handle the host calls to inject a single invocation; no axum/cron/event-bus substrate. Inside `invoke` the body waits on a per-instance tokio::sync::mpsc::Receiver against the cancel select; the host holds the matching Sender and drives the fire. The receiver is owned by the body via `Arc<Mutex<Option<Receiver<...>>>>` so the same body instance can be reused across runs (stateless invariant: the receiver is the fire-channel substrate, not invocation state). Trigger payload becomes the output slot named `OUTPUT_SLOT = "payload"`. Mandatory config slot `CHANNEL_ID_SLOT = "channel_id"` (string KindId-shaped) lets a host distinguish multiple explicit triggers by binding each to a separate Sender at host wiring time. (D-F5.2) `log` body lives in crates/starter-flow-nodes/src/log.rs behind a new default-off cargo feature `log` on starter-flow-nodes. Body emits its `INPUT_SLOT = "value"` as a structured `tracing::event!` at a configurable level (config slot `LEVEL_SLOT = "level"`, optional, default `Level::INFO`, validated to enum `{"trace","debug","info","warn","error"}`). Event target is hardcoded `"starter.flow.log"` and the event payload includes `node_id`, `run_id`, `principal_id_hash`, and `value` (Debug-formatted). No file/stdout sink — the existing tracing seam already routes to whatever subscriber the host attached. Output slot `EMITTED_SLOT = "emitted"` carries a passthrough copy of the input so the slot can chain into a downstream node if desired. (D-F5.3) Demo flow in examples/notes lives at examples/notes/flows/codeless-demo.yaml (canonical YAML form per the workspace flow loader); registration of the two new node kinds + ai-agent + tool-call + the Claude runner happens at notes-app boot in examples/notes/src/server.rs (or wherever the notes app constructs its top-level Engine — verified at stage 4 entry). The demo button is exposed via the existing notes REST surface as POST /api/flows/codeless-demo/fire; UI integration is one button in the notes frontend that POSTs to that endpoint and shows the resulting log line via the existing notes UI event stream. CLI parity is out of scope for this demo (the REST button is enough). (D-F5.4) End-to-end smoke lives at crates/smoke-tests/tests/codeless_shape_on_one_engine.rs per D-F4.10 precedent. The smoke builds the same three-node flow stage 4 ships, but driven by RecordingAiRunner from starter-ai''s `testing` feature so CI never hits the Anthropic API. One `#[tokio::test]` (`codeless_shape_trigger_ai_agent_log_chains_through_engine`) that fires the trigger with a `{"prompt": "summarise the demo note"}` payload, asserts the RecordingAiRunner saw exactly one call with that input, asserts the ai-agent emitted its scripted output text, and asserts the log node emitted exactly one `starter.flow.log` tracing event with that text as its `value` field. Single commit per D-F4.10 precedent (no bundling). (D-F5.5) Dep-tree gates extension — two new integration tests in crates/starter-flow/tests/workspace_dep_tree_gates.rs: `starter_flow_nodes_with_trigger_explicit_feature_does_not_pull_adk_rust` and `starter_flow_nodes_with_log_feature_does_not_pull_adk_rust`. Test shape mirrors the six existing `*_contains_no_adk_rust` gates verbatim — same Command::new("cargo") + same grep + same assert; only the `--features <name>` arg differs. The six existing gates stay green. Record decisions in SCOPE.md "Decisions" with rule + revisit trigger per Phase 4 stage 1 precedent. No code in this stage.'
  - 'stage 2 — `trigger.explicit` body in crates/starter-flow-nodes/src/trigger_explicit.rs behind the new default-off cargo feature `trigger-explicit` on starter-flow-nodes. The file currently is a 14-line stub; this stage replaces it with a ~150-line body matching the structural shape of tool_call.rs (registry-injected, NodeBehavior impl, R12 tracing, R13 cancellation). Structure: `pub struct TriggerExplicit { channels: Arc<dyn TriggerChannelRegistry> }` where `TriggerChannelRegistry` is a local trait in the same file (no SPI edit needed for this demo — the registry is opaque to the engine, only the body resolves channels) with method `fn lookup(&self, channel_id: &KindId) -> Option<TriggerReceiver>`. `TriggerReceiver` is a thin newtype around `Arc<tokio::sync::Mutex<tokio::sync::mpsc::Receiver<SlotMap>>>` so multiple invocations of the same body across runs share the same channel without consuming it. Static impl `StaticTriggerChannelRegistry` lives in the same file. impl NodeBehavior::invoke: (1) read + validate the `channel_id` config slot, error NodeError::Domain { code: "channel_id_required" } on missing; (2) registry lookup, error NodeError::Domain { code: "channel_not_registered" } on miss; (3) `tokio::select!` between `receiver.lock().await.recv()` and `ctx.cancel.cancelled().await`; (4) on receive, write the payload to OUTPUT_SLOT and return the SlotMap; (5) on cancel, return NodeError::Cancelled. R12 span: `trigger_explicit.invoke` with fields `(node_id, run_id, principal_id_hash, channel_id, cancel_observed)`. Unit tests inline `#[cfg(test)] mod tests`: (a) missing channel_id surfaces NodeError::Domain { code: "channel_id_required" }; (b) channel_id present but no channel registered surfaces NodeError::Domain { code: "channel_not_registered" }; (c) a registered channel that receives a payload drives invoke to a clean output write; (d) cancel before payload arrives surfaces NodeError::Cancelled within 200ms; (e) the R12 span shape is recorded once per invoke with the documented fields. New dep-tree gate `starter_flow_nodes_with_trigger_explicit_feature_does_not_pull_adk_rust` lands in the same commit. cargo test -p starter-flow-nodes --features trigger-explicit green; cargo test -p starter-flow-nodes (no new feature) still green; cargo clippy -p starter-flow-nodes --features trigger-explicit --all-targets -- -D warnings green; cargo fmt --check green. The seven existing workspace gates (six dep-tree + one SPI baseline) stay green.'
  - 'stage 3 — `log` body in crates/starter-flow-nodes/src/log.rs behind the new default-off cargo feature `log` on starter-flow-nodes. The file currently is a 14-line stub; this stage replaces it with a ~80-line body. Structure: `pub struct Log;` — no registry, no shared state. impl NodeBehavior::invoke: (1) read INPUT_SLOT (mandatory, NodeError::Domain { code: "value_required" } if absent); (2) read optional LEVEL_SLOT, parse to tracing::Level (default Level::INFO, error NodeError::Domain { code: "invalid_level" } on unparseable); (3) cancel-check before emit (sub-millisecond budget — sync work); (4) emit `tracing::event!(target: "starter.flow.log", level, node_id, run_id, principal_id_hash, ?value)`; (5) write EMITTED_SLOT passthrough and return. R12 span: `log.invoke` with fields `(node_id, run_id, principal_id_hash, level, cancel_observed)`. Unit tests inline: (a) missing value surfaces NodeError::Domain { code: "value_required" }; (b) invalid level surfaces NodeError::Domain { code: "invalid_level" }; (c) a happy-path invoke emits exactly one tracing event at the specified level with the documented fields (use tracing-test crate or a custom subscriber); (d) the R12 span shape is recorded once per invoke; (e) emitted_slot passthrough equals input value. New dep-tree gate `starter_flow_nodes_with_log_feature_does_not_pull_adk_rust` lands in the same commit. cargo test -p starter-flow-nodes --features log green; cargo test -p starter-flow-nodes (no new feature) still green; cargo clippy -p starter-flow-nodes --features log --all-targets -- -D warnings green; cargo fmt --check green. The eight existing workspace gates (seven from previous stages + the new trigger-explicit one) stay green.'
  - 'stage 4 — wire the demo into examples/notes. (a) Add `starter-flow`, `starter-flow-nodes` (with features `ai-agent,tool-call,trigger-explicit,log`), `starter-flow-surfaces`, and `starter-ai` (with the existing `claude` feature already used elsewhere in the workspace; confirm at stage entry) to examples/notes/Cargo.toml. (b) In examples/notes/src/server.rs (or the matching boot site), construct an Engine via the existing builder convention: register the four node kinds (ai-agent, tool-call, trigger.explicit, log) on its NodeKindRegistry; build a StaticAiRunnerRegistry registering the Claude runner against its provider_id; build a StaticTriggerChannelRegistry holding one Sender for the demo channel `examples.notes.codeless-demo`. Attach all three to the Engine via the existing builder hooks. (c) Define the demo flow at examples/notes/flows/codeless-demo.yaml — three nodes (trigger.explicit channel_id=examples.notes.codeless-demo; ai-agent provider_id=anthropic.claude with the user note as the input prompt; log level=info), output→input edges between them. Load the flow at boot via the existing FlowRegistry pathway. (d) Add a REST endpoint POST /api/flows/codeless-demo/fire that calls the host-side Sender to inject a payload built from the request body (the note id + the prompt). The endpoint returns the run id; subsequent log events stream through the existing notes UI event channel. (e) Add a single button in the notes frontend that POSTs to that endpoint and shows the resulting log line. Unit tests (or integration tests) cover: the REST endpoint accepts a valid payload and returns 202 + a run id; an invalid payload returns 400; the registered Claude runner is reachable from the AiRunnerRegistry under its provider_id. The notes example builds clean under `cargo build -p starter-notes-example` (or whatever the package name is — verified at stage entry). No CI-side network calls — the notes example is build-tested and unit-tested in CI; only a developer firing the button locally hits Anthropic.'
  - 'stage 5 — end-to-end smoke in crates/smoke-tests/tests/codeless_shape_on_one_engine.rs per D-F4.10 precedent. The smoke builds the same three-node flow stage 4 wires into notes (trigger.explicit → ai-agent → log) but driven by RecordingAiRunner from starter-ai''s `testing` feature so CI never hits the Anthropic API. One `#[tokio::test]` (`codeless_shape_trigger_ai_agent_log_chains_through_engine`): (a) construct an Engine with all four node kinds registered, StaticAiRunnerRegistry containing one RecordingAiRunner scripted to emit `[(text="summary: hello", tool_calls=[])]` for one turn, StaticTriggerChannelRegistry holding one Sender, NullSkillSelector default; (b) load the three-node flow; (c) start the run; (d) fire the Sender with payload `{"prompt": "summarise the demo note"}`; (e) wait for run completion; (f) assert the RecordingAiRunner saw exactly one call whose input contained `summarise the demo note`; (g) attach a tracing subscriber capturing `starter.flow.log` events, assert exactly one captured event with `value` field containing `summary: hello`. Test fixtures (`Cargo.toml` dev-deps if needed for tracing-subscriber capture) added in the same commit. cargo test -p starter-smoke-tests --test codeless_shape_on_one_engine green. The eight existing workspace dep-tree gates + the three Phase 2 + four Phase 3 + two Phase 4 smokes (16 tests across 7 files) all stay green. clippy + fmt green. Single commit; bundling smoke with stage 4 demo wiring is a stage-fail (precedent: Phase 3 stage 9, Phase 4 stages 7+8).'
  - 'stage 6 — workspace verify + dep-tree gates re-confirm (Phase 4 stage 9 shape). No code changes; just running the gates and confirming green. The eight workspace dep-tree gates all hold (six from prior phases + the two new ones from stages 2 + 3). The three Phase 2 + four Phase 3 (13 tests) + two Phase 4 (3 tests) smokes still pass under cargo test -p starter-smoke-tests. The new Phase 5 demo smoke from stage 5 passes. cargo test -p starter-flow-nodes --features ai-agent,tool-call,trigger-explicit,log green; cargo test -p starter-flow green; cargo test -p starter-flow-spi green; cargo test -p starter-flow-surfaces green; cargo test -p starter-store-sqlite --features flow,testing green; cargo build -p <notes-example-pkg> green (the notes demo builds clean); cargo clippy -p starter-flow -p starter-flow-spi -p starter-flow-surfaces -p starter-flow-nodes -p starter-smoke-tests --all-targets --features ai-agent,tool-call,trigger-explicit,log -- -D warnings green; cargo fmt --check on the flow-scoped globs (extended to include crates/starter-flow-nodes/src/{trigger_explicit,log}.rs + examples/notes/src/* + crates/smoke-tests/tests/codeless_shape_on_one_engine.rs). After this stage the Codeless half of Phase 5 is honestly green; a future job picks up the remaining eight node kinds and the Rubix half of the Phase 5 smoke. Open PR against master.'
