name: rubix-client-ts
goal: |
  Ship @nube/rubix-client-ts: a hand-curated TypeScript HTTP client over
  rubix-agent's REST surface, codegen'd from a freshly-emitted
  rubix/openapi.json, that mirrors the shape of @nube/starter-client-ts
  and the Rust rubix-client crate. Lands upstream uplifts in
  @nube/starter-client-ts first (CSRF helper, fetch helpers,
  StarterError.is type guard, generalised codegen script) so common
  primitives live in one place. New CI drift job catches OpenAPI
  staleness. End state: a fresh TS consumer constructs
  RubixClient(starter), calls every wired verb with typed
  request/response/error.

stages:
  - "phase A.1 — upstream-first dependency check — read packages/starter-client-ts/src/ end-to-end, list every common primitive rubix will need (CSRF cookie reader, fetch wrappers, error type guard, codegen script), confirm SCOPE Phase A captures all of them; if Phase C will need a primitive not in Phase A, pause and add it to A before proceeding; commit nothing this stage (analysis only); the handover names every primitive that will land in A.2/A.3 with its target file path"
  - "phase A.2 — starter-client-ts fetch helpers + CSRF helper — add packages/starter-client-ts/src/client/csrf.ts exposing readCsrfHeader(cookieName='starter_csrf'): Record<string,string> (extracts the existing readCookie+X-CSRF-Token pattern from endpoints/auth.ts); add packages/starter-client-ts/src/client/fetch_json.ts, fetch_void.ts, fetch_bytes.ts each ~30 lines exposing one helper that handles URL build + credentials:include + res.ok branch + StarterError.fromResponse throw + typed return; refactor endpoints/auth.ts, endpoints/theme.ts, endpoints/openapi.ts, endpoints/health.ts to use the new helpers (each endpoint method becomes ~5 lines); pnpm --filter @nube/starter-client-ts typecheck + test green; commit feat(starter-client-ts) extract csrf + fetch helpers"
  - "phase A.3 — starter-client-ts StarterError.is type guard + codegen generalisation — add StarterError.is(err: unknown, status?: number): err is StarterError as a static method on the class; add a unit test in src/error/starter-error.test.ts covering both arity forms; generalise the codegen script — move from inline package.json line to packages/starter-client-ts/bin/codegen.mjs taking --input and --output flags, defaulting to ../../openapi.json and ./src/generated/index.ts to keep existing pnpm codegen working; update package.json scripts.codegen to call the new script; pnpm --filter @nube/starter-client-ts codegen and confirm no diff in generated output; commit feat(starter-client-ts) StarterError.is + codegen generalisation"
  - "REVIEW gate — Phase A landed — handover lists the two A.2/A.3 commits, the refactored endpoint files, typecheck+vitest counts, and confirms no public API regression in @nube/starter-client-ts; wait for operator confirmation before Phase B"
  - "phase B.1 — confirm goals-2-4-3 status + utoipa attribute audit — run git fetch origin master and git log --oneline -20 to confirm whether the goals-2-4-3 PR has merged; if NOT merged, raise BLOCKED with a one-paragraph status report (job 01KSC5XXS54ZPQXVHZ00QSA8KV in the codeless workspace) and halt; if merged, grep rubix/crates/rubix-agent/src/routes/ for utoipa::path attributes vs every Axum route, list any handler missing the attribute, plan a single commit to add them; this stage commits nothing if no handlers need annotation, otherwise commits one feat(rubix-agent) utoipa::path on every handler with the list of touched files in the body"
  - "phase B.2 — rubix-agent OpenAPI document assembly — add verb file rubix/crates/rubix-agent/src/openapi.rs exposing pub fn rubix_openapi() returning utoipa OpenApi assembling info+servers+tags+routes per SCOPE Phase B (mirrors crates/starter-server/src/openapi.rs); tag-per-goal: auth, system, user-admin, clickhouse-ruler, flow-programmer, mcp, undo, dashboard-stub, weekly-report-stub; wire into main.rs; add verb file rubix/crates/rubix-agent/src/routes/openapi_doc.rs serving GET /openapi.json (unauthenticated, mirrors starter-server's); register the route on the Router; integration test rubix/crates/rubix-agent/tests/openapi_test.rs asserts the served doc parses, has the expected tag count, and includes the canary paths; commit feat(rubix-agent) emit /openapi.json"
  - "phase B.3 — snapshot script + committed rubix/openapi.json — add rubix/scripts/snapshot-openapi.sh that boots the agent in a background process with RUBIX_BIND=127.0.0.1:0, curls /openapi.json, writes to rubix/openapi.json, kills the child cleanly (trap handling); run it once and commit the snapshot; document the regen flow in rubix/HOW-TO-CODE.md (one paragraph: when to regen, the command, the commit message convention); verify the snapshot is well-formed JSON and deterministic (no nondeterministic timestamps in the output — strip them in routes/openapi_doc.rs if utoipa emits any); commit chore(rubix) snapshot openapi.json + regen script"
  - "REVIEW gate — Phase B landed — handover names the two/three Phase B commits (utoipa attrs if any + openapi module + snapshot), shows the openapi_test passing, shows the snapshot diff is sane (route count matches grep, tag count matches the goal count), confirms the regen script is operator-runnable; wait for confirmation before Phase C"
  - "phase C.1 — rubix-client-ts package scaffold — create packages/rubix-client-ts/ with package.json (name @nube/rubix-client-ts, workspace dep on @nube/starter-client-ts, scripts: build, typecheck, test, codegen pointing at the new bin/codegen.mjs --input ../../rubix/openapi.json --output ./src/generated/index.ts), tsconfig.json extending starter-client-ts's, vitest.config.ts; add packages/rubix-client-ts/src/client/client.ts with class RubixClient constructor(starter: StarterClient) exposing .starter readonly field; add src/error/rubix-error.ts with class RubixError extends StarterError that parses .code from body.summary.code (per SCOPE OQ-4); add src/index.ts barrel; add to pnpm-workspace.yaml; run pnpm install from workspace root, then pnpm --filter @nube/rubix-client-ts codegen to produce src/generated/index.ts, commit it (codegen output is committed per the existing convention); pnpm --filter @nube/rubix-client-ts typecheck green; commit feat(rubix-client-ts) package scaffold + RubixClient + RubixError + generated types"
  - "phase C.2 — system + alert + audit endpoints (read-mostly first) — confirm via grep whether audit reads belong on the starter or rubix surface per SCOPE OQ-3; add src/endpoints/system.ts (disk, db, flowErrors), src/endpoints/alert.ts (send), src/endpoints/audit.ts (auditList with filters, only if it belongs in rubix per the OQ resolution); each method uses the starter fetchJson/fetchVoid helpers from the wrapped .starter; add sibling .test.ts files using the same fetch-mock pattern as starter-client-ts/src/endpoints/auth.test.ts (confirm and mirror); update src/endpoints/index.ts barrel; pnpm test green; commit feat(rubix-client-ts) system + alert + audit endpoints"
  - "phase C.3 — user + team + tenant endpoints (Goal 2) — add src/endpoints/user.ts (userCreate, userDisable, userList), team.ts (teamCreate, teamAssign), tenant.ts (tenantList); each mutating method calls readCsrfHeader() from starter-client-ts and threads it via headers; sibling .test.ts per file asserting the wire shape and the CSRF header presence; pnpm test green; commit feat(rubix-client-ts) user + team + tenant endpoints"
  - "phase C.4 — clickhouse + flow_ops + undo endpoints (Goals 4 + 3) — add src/endpoints/clickhouse.ts (ruleWrite, martCreate, retentionSet), flow_ops.ts (flowDeploy, flowLint, flowList, flowDuplicate), undo.ts (undoLast); CSRF header on every mutating method; sibling .test.ts per file; pnpm test green; commit feat(rubix-client-ts) clickhouse + flow-ops + undo endpoints"
  - "phase C.5 — MCP endpoint + round-trip test — add src/endpoints/mcp.ts with mcpToolsList() and mcpToolsCall(name, args, opts?) where opts carries acceptLanguage threaded into _meta.acceptLanguage per the rubix MCP contract; the method builds the JSON-RPC envelope, sends to POST /api/v1/mcp (confirm path per SCOPE OQ-2), parses result.structuredContent; sibling .test.ts covers en-US and es-AR; add tests/round-trip.test.ts that exercises one method per endpoint family against a fetch-mock or recorded fixture (operator may run this manually against a live agent; document the manual flow in the design doc); commit feat(rubix-client-ts) MCP endpoint + round-trip test"
  - "REVIEW gate — Phase C landed — handover names every endpoint commit, the typecheck+test counts, the per-method file count (mirror of the Rust verb file count), and any deviation from SCOPE; one operator-runnable manual flow (boot the agent, run a tiny TS file that imports RubixClient, calls disk() and undoLast(), prints the result); confirm before Phase D"
  - "phase D — drift CI + design doc + session note + PR — add .github/workflows/rubix-openapi-drift.yml mirroring the existing openapi-drift job that runs the snapshot script and diffs against the committed rubix/openapi.json; document the snapshot regen flow in rubix/HOW-TO-CODE.md (already started in B.3, finalise here); add rubix/docs/design/client-ts/README.md present-tense covering what the client exposes, the relationship to starter-client-ts, the codegen flow, the error type, and the worked example (mirrors starter-client-ts/README.md); add rubix/docs/sessions/<today>-rubix-client-ts-landed.md with the new package summary, the upstream uplifts, the typecheck+vitest counts, the drift CI run evidence; confirm with operator that the PR shape is one PR off codeless/rubix-client-ts reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-client-ts with title feat(client) rubix-client-ts + starter-client-ts uplifts and body summarising each phase with the commits per phase listed; commit chore(ci+docs) close out rubix-client-ts + open PR"
