name: starter-tools-services
goal: 'Ship the starter-tool-* / starter-service-* family per DOCS/tools/scope/SCOPE.md — a family of small sibling Rust crates each wrapping one third-party integration (Gmail, Slack, Telegram, …) as either a Tool (one-shot request/response, MCP-callable) or a Service (long-running listener/poller with a lifecycle). starter-spi gains exactly the new Service / ServiceRegistry / ServiceContext / ServiceHandle / EventSink types plus a SecretString re-export from secrecy; nothing else. Each provider crate is selected by Cargo dependency and constructed in the consumer main.rs — no mega-crate, no cargo-feature matrix, no plugin loader. Mine the codeless workspace (codeless-slack, codeless-telegram, codeless-bot-core, codeless-tools email/gmail) for working integration code; lift implementations not architecture. v0.1 ships Slack, Telegram, and Gmail (send-only); each provider crate ships independently versioned with a pinned starter-spi major.'

stages:
  - 'resolve design points implicit in the scope — pin the starter-spi dependency baseline at DOCS/tools/scope/starter-spi-deps.baseline.txt (the dep-leakage smoke test compares against it, updated only when starter-spi itself changes), decide where the blanket EventSink impl over tokio::sync::broadcast::Sender lives (default: in starter-spi behind a default-on feature so consumers without broadcast still compile a minimal SPI), decide ownership of the 5-second shutdown deadline used by smoke test 5 (default: ServiceRegistry exposes a SHUTDOWN_DEADLINE_DEFAULT constant and a shutdown_with_deadline method; the constant is the contract, smoke tests assert against it), decide EventSink::emit error semantics (SpiResult<()> with a typed enum so a slow sink does not silently drop events — sinks fan-out helper logs and continues on individual sink errors but bubbles a typed Saturated error when the broadcast channel is full). Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions before any starter-spi additions land'
  - 'Phase 1 — starter-spi additions per the source SCOPE What lands in starter-spi section. Add the service module containing: Service trait (async start(&self, ctx: ServiceContext) -> SpiResult<ServiceHandle>, name() -> &str), EventSink trait (async emit(&self, kind: &str, payload: serde_json::Value) -> SpiResult<()>), ServiceContext #[non_exhaustive] with metrics: Arc<prometheus::Registry>, shutdown: tokio::sync::watch::Receiver<bool>, sink: Arc<dyn EventSink> — non_exhaustive so new fields are additive not breaking. ServiceHandle holding tokio::task::JoinHandle<SpiResult<()>>. ServiceRegistry mirroring ToolRegistrys shape, owning the single watch::Sender<bool> and fanning out receivers via ServiceContext.shutdown to every spawned service (R2 — no service holds the sender). Plus SecretString re-export from secrecy at crate root (R5 — provider crates do not pick up secrecy directly). Plus blanket EventSink impl on tokio::sync::broadcast::Sender<Event> for a consumer-defined Event and a Vec<Arc<dyn EventSink>> fan-out helper that collects per-sink errors and bubbles a typed Saturated variant when broadcast is full. Plus the DOCS/tools/scope/starter-spi-deps.baseline.txt baseline file committed alongside R8 enforcement. R7 observability stays just docs — provider crates do their own metrics registration against the prometheus::Registry from ServiceContext, no helper API yet'
  - 'REVIEW starter-spi surface frozen — no additions or signature changes past this point until v0.2 cuts a new major. Three provider phases land on top; they must not feed back into starter-spi shape changes'
  - 'Phase 2 — starter-tool-slack outbound: new sibling crate depending only on starter-spi + starter-observability + reqwest + tokio + serde + tracing. SlackConfig with bot_token: SecretString and signing_secret: SecretString fields (R5 — secrets resolved by consumer not the crate). SlackPostTool implementing Tool::invoke for chat.postMessage (text, channel, optional blocks payload). Latency histogram + error counter registered against the prometheus::Registry the consumer passes in via McpHttpOptions (R7). README mirroring examples/notes/README.md how its extended table. One integration test against a mock HTTP server (wiremock) exercising success + 429 + 5xx + auth failure paths. Mine codeless/crates/codeless-slack for working chat.postMessage code; lift the implementation, not codelesss bot-core architecture'
  - 'Phase 2 — starter-service-slack inbound (socket-mode): new sibling crate. SlackSocketModeService implementing Service::start, opens the socket-mode websocket via apps.connections.open + the WSS URL, observes ctx.shutdown for cooperative exit, deserializes each event to a typed envelope and emits via ctx.sink with kind="slack.<event_type>" (R4 — service does not pattern-match on payloads beyond deserialization). Restart counter, event-emitted counter, is-running gauge registered on ctx.metrics (R7). Restart policy lives in the service implementation per R9, not in the registry — wrap the inner loop in a retry layer with exponential backoff and a max-attempts circuit so a permanently-broken Slack app does not pin the service in a hot loop. Integration test stubs the websocket via tokio-tungstenite test server. Mine codeless/crates/codeless-slack inbound paths'
  - 'Phase 3 — starter-tool-telegram + starter-service-telegram: starter-tool-telegram exposes TelegramSendMessageTool (Bot API sendMessage), TelegramConfig with bot_token: SecretString, latency + error metrics, mock-HTTP test. starter-service-telegram implements TelegramBotService::start using long-poll getUpdates with the offset cookie persisted across calls (in-memory for v0.1, an at-rest seam reserved for later), emits each update via ctx.sink as kind="telegram.<update_type>", respects ctx.shutdown, restart policy in the impl per R9. Mine codeless/crates/codeless-telegram for both crates'
  - 'Phase 4 — starter-tool-gmail send-only: starter-tool-gmail with GmailSendTool calling users.messages.send. GmailConfig with oauth_access_token: SecretString (acquisition is the consumers concern — starter-auth-oauth Phase 6 reserved or a custom flow). Latency + error metrics, mock-HTTP test covering happy path + 401 + 5xx. Inbound Gmail (users.watch + Pub/Sub or history.list long-poll) is explicitly deferred per the SCOPE one-line summary on Gmail. Mine codeless/crates/codeless-tools email/gmail.rs for the message-construction code and the users.messages.send call shape'
  - 'smoke tests — five design checks per the source SCOPE Smoke test for the design section, exercised against every shipped provider crate: no-dep-leakage-via-starter-spi (cargo tree -p starter-spi --edges normal must match DOCS/tools/scope/starter-spi-deps.baseline.txt — none of the provider crates deps appear in the snapshot), no-special-case-wiring (the provider Tool or Service registers via the same .register(...) call the notes demo uses), config-guarded construction (an if-around-.register() in main.rs flips the integration off via a single env var with no recompile of the consumer), secrets-backend-swappable (switching from starter-secrets-file to starter-secrets-keyring requires zero changes to the provider crate Config struct or its tests), shutdown-actually-shuts-down (calling ServiceRegistry::shutdown causes every Services JoinHandle to resolve within SHUTDOWN_DEADLINE_DEFAULT=5s; a service that fails this check is rejected). Plus the dep-baseline diff is a CI gate, not an after-the-fact check'
