name: puck-builder-finish
goal: |
  Finish the Puck visual SDUI editor begun in commit bd8eeab. B1/B2/B4/B5
  and the §B6 CI drift guard are landed; the editor at
  /dashboards/$pageId/edit loads, edits, saves, and surfaces 409 conflicts
  end-to-end. This job lands the remaining scope: §B3 data-source
  selectors (replace text-field fallback for $ref-typed leaves with
  catalogue-backed selects), the §B6 runtime schema-hash banner,
  scope 11 (live-canvas SSE banner + revalidate-on-resume), plus the
  follow-ups the §B4/§B5 work flagged — real tenant wiring (drop the
  hardcoded "system"), ref-based discard bridge (drop the
  window.__rubixPuckDiscardRequested polling shim), expanded placeholder
  coverage, and the stale render-chart test. After this job the editor
  has parity with the read-side renderer and the scope docs at
  rubix/docs/scope/dashboards/10-puck-builder.md and
  rubix/docs/scope/dashboards/11-live-canvas-sse.md are fully implemented.

stages:
  - "stage 1 — §B3 data-source selectors: replace the text-field fallback in packages/starter-ui-sdui-puck/src/build-puck-config.ts for every $ref-typed leaf the IR schema declares (AnalyticsTemplateRef, ToolRef, TenantId, unit symbols, page-state keys) with a select/autocomplete Puck field backed by a live catalogue; wire the catalogue fetch through the rubix client so analytics templates come from rubix.analytics.template.list (or equivalent — discover the verb from the running agent's /api/v1/tools listing during stage warmup; the proposal lives at rubix/docs/scope/dashboards/10-puck-builder.md §B3), tool refs from /api/v1/tools, tenants from rubix.tenant.list; the package itself stays rubix-agnostic — add a Catalogue seam (like the save seam) that the rubix-frontend route fills in; harness page (packages/starter-ui-sdui-puck/harness) gets a mock catalogue so the package's own tests don't need rubix-agent running; expand src/__tests__/build-puck-config.test.ts to cover one $ref-typed field per category; update README §B3 row from ⏳ to ✅; pnpm --filter @nube/starter-ui-sdui-puck typecheck + test green; pnpm --filter @nube/rubix-frontend typecheck green; manual verify in browser at /dashboards/data-flow-site-a/edit — click on a kpi.source.name field and confirm the dropdown lists real analytics templates"
  - "stage 2 — tenant + discard-bridge + render-chart cleanup: replace every hardcoded 'system' tenant in rubix/frontend/src/routes/dashboards/$pageId_.edit.tsx and rubix/packages/rubix-client-react/src/hooks/dashboard.ts with the tenant from the authed session — discover the session hook from packages/starter-client-react (likely useSession or useMe; if no tenant field exists, surface that as a halt rather than guess); replace the window.__rubixPuckDiscardRequested polling shim in $pageId_.edit.tsx with a useImperativeHandle ref or onDiscardRequested callback prop on PuckBuilder so the route reload happens synchronously without the 250ms tick; drop the window flag from packages/starter-ui-sdui-puck/src/builder.tsx; fix the stale '3 series' assertion in packages/starter-ui-sdui-react/src/renderer/__tests__/render-chart.test.tsx (handover flagged this as one-line); update README next-tasks section to remove the cleaned items; pnpm --filter @nube/starter-ui-sdui-puck test + typecheck green; pnpm --filter @nube/starter-ui-sdui-react test green; pnpm --filter @nube/rubix-frontend typecheck green"
  - "stage 3 — placeholder coverage: add per-variant fillers to packages/starter-ui-sdui-react/src/headless/placeholder-render.tsx for every IR variant currently falling through to the dangling-variant tile in the Puck canvas — enumerate the gap by walking starter-ui-ir/schema/starter-ui-ir.schema.json definitions.Component.oneOf against the existing placeholder switch (RESOLVER_ONLY_VARIANTS stay excluded); each new placeholder mirrors the live renderer's visual idiom (axes for chart_kind variants, header+rows for table variants, etc) so the canvas is visually faithful without a transport; add a snapshot test per new placeholder; update README §B2 follow-up note; pnpm --filter @nube/starter-ui-sdui-react test green"
  - "stage 4 — §B6 runtime schema-hash banner: hash the committed starter-ui-ir JSON schema at @nube/starter-ui-sdui-puck build time (vite plugin or scripts/emit-schema-hash.mjs that writes a JSON sidecar consumed at runtime), expose the hash on PuckBuilder as a prop, and have rubix-frontend's $pageId_.edit.tsx route fetch the live schema hash from rubix-agent (rubix.system.schema_hash or equivalent — discover the verb from /api/v1/tools during stage warmup) and surface a non-blocking banner inside PuckBuilder when they diverge ('schema drifted — refresh to reload the palette'); the existing CI drift guard at packages/starter-ui-sdui-puck/scripts/check-schema-drift.mjs stays untouched (catches drift at PR time; this catches drift at runtime when agent and frontend deploy separately); update README §B6 row from 'CI-time guard only' to ✅; pnpm tests green at every affected package"
  - "stage 5 — scope 11 live-canvas SSE: implement rubix/docs/scope/dashboards/11-live-canvas-sse.md in full — re-read the doc at stage warmup, it is the contract; expected surface includes a PuckBuilder banner + auto-refresh trigger when rubix-agent emits a dashboard.updated SSE event for the page the operator is editing (someone else, or the AI assistant, saved a new revision); reuse the existing 409 conflict-modal mechanics from §B4 so the operator sees the same Discard / Keep editing choices when the SSE event arrives before they hit Save; integrate with the existing SSE plumbing in @nube/starter-ui-sdui-react/headless (sdui-page.tsx already subscribes for the read path — extract a shared useDashboardEvents hook if needed); update the package README to mark Scope 11 from ⏳ to ✅; pnpm --filter @nube/starter-ui-sdui-puck test + typecheck green; pnpm --filter @nube/rubix-frontend typecheck green; manual verify in two browser tabs — edit in tab A, save from agent CLI, confirm tab A shows the banner without a manual refresh"
