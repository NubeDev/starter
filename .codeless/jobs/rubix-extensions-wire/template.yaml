name: rubix-extensions-wire
goal: |
  Wire the already-built starter-extensions framework into rubix
  end-to-end. After this job: rubix-agent boot loads extensions via
  starter-ext-host, supervises process-flavour extensions via
  starter-ext-supervisor, exposes the admin REST surface from
  starter-ext-server under /api/v1/extensions/*, persists enable/disable
  via a new upstream PG-backed EnablementStore (starter-ext-store-pg),
  the com.rubix.example reference extension builds and loads cleanly,
  an integration test drives full lifecycle through REST, and a
  test-ui-5 page renders an extension-contributed React panel via the
  existing starter-ext-ui host runtime. No new extension authoring;
  pure wiring of existing primitives. R2 strictly upstream-first.

stages:
  - "phase A.1 — starter-ext-store-pg crate scaffold — add starter-extensions/crates/starter-ext-store-pg/ with Cargo.toml depending on starter-ext-spi + starter-ext-server (for EnablementStore trait + EnablementState enum) + sqlx (postgres + chrono features) + async-trait + serde + thiserror; src/lib.rs barrel + module declaration; src/store.rs (~120 lines) implementing PgEnablementStore { pool: PgPool } with #[async_trait] impl EnablementStore — get + set + list_all + set_as helpers; src/migrations/0001_extensions_enablement.sql with the extensions_enablement table per SCOPE Phase A; add the crate to starter-extensions/Cargo.toml workspace.members; cargo build -p starter-ext-store-pg green; commit feat(starter-ext-store-pg) PG-backed EnablementStore"
  - "phase A.2 — starter-ext-store-pg testcontainers test + SCOPE update — add tests/store_test.rs against testcontainers PG asserting roundtrip + UPSERT (set twice same id different state) + list_all ordering + updated_by audit; cargo test -p starter-ext-store-pg --features testcontainers green; append a one-line decision to starter-extensions/DOCS/extensions/scope/SCOPE.md naming starter-ext-store-pg under the existing Decisions-made — enable/disable-persistence-model section; commit test(starter-ext-store-pg) + docs(starter-extensions-scope)"
  - "REVIEW gate — Phase A landed — handover lists two A commits, confirms cargo build + test green across all starter-extensions crates not just the new one (workspace integrity), confirms SCOPE update reflects reality; present SCOPE OQ-6 evidence (PG migration namespacing) before Phase B begins"
  - "phase B.1 — rubix/extensions/ workspace bootstrap — add rubix/extensions/Cargo.toml with [workspace] block listing com.rubix.example/process as the sole member for now; verify com.rubix.example/process/Cargo.toml's path-dep on starter-ext-sdk resolves correctly (workspace-relative path of ../../../../starter-extensions/crates/starter-ext-sdk); cargo build --manifest-path rubix/extensions/Cargo.toml -p com.rubix.example green producing target/debug/rubix-example-extension; verify the binary is invokable (rubix-example-extension --help or equivalent should print without panicking); commit chore(rubix-extensions-workspace) build the example extension"
  - "phase B.2 — rubix/extensions/README.md + CI build — write rubix/extensions/README.md present-tense covering how to add a new extension under this workspace, how to build it, how rubix-agent picks it up (link to docs/design/extensions/README.md to be rewritten in Phase E); add or extend .github/workflows/ to build the rubix/extensions workspace (a separate cargo build line is sufficient — does not need to replace existing rubix-workspace build); commit docs(rubix-extensions) + ci(rubix-extensions-build)"
  - "REVIEW gate — Phase B landed — handover confirms cargo build of both workspaces green, confirms the example process binary exists at target/debug/rubix-example-extension, presents SCOPE OQ-3 evidence (whether the example ships UI assets — if not, Phase D adds them)"
  - "phase C.1 — boot/extensions.rs verb file — add rubix/crates/rubix-agent/src/boot/extensions.rs (~250 lines, verb file) exposing pub async fn build_extension_admin(cfg, pg_pool) -> Result<ExtensionAdmin, BootError> that constructs PgEnablementStore + ExtensionHost + Supervisor + ExtensionAdmin per SCOPE Phase C step list; extend rubix/crates/rubix-agent/src/boot/config.rs with [extensions] section (enabled bool default true, dir String default rubix/extensions, autostart_enabled_records bool default true); update rubix/dev/agent.toml with the [extensions] block + dev defaults; cargo build -p rubix-agent green; commit feat(rubix-agent) boot extension admin"
  - "phase C.2 — main.rs router wiring + autostart — wire build_extension_admin into rubix-agent/src/main.rs after the PG pool construction but before the Router assembly; merge starter_ext_server::router(admin) under /api/v1/extensions/* into the Router; apply the existing authz_gate middleware to the lifecycle endpoints (admin-only); verify the boot log emits an INFO line naming the count of discovered extensions (e.g. rubix.boot.extensions loaded=1 autostarted=1) — add the log line if not already in build_extension_admin; commit feat(rubix-agent) mount extensions router + autostart"
  - "phase C.3 — MCP surface integration + changelog — verify SCOPE OQ-4 by booting the agent, fetching tools/list, asserting com.rubix.example.echo (the contributed tool from the example) is present — if not present, trace through starter-ext-mcp's adapter to find the missing wire; verify SCOPE OQ-5 by setting the changelog actor for autostart-on-boot to a synthetic system principal (add the principal constant if it doesn't exist) so the audit row clearly distinguishes operator actions from boot-time autostart; integration smoke at this stage is one curl GET /api/v1/extensions returning the example record; commit fix(rubix-agent) MCP auto-surface for extension tools + changelog actor"
  - "REVIEW gate — Phase C landed — handover names three C commits, shows tools/list includes the example's echo, shows GET /api/v1/extensions returns the example record, shows boot log line counts, present SCOPE OQ-2 evidence (whether SSE event stream is in the same router or separate)"
  - "phase D.1 — install/uninstall endpoints — extend the extensions surface in rubix-agent with POST /api/v1/extensions/install (multipart tarball upload OR JSON body with registry URL — for v1 implement tarball-only and document the registry-URL path as deferred-with-stub-error), DELETE /api/v1/extensions/<id> (stop supervisor + remove directory + mark PG row disabled); add 4 MessageKeys (rubix.extension.install.succeeded, install.invalid_manifest, uninstall.succeeded, uninstall.not_found) to en.json + es.json same commit; integration test asserts a tarball roundtrip; commit feat(rubix-agent) install/uninstall extension endpoints"
  - "phase D.2 — test-ui-5 ExtensionHostProvider page — add packages/test-ui-5/src/app/extensions/page.tsx (or current router equivalent) wiring ExtensionHostProvider from @nube/starter-ext-ui with the rubix-agent base URL; renders <ExtensionSlot id=main /> visibly; if com.rubix.example does not ship UI assets today (per Phase B finding), add a minimal ui/main.tsx in the example exporting a React component that renders hello-from-com.rubix.example with the host-context theme; update com.rubix.example/block.yaml contributes.ui.exposes.main if needed; pnpm --filter @nube/test-ui-5 typecheck + test + lint green; commit feat(test-ui-5+example-ext) frontend host-provider page"
  - "REVIEW gate — Phase D landed — handover names two D commits, shows curl install/uninstall roundtrip, shows a browser screenshot or step-by-step description of the test-ui-5 page rendering the panel (operator-runnable manual flow: boot agent → boot test-ui-5 → navigate to /extensions → see the panel)"
  - "phase E.1 — full lifecycle integration test — add rubix/crates/rubix-agent/tests/extensions_lifecycle_test.rs against testcontainers PG with a fixture extension dir containing com.rubix.example; asserts the 8 lifecycle assertions from SCOPE Phase E (GET list / start / stop / restart / disable / enable / PG row state / event stream messages); cargo test -p rubix-agent --test extensions_lifecycle_test green; commit test(rubix-agent) full lifecycle"
  - "phase E.2 — closing docs + smoke + PR — rewrite rubix/docs/design/extensions/README.md from the current scaffold-and-pointer style to present-tense per SCOPE Phase E (boot flow + REST surface + PG persistence + 10-minute scaffold rewritten so it actually works + frontend wiring + block.yaml shape); add rubix/docs/sessions/<today>-extensions-wired.md closing session note with per-phase commit summary + operator-runnable manual flow + cargo+vitest+integration counts; add an Extensions-wired row to rubix/docs/scope/THIN-SLICE.md Goals-lit-up-beyond-the-thin-slice table; confirm with operator PR shape is one PR off codeless/rubix-extensions-wire reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-extensions-wire with title feat(rubix-agent) wire starter-extensions end-to-end + starter-ext-store-pg upstream and body summarising each phase with commits listed; commit chore(docs) close out + open PR"
