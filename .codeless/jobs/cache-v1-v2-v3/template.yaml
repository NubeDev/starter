name: cache-v1-v2-v3
goal: |
  Land every deferred feature of rubix/docs/proposal/fe-cache-opt-in.md
  on top of the already-shipped v0. After this job: SWR + empty_ttl +
  bucket-level invalidation + read-only handler declarations are
  live at the kind dispatcher (v1); a `starter-windowed` companion
  crate exists, `time_series:` is a CacheSpec block, the
  TimescaleWindowedFetcher + two-layer (`inner_scope:`) caching ship
  (v2); SDUI page-level `cache:` + tower-layer `CacheLayer`,
  multi-node event-bus invalidator + Valkey backend + cold-start
  warming + dimension-scoped tags + a real WarehouseWriter
  chokepoint that fires `invalidate_tags` automatically all ship
  (v3). Authoritative design lives in
  rubix/docs/proposal/fe-cache-opt-in.md; the v0 baseline this job
  builds on is documented in
  rubix/docs/sessions/cache-v0-progress.md and the operator surface
  in rubix/docs/operations/cache-runbook.md.

stages:
  - "stage 1 — v1 land at the existing dispatcher seam: extend `CacheSpec` with `stale_while_revalidate: Duration`, `max_stale: Duration` (default `2 * ttl`), `empty_ttl: Duration` (default 5s, clamped to `min(empty_ttl, ttl)`), and `cache_empty: bool` (default true); extend `InvalidateOn` with `events: Vec<String>` (write-path event tags like `event:ingest.batch.committed`) and `buckets: Option<BucketTagSpec { table, granularity }>` so a writer can fire `bucket:<table>:<floor(t, granularity)>` per-row and a spec can subscribe to one bucket granularity per table; extend the hand-rolled YAML parser to accept the new keys (keep `serde_yaml` out of the workspace dep surface) with the line-number error path the v0 parser already uses; extend `CacheLayer::get_or_load_labelled` with the SWR semantics from §Layer 6b verbatim — serve stale immediately when within `stale_while_revalidate` of expiry or already expired but within `max_stale`, single-flight one background refresh per key, drop the refreshed store if invalidation fires while refresh is in flight, fall through to error after `max_stale` if the refresh keeps erroring; track each entry's expiry via the existing `Clock` so `MockClock` in tests covers SWR boundaries deterministically; add empty-result detection (the loader returns an explicit `Empty` marker the layer can recognise — wrap the value type so callers signal `Empty` rather than relying on `Vec::is_empty()` which would mistake `\"[]\"` JSON for empty); add the read-only handler declaration mechanism — `BuiltinEntry` / `ProcessRestDispatcher` register-time metadata gains `read_only: bool` and `affects_tables: Vec<String>`; a writing handler that does not declare `affects_tables` is a hard error at registration (per §\"Pieces the original revision missed → Read-only handler declaration\"); the dispatcher fires `invalidate_tags(affects_tables.map(|t| format!(\"table:{t}\")))` after a successful write call — this gives v1 a real (not best-effort) invalidation hook for the action handlers the dispatcher owns, while the warehouse-write chokepoint stays the v3 problem; admin endpoint `GET /api/v1/admin/cache/specs` SpecRow grows `config.stale_while_revalidate_seconds`, `config.empty_ttl_seconds`, `config.cache_empty`, `config.invalidate_on_events`, `config.invalidate_on_buckets`; the runbook gets a new \"SWR explained\" + \"how to declare a writing handler\" sections; tests — scenarios.rs gains an SWR-stale-served-while-refresh scenario, an empty-result-respects-empty-ttl scenario, and a read-only-vs-writing handler registration test; canary sidecar at rubix/extensions/com.nubeio.rubixos/kinds/com.nubeio.rubixos.warehouse_query.cache.yaml grows an opt-in `stale_while_revalidate: 30s` line and a smoke test asserts the spec carries it; cargo build + cargo test + cargo clippy --workspace --all-features -- -D warnings + cargo fmt --check all green at stage end; nothing v2 or v3 introduced in this stage"
  - "REVIEW — v1 ships; user confirms the SWR semantics behave the way they expect, the empty-result handling is correct against real warehouse query patterns, and that the read-only handler declaration mechanism is the right shape before stage 2 builds new public surface on top of v1's CacheSpec; any open questions surfaced during stage 1 get answered here, in writing in the handover, before stage 2 starts"
  - "stage 2 — `starter-windowed` companion crate (engine-agnostic) + `time_series:` block + two-layer caching: create crate `crates/starter-windowed` with the module shape the proposal pins (`spec.rs` carrying `WindowedSpec`, `bucket.rs` with `snap_to_bucket` + `decompose(from, to) -> Vec<Bucket>`, `fetch.rs` with `WindowedFetcher<T: Stitchable>` trait and `fetch_bucket(Bucket) -> T`, `stitch.rs` with `Stitchable::stitch(Vec<T>) -> T`, `delta.rs` with `extend(cached_range, requested_range) -> missing_ranges`); the crate has zero dependency on `starter-cache` — it is read-shape not storage-shape and any caller that wants windowed delta-fetch without caching uses it directly (flow nodes, agent steps, export jobs); add per-engine `WindowedFetcher` impls: `TimescaleWindowedFetcher` in `crates/starter-store-warehouse` that wraps a `WarehouseClient` + a SQL template and emits one bucket query at a time, `PgWindowedFetcher` in `crates/starter-store-postgres` for non-Timescale bucketed reads; both implement `WindowedFetcher<RowSet>` and respect the `align_to: utc` boundary so distinct timezones share buckets; extend the v0 `CacheSpec` (additive) with `time_series: Option<TimeSeriesBlock>` carrying `time_param`, `range_param`, `bucket`, `tail_ttl`, `body_ttl`, `align_to`; the parser accepts the block; the `CacheLayer` integration is a thin adapter — when the spec has `time_series:` set, decompose the request's window into buckets, look each closed bucket up with `body_ttl` semantics, look the tail bucket up with `tail_ttl` semantics, and stitch the result with `T::stitch`; the request's `now` is snapped to the bucket boundary before it enters the cache key so the per-bucket key cardinality is bounded; emit the bucket-level invalidation tags (`bucket:<table>:<floor(t, bucket)>`) at registration time so they wire into the v1 bucket-tag registry; add `inner_scope: Option<CacheScope>` to `CacheSpec` — when set and the layer sees `scope: user` with `inner_scope: tenant`, the cache wrapper does a tenant-scope lookup first against the canonical-units query result, runs convert-on-read against the user's prefs from `EvalContext`, then stores in the user-scope cache; this lands as the two-layer cache from §Layer 6c; per §6c the implementation was held \"until 50+ users on one dashboard appear\" — for this job we ship it because the alternative is a hand-wave in the spec; the integration spot uses the existing `starter-i18n` / `starter-spi::preferences` units stack so the conversion is real, not stubbed; canary `com.nubeio.rubixos.warehouse_query.cache.yaml` grows a `time_series:` block targeting the `histories` hypertable plus `inner_scope: tenant`; admin endpoint SpecRow grows `config.time_series` + `config.inner_scope`; scenarios cover bucket decomposition, body-vs-tail TTL, delta-fetch when a cached 7d range is extended to 90d, two-layer hit (outer miss + inner hit), bucket-level invalidation hitting one bucket only; cargo build + cargo test + cargo clippy + cargo fmt --check all green at stage end; nothing v3 introduced"
  - "REVIEW — v2 ships; user confirms `starter-windowed` shape is reusable for non-cache consumers (flow nodes, agent steps), the `inner_scope:` two-layer caching does the right thing against real per-user unit prefs, and the bucket decomposition + delta-fetch matches the worked example D from the proposal end-to-end; any open questions about the per-engine fetcher seams or the stitch contract get resolved here in writing before stage 3 starts"
  - "stage 3 — v3 ship: distribution + SDUI integration + real write-path chokepoint: (a) SDUI integration per §Layer 2 — `starter-sdui-routes` `POST /ui/resolve` wraps the resolver work in `cache_layer.get_or_load_labelled` when the resolved `ComponentTree` carries a `cache:` block; cached objects are `ResolveResponse` (rendered tree + subscription plan) with the resolve-cache key including `(tenant, user, page_id, target_ref, stack_hash, page_state_hash, units_hash, ir_version, page_content_hash)`; the `/ui/table` endpoint caches independently with its own key shape `(source_id, page, sort, filter, scope-vars)`; `/ui/action` is never cached but action handlers fire `invalidate_tags` on success via the v1 read-only declaration mechanism extended to SDUI action handlers; the SDUI IR adds `cache:` as an additive optional root field — no IR version bump per §\"What changed in this revision\"; (b) core HTTP tower layer per §Layer 2 — `CacheLayer::tower()` returns an `axum`-compatible `tower::Layer` driven by a builder that takes a `CacheSpec` and derives the key from `(route_path, query_string, scope-vars)`; an example wiring goes on one rubix-side non-SDUI non-extension JSON route to prove the shape; (c) event-bus invalidator per §Layer 3(b) — `EventBusInvalidator` impl behind the existing `Invalidator` trait, fanning `invalidate_tags` out via the existing `RubixEventBus` so a multi-node rubix-agent deployment converges; each replica subscribes on boot, the `InMemoryInvalidator` stays the default for single-node deployments, the dispatcher wiring picks one or the other based on a new `RUBIX_CACHE_INVALIDATOR=local|event-bus` env var; (d) Valkey backend per §Layer 7 — second `Cache` impl behind the trait (`crates/starter-cache/src/backends/valkey.rs`) gated by a `valkey` feature, the production wiring picks the backend by server config — the author-facing `CacheSpec` does not change; (e) cold-start warming per §\"Pieces the original revision missed → Cold start\" — a simple warmer that replays the top-N spec ids (by hit count from per-spec stats) after a deploy, gated behind a `RUBIX_CACHE_WARM_ON_BOOT=<N>` env var, default off; (f) dimension-scoped tags per §Layer 3 \"Dimension-scoped tags\" — `BucketTagSpec` extends to optionally emit `table:<name>:<dim>=<value>` tags, with the writer registry knowing which dims are tagged; (g) the v3 precondition — a unified `WarehouseWriter` chokepoint that the entire warehouse-write surface goes through; replaces the scattered `// TODO(cache-invalidation):` markers in `crates/starter-store-warehouse/src/tsdb/store/*.rs` (4 sites) and `rubix/crates/rubix-agent/src/extensions/warehouse_write.rs` (1 site) with one trait + impl where `commit` automatically fires `invalidate_tags` with the deduplicated set of table + bucket + dimension tags for the rows just committed; per §Layer 3 \"Batched ingest coalesces tag emissions\" a 500-row batch spanning 12 buckets fires one `invalidate_tags` call with the deduped tag set, not 500; the existing `WarehouseWriteBackend::insert` is reshaped to flow through the chokepoint; admin endpoint SpecRow grows `config.invalidator_kind` (local | event-bus) and the warmer's status surfaces as `cache.warmer.last_run_at` + `cache.warmer.entries_warmed`; rubix-agent boot picks the invalidator + warmer config + Valkey wiring from env; the runbook gets full sections on multi-node deployment + Valkey configuration + warming + the new `WarehouseWriter` story replacing the v0 best-effort posture; scenarios cover the event-bus invalidator firing across two layer instances (simulated multi-node), the Valkey backend round-tripping a value, the cold-start warmer populating after a synthetic process-restart, dimension-scoped tags hitting only the dimensioned entries, the `WarehouseWriter` chokepoint firing invalidate after a real ingest, and the batched-tag dedup behaviour; cargo build + cargo test + cargo clippy --workspace --all-features -- -D warnings + cargo fmt --check all green at stage end"
  - "REVIEW — v3 ships; user confirms the event-bus invalidator and Valkey backend are wired correctly against the rubix multi-node deployment story, the `WarehouseWriter` chokepoint replaces the v0 scattered TODOs and the invalidation story is now type-system-enforced not lint-and-hope, the SDUI integration handles per-user AuthZ + units correctly, and any remaining open questions about cold-start warming heuristics or dimension-tag cardinality get answered here in writing before the job closes"
  - "stage 4 — proposal status flip + final reconciliation: edit rubix/docs/proposal/fe-cache-opt-in.md to flip Status from `Deferred` to `Landed (v1 + v2 + v3 — 2026-Q3)`; update the \"Why this is deferred\" section to a \"Why this landed\" retrospective naming the three un-defer conditions and how they were satisfied (the workload arrived, the WarehouseWriter chokepoint shipped as part of stage 3, the non-cache `starter-windowed` consumer is the agent-step caller that lands alongside it); the \"Minimum viable v0 (when this is revived)\" section becomes a \"v0 baseline (shipped 2026-05-29)\" historical reference linking to rubix/docs/sessions/cache-v0-progress.md; create rubix/docs/sessions/cache-v1-v2-v3-progress.md following the same structure as the v0 progress doc with one session entry per stage of this job and a decisions log capturing every non-obvious choice made along the way; update rubix/docs/operations/cache-runbook.md to reflect the full v3 surface — multi-node invalidation, Valkey backend, warmer config, SWR semantics, `time_series:` authoring, `inner_scope:` two-layer authoring, dimension-scoped tag declarations, the `WarehouseWriter` chokepoint behaviour from the operator perspective; reconcile the admin `GET /api/v1/admin/cache/specs` schema doc against the actual SpecRow shape after three stages of additive growth; cargo build + cargo test + cargo clippy + cargo fmt --check all green at stage end; this is the documentation-only capstone — no code change beyond what's needed to keep `cargo doc` / `cargo test --doc` green"
