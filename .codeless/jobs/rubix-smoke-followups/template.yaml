name: rubix-smoke-followups
goal: |
  Land the uncommitted post-#30 smoke-test work as a clean stack of commits on
  codeless/rubix-smoke-followups, then implement four small follow-ups (B9 CH
  database routing, B10 stale handover volume names, N4 dead-code warning,
  alert-path integration test). At the end, the THIN-SLICE smoke is
  reproducible by a fresh operator from the published handover commands
  without workaround, and 6 / 6 PASS.

stages:
  - review the working-tree diff for Group A (in-flight tracker in starter-flow run_coordinator with the slow_node_body_does_not_race_quiescence test, provider-aware RunnerInput dispatch in starter-ai-agent agent_loop with the LONG-TERM.md CLI tool dispatch note, and rubix-agent boot/mcp/ split into mod.rs+agent_node.rs+prefs.rs+register.rs with primary-tool dispatch + RUBIX_AI_NARRATION on by default + ch_client threading + mcp_stdio_test non-empty reply canary), confirm it matches the narrative in rubix/docs/sessions/2026-05-24-smoke-test-pr30.md and that ./rubix/scripts/lint-doc-refs.sh is clean, run cargo test -p starter-flow -p starter-ai-agent -p rubix-agent and confirm green, then commit in three chronological dependency-order commits (starter-flow first, then starter-ai-agent, then rubix-agent) so each builds standalone and bisect works, and push to codeless/rubix-smoke-followups
  - review the working-tree diff for Group B (starter-observability tracing init honors RUST_LOG when set non-empty, starter-mcp RpcError::internal_from_source walks the source chain into message and data.chain, dispatch tools_call uses the new constructor and emits a warn log line at the boundary), run cargo test -p starter-observability -p starter-mcp and confirm green plus lint-doc-refs clean, commit as one unit titled fix(starter-observability+starter-mcp) surface real error chain on -32603 with body linking B7a and B7b in the smoke note, and push
  - review the working-tree diff for Group C (rubix-agent boot::migrations and boot::clickhouse take Option<&str> parameters with env reads removed, main.rs threads cfg.database_url.as_deref and cfg.clickhouse_url.as_deref, rubix/mani.yaml demo task pre-flights 127.0.0.1:8088 with ss -tlnp and friendly abort), run cargo test -p rubix-agent plus a manual mani run demo until you see mcp_tools=6 and migrations_skipped=false then Ctrl-C, lint-doc-refs clean, commit as fix(rubix-agent) drive migrations from cfg + port pre-flight in demo with body linking B5 and B6, and push
  - REVIEW gate — write a handover summarising all five commits made so far (one-line title + bugs closed + cargo test counts per stage), present SCOPE Open Question 4 to the operator about PR shape (default one PR with stacked-commit history reviewed commit-by-commit versus four child branches with cherry-picks), wait for operator confirmation, then on confirmation run gh pr create --base master --head codeless/rubix-smoke-followups with the agreed title and body that lists each commit and its closed bug ids — this stage commits nothing of its own and the git closing-todo reads skipped — gate-only
  - implement B9 per SCOPE Open Question 2 — first grep -rn 'CREATE DATABASE rubix\|USE rubix' crates/starter-store-clickhouse rubix/ to ground the choice, pick (a) move tables to rubix DB or (b) drop the rubix DB bootstrap, apply the change with one commit, add or extend a history-insertion integration test under rubix/crates/rubix-agent/tests/ that asserts the row lands in the chosen DB, update docs/design/warehouse/README.md present-tense with the chosen routing, commit titled fix(rubix-agent) route warehouse tables to the rubix database (or the converse) with a body explaining the choice, and push
  - implement B10 plus N4 together — fix the stale volume names in rubix/docs/sessions/2026-05-24-handover-codeless-orchestration.md §2 to docker_rubix_postgres_data / docker_rubix_clickhouse_data and scan §§5–8 for any other stale paths the smoke surfaced, run git log -G SUPER_ADMIN_TENANT to decide deletion vs annotation in crates/starter-auth-users, apply the chosen treatment so cargo build -p starter-auth-users is warning-free, commit as one unit titled chore(docs+auth-users) handover volume names + dead-code cleanup, and push
  - implement the alert-path integration test per SCOPE Open Question 3 — first read rubix/crates/rubix-agent/src/boot/insights.rs to find the hardcoded 90 threshold, parameterise via cfg.insights.disk_warn_threshold defaulted to 90 in agent.toml (raise BLOCKED if the refactor is genuinely >100 LoC), add an integration test under rubix/crates/rubix-agent/tests/ that sets the threshold to 50, fires the disk tool, and asserts the alert path fired (log capture or in-memory sink — justify the choice in the test header), commit titled test(rubix-agent) alert path verification via threshold parameterisation, and push
  - REVIEW gate plus closing docs — write a handover summarising the four follow-up commits (B9, B10+N4, alert test), confirm with the operator that the follow-up PR shape should be one PR off the same branch, on confirmation open it via gh pr create, then update rubix/docs/sessions/2026-05-24-smoke-test-pr30.md with a closing Follow-ups landed subsection naming each PR by number and flip rubix/docs/scope/THIN-SLICE.md success-criterion smoke-test row to verified-on-<today> if the alert path exercises, commit titled chore(docs) close out smoke followups, push, and open the final docs PR
