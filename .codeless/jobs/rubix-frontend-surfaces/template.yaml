name: rubix-frontend-surfaces
goal: |
  Build out four major user-visible surfaces in rubix/frontend by
  consuming the already-built starter UI packages and adding one
  rubix-side ClickHouse admin surface. After this job an operator who
  runs make start sees: full authz admin (8 tabs), flow browser
  rendering bundled flow bodies via FlowCanvas, ClickHouse + insights
  admin, polished top-header + nav + toasts + empty states + loading
  skeletons. Pure consumption + one rubix-side panel set; zero new
  starter packages; zero modifications to existing starter UI packages.

stages:
  - "phase A.1 — authz tab triage — verify every tab in <AuthzAdmin> at /admin/access renders against live rubix-agent backend (per the merged frontend-wire PR the route mounts the panel); manually walk through tenants/teams/members/rules/assignments/resources/check/decisions; for each broken tab classify the cause as (a) backend endpoint missing/broken (b) starter-ui-authz panel calling an API method that doesn't exist on StarterClient or (c) i18n keys missing/stylin/wiring; commit nothing this stage if every tab renders; otherwise commit only the (c) class fixes per SCOPE Phase A and file (a)/(b) as follow-ups in the handover; commit feat(rubix-frontend) authz tab triage + i18n fills if any (c) fixes lands otherwise mark git skipped — no diff with the handover naming what's broken"
  - "phase A.2 — left-nav admin section + authz smoke test — add a left-nav admin section to the rubix/frontend layout with three entries (access already exists, users already exists, warehouse stub for Phase C); use starter-ui-kit nav primitives only — do not author new ones; add rubix/frontend/e2e/authz-admin.spec.ts navigating to /admin/access switching through all 8 tabs asserting each tab heading renders without error (doesn't assert business logic just shell mounts); pnpm --filter @nube/rubix-frontend typecheck + test + e2e green; commit feat(rubix-frontend) admin nav section + authz e2e"
  - "REVIEW gate — Phase A landed — handover names the A.1 + A.2 commits + the list of broken-tab follow-ups (if any) split by class; confirm with operator before Phase B begins"
  - "phase B.1 — flow-ops body source confirmation — per SCOPE OQ-2 grep rubix-client-ts/src/endpoints/flow_ops.ts to confirm whether flow-ops.list returns the full YAML body or only metadata; if only metadata and no flow-ops.get(id) exists either grep for an alternative route (e.g. /api/v1/flows-definitions/<id>) or raise BLOCKED with a one-paragraph list of missing endpoints; if a workable endpoint exists add useFlowDefinition(flowId) hook to @nube/rubix-client-react/src/hooks/flow-ops.ts returning the parsed FlowGraph by feeding the body_yaml through the yaml npm package; add a sibling .test.tsx covering the parse; pnpm test green; commit feat(rubix-client-react) useFlowDefinition hook + yaml parse path"
  - "phase B.2 — flow-node-registry + ai-agent override — add rubix/frontend/src/lib/flow-registry.ts (~80 lines) building a NodeKindRegistry at app boot from @nube/starter-ui-flow's builtins (ai-agent, tool-call, trigger, branch); add rubix/frontend/src/lib/flow-nodes/ai-agent-node.tsx (~120 lines) custom component for the ai-agent kind rendering the rubix-specific config fields (skill_hint as a label + allowed_tools[] count as a badge) on the node body; the registry registers the rubix override replacing the built-in ai-agent entry; do NOT modify @nube/starter-ui-flow — rubix-side override only; commit feat(rubix-frontend) flow node registry + rubix ai-agent override"
  - "phase B.3 — /flows list + /flows/$flowId view routes — add rubix/frontend/src/routes/flows/index.tsx consuming useFlowsList from @nube/rubix-client-react/hooks/flow-ops; render a table with columns flow_id + latest_revision_id + last_deployed_at + supersession_count; click row navigates to /flows/$flowId; loading skeleton + empty state from starter-ui-kit; add rubix/frontend/src/routes/flows/$flowId.tsx consuming useFlowDefinition(flowId) rendering <FlowCanvas registry={flowRegistry} graph={flowGraph} readOnly={true} showMiniMap showControls showBackground />; add @xyflow/react/dist/style.css + @nube/starter-ui-flow/styles.css imports to main.tsx if not already present; add Flows entry to left nav; commit feat(rubix-frontend) /flows list + view routes"
  - "phase B.4 — flows smoke test — add rubix/frontend/e2e/flows.spec.ts navigating to /flows asserting list renders >= 6 entries (the 6 bundled flows from PR #32 + any subsequent rows), click com.rubix.scheduled-system-check, assert the canvas renders at least one node labelled ai-agent (selector: text=ai-agent or whatever the BaseNode renders for kind); pnpm --filter @nube/rubix-frontend e2e green against a running backend; commit test(rubix-frontend) flows e2e"
  - "REVIEW gate — Phase B landed — handover names the four B commits, shows one operator-runnable manual flow (boot make start → browse /flows → click scheduled-system-check → see the canvas), confirms readOnly behaviour, presents SCOPE OQ-2 evidence on the body-source choice; wait before Phase C"
  - "phase C.1 — insights + clickhouse endpoint confirmation — per SCOPE OQ-3 grep rubix-agent/src/routes/ for insights and clickhouse list/CRUD endpoints; if any of useInsightsRulesList useInsightsRuleCreate useInsightsRuleEnable useInsightsRuleDisable useClickhouseRulesList useClickhouseMartsList useClickhouseMartDrop useClickhouseTablesList lack a backing endpoint raise BLOCKED with the one-paragraph list of missing endpoints (a separate rubix-agent job lands them; this job halts); if all endpoints exist commit nothing — analysis only — the handover names every endpoint by route and the existing hook coverage in rubix-client-react"
  - "phase C.2 — rubix-client-react hooks for clickhouse + insights — extend @nube/rubix-client-react/src/hooks/clickhouse.ts with useClickhouseRulesList useClickhouseMartsList useClickhouseMartDrop useClickhouseTablesList; add @nube/rubix-client-react/src/hooks/insights.ts with useInsightsRulesList useInsightsRuleCreate useInsightsRuleEnable useInsightsRuleDisable; sibling .test.tsx per file; pnpm --filter @nube/rubix-client-react typecheck + test green; commit feat(rubix-client-react) clickhouse list/drop + insights hooks"
  - "phase C.3 — warehouse admin panels — add rubix/frontend/src/components/admin/warehouse/ with rules-panel.tsx (CH rules list + inline textarea editor + save via useClickhouseRuleWrite + delete via soft-delete) marts-panel.tsx (list + create modal + drop with data-loss warning) retention-panel.tsx (system.tables list with inline TTL edit via useClickhouseRetentionSet) insights-panel.tsx (insights rules list + create form + enable/disable toggles) warehouse-admin.tsx (tabbed shell mirroring AuthzAdmin) plus index.ts barrel; each panel ≤ 200 lines and is a verb file; rubix-spi catalogue keys admin.warehouse.* land in rubix/frontend/src/i18n/{en,es}.json same commit; commit feat(rubix-frontend) warehouse admin panels"
  - "phase C.4 — /admin/warehouse route + smoke test — add rubix/frontend/src/routes/admin/warehouse.tsx mounting <WarehouseAdmin> wrapped in <ErrorBoundary>; ensure the warehouse entry is wired in the left nav admin section (placeholder added in Phase A.2 now becomes live); add rubix/frontend/e2e/warehouse.spec.ts navigating through 4 tabs asserting each heading; pnpm --filter @nube/rubix-frontend typecheck + test + e2e green; commit feat(rubix-frontend) /admin/warehouse route + e2e"
  - "REVIEW gate — Phase C landed — handover names the four C commits, shows one operator-runnable manual flow (browse /admin/warehouse → set retention on system_disk_history to 30 days via the panel → assert system.tables shows new TTL → undo via the panel's undo button OR via /admin/users's existing undo flow); wait before Phase D"
  - "phase D.1 — top header polish + theme toggle — extend rubix/frontend/src/components/top-header.tsx with current user email + role badge from useAuth().user; tenant indicator from useTenantList() — display-only for 0/1 tenants, dropdown for 2+ with switching disabled and a tooltip 'switching not yet wired'; logout menu item calling useAuth().logout(); theme toggle wired via starter-ui-kit's useTheme if available (per SCOPE OQ-7 confirm and consume; otherwise hand-roll a minimal toggle button using the existing theme CSS variables); commit feat(rubix-frontend) top header with user + tenant + logout + theme toggle"
  - "phase D.2 — toast-error-listener + empty states + loading skeletons — add rubix/frontend/src/components/toast-error-listener.tsx (~80 lines) installing a TanStack Query QueryCache onError callback that catches uncaught RubixError and renders a localised toast via starter-ui-kit's Toast primitive (per SCOPE OQ-6 confirm starter-ui-kit exposes Toast; if not, raise BLOCKED — toasts shouldn't be hand-rolled in rubix); mount once in main.tsx alongside the existing ErrorBoundary; add or wire <EmptyState> components to every list-rendering route (extensions list, users list, flows list, warehouse rules/marts/tables/insights lists) per SCOPE OQ-5; add <Skeleton> placeholders during isLoading state on every useQuery consumer replacing any spinner-only states; commit feat(rubix-frontend) toast listener + empty states + loading skeletons"
  - "phase D.3 — chrome smoke test — add rubix/frontend/e2e/chrome.spec.ts covering login → assert top-header shows email + logout → assert left nav has 5 sections (Home Flows Extensions Admin Settings) → click logout → assert redirect to /login; pnpm --filter @nube/rubix-frontend e2e green; commit test(rubix-frontend) chrome e2e"
  - "REVIEW gate — Phase D landed — handover names three D commits + total e2e count across the new specs (authz-admin + flows + warehouse + chrome = 4 new specs); one operator-runnable manual flow (run make start → log in → walk every left-nav section → trigger a deliberate error to see the toast); wait before Phase E"
  - "phase E — closing docs + session note + PR — extend rubix/docs/design/frontend/README.md with sections for the route map (after-this-job), the rubix-flavoured NodeKindRegistry boot wiring (link to rubix/frontend/src/lib/flow-registry.ts and the ai-agent-node.tsx override), the warehouse admin surface design, the toast-error-listener pattern; add rubix/docs/sessions/<today>-frontend-surfaces.md with per-phase commit summary + the operator-runnable manual flow (full make start walkthrough) + test counts + the list of REST endpoints that proved missing during the job and got tracked as follow-ups; update rubix/docs/scope/THIN-SLICE.md Goals-lit-up table with a new Frontend surfaces row; confirm with operator the PR shape is one PR off codeless/rubix-frontend-surfaces reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-frontend-surfaces with title feat(rubix-frontend) consume starter UI packages + ClickHouse admin surfaces and body summarising each phase with commits listed; commit chore(docs) close out frontend surfaces + open PR"
