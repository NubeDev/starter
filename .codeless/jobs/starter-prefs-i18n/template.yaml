name: starter-prefs-i18n
goal: |
  Land Phases 1 through 5 of DOCS/user/scope/SCOPE.md as one job:
  the user-preferences + i18n backend end-to-end, including the
  React UI glue. After this job, a starter-based product compiled
  with the new crates and the existing @nube/starter-ui-core gets
  multi-locale, multi-unit, multi-timezone behaviour out of the box.

  Scope by phase (mirroring the SCOPE Rollout block):
  - Phase 1 — starter-prefs crate. Cargo.toml + 4 REST endpoints
    (GET/PATCH /v1/me/preferences, GET/PATCH /v1/orgs/{id}/preferences,
    GET /v1/units). Three-layer user → org → default resolver with
    "auto" derivation per R3. PrefsStore trait + sqlite impl (Postgres
    deferred per the SCOPE's existing precedent — flagged in stage 1).
    starter-client-rs methods + starter-cli prefs subcommand.
    iso_currency lands HERE per D-U0.3 (not on starter-spi at Phase 0).
  - Phase 2 — Accept-Units tower middleware in starter-server +
    UnitsCtx threading through to typed serialisers + per-series unit
    metadata wire shape per R8 + "canonical-only logs" audit + the
    CDN-cache caveat docs that R7 calls out.
  - Phase 3 — starter-i18n crate. LanguageTag-based catalog loader,
    Accept-Language tower middleware in starter-server, GET
    /v1/i18n/catalogs/{lang} + GET /v1/i18n/manifest with content-hash
    URLs for immutable caching, seed catalogs at catalogs/starter/
    (en.json + es.json covering starter-owned chrome: auth flows,
    error envelopes, settings page labels), X-I18n-Fallback header
    (off by default; per-route opt-in).
  - Phase 4 — @nube/starter-ui-core additions: PreferencesProvider
    (zustand or context + react-query — pick at stage 1) + a
    formatters module (formatDate, formatTime, formatNumber,
    formatCurrency, formatQuantity) + IntlProvider wiring via
    react-intl bound to the loaded catalog + a Settings page wired
    into starter-auth-users' account page. Re-export useTranslate +
    the pure formatters for consumer apps.
  - Phase 5 — scope-limited diagnostics rewriter (opt-in DiagnosticBody
    response extension; touches only the documented envelope shape at
    documented top-level paths; SSE / streaming bodies are explicitly
    NOT rewritten per R5). Feature-gated on starter-i18n's diagnostics
    feature (default-off).

  F-0.1 and F-0.2 from PHASE0-VERIFY.md fold into stage 1: the
  starter-flow-spi baseline regression resolves per recommendation
  (b) — feature-gate uom + icu_locale_core on starter-spi so the
  Phase 0 dep landing does not leak into starter-flow-spi's tree —
  and the baseline-capture script grows worktree-path stripping so
  cargo-tree output is reproducible across worktrees. Phase 1 builds
  on a clean starter-spi baseline; doing this first means every
  later stage's dep-tree gate is comparing against the right
  reference.

  Workspace policy posture stays: the two new Rust crates ship
  default-features = []; the new @nube/starter-ui-core surface is
  additive behind the existing package boundary; a consumer that
  doesn't compile starter-prefs / starter-i18n in is unaffected
  (the "Headless appliance keeps working" smoke from the SCOPE
  Smoke-tests block is the exit gate at stage 22).

stages:
  - 'stage 1 — Phase 0 closure + decisions lock for Phases 1-5. (a) Resolve F-0.1: feature-gate `uom` + `icu_locale_core` on starter-spi so the Phase 0 dep landing does not regress the starter-flow-spi baseline. Update DOCS/flow/scope/starter-flow-spi-deps.baseline.txt if and only if a legitimate gap exists; otherwise the gate stays as-is and the new starter-spi features default-off. Update DOCS/user/scope/starter-spi-deps.baseline.txt to reflect the feature-gated state. (b) Resolve F-0.2: add a baseline-capture script at DOCS/user/scope/capture-baseline.sh that strips worktree paths so `cargo tree -p starter-spi --edges normal` is reproducible across worktrees (matches whatever pattern starter-flow-spi already uses; if there is no prior pattern, the script lives here and the flow-spi baseline gets the same treatment in a separate small follow-up). (c) Lock Phase 1 decisions in SCOPE.md "Decisions": PrefsStore trait shape (sqlx::Pool-backed or generic Repository<T>; bias sqlx::Pool-backed for v1 per the SCOPE Open-questions block "Repository<T> derive for prefs tables — deferred to v0.2"), Postgres impl posture (deferred; the SCOPE Crate-layout block lists starter-store-sqlite explicitly and starter-store-postgres only by implication; bias sqlite-only for this job, Postgres in a follow-up), iso_currency landing location (D-U0.3 from Phase 0 said NOT starter-spi; land in starter-prefs only). (d) Lock Phase 2 decisions: per-series wire shape per R8 ({series: [{slot, quantity, unit, points: [[ts, val]]}]}); UnitsCtx::convert call shape (handler-level, NOT response-body rewriting per R6). (e) Lock Phase 3 decisions: catalog file format (plain ICU JSON keyed by MessageKey; deny_unknown_fields on the loader); manifest fingerprint algorithm (sha256 hex prefix, 16 chars — matches the immutable-cache URL shape R5 describes). (f) Lock Phase 4 decisions: PreferencesProvider state-management (react-query for fetch + zustand for ephemeral UI state, matching the existing @nube/starter-ui-core posture); IntlProvider catalog loader (lazy import per language, manifest-driven). (g) Lock Phase 5 decisions: which response top-level paths the rewriter touches (the SCOPE says "the declared envelope shape (diagnostic: {code, params})" — lock the exact paths in this stage). Each decision lists rule-it-derives-from and revisit-trigger per the WORKFLOW convention. No code changes outside DOCS/ and the new capture-baseline.sh script in this stage; everything substantive lands in later stages.'
  - 'REVIEW Phase 0 closure + Phases 1-5 decisions — F-0.1 resolution, F-0.2 baseline script, and the seven decision blocks in SCOPE.md "Decisions" all locked. The next 19 stages bind to these answers; do not advance until the gate passes.'
  - 'stage 3 — Phase 1 starter-prefs crate scaffold. Add crates/starter-prefs/ with default-features = []. Cargo.toml depends on starter-spi + sqlx (workspace) + serde + serde_json + utoipa + tracing + iso_currency (new dep landing here per D-U0.3). lib.rs declares pub mod resolver; pub mod store; pub mod routes (behind a `routes` feature, default off); pub mod middleware (behind a `routes` feature). Add the crate to workspace members alphabetically (between starter-observability and starter-secrets-file or in whichever slot keeps the list grep-clean). cargo check -p starter-prefs green; the empty modules carry doc comments naming the SCOPE section that owns each.'
  - 'stage 4 — Phase 1 three-layer resolver in starter-prefs/src/resolver.rs. Pure function `pub fn resolve(user: Option<UserPrefsRow>, org: Option<OrgPrefsRow>, default: &SystemDefaults) -> ResolvedPreferences` — no I/O, deterministic, fully unit-testable. Resolution rule per SCOPE R3: for each field independently, first non-null layer wins (user → org → default). "auto" derivation per the R3 derivation order block: explicit value at any layer → unit_system at the same/closer layer (metric/imperial table) → locale-derived default via icu_locale → hardcoded system default. ResolvedPreferences carries no Option and no "auto" string (Phase 0 D-U0.3 + ResolvedPreferences invariant). Unit tests cover the three SCOPE Smoke-tests-block cases: "Resolver layer precedence" (three rows, user wins per-column, org wins for NULL fields, default wins when org is removed); "auto derivation" (en-AU + metric + auto-all = C/kPa/km/h/m/kg/AUD; flip to imperial = F/psi/mph/ft/lb; BBQ case = metric everywhere except temperature_unit: F). cargo test -p starter-prefs green.'
  - 'stage 5 — Phase 1 PrefsStore trait + sqlite impl in starter-prefs/src/store.rs. Trait shape: async fn get_user_prefs(user_id, workspace_id) -> Result<Option<UserPrefsRow>>, async fn get_org_prefs(workspace_id) -> Result<Option<OrgPrefsRow>>, async fn upsert_user_prefs(user_id, workspace_id, patch) -> Result<()>, async fn upsert_org_prefs(workspace_id, patch) -> Result<()>. Sqlite impl uses sqlx::SqlitePool, behind a `sqlite` cargo feature (default off — workspace policy R5). Migrations land at starter-prefs/migrations/0001_starter_prefs.sql per the namespaced migration source pattern the workspace already uses; tables: starter_prefs_org and starter_prefs_user per the SCOPE Preferences-model block, all timestamps INTEGER (UTC epoch milliseconds — BIGINT-equivalent affinity in SQLite). Integration tests under starter-prefs/tests/ use sqlx::SqlitePool::connect("sqlite::memory:") fixtures. Tests cover: upsert-then-get round-trip preserves every field; NULL-valued column comes back NULL (no implicit default coercion at storage layer — coercion is the resolver''s job per R3); the multi-org pattern (user with N rows keyed (user_id, workspace_id)) works for any N. cargo test -p starter-prefs --features sqlite green.'
  - 'stage 6 — Phase 1 REST routes + 4 endpoints in starter-prefs/src/routes.rs behind the `routes` feature. axum Router with GET /v1/me/preferences (query param `org=<workspace_id>`, defaults to the active org on Principal), PATCH /v1/me/preferences (PreferencesPatch body, null field means "revert to inherit"), GET /v1/orgs/{id}/preferences (require_role(Admin)), PATCH /v1/orgs/{id}/preferences (require_role(Admin)), GET /v1/units (public UnitRegistry serialised JSON + ETag header + X-Platform-Version header per R4 / SCOPE API-surface block). Every handler returns ResolvedPreferences (or 204 on PATCH success). All four routes derive utoipa::ToSchema; the route module exposes a function that contributes them to starter-server''s openapi.json per workspace R7. Integration tests use an in-memory sqlite store + a stub Principal; cover: GET-after-PATCH reflects the change; PATCH null reverts to org/default; GET-units returns the same JSON twice (ETag stable); admin-only paths return 403 for non-admin Principal. cargo test -p starter-prefs --features sqlite,routes green.'
  - 'stage 7 — Phase 1 starter-client-rs methods + starter-cli prefs subcommand. Client: add async fn get_my_preferences(&self, org: Option<&str>) -> Result<ResolvedPreferences>, async fn patch_my_preferences(&self, org: Option<&str>, patch: PreferencesPatch) -> Result<()>, async fn get_org_preferences / patch_org_preferences (admin), async fn get_units(&self) -> Result<UnitsResponse> on the existing Client struct. CLI: starter-cli prefs get [--org WS] (prints the resolved view as table or JSON depending on --output), starter-cli prefs set --field temperature_unit --value F [--org WS] (PATCH for a single field; "auto" string accepted at the CLI as the inheritance sentinel and translated to JSON null in the body before send), starter-cli prefs units (list the public registry). Integration test spins up the routes against an in-memory sqlite store, hits each command, asserts on stdout. cargo test -p starter-client-rs green; cargo test -p starter-cli green.'
  - 'stage 8 — Phase 2 Accept-Units tower middleware in starter-server. tower Layer + Service implementing `accept_units_layer(registry: Arc<dyn UnitRegistry>, prefs: Arc<dyn PrefsResolverFor>)`: parses Accept-Units header (defaults to "preferred"; "canonical" disables conversion), resolves the caller''s prefs once per request via the injected resolver, sets `Vary: Accept-Units`, inserts a UnitsCtx into request extensions. The middleware does NOT mutate response bodies per R6 — it resolves prefs once and exposes them to typed serialisers via UnitsCtx::convert(quantity, value, source_unit) which handlers call when emitting values. UnitsCtx::convert delegates to starter_spi::units::normalize_for_storage in reverse (source_unit → canonical for storage; canonical → user_unit for response). Integration tests assert: Accept-Units: canonical bypasses conversion; missing header defaults to "preferred"; Vary header is present; UnitsCtx is in extensions and a test handler that opts in serialises a converted value. cargo test -p starter-server green.'
  - 'stage 9 — Phase 2 per-series response shape per R8. starter-spi::units gains a small UnitMetadata helper struct ({quantity: Quantity, unit: Unit}) deriving Serialize + utoipa::ToSchema. starter-prefs gains a SeriesEnvelope<T> struct ({slot: String, quantity: Quantity, unit: Unit, points: Vec<(i64, T)>}) deriving Serialize + ToSchema — the wire shape from the SCOPE R8 block. A small adapter trait ToCanonicalSeries / FromCanonicalSeries on the consumer side lets a typed timeseries struct serialise through UnitsCtx for unit-aware conversion. starter-server does NOT impose a wire format on consumer endpoints; the helper structs are opt-in. Tests cover round-trip serialisation of SeriesEnvelope through serde_json, ToSchema generation gives the right openapi.json shape, and the metadata-hoisting principle (one quantity/unit per series, not per point) is preserved.'
  - 'stage 10 — Phase 2 canonical-only-logs audit. Add a tracing-test harness in starter-server/tests/canonical_logs.rs that runs the workspace integration tests with a captured subscriber and asserts no log line contains the strings "°F", " psi", " mph", " lb" (the SCOPE Smoke-tests block "Canonical-only logs" test). The audit lives in starter-server because that is where the middleware applies; if a downstream crate logs a converted value, the test fails at the workspace integration level. Update CONTRIBUTING.md (or whichever workspace doc is in fashion) with the rule: logs are always canonical SI; conversion happens at the response edge only. cargo test -p starter-server --test canonical_logs green.'
  - 'REVIEW Phase 2 complete — Accept-Units middleware + R8 wire shape + canonical-only logs audit all green. The middleware does not mutate response bodies (R6); per-series metadata is one-per-series not per-value (R8); logs are SI-only. The next stage starts Phase 3 (i18n).'
  - 'stage 12 — Phase 3 starter-i18n crate scaffold + LanguageTag-based locale module. Add crates/starter-i18n/ with default-features = []. Cargo.toml depends on starter-spi (uses LanguageTag, MessageKey, Diagnostic from Phase 0) + serde + serde_json + utoipa + tracing + icu_locale_core (already in starter-spi feature-gated; starter-i18n turns the feature on) + sha2 (for catalog fingerprinting). lib.rs declares pub mod locale; pub mod catalog; pub mod bundle; pub mod translate; pub mod platform; pub mod routes (behind a `routes` feature, default off); pub mod middleware (behind `routes`). locale.rs: parse_accept_language(header) -> Vec<(LanguageTag, f32)>; pick_language(available: &[LanguageTag], accept: &str, fallback: LanguageTag) -> LanguageTag — implements the R5 fallback chain (requested → language family → en). Add the crate to workspace members. Unit tests cover BCP-47 parsing edge cases (en-US, zh-TW with country, en;q=0.5 quality weight, "*" wildcard, empty/garbage headers).'
  - 'stage 13 — Phase 3 catalog loader + bundle in starter-i18n/src/catalog.rs and bundle.rs. Catalog format: a plain JSON object keyed by MessageKey, values are ICU MessageFormat strings; the loader uses serde with deny_unknown_fields at the top level. MessageBundle struct holds a Map<LanguageTag, Map<MessageKey, String>> in memory; lookup(lang, key) -> Option<&str> walks the R5 fallback chain (lang → language-family → en). Catalog fingerprint: sha256 hex of the canonical-serialised JSON, 16-char prefix (locked at stage 1). Loader supports loading from disk path AND from compiled-in const &str (the platform.rs pattern — starter-owned chrome catalogs ship compiled into the crate so a binary still serves them when no on-disk catalog dir exists). Unit tests cover: load valid catalog round-trips; load with unknown top-level key fails fast; lookup fallback chain returns the right hit; missing key returns None (per R5 "missing keys fall through to the source string, never error" — the bundle returns None and the caller decides; the documented behaviour is "log a debug event and return the key itself as the rendered string", landed here as a default `render_or_key(lang, key)` helper).'
  - 'stage 14 — Phase 3 Accept-Language middleware + routes. accept_language_layer(bundle: Arc<MessageBundle>) tower Layer + Service: parses Accept-Language, picks a LanguageTag with R5 fallback, sets Content-Language and Vary: Accept-Language, inserts a LocaleCtx into request extensions. Optional X-I18n-Fallback header is off by default and enables via accept_language_layer(...).with_fallback_header(true) per SCOPE R5 "every fallback emits a tracing::debug! event and the response carries an opt-in X-I18n-Fallback: <lang> header". starter-i18n/src/routes.rs (behind `routes`): GET /v1/i18n/manifest -> {<lang>: <16-char-fingerprint>} for every shipped language, ETag''d; GET /v1/i18n/catalogs/{lang} -> the bundle for one language, ETag matches the manifest fingerprint, Cache-Control: public, max-age=31536000, immutable when the path is the content-hashed form /v1/i18n/catalogs/{lang}-{fingerprint}.json; the un-fingerprinted form supports plain ETag revalidation but not immutable caching. Integration tests assert: manifest is stable across calls (same fingerprints); fingerprinted URL returns immutable Cache-Control; un-fingerprinted URL returns ETag and a 304 on revalidate; pick_language with no Accept-Language header falls back to en + sets X-I18n-Fallback when enabled.'
  - 'stage 15 — Phase 3 seed catalogs at starter-i18n/catalogs/starter/en.json and es.json. Cover: auth flow strings (login button labels, error envelope keys for AuthError variants per starter-auth-* surfaces), generic error envelope keys (validation.*, internal.*, not-found.*), settings page chrome (every label/button text the Phase 4 Settings page will use), preferences field labels (one key per ResolvedPreferences field). MessageKey discipline per Phase 0 D-U0.3: reverse-DNS-ish dotted form starter.auth.login.button.label, starter.error.validation.email.invalid, starter.settings.preferences.timezone.label. The platform.rs module compiles both catalogs as include_str! constants so a binary serves them with no on-disk catalog dir. en.json is exhaustive (every key the workspace currently emits); es.json is a complete translation of the starter-owned keys (every key in en.json has an entry; the Phase 4 UI verifies this via the load-all-keys test). Verify with a small starter-i18n/tests/seed_catalog_consistency.rs that asserts en.json and es.json have identical key sets (no untranslated keys in es.json).'
  - 'REVIEW Phase 3 complete — starter-i18n crate scaffolds + locale parsing + catalog loader + bundle + Accept-Language middleware + manifest/catalog routes + seed en/es catalogs all green. R5 fallback chain works end-to-end; X-I18n-Fallback opts in correctly; immutable-cache URL shape is reachable. Phase 4 (TS / React) starts next.'
  - 'stage 17 — Phase 4 @nube/starter-ui-core: PreferencesProvider + formatters module. Add packages/starter-ui-core/src/preferences/ directory. PreferencesProvider component: react-query fetches GET /v1/me/preferences (key: ["preferences", workspaceId]) on mount; exposes a React context with the ResolvedPreferences object + a setPreferences(patch) callback that PATCHes and invalidates the query. usePreferences() hook reads the context. formatters.ts module: formatDate(timestamp_ms, prefs) using Intl.DateTimeFormat keyed off prefs.locale + prefs.date_format; formatTime similarly; formatNumber(value, prefs) keyed off prefs.locale + prefs.number_format; formatCurrency(amount_minor_units, currency_code, prefs) using Intl.NumberFormat style currency; formatQuantity(value, quantity, source_unit, prefs) does the unit-conversion + symbol render in one call (source_unit -> prefs[`${quantity}_unit`]). All formatters are pure functions; the unit-conversion table mirrors starter-spi::units::StaticRegistry but lives in TS as a small static map (kept in sync via a test that pnpm-tests against /v1/units). vitest tests cover every formatter; one snapshot test per (locale, prefs) matrix to catch surprises. Re-export PreferencesProvider, usePreferences, and the pure formatters from src/preferences/index.ts; add the entry to package.json exports under "./preferences".'
  - 'stage 18 — Phase 4 IntlProvider wiring + Settings page. Add packages/starter-ui-core/src/i18n/ directory. IntlProvider component wraps react-intl: on mount, fetches GET /v1/i18n/manifest, then fetches the fingerprinted catalog URL for the active language (active = prefs.language, falls back to en); passes messages + locale to react-intl''s IntlProvider; provides a useTranslate() hook that wraps react-intl''s useIntl().formatMessage with a typed MessageKey overload. The catalog cache is permanent for the fingerprinted URL (immutable). Settings page in packages/starter-ui-core/src/preferences/SettingsPage.tsx: a React form bound to PreferencesPatch, fields for every column (timezone via Intl.supportedValuesOf("timeZone") dropdown, locale dropdown, language dropdown listing manifest keys, every per-unit selector, theme/date/time/week/number selectors, currency dropdown using iso_currency-style list fetched from the consumer side or a static curated subset shipped here). Submit calls usePreferences().setPreferences(patch); success toasts the change; error toasts the message via useTranslate(). Wire the Settings page into starter-auth-users'' account page surface (the consumer mounts <SettingsPage /> at /account/settings). Re-export IntlProvider, useTranslate, SettingsPage from src/i18n/index.ts (and src/preferences/SettingsPage.tsx). vitest tests cover useTranslate fallback to en, IntlProvider remount on language switch, SettingsPage form-submit happy path with a MockClient. pnpm -C packages/starter-ui-core test green; pnpm -C packages/starter-ui-core typecheck green.'
  - 'REVIEW Phase 4 complete — PreferencesProvider + formatters + IntlProvider + Settings page all green. The "Australian operator" SCOPE Smoke-tests block test passes end-to-end against an in-memory server + the new UI (a user with timezone Australia/Brisbane, metric units, DD/MM/YYYY, 24h hits a test endpoint and sees Brisbane time, Celsius, slash-format dates). Phase 5 (diagnostics rewriter) starts next.'
  - 'stage 20 — Phase 5 scope-limited diagnostics rewriter in starter-i18n behind a `diagnostics` cargo feature (default off). DiagnosticBody response extension: a marker type that handlers insert into the response via response.extensions_mut().insert(DiagnosticBody::new()). A tower Layer reads the extension on the way out and rewrites ONLY the documented envelope shape: {diagnostic: {code: MessageKey, params: Map<String, DiagnosticParam>}} at the documented top-level paths (which paths are documented was locked in stage 1; default is the response root). The rewriter is scope-limited per R5: it does not walk arbitrary JSON; it touches only the marked envelopes; SSE / chunked / streaming responses are NEVER rewritten (the layer inspects Content-Type and bails on text/event-stream and chunked transfer-encoding). The bundle is read from request extensions (LocaleCtx is required upstream); on missing translation the rewriter leaves the envelope as-is and the consumer translates per-event. Integration tests cover: opted-in handler produces a translated body; non-opted-in handler is untouched; SSE response is untouched; missing translation leaves the envelope intact; the rewriter''s presence does not change behaviour for clients that ignore Content-Language.'
  - 'stage 21 — Headless appliance + canonical-only-logs + add-a-language + workspace-wide smoke tests. The "Headless appliance keeps working" smoke from the SCOPE Smoke-tests block: a binary built with starter-auth-token + starter-secrets-file and WITHOUT starter-prefs / starter-i18n still builds, runs, and serves requests; no middleware, no extra routes, no extra migrations. (Structural test — cargo build --workspace --no-default-features --features minimal-feature-set succeeds.) The "Add a language" smoke: drop fr.json into starter-i18n/catalogs/starter/, bump the i18n crate''s version, rebuild — manifest gains the new language; clients fetching it get the new bundle. The "Australian operator" smoke from the SCOPE has a server-side counterpart at this stage: GET /v1/telemetry?slot=temp_in with Australian prefs returns "unit": "celsius", "value": <converted>. The dep-tree gates all stay green: cargo tree -p starter-spi --edges normal matches the (now feature-gated) baseline; cargo tree -p starter-flow-spi --edges normal matches its existing baseline byte-for-byte; cargo tree -p starter-prefs --edges normal contains iso_currency; cargo tree -p starter-i18n --edges normal contains icu_locale_core + sha2 and nothing surprising. R7 openapi.json contains every new route''s schema entries. cargo test --workspace green; cargo clippy --workspace --all-targets -- -D warnings green; cargo fmt --check green; pnpm -C packages/starter-ui-core test + typecheck green.'
  - 'stage 22 — final cleanup + docs sweep. Update DOCS/user/scope/SCOPE.md to mark Phases 1-5 as landed (a small footer block "Landed in PR #<this-PR>" with the merge commit pointer); update DOCS/user/scope/PHASE0-VERIFY.md to mark F-0.1 and F-0.2 as closed with the resolution. Run the SCOPE Smoke-tests block top to bottom and record results in DOCS/user/scope/PHASES-1-5-VERIFY.md (the analog of PHASE0-VERIFY.md from the prior job): each test name, pass/fail, and the exact command that proves it. Confirm R1 (canonical-only storage), R2 (display vs quantity prefs), R3 (three-layer resolution + auto), R4 (closed enums, no #[non_exhaustive] crept in), R5 (translation client-side by default, diagnostics rewriter opt-in), R6 (conversion at exactly one layer), R7 (Accept-Units custom header + Vary), R8 (per-series metadata) all hold structurally — grep + cargo-tree + a per-rule one-liner in PHASES-1-5-VERIFY.md. Workspace policy R5 ("default-features minimal") confirmed via the headless-appliance smoke from stage 21.'
