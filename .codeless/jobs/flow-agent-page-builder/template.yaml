name: flow-agent-page-builder
goal: 'Land the `flow-agent` Page Builder slice spec''d in examples/flow-agent/PAGE-BUILDER.md — two new sidebar entries (Pages, Skills) plugged into the existing flow-agent React shell with zero new Rust code. Pages are AI-authored SDUI trees streamed into a live `<Renderer>` via a scripted `BuilderAdapter`, saved to `localStorage` keyed `flow-agent:pages`, viewed read-only via the same renderer (no-op `SduiHost` action dispatcher), and listed in a sidebar section that updates live in-tab and across tabs. Skills is a drop-in `<SkillsManager>` seeded with the two reference bundles via `createInMemorySkillsAdapter`. Composes — does not wrap — the opinionated `<AiBuilder>`: `PageBuilder.tsx` calls `useBuilder` itself so the host owns the current `tree` and can wire the save button. Fixture timings are pinned for a deterministic buffered-patch demo.'

stages:
  - 'resolve the four open design points before any code lands and record them in SCOPE.md under Decisions — pin the sidebar live-update mechanism (bias `useSyncExternalStore` over a `pages-store` subscribe + a `window.storage` listener for cross-tab sync), pin the buffered-patch fixture timings (bias `patch` t=0ms / parent `full_render` t=80ms / phase done <2s, well inside the default `useBuilder` window), pin the `<SduiHost>` shape (bias a thin wrapper around `SduiProvider` from `@nube/starter-sdui-react` installing a no-op action dispatcher, reused by both the builder canvas and `/pages/:id`), and confirm `frontend/package.json` requires no edits because every `@nube/*` lib is already a dep'
  - 'REVIEW prerequisite design decisions before any frontend code lands'
  - 'land the lib layer in `examples/flow-agent/frontend/src/lib/` — `pages-store.ts` (localStorage CRUD keyed `flow-agent:pages` plus a `useSyncExternalStore` hook driven by an in-process subscribe + a `window.storage` listener so the sidebar updates live in-tab and across tabs), `builder-fixture.ts` (a `createFixtureBuilderAdapter`-driven script keyed by prompt prefix — `sales` / `dashboard` / `onboard` / `report` / fallback — with the pinned timings from stage 1 and one fixture firing `patch` before its parent `full_render` to exercise the R1 buffer), and `sdui-shim.tsx` (`<SduiHost>` wrapping `SduiProvider` with a no-op action dispatcher). No routes yet'
  - 'land the four route screens in `examples/flow-agent/frontend/src/pages/` — `PagesList.tsx` (cards + first-visit empty state "No pages yet — hit + New page to start", "+ New page" routes to `/pages/new`), `PageBuilder.tsx` (composes `useBuilder` + `<BuilderTranscript>` + `<AiBuilderCanvas>` directly — does not wrap `<AiBuilder>` — so the host owns `tree` and wires a save button that writes `{id, name, tree, createdAt}` via `pages-store` then navigates to `/pages/:id`; supports `initialTree` for edit), `PageView.tsx` (renders `<Renderer node={page.tree.root} />` inside `<SduiHost>` with Edit/Duplicate/Delete actions), `Skills.tsx` (drop-in `<SkillsManager adapter={createInMemorySkillsAdapter({skills: fixture})} />` seeded with the two reference bundles `starter.ai-builder.dashboards` + `starter.ai-builder.themes`)'
  - 'wire routes and shell nav in `examples/flow-agent/frontend/src/app.tsx` (add `/pages`, `/pages/new`, `/pages/:id`, `/pages/:id/edit`, `/skills`) and `src/layout/Shell.tsx` (collapsible Pages section subscribed to `pages-store` via the `useSyncExternalStore` hook from stage 3 so saved pages appear under it live, plus a Skills leaf). Verify the eight acceptance checks from PAGE-BUILDER.md pass — empty state on first visit, `sales` prompt streams in <2s with the buffered-patch badge briefly visible, save → `/pages/:id` with no layout shift and no console errors, Edit ⇄ View round-trip has zero diff, sidebar updates live in-tab and across tabs, Skills approve flips status without manual reload, `pnpm --filter flow-agent-frontend typecheck` clean, `pnpm --filter flow-agent-frontend build` succeeds and `vite preview` of the build on `/pages/:id` reports no console errors and no layout-shift warnings (Lighthouse perf is not gated)'
