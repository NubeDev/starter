name: notes-prefs-i18n
goal: |
  Wire the existing prefs + i18n surface (PreferencesProvider, IntlProvider,
  SettingsPage, formatters) into examples/notes end-to-end through one
  Module-Federation extension (com.nube.hello). Prove that an Australian
  operator sees AU-formatted dates and BBQ °F across host chrome and a
  federated panel, that flipping language updates both in one render
  without a reload, and that the same flip propagates to a second tab.
  Ship the production-hardening cross-cuts (locale fallback, missing-key
  telemetry, BroadcastChannel multi-tab, dev catalog watcher, a11y live
  region, perf budget) plus three documentation deliverables so the
  contracts are the reference implementation every starter-based product
  copies. Canonical scope: examples/notes/user-pref.md. Platform rules:
  DOCS/user/scope/SCOPE.md R9 + DOCS/extensions/scope/SCOPE.md R11.

stages:
  - Stage 1 — Notes host adopts PreferencesProvider + IntlProvider, mounts SettingsPage, sets document.documentElement.lang from the resolved language, defines the loading contract; ship prefs-host.test.tsx asserting en-AU date + BBQ °F + html lang.
  - Stage 2 — Extend ExtensionHostManager singleton table with @nube/starter-ui-core/preferences and @nube/starter-ui-core/i18n; wire major-mismatch refusal + extension.singleton_mismatch telemetry; warn on minor drift via extension.singleton_minor_drift.
  - Stage 3 — Add useHostPrefs / useHostTranslate / useHostFormatters to @nube/starter-ext-sdk-ts, generate MessageKey type from catalog union, ship MockHostProvider testing helper; commit extension-prefs-singleton.test.tsx.
  - REVIEW — Confirm SDK hook surface, MessageKey codegen shape, and MockHostProvider API before com.nube.hello rewrites against them and downstream consumers depend on the signatures.
  - Stage 4 — Rewrite com.nube.hello/ui/remoteEntry.js init factory to declare the two new singletons, read prefs + IntlShape off the handle, render greeting (catalog), unread-count (ICU plural), AU-formatted date, and BBQ formatQuantity temperature.
  - Stage 5 — Add requires + contributes.i18n.catalogs to com.nube.hello/block.yaml, serve catalog files from the notes host, namespace keys by extension id, wire pnpm -w run check:i18n CI gate + extension.catalog_key_collision warning; lazy-load per active locale; commit extension-catalog-merge.test.tsx.
  - Stage 6 — Playwright spec au-operator.spec.ts covering single-tab language flip, °F→°C flip, html lang flip, second-tab BroadcastChannel propagation, axe-core clean.
  - REVIEW — Confirm cross-cut design (fallback chain truncation, BroadcastChannel channel name, telemetry event names, perf-budget thresholds) before the hardening pass touches the provider internals.
  - Stage 7 — Ship production cross-cuts (locale fallback chain D-NP.6, i18n.message_missing + i18n.locale_fallback telemetry, BroadcastChannel multi-tab, dev catalog watcher in vite plugin, render-budget Vitest, aria-live announcement) and three docs (DOCS/extensions/guides/i18n.md, DOCS/user/guides/prefs-in-extensions.md, hello README update).
