name: rubix-dashboards-goal-1
goal: |
  Light up rubix Goal 1 — operator-authored AND AI-authored dashboards
  end-to-end. Lands rubix-side dashboards_definitions PG storage,
  upstream starter-ui-bindings substrate fixes (6 gaps), rubix SDUI host
  glue (4 trait impls), 7 rubix.dashboard.* tool bodies, new
  @nube/starter-ui-sdui-react upstream package, dashboard-assistant flow
  with skill + tool wiring, /dashboards frontend routes, and a bundled
  disk-overview demo page. Five phases following the scope-file
  dependency graph at rubix/docs/scope/dashboards/README.md.

stages:
  - "phase A.1 — dashboards_definitions table + PgDashboardStore + authz registration — per rubix/docs/scope/dashboards/01-storage.md: add rubix-store-postgres/migrations/<NNNN>_dashboards_definitions/up.sql with the columns and pg_notify trigger; add rubix-store-postgres/src/dashboards/store.rs PgDashboardStore impl over a DashboardStore trait under rubix-spi/src/dashboard/store.rs (insert_revision, get_active, list_active, mark_superseded, history); register the page id as a ResourceSpec via starter-authz on every insert mirroring the goals-2-4-3 flow definitions wiring; add rubix-agent/src/boot/dashboards_seed.rs idempotent seeder mirroring boot/flows_seed.rs; integration test rubix-agent/tests/dashboards_definitions_test.rs covering insert/get/supersede/history; cargo test -p rubix-store-postgres -p rubix-spi -p rubix-agent green; commit feat(rubix-store-postgres+rubix-spi) dashboards_definitions + PgDashboardStore + authz registration"
  - "phase A.2 — bindings substrate fixes G1-G7 (seven commits) — per rubix/docs/scope/dashboards/02-bindings-gaps.md land six substrate gaps in starter-ui-bindings + starter-ui-ir as seven sequential commits sized to bisect cleanly: commit 1 feat(starter-ui-ir) per-variant Bindable trait adding visit_bindings impls for every Component variant (G1 part 1); commit 2 feat(starter-ui-bindings) substitute_tree dispatches through Bindable replacing the text/heading-only match (G1 part 2); commit 3 feat(starter-ui-bindings) qualifier grammar $target? optional and $target! required (G2); commit 4 feat(starter-ui-bindings) Repeat eval pushes synthetic $item source onto cursor stack (G3); commit 5 feat(starter-ui-ir) synthetic ids for Repeat children via Component::synthetic_id(parent_id index) helper (G4); commit 6 feat(starter-ui-ir) portable-subset flag per variant via const fn on each variant (G5); commit 7 feat(starter-ui-bindings+starter-ui-ir) $msg source with MessageBag threaded through EvalCtx (G6); tests in starter-ui-bindings/tests + starter-ui-ir/tests live with each commit; cargo test -p starter-ui-bindings -p starter-ui-ir green after every commit"
  - "REVIEW gate — Phase A landed — handover names A.1 commit + the 7 A.2 commits with per-commit test counts; confirm bindings substrate is sound by demonstrating one non-text-widget template (e.g. a chart's node_id = '{{$target}}' now resolves rather than rendering literally); wait before Phase B"
  - "phase B.1 — SDUI host glue four trait impls — per rubix/docs/scope/dashboards/03-host-glue.md: add rubix-agent/src/sdui/entity_graph.rs (~150 lines) RubixEntityGraph impls starter_ui_bindings::EntityGraph reading slots via the flow engine's slot-read seam; add rubix-agent/src/sdui/page_provider.rs (~120 lines) PgPageProvider impls starter_sdui_routes::PageProvider looking up page_ref via PgDashboardStore::get_active; add rubix-agent/src/sdui/query_engine.rs (~180 lines) RubixQueryEngine impls starter_sdui_routes::QueryEngine routing GET /table to ClickHouse via ChClient and PG via the existing pool; add rubix-agent/src/sdui/handler_registry.rs (~120 lines) RubixHandlerRegistry impls starter_sdui_routes::HandlerRegistry for POST /api/v1/ui/action dispatching every action into the tool registry; sibling tests under rubix-agent/tests/sdui_*_test.rs; cargo test -p rubix-agent green; commit feat(rubix-agent) SDUI host glue — four trait impls"
  - "phase B.2 — mount sdui_router under /api/v1/ui — add rubix-agent/src/boot/sdui.rs (~120 lines verb file) build_sdui_router(cfg pg_pool ch_client tool_registry) constructing the four trait impls and calling starter_sdui_routes::router; merge into rubix-agent/src/main.rs alongside the extensions and flow_events routers (one known merge point with the in-flight rubix-flow-live-tick-demo job — adjacent additions to main.rs not the same lines so second-to-merge rebases trivially); cargo test -p rubix-agent green; commit feat(rubix-agent) mount SDUI router under /api/v1/ui"
  - "REVIEW gate — Phase B landed — handover names two B commits + cargo test count + one operator-runnable manual flow (curl POST /api/v1/ui/resolve with a stub page_ref — pre-seed a row in dashboards_definitions via SQL — see a ComponentTree returned); wait before Phase C"
  - "phase C.1 — dashboard.get + dashboard.list reads — per rubix/docs/scope/dashboards/04-tools.md add DTOs in rubix-spi/src/dto/dashboard/{get list}.rs with utoipa ToSchema; fill rubix-tools/src/dashboard/{get list}.rs dispatching through PgDashboardStore; three MessageKeys (fetched listed get.not_found) in en + es catalogues same commit; sibling tests; cargo test -p rubix-tools -p rubix-spi green; commit feat(rubix-tools+rubix-spi) dashboard.get + dashboard.list"
  - "phase C.2 — dashboard.create + dashboard.update writes (reversible) — per 04-tools.md add DTOs and verb bodies in rubix-tools/src/dashboard/{create update}.rs; create.rs writes via PgDashboardStore::insert_revision and registers ResourceSpec via authz; update.rs takes expected_revision_id and returns rubix.dashboard.update.conflict Diagnostic on stale; both impl Reversible via starter-undo (create-reverses-as-delete update-reverses-as-prior-revision); four MessageKeys (created updated update.conflict create.duplicate_id) en + es same commit; sibling tests covering create→undo→delete and update→conflict-on-stale; cargo test green; commit feat(rubix-tools+rubix-spi) dashboard.create + dashboard.update"
  - "phase C.3 — dashboard.delete + dashboard.duplicate writes (reversible) — per 04-tools.md add DTOs and verb bodies; delete.rs supersedes every revision and refuses created_by=system with rubix.dashboard.delete.refused_system; duplicate.rs reads active revision of source and writes new (target_page_id fresh_revision_id) row with same body; both impl Reversible; four MessageKeys (deleted delete.refused_system duplicated duplicate.source_not_found) en + es same commit; sibling tests; cargo test green; commit feat(rubix-tools+rubix-spi) dashboard.delete + dashboard.duplicate"
  - "phase C.4 — dashboard.page_set runtime slot write — per 04-tools.md add DTO and verb body in rubix-tools/src/dashboard/page_set.rs mutating one slot on a live page via the same write chokepoint flows use (R2 one slot-write chokepoint); NOT a revision write — runtime slot mutation only; NOT Reversible (per SCOPE OQ-5 — operator reverts by setting slot back; document in design doc); one MessageKey (page_set.applied) en + es same commit; sibling test; cargo test green; commit feat(rubix-tools+rubix-spi) dashboard.page_set runtime slot write"
  - "phase C.5 — integration test + dispatch wiring — update rubix-tools/src/dashboard/mod.rs to export the seven verbs into the tool registry; update rubix-agent/src/boot/mcp/register.rs (or wherever tool registry assembly lives) to register the seven tools so they auto-surface as MCP tools per R7; add rubix-agent/tests/dashboard_crud_test.rs end-to-end against testcontainers PG covering create → get → update → conflict-on-stale → undo → delete → duplicate → list-with-filter → page_set; mirror goals-2-4-3 integration test shape; cargo test -p rubix-agent --test dashboard_crud_test green; commit test(rubix-agent) dashboard CRUD + page_set end-to-end"
  - "REVIEW gate — Phase C landed — handover names five C commits + total cargo test count + tools/list including the seven rubix.dashboard.* verbs as MCP tools + one operator-runnable manual flow (curl POST /api/v1/tools/rubix.dashboard.create with a tiny body → assert PG row → curl rubix.dashboard.list → see it → curl rubix.dashboard.update → see new revision → curl rubix.undo.last → see prior restored); wait before Phase D"
  - "phase D.1 — new @nube/starter-ui-sdui-react package — per rubix/docs/scope/dashboards/05-frontend-renderer.md create packages/starter-ui-sdui-react/ mirroring starter-ui-flow's shape: package.json (name @nube/starter-ui-sdui-react, peer-deps React 19 + @tanstack/react-query 5 + @nube/starter-ui-ir, depends on @nube/starter-client-ts workspace); tsconfig + vitest.config; src/index.ts barrel; src/sdui-page.tsx (~250 lines may split) consuming useSduiResolve + useSduiSubscriptions + useSduiAction all expecting a SduiTransport via context; src/transport/index.ts SduiTransport interface + HttpSduiTransport over StarterClient mirroring starter-ui-ai-builder/http.ts; src/renderer/ one verb file per IR variant (render-page render-grid render-kpi render-chart render-table render-form render-tabs render-select render-slider render-toggle render-date-range render-divider render-custom render-repeat) each ≤ 150 lines TS using starter-ui-kit primitives; src/provider/sdui-provider.tsx with SduiProvider context; sibling .test.tsx per render verb using msw or fetch-mock; add to pnpm-workspace.yaml; README.md present-tense covering mount + transport + renderer-per-variant; per SCOPE OQ-7 confirm @nube/starter-ui-ir is exposed as a TS package — if only Rust today add a small upstream addition (generated .d.ts or hand TS mirror) before consuming; pnpm --filter @nube/starter-ui-sdui-react typecheck + test green; commit feat(starter-ui-sdui-react) new package — SduiPage + per-variant renderers + transport seam"
  - "phase D.2 — frontend adoption + dashboard-assistant flow + bundled disk-overview demo — rewrite rubix-flows/flows/dashboard-assistant.yaml from the goal-1 stub into a real flow per 06-ai-builder.md (root ai-agent skill_hint=com.rubix.dashboard-builder allowed_tools=[rubix.dashboard.{create,update,get,list,duplicate,delete,page_set} rubix.undo.last]); delete rubix-tools/src/dashboard/assistant.rs goal-1 stub (the primary tool from the flow is now real); add rubix-flows/dashboards/disk-overview.json (~80 lines) bundled worked-example page with one kpi widget + one chart widget; seeded by boot/dashboards_seed.rs (created in A.1) into dashboards_definitions with created_by=system; add rubix-client-ts/src/endpoints/dashboard.ts mirroring flow_ops.ts; add rubix-client-react/src/hooks/dashboard.ts with useDashboardList/Get/Create/Update/Delete/Duplicate/PageSet under ['rubix','dashboard',...] query keys; add rubix-frontend/src/routes/dashboards/index.tsx list route + dashboards/$pageId.tsx detail route mounting <SduiPage page_ref={pageId}> with <SduiProvider transport={httpTransport(rubixClient)}>; replace rubix-frontend/src/routes/dashboard.tsx hand-coded stub with a redirect to /dashboards/disk-overview; mount <SduiProvider> once in main.tsx alongside <RubixClientProvider>; add Playwright spec rubix-frontend/e2e/dashboards.spec.ts (login → navigate /dashboards/disk-overview → assert kpi numeric value → assert chart renders → click time-range toggle → assert page_set lands); two MessageKey families dashboards.* + dashboard.{kpi,chart}.* in en + es same commit; pnpm typecheck + test + e2e green; commit feat(rubix-frontend+rubix-flows+rubix-client-ts+rubix-client-react) dashboard-assistant flow + /dashboards routes + bundled disk-overview + e2e"
  - "REVIEW gate — Phase D landed — handover names two D commits + total typecheck + e2e count + one operator-runnable manual flow (make start → log in → navigate /dashboards → see disk-overview listed → click it → see live kpi + chart → from Claude Desktop or curl drive the dashboard-assistant flow saying 'make me a page for cpu usage' → see new page appear in list → click it → see it render); wait before Phase E"
  - "phase E — promote scope to design docs + closing — promote each numbered scope file 01-06 to rubix/docs/design/sdui/<area>/README.md in present-tense (01→storage.md, 02→bindings.md, 03→host-glue.md, 04→tools.md, 05→renderer.md, 06→ai-builder.md); replace each promoted scope file with a one-line 'Promoted to docs/design/sdui/<area>/README.md' redirect (or delete if the design doc supersedes cleanly); 07-fetch-plan.md stays as v2 hand-off; 08-open-questions.md emptied as questions resolve (the codeless agent folds each answer into the relevant promoted design doc); add rubix/docs/design/sdui/README.md cross-linking the sub-docs; add rubix/docs/sessions/<today>-dashboards-goal-1-landed.md per-phase commit summary + operator-runnable manual flow + test counts; flip Goal 1 row in rubix/docs/scope/THIN-SLICE.md from stubbed to real with the evidence link; confirm with operator the PR shape is one PR off codeless/rubix-dashboards-goal-1 reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-dashboards-goal-1 with title feat(dashboards) Goal 1 end-to-end SDUI + AI builder + bindings substrate upstream and body summarising each phase; commit chore(docs) promote dashboards scope to design + close out Goal 1 + open PR"
