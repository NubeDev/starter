name: starter-skills
goal: |
  Ship the starter-skills crate that lives behind the existing
  SkillSelector seam in starter-flow-spi, per
  DOCS/agent/SKILLS.md. The crate turns a directory of SKILL.md
  bundles into a SkillRegistry with parse-once / no-templating
  loading, agent R4 content-hash quarantine (length-prefixed
  framing, exact CRLF/CR -> LF byte transforms on text files,
  no BOM handling), a load-path-determines-trust matrix where
  load_dir is approved-by-default and extend(...) is always
  quarantined, an ApprovalStore trait with append-mostly
  semantics (drift never mutates the store) and SQLite +
  Postgres + in-memory impls, an LlmSkillSelector with 2s
  hard timeout / no retries / fail-to-None graceful
  degradation plus a KeywordSkillSelector and FirstSkillSelector,
  on-mount content_hash verification by the ai-agent node so a
  concurrent reload() can never mount drifted resource bytes,
  v1-locked file:// resource URI scheme, wiring of
  contributes.skills through starter-ext-flow's existing
  adapter (specified in agent R-agent-4 but not yet
  implemented), and the two reference SKILL.md bundles that
  unblock ai-builder Phase 5. No new SPI crate, no new wire
  format, no new adapter; one crate, six smoke tests covering
  framing collision, line-ending stability, extension
  quarantine, hash-mismatch re-quarantine, resource-hash
  mismatch aborts the run, and select()-touches-no-store.

stages:
  - 'resolve the four open questions in DOCS/agent/SKILLS.md before any code lands — S-D1 approval CLI surface (out of scope for this crate; flag for starter-cli), S-D2 resource URI scheme (file:// only in v1; reject other schemes at load time), S-D3 model_hint semantics (best-effort pass-through to AiRunner; fall back to runner default and log on unknown model), S-D5 line-ending normalisation (keep agent R4 as specified; this crate implements R4 byte-for-byte without divergence — switching R4 to byte-exact is a separate agent-SCOPE-level edit). Record decisions in DOCS/agent/SKILLS.md under a new Decisions section with revisit triggers; do not edit the agent SCOPE itself in this stage'
  - 'REVIEW prerequisite decisions before any starter-skills code lands'
  - 'Phase 1 — crate skeleton + SKILL.md parser. Add starter-skills as a workspace member under crates/starter-skills with Cargo.toml depending only on starter-flow-spi + serde + serde_yaml + thiserror + async-trait + blake3 + tracing (no I/O crates yet; no tokio runtime dep beyond what async-trait needs). Implement the SKILL.md frontmatter parser with serde deny_unknown_fields covering id (validated via existing SkillId), description, allowed_tools (Vec<KindId>), model_hint (Option<String>), trust (Trust enum: Approved | Quarantined), resources (Vec<String> of relative paths). Implement bundle directory walker that loads SKILL.md + every listed resource into a parsed Bundle struct. Frontmatter parse error or missing SKILL.md fails load with a structured error naming the path; deny_unknown_fields catches unknown keys. Unit tests with fixture bundles cover happy path, deny_unknown_fields rejection, and missing-id rejection. No SkillRegistry yet — just the parser and Bundle type'
  - 'Phase 2 — content-hash algorithm + EXCLUDED list. Implement starter_skills::approval::hash_bundle(path) -> String per DOCS/agent/SKILLS.md R-skills-2: enumerate recursively, exclude paths matching .DS_Store, Thumbs.db, *.swp, *.swo, *~, anything under .git/, .idea/, __pycache__/ (the EXCLUDED list is pub const so additions go via PR). Normalise line endings on text files (extension in {.md, .txt, .json, .yaml, .yml, .toml}) by exactly two byte-level replacements applied in order: CRLF -> LF, then lone CR -> LF. No BOM stripping, no UTF-16 special-casing, no other transforms. Binary files (any extension not in the text set) hash as-is. Path separators normalised to / before sort and before hashing. Sort entries by relative path bytes lexicographic. For each entry, feed framed bytes into a single blake3 hasher: u64_le(path_byte_len) || path_bytes || u64_le(content_byte_len) || content_bytes. Hex-encode (lowercase) the 32-byte digest. Two property tests pin the algorithm: (a) the "Path framing prevents collision" smoke (bundle A with file a/b containing c vs bundle B with file a containing b/c produce different hashes) and (b) the "Line-ending normalisation is stable" smoke (a fixture committed once CRLF, once LF, once CR-only produces identical hashes). A third unit test pins a fixture-bundle hex digest so refactors cannot drift the algorithm silently'
  - 'Phase 3 — SkillRegistry + ApprovalStore trait + InMemoryApprovalStore. SkillRegistry::builder() returns SkillRegistryBuilder with with_approval_store(impl ApprovalStore), with_default_selector(impl SkillSelector) (optional), load_dir(&Path) (R-skills-3 row 1/2: approved-by-default unless frontmatter says trust: quarantined), load_dir_quarantined(&Path) (staging dirs: always quarantined regardless of frontmatter), extend(Vec<ContributedSkill>) (R-skills-3 row 3: always quarantined regardless of frontmatter), build() -> Result<SkillRegistry, LoadError>. Skill carries id, description, allowed_tools, model_hint, trust, body: Arc<str>, resources: Vec<ResourceRef> (uri: String, content_hash: String), bundle_hash: String. ResourceRef.uri is file:// only in v1; other schemes parse-fail at load time. Registry exposes list(), list_quarantined(), get(&SkillId), approve(&SkillId, &str, &Principal), revoke(&SkillId, &str, &Principal), reload(). ApprovalStore trait: record(ApprovalRow), lookup(&SkillId, &str), list(), revoke(&SkillId, &str) — append-mostly semantics, drift never mutates the store. InMemoryApprovalStore ships in starter-skills for tests. Two smoke tests pass: "Extension-contributed skill is quarantined regardless of frontmatter" (a SKILL.md with trust: approved contributed via extend appears in list_quarantined() and select returns None until approve() is called) and "Hash mismatch re-quarantines" (a skill is approved at H1, the bundle is edited, on reload the new hash H2 does not match the approval row so the bundle is quarantined again; the H1 row remains in ApprovalStore::list() but is inert)'
  - 'Phase 4 — LlmSkillSelector + KeywordSkillSelector + FirstSkillSelector + SkillRegistry impl SkillSelector. SkillRegistry implements the existing SkillSelector trait from starter-flow-spi: it filters quarantined bundles before delegating to the configured selector strategy. LlmSkillSelector wraps an AiRunner (Haiku by default; configurable) and makes one call against a deterministically-ordered list of (skill_id, description) pairs. Failure semantics are normative: 2 second hard timeout (configurable on the builder; 2s is the default), no retries, on timeout / 5xx / network error / parse error / unknown id return SkillSelection::None and increment skill_selector_failed_total{reason="..."} with a WARN-level structured log, emit one tracing span per outcome tagged with skill.selector.outcome and (on failure) skill.selector.reason. KeywordSkillSelector matches against description keywords deterministically with no LLM call. FirstSkillSelector picks the alphabetically-first matching skill (test fixture). The default selector strategy is LlmSkillSelector when an AiRunner is configured, KeywordSkillSelector otherwise. Engine integration: Engine::with_skill_selector(Arc::new(registry)) plugs the registry into the existing once-per-run selection path. Two smoke tests pass: "Selection is frozen per run" against the real registry (retarget the existing crates/starter-flow/tests/stage5_skill_threading.rs pattern at a registry-backed selector — same invariant: a flow with two ai-agent nodes sees the same SkillSelection across both even if the underlying bundle is edited between nodes) and "Quarantined skill never reaches the selector strategy" (a custom strategy wraps LlmSkillSelector and records every candidate passed in; with one approved + one quarantined skill the recorded set contains only the approved one regardless of LLM choice)'
  - 'Phase 4b — on-mount resource hash verification in the ai-agent node. Modify crates/starter-flow-nodes/src/ai_agent.rs so that when the node mounts skill resources (ResourceRef) at run time, it reads the resolved bytes from the file:// URI, blake3-hashes them, and compares against the frozen ResourceRef.content_hash. On mismatch the node fails the run with a typed SkillResourceHashMismatch error rather than mounting drifted bytes. This is load-bearing for the quarantine guarantee under concurrent reload(): in-flight runs keep their frozen SkillSelection but mount resources from disk — without the hash check, a reload() racing with an in-flight run would silently mount new bytes. Add the "Resource hash mismatch aborts the run" smoke test: start a flow with a skill whose resource has hash H1, edit the on-disk file between run-start and mount, verify the node aborts with SkillResourceHashMismatch and the error surfaces as a typed node failure in run telemetry; subsequent runs against the edited bundle see the new content_hash and proceed normally. Also add the "No I/O on select" smoke test: a registry built against a deliberately-broken ApprovalStore that panics on lookup still serves select(...) without touching the store (R-skills-8: approvals are cached at build time)'
  - 'REVIEW starter-skills core surface frozen — no additions or signature changes to SkillRegistry, ApprovalStore, the three selectors, or the ai-agent on-mount check past this point. The remaining phases (store impls, ext-flow wiring, reference skills) build on top; they must not feed back into core shape changes'
  - 'Phase 5 — SQLite + Postgres ApprovalStore impls in starter-store-sqlite and starter-store-postgres. One new table per store (skill_approvals) with columns matching ApprovalRow (skill_id TEXT, hash TEXT, approved_at INTEGER/TIMESTAMP, approved_by TEXT, primary key (skill_id, hash)). Each store crate gains a SkillApprovalStore type implementing the ApprovalStore trait from starter-skills behind a default-on skill-approvals feature so consumers who do not need skills do not pay for the table. Migrations land alongside existing RunStore / SessionStore migrations using the same conventions (numeric prefix, idempotent CREATE TABLE IF NOT EXISTS). Existing store smoke tests extended with one approval round-trip test per backend: record, lookup, list, revoke, lookup-after-revoke returns None. Process restart durability is implicit (it is just SQL); no special test needed beyond the round-trip'
  - 'Phase 6 — starter-ext-flow wires contributes.skills through SkillRegistry::extend(...). The contributes.skills field is specified in agent R-agent-4 (DOCS/agent/SCOPE.md) but is not yet wired in the starter-ext-flow adapter; this phase adds the wiring. When an extension manifest declares contributes.skills with a dir: path, the adapter walks the directory, parses each SKILL.md bundle, and passes them to SkillRegistry::extend(...) as ContributedSkill values — which means they land quarantined regardless of their frontmatter trust: field (R-skills-3). No new adapter, no new wire format; one new branch in the existing starter-ext-flow handler. An integration test stubs an extension manifest with contributes.skills, runs the adapter against a fixture extension dir, and asserts the loaded skills appear in registry.list_quarantined() and not in registry.list()'
  - 'Phase 7 — reference SKILL.md bundles for ai-builder Phase 5. Ship skills/starter.ai-builder.dashboards/SKILL.md and skills/starter.ai-builder.themes/SKILL.md under the workspace root (the host-binary skills dir; load_dir resolves them as approved-by-default per R-skills-3). Content lifted verbatim from DOCS/frontend/ai-builder/SCOPE.md "Skills for ai-builder" section. The two bundles unblock the ai-builder Phase 5 smoke ("Page-builder over MCP" and "Theme-builder reuses the editor transport") once the ai-builder crates exist; this job stops at landing the skill bundles, not at integrating them with ai-builder (that work lives in the ai-builder job). An integration test against the published starter-skills crate loads the workspace-root skills dir, asserts both skills parse, register as approved, and round-trip through select() given a matching query'
  - 'smoke tests — all six smoke tests from DOCS/agent/SKILLS.md pass in CI for the starter-skills crate, plus the additional ai-agent / engine smokes touched by Phase 4b: (1) Bundle hash is stable across line endings, (2) Extension-contributed skill is quarantined regardless of frontmatter, (3) Hash mismatch re-quarantines, (4) Selection is frozen per run (retargeted at a real registry-backed selector), (5) Quarantined skill never reaches the selector strategy, (6) No I/O on select, (7) Resource hash mismatch aborts the run, (8) Path framing prevents collision, (9) Line-ending normalisation is stable. Plus a dep-tree gate: cargo tree -p starter-skills --edges normal must not contain async-openai, anthropic-ai-sdk, anthropic-sdk, google-genai, aws-sdk-bedrockruntime, mistralai, or ollama-rs (provider SDK isolation per agent R2; LlmSkillSelector talks through AiRunner only). The dep-tree gate is a CI gate, not an after-the-fact audit'
