name: rubix-demo-wiring
goal: |
  Take the rubix backend from "all five thin-slice PRs are merged
  on master at `912667e` but the binary's `main.rs` discards the
  MCP router (literal `let _mcp_router = mcp.router;` at
  rubix/crates/rubix-agent/src/main.rs:55) and mounts no auth
  router" to "the six-step manual smoke in
  rubix/docs/scope/THIN-SLICE.md §Success criterion passes end to
  end, by hand, in under five minutes, against a real Postgres +
  ClickHouse running locally." Three blocks delivered as three PRs
  against the `codeless/rubix-demo-wiring` branch. Block A — binary
  wiring (mount MCP router, mount auth router, wrap tools router
  in authz gate, replace ad-hoc env vars with starter-config
  loader, thread ChClient through the tool registry, add changelog
  middleware). Block B — runtime dependencies (docker-compose.dev
  with Postgres + ClickHouse, rubix/dev/agent.toml sample config,
  four new mani tasks including `mani run demo` for first-boot).
  Block C — Claude Desktop MCP integration (rubix-admin mcp stdio
  subcommand, principal resolved from RUBIX_PRINCIPAL_EMAIL,
  dev/claude-desktop.example.json snippet, mcp_stdio_test
  integration test). Pre-answered decisions T1/T2/T3/T4/Q6 and the
  U1 MCP-locale + U3 FlowAsTool::from_registry contracts are
  locked in SCOPE.md §"What is already answered" — do NOT
  re-litigate. Do NOT redo anything from PR 27: the disk tool,
  alert_send, ClickHouse history write hook, per-tool REST handler,
  bootstrap_user verb, mcp_disk_test / rest_disk_test /
  cli_disk_test, and the EN+ES catalogue entries are already on
  master at 912667e — touching them creates conflicts. Three work
  stages, three REVIEW gates, strictly linear.

stages:
  - "stage 1 (block A, binary wiring) — close the four wiring gaps in rubix/crates/rubix-agent/src/main.rs that keep the six-step demo from working: (1) mount the MCP router by removing the `let _mcp_router = mcp.router;` line at main.rs:55 and instead `app = app.merge(mcp.router)` so the MCP HTTP surface is reachable under /api/v1/mcp (the curl path for Claude-Desktop-equivalent testing); (2) mount the auth router from `starter_auth_users::routes::auth_router(AuthState)` (verified shape at crates/starter-auth-users/src/routes/router.rs:46) using examples/authz-demo/src/main.rs as the exemplar — routes land under /api/v1/auth/{login,logout,refresh,me} per the auth_router contract; (3) wrap routes::tools::router in the starter-authz gate layer so unauthenticated calls return 401 and authenticated calls without the matching REQUIRED_PERMISSION return 403 — the authz_gate_test.rs integration test already exists and must start passing as the gate-was-mounted signal; (4) wire starter-config as the layered loader (defaults < file < env < flags) in a new rubix/crates/rubix-agent/src/boot/config.rs (verb file per FILE-LAYOUT, ~100 lines, returns a typed AgentConfig with RUBIX_BIND, DATABASE_URL, CLICKHOUSE_URL, RUBIX_SECRETS_PATH, RUBIX_CONFIG fields) and replace the std::env::var('RUBIX_BIND') site at main.rs:60 — default config file path is $XDG_CONFIG_HOME/rubix/agent.toml falling back to ~/.config/rubix/agent.toml; (5) thread starter-store-clickhouse::ChClient through registry::build_tool_registry by extending its signature to take `&ChClient` and passing it into DiskTool::new(ch_client) (the disk tool already writes history per commit 90facb5 but has no client wired); (6) add a changelog middleware at rubix/crates/rubix-agent/src/middleware/changelog.rs that writes one starter-changelog row per authenticated tool call via starter-changelog-postgres::PgChangelogStore (actor = principal, action = tool id, kind = 'tool.invoke', payload = redacted input); (7) update rubix/docs/design/agent/README.md to describe the new wiring shape in present tense (the document currently still says PR 3 unblocked stuff and discards-the-router phrasing — rewrite to reflect what main.rs actually does after this stage); each new file is verb-per-file (boot/config.rs, boot/auth.rs for AuthState construction, routes/auth.rs as a barrel re-exporting starter_auth_users::routes::auth_router with rubix-agent's AppState, middleware/changelog.rs, registry.rs extension) and stays under 400 lines; exit signals are `cargo build -p rubix-agent` green, `cargo test -p rubix-agent` green including authz_gate_test, a new `cargo test -p rubix-agent --test changelog_middleware_test` asserts one changelog row per authenticated tool call, main.rs does NOT contain `let _mcp_router` or any `let _ = router-typed-expression` form, the auth + tools (gated) + MCP routers are all merged into one axum::Router, `./rubix/scripts/lint-doc-refs.sh` clean, and the agent design doc is present-tense"

  - "REVIEW block A — confirm `grep -n 'let _mcp_router' rubix/crates/rubix-agent/src/main.rs` returns empty (the discard is gone); confirm `grep -nE '\\.merge\\(' rubix/crates/rubix-agent/src/main.rs` shows the MCP + auth + tools routers all merged; confirm an unauthenticated `curl -X POST http://127.0.0.1:8088/api/v1/tools/rubix.system.disk` against a running binary returns 401 (the authz_gate_test exercises this via the test harness — but eyeball the route definition to confirm the gate layer wraps the right router, not the whole app); confirm the changelog middleware writes exactly once per authenticated call (not duplicated across the tools router and the auth router); confirm boot::config::load follows defaults < file < env < flags precedence via a unit test in boot/config.rs; confirm starter-config is the only env-var read site outside of test code (grep main.rs for `std::env::var` — should be zero after this stage); confirm the design doc at docs/design/agent/README.md no longer contains 'PR 3', 'unblocked', or 'discards' wording; confirm `./rubix/scripts/lint-doc-refs.sh` is clean; confirm no rubix crate gained a direct `clickhouse =` Cargo.toml line (ChClient is pulled transitively through starter-store-clickhouse)"

  - "stage 2 (block B, runtime deps) — make `mani run run` work on a fresh dev machine that has only docker + cargo installed: (1) add rubix/docker/docker-compose.dev.yaml (matches the starter/docker/* convention seen in docker-compose.{clickhouse,garage,example}.yml) bringing up Postgres 16 on 127.0.0.1:5433 with database `rubix` + user `rubix` + password `rubix-dev`, ClickHouse on 127.0.0.1:8124 (HTTP) + 9001 (native) with default user + database `rubix`, named volumes so data persists across `docker compose down`, no other services (no mosquitto, no garage — keep this small); (2) add rubix/dev/agent.toml — a sample starter-config file matching the compose URLs above (DATABASE_URL=postgres://rubix:rubix-dev@127.0.0.1:5433/rubix, CLICKHOUSE_URL=http://127.0.0.1:8124, RUBIX_SECRETS_PATH=rubix/dev/secrets.age, RUBIX_BIND=127.0.0.1:8088), documented for the README as `cp rubix/dev/agent.toml ~/.config/rubix/agent.toml`; (3) extend rubix/mani.yaml with four new tasks — `dev-deps` (docker compose up -d), `dev-deps-down` (docker compose down), rewritten `run` (RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent), `bootstrap` (cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user --email op@example.com --password rubix-dev), and `demo` (aggregate: dev-deps then wait-for-healthy then bootstrap then run); (4) update rubix/README.md adding a `## Local demo` section that embeds the six-step bash from THIN-SLICE.md §Success criterion verbatim (boot, log in, curl tool, claude desktop, audit query, clickhouse query) plus the one-line `mani run demo` setup; (5) the wait-for-healthy step in the demo task uses a simple loop polling 127.0.0.1:5433 + 127.0.0.1:8124 with a 30s ceiling (no docker-compose healthcheck-watcher dependency) — write the loop as a tiny shell script at rubix/scripts/wait-for-deps.sh; exit signals are `mani run dev-deps` brings up Postgres + ClickHouse with no manual `docker pull` or config edit (the human will smoke-test, codeless verifies the compose file parses via `docker compose -f rubix/docker/docker-compose.dev.yaml config`), `mani run bootstrap` is idempotent (second run exit 0; assert via integration test in tests/bootstrap_user_test.rs if not already), `mani run demo` lists in `mani list tasks`, the rubix/dev/agent.toml parses cleanly via boot::config::load (covered by Block A's config test), and the README Local demo section is the verbatim six-step bash from THIN-SLICE.md plus the `mani run demo` line"

  - "REVIEW block B — confirm `docker compose -f rubix/docker/docker-compose.dev.yaml config` exits 0 (the compose file is valid); confirm Postgres + ClickHouse are pinned to specific image tags (postgres:16-alpine and clickhouse/clickhouse-server:24.x or similar — do NOT use `latest` which makes future re-runs unreproducible); confirm the named volumes are namespaced so they don't collide with other docker-compose files on the dev host (e.g. `rubix-dev-postgres-data`, not `postgres-data`); confirm rubix/dev/agent.toml has no secrets-in-cleartext beyond the dev-only `rubix-dev` password (which is fine for a local-only sample); confirm the four new mani tasks appear in `mani list tasks` output; confirm `mani run demo` is genuinely idempotent — a second invocation finds containers already running, bootstrap finds user already exists, agent boots normally; confirm the README Local demo bash matches THIN-SLICE.md §Success criterion verbatim (diff them — any drift means one of the two docs is wrong); confirm `./rubix/scripts/lint-doc-refs.sh` is clean"

  - "stage 3 (block C, Claude Desktop MCP) — wire stdio MCP so Claude Desktop can launch rubix as a child process: (1) add rubix/crates/rubix-agent/src/bin/rubix_admin/mcp/serve.rs (verb file per FILE-LAYOUT; the existing rubix_admin already has system/disk.rs + bootstrap_user.rs so the bin/rubix_admin/ tree is established) that runs starter-mcp's stdio loop wrapping the SAME FlowAsTool registry that Block A's HTTP MCP router uses — do NOT reimplement framing (starter-mcp owns the stdio framing per starter-jsonrpc-stdio); the registry composition lives in a shared boot::mcp::build_mcp_surface() that both HTTP and stdio call; (2) register the `mcp` subcommand in rubix/crates/rubix-agent/src/bin/rubix_admin/main.rs alongside the existing `bootstrap-user` and `system disk` subcommands using clap; (3) authentication in stdio MCP — there is no HTTP session, so read RUBIX_PRINCIPAL_EMAIL from the process env at startup, look up the user via starter-auth-users::PgUserStore against the same Postgres the HTTP path uses, fail with a clear localised Diagnostic if the user doesn't exist or is disabled (no panic; exit code 1, message via stderr — stdout is reserved for MCP framing); the resolved principal is the actor for every changelog row written during the stdio session; (4) locale on stdio MCP — primary source is per-call `params._meta.acceptLanguage` per the U1 contract, fallback is the LANG env var read at process startup, final fallback `en` (matches the HTTP path's cascade); update docs/design/i18n-prefs/README.md only if the stdio fallback shape (LANG → _meta.acceptLanguage → en) needs to be added to the locale-source list — it does (today the doc covers HTTP + CLI but stdio MCP is a third path); (5) add rubix/dev/claude-desktop.example.json — a snippet the operator pastes into their claude_desktop_config.json's `mcpServers` block, names the env vars (RUBIX_CONFIG, RUBIX_PRINCIPAL_EMAIL), the launch command (cargo run --bin rubix-admin -- mcp or the built path), and a one-line description; (6) add one mani task `mcp-stdio` to rubix/mani.yaml for ad-hoc local testing (RUBIX_PRINCIPAL_EMAIL=op@example.com cargo run -p rubix-agent --bin rubix-admin -- mcp); (7) add an integration test at rubix/crates/rubix-agent/tests/mcp_stdio_test.rs that spawns rubix-admin mcp as a subprocess via tokio::process::Command, writes a tools/list JSON-RPC frame then a tools/call frame for com.rubix.scheduled-system-check with params._meta.acceptLanguage es-AR, reads the response from stdout, asserts Spanish output with America/Argentina/Buenos_Aires timezone — the test uses RUBIX_PRINCIPAL_EMAIL pointing at a fixture user inserted via a testcontainers-pattern Postgres setup; exit signals are rubix-admin mcp responds to tools/list listing com.rubix.scheduled-system-check, the new mcp_stdio_test passes for both en-US and es-AR _meta.acceptLanguage values, RUBIX_PRINCIPAL_EMAIL=missing@example.com rubix-admin mcp exits non-zero with a localised error on stderr (no panic), rubix/dev/claude-desktop.example.json is valid JSON (parses via `python3 -m json.tool`), the agent design doc and i18n-prefs doc both document the stdio path, and `./rubix/scripts/lint-doc-refs.sh` is clean"

  - "REVIEW block C — confirm rubix-admin mcp is in the clap subcommand list (run `cargo run -p rubix-agent --bin rubix-admin -- --help` and grep the output); confirm the stdio loop uses starter-mcp's framing not a hand-rolled JSON-RPC layer (grep src/bin/rubix_admin/mcp/serve.rs for `starter_mcp` imports — should be there; for `serde_json::to_string + stdout.write_all` ad-hoc framing — should NOT be there); confirm the HTTP MCP path and stdio MCP path share boot::mcp::build_mcp_surface (one composition, two transports); confirm `RUBIX_PRINCIPAL_EMAIL=missing@example.com rubix-admin mcp </dev/null` exits non-zero with a stderr message that contains a localised string (not a Rust panic stack); confirm stdout produces NO output before stdin is read (stdout is sacred for MCP framing — anything else corrupts the JSON-RPC stream); confirm dev/claude-desktop.example.json parses; confirm the mcp_stdio_test cleanly tears down the subprocess (no zombie processes after the test); confirm docs/design/i18n-prefs/README.md now lists three transport paths in the locale-source section (HTTP / CLI / stdio MCP) with the stdio fallback cascade documented; confirm `./rubix/scripts/lint-doc-refs.sh` is clean; confirm the six-step manual smoke in THIN-SLICE.md §Success criterion is now genuinely runnable end-to-end (boot via `mani run demo`, log in via the auth route mounted in Block A, curl the tool via the gated route, connect Claude Desktop via the stdio MCP launched by this block, query changelog via psql, query system_disk_history via clickhouse-client) — document this in the PR description with the exact commands so the human can copy-paste"
