name: starter-flow-engine
goal: |
  Land Phase 2 of DOCS/flow/scope/SCOPE.md — the starter-flow engine
  in full, in-memory stores only. After this job: an in-memory
  GraphStore impl with a single write_slot chokepoint (R2), the
  synchronous tokio slot propagator (R2 + the rubix live_wire model),
  NodeKindRegistry + FlowRegistry, the engine state machine
  (Starting through Stopped per R12), per-flow Cancel plumbing,
  FlowEvent stream, and two built-in node kinds — transform and
  tool-call — implemented in starter-flow-nodes behind their existing
  cargo features. D1 is locked at stage 1 (recommended default:
  starter-flow-node-loop — leaner LLM-loop over adk-rust), but the
  ai-agent kind body remains Phase 4 work; this job only depends on
  the decision so the engine can be built knowing which side wins.
  Persistence (FlowStore / RunStore / SessionStore impls in
  starter-store-sqlite) is Phase 3. Surfaces (FlowAsTool /
  FlowAsService) are Phase 3. Remaining built-in kinds are Phase 5.
  ai-agent body is Phase 4. The Phase 2 exit criteria — the two
  SCOPE Smoke tests "One write chokepoint" and "Engine is reader of
  policies" pass green, and the workspace-builds-without-adk-rust
  baseline still matches.

stages:
  - 'stage 1 — lock D1 (adk-rust vs lifted Codeless Runner for the future ai-agent node kind body) at the Phase 2 entry gate, per the flow SCOPE Open-questions block. Default-bias is option (b) starter-flow-node-loop — lift Codeless''s Runner shape, route LLM calls through AiRunner, keep adk-rust out of the workspace dep tree. Record the decision under SCOPE.md "Decisions" with the rule it derives from (flow SCOPE R7 the AI agent is a node kind, not a runtime) and the revisit trigger (a consumer surfaces a hard need for adk-rust planner heuristics that codeless and rubix do not provide). Lock the cycle-bound budget defaults from flow SCOPE R1 — max_propagation_hops = 1000, idempotent-write short-circuit on, both overridable at FlowRunner::start. Lock the in-memory store shape for Phase 2 — std::collections + tokio::sync::RwLock + tokio::sync::broadcast for SubscriptionStream; explicitly note that the sqlite impls land in Phase 3 and Phase 2 does not pre-decide their shape beyond the GraphStore trait contract. Lock the FlowEvent stream cardinality — one stream per FlowRun, broadcast::Sender on the run handle, multi-consumer per-subscriber semantics. No code in this stage; SCOPE.md "Decisions" filled in for all four items; the closing-trio runs commit-only on the docs change.'
  - 'REVIEW Phase 2 entry-gate decisions — D1 locked, cycle budget defaults locked, in-memory store substrate locked, FlowEvent stream cardinality locked. The next stage lands the GraphStore impl which depends on the substrate decision; do not advance until the gate passes.'
  - 'stage 3 — in-memory GraphStore impl in crates/starter-flow/src/graph.rs. Single struct InMemoryGraphStore wrapping a tokio::sync::RwLock over a BTreeMap of NodeId to Node for node storage and a tokio::sync::broadcast::Sender of GraphEvent for the change stream. Implement starter_flow_spi::GraphStore for it — write_slot is the single chokepoint per R2; read_slot is a snapshot read; subscribe returns a SubscriptionStream backed by a broadcast::Receiver wrapped in a BroadcastStream. write_slot enforces R2 replay semantics — when WriteSlotOpts.replay equals true the propagator-facing SlotChanged event is NOT published (the safe-state R12 path is a separate code path and DOES publish; both flags are visible in the per-write tracing span). write_slot also performs the R3 idempotent-write short-circuit — if the new SlotValue equals the prior value, no SlotChanged is emitted (configurable per-write via WriteSlotOpts.force which defaults to false). Every write opens a span on write_slot and records (node_id, slot_name, replay_flag, force_flag, prev_was_equal). Unit tests cover single-writer flow producing one SlotChanged, replay-flag path producing zero SlotChanged, idempotent-write short-circuit, force=true defeats the short-circuit, and subscribe sees writes after subscribe but never before. cargo test for starter-flow green; clippy warnings-as-errors green.'
  - 'stage 4 — slot propagator in crates/starter-flow/src/propagator.rs. Synchronous tokio loop driven from a spawned task that subscribes to GraphStore::subscribe and fans values downstream along outbound Links. The propagator owns the per-run propagation budget — increments the per-run epoch on every hop; on exceed marks the run Failed with reason cycle-budget-exhausted and emits FlowEvent::RunFailed. The propagator never owns slot data; it only schedules NodeBehavior::invoke calls and writes their outputs through GraphStore::write_slot — the chokepoint stays single. Two propagator policies are exposed — max_propagation_hops (default 1000, overridable per FlowRunner::start call) and the idempotent-write short-circuit hooked from stage 3. Cancel-token integration — every NodeBehavior::invoke is called with the run''s Cancel token; a fired Cancel stops the propagator from scheduling further hops within a few hundred ms. Unit tests cover linear three-node chain propagates end-to-end, a one-cycle graph terminates on the idempotent short-circuit, a forced-no-shortcut cycle terminates on max_propagation_hops, and a fired Cancel mid-run stops scheduling. cargo test for starter-flow green.'
  - 'stage 5 — NodeKindRegistry and FlowRegistry in crates/starter-flow/src/registry.rs. NodeKindRegistry is keyed on KindId, stores Arc of dyn NodeBehavior + Send + Sync, refuses duplicate registrations under R10 namespace ownership (the reserved starter.flow.* prefix is registry-enforced — only the host''s own register_builtin path may use it). FlowRegistry stores FlowId to FlowRevisionId to flow definition (a thin in-memory Vec for Phase 2; the real persistence lands in Phase 3 alongside FlowStore). Both registries are tokio::sync::RwLock-protected. Unit tests cover registering a kind under the reserved prefix from outside the host path is refused, duplicate KindId registration is refused, lookup-after-register succeeds, lookup-after-deregister fails, and FlowRegistry holds multiple revisions per FlowId returning the right one on lookup-by-revision.'
  - 'stage 6 — engine state machine in crates/starter-flow/src/engine.rs per R12. Type-state enum EngineState — Starting, Running, Pausing, Paused, Resuming, Stopping, Stopped — with the SCOPE-mandated transition matrix; pub struct Engine owns the GraphStore, the propagator handle, both registries, and a tokio::sync::watch::Sender of EngineState. Engine::start drives Starting to Running; Engine::stop drives Running to Stopping to Stopped (R12 graceful — stop accepting new triggers, finish in-flight, drive writable outputs to safe state, exit). Engine::pause drives Running to Pausing to Paused; resume drives Paused to Resuming to Running. Every transition logs at info-level and emits a span. SIGTERM handling is documented but NOT wired in this crate — that is a bin-level concern; the engine exposes the API the bin will hook. Unit tests cover a state-machine transition table test (every legal transition succeeds, every illegal transition returns a typed error), and engine.stop walks IsWritable nodes and writes safe-state values per R12 (test uses a fake writable node kind that records its safe-state write).'
  - 'stage 7 — run lifecycle in crates/starter-flow/src/run.rs and engine-typed RunState in crates/starter-flow/src/state.rs per R6. Per-run state — RunId, current FlowRevisionId, in-flight slot writes, propagation queue snapshot, per-run epoch counter, FlowEvent broadcast::Sender (cardinality locked in stage 1), Cancel token. FlowRunner::start (flow, input) — runs the SkillSelector hook ONCE per outer run (R7''s outer-run binding rule, even though ai-agent body is Phase 4 — the seam is wired now so Phase 4 doesn''t have to retro-fit it), threads SkillSelection through the run as Arc, kicks the propagator. RunStore is a trait seam only in Phase 2 — the in-memory impl is a Vec of RunState for tests; the sqlite impl lands in Phase 3 per the flow SCOPE Phase 3 block. Unit tests cover a successful run emits RunStarted then NodeStarted+ then NodeEmitted+ then RunCompleted, a cancelled run emits RunCancelled within bounded time, a cycle-exhausted run emits RunFailed with reason cycle-budget-exhausted, and the skill-selection hook is called exactly once per FlowRunner::start.'
  - 'REVIEW engine-side complete, before node-kind bodies — confirm the GraphStore + propagator + registries + engine + run lifecycle compose end-to-end on the two-node smoke (a transform node feeding a downstream node); confirm no API hot-spots regret. The next two stages add the first NodeBehavior impls and the SCOPE Smoke tests; locking the engine API here means the node-kind authors don''t have to chase a moving target.'
  - 'stage 9 — transform node-kind body in crates/starter-flow-nodes/src/transform.rs behind the existing transform feature. NodeBehavior::invoke reads its input slot, applies a pure function declared at config-slot config.fn (a closure / function name / inline rhai expression — the exact transform language is a stage-1 sub-decision; default Rust-closure stored in registry registration shim if rhai is heavy), writes the result to its output slot through GraphStore::write_slot (NEVER bypassing the chokepoint per R2). Stateless per R5 — uses &self. Unit tests cover identity transform emits input verbatim on output, arithmetic transform sums two input slots into one output slot, and transform that panics surfaces as FlowEvent::NodeFailed.'
  - 'stage 10 — tool-call node-kind body in crates/starter-flow-nodes/src/tool_call.rs behind the existing tool-call feature. NodeBehavior::invoke reads tool-name from a config slot (the KindId-validated tool id per R8), reads tool-input-json from its input slot, looks up the Tool in the host-provided starter_spi::ToolRegistry (passed in via engine construction — same registry starter-mcp serves per R8 / R9), invokes the tool with the run''s Principal + Cancel + EventSink the engine threads through, writes the tool''s result JSON to the output slot through the GraphStore chokepoint. The auth check is applied by the adapter not by the node body per extensions R13 — this crate trusts the Principal it receives. Unit tests use a MockTool in the registry, cover successful tool invocation propagates output, a tool that returns a typed error surfaces as FlowEvent::NodeFailed, and a Cancel firing mid-invocation cancels the tool call.'
  - 'stage 11 — Phase 2 SCOPE smoke tests in crates/smoke-tests/. Test 1 — One write chokepoint — three writers (a thin REST-style handler stub, a CLI-style synchronous call, an internal propagator tick) all enter GraphStore::write_slot for the same NodeId/slot; tracing shows exactly three spans on write_slot; the propagator emits exactly three SlotChanged events; if any writer bypasses the chokepoint the test fails. Test 2 — Engine is reader of policies — build a flow with a writable output node (a fake kind that records writes) carrying safe_state fail-safe(0) and another with safe_state hold-last; Engine::stop is called; observe via subscribe that both outputs receive the engine-driven write to their declared safe state; assert that no code path in starter-flow contains a hardcoded policy registry — a grep test on the crate''s src/ for the policy slot names returns hits only inside R3-citing doc comments, never in match arms. cargo test for smoke-tests with flow feature green.'
  - 'stage 12 — workspace verify and dep-tree gates. cargo build workspace all-features green; cargo clippy workspace all-targets warnings-as-errors green; cargo fmt check green. cargo tree for starter-flow-spi matches DOCS/flow/scope/starter-flow-spi-deps.baseline.txt byte-for-byte — the Phase 1 baseline must not regress under Phase 2''s engine landing in a sibling crate. cargo tree for starter-flow contains no adk-rust entry — D1 locked toward (b) means the workspace-builds-without-adk-rust smoke stays green; if a future stage somehow pulls adk-rust into the tree, this gate catches it. cargo tree for starter-flow-nodes contains no adk-rust entry (the ai-agent feature is OFF for the cargo tree check; this matches Phase 4''s later gate). Confirm R1 through R5 hold structurally — no tokio::process anywhere outside any whitelisted host adapter; the engine and the two node kinds depend only on starter-flow-spi + starter-spi + tokio; no path-dep to starter-mcp / starter-server / starter-cli appears under cargo tree for any of the four flow crates.'
