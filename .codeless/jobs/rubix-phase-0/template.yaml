name: rubix-phase-0
goal: |
  Lay the rubix tree and write the load-bearing design docs that every
  subsequent rubix phase depends on, per rubix/SCOPE.md Phase 0. After
  this job a contributor walks into rubix/ and finds the full crate
  skeleton (contracts/spi, agent/crates/{graph,engine,kinds-registry},
  agent-sdk, agent-client-rs, agent-client-ts, agent-client-dart,
  ui-kit, ui-core, extension-ui-sdk, studio, desktop), an empty but
  valid Cargo workspace plus npm/pnpm workspace for the TS side, a
  mani.yaml that builds and lints across both, testcontainer-Postgres
  and testcontainer-ClickHouse fixtures wired through the existing
  starter-store-* testing seams, and the eight load-bearing design
  docs (OVERVIEW, EVERYTHING-AS-NODE, NODE-AUTHORING, KIND-MANIFEST,
  AUTH, MIGRATIONS, TESTS, VERSIONING). No domain logic, no kinds,
  no Studio pages — phase 0 is gate-writing only. Phases 1-5 each
  become their own follow-up jobs after this lands.

stages:
  - "stage 1 — layout, workspace wiring, mani task surface: create rubix/contracts/spi (empty Rust crate depending only on starter-spi via path-dep, with a lib.rs reserving the module slots KindManifest/Msg/slot_schema/dto/artifacts even if each is just an empty pub mod), rubix/agent/crates/{graph,engine,kinds-registry} (empty crates with one-line lib.rs each, path-dep on rubix-spi), rubix/agent/crates/apps/agent (empty bin crate that compiles a single fn main that prints rubix-agent vX.Y.Z and exits 0), rubix/agent-sdk (empty crate path-deps spi only), rubix/agent-client-rs (empty crate path-deps spi only), rubix/agent-client-ts (empty package.json with workspaces stub), rubix/agent-client-dart (empty pubspec.yaml skeleton), rubix/ui-kit (empty package.json), rubix/ui-core (empty package.json), rubix/extension-ui-sdk (empty package.json), rubix/studio (empty package.json + Tauri shell stub directories under src-tauri), rubix/desktop (empty package.json reserved for the shared Tauri shell); add every new Rust crate to the workspace root Cargo.toml members list; create rubix/pnpm-workspace.yaml listing the TS packages; create rubix/mani.yaml with build/test/lint/status tasks that target the rubix subtree (lint task runs a 400-line-per-file check per R1, fails on any file over 400 lines so future phases cannot regress); confirm cargo build --workspace green from the starter repo root with the new crates included; confirm pnpm install at rubix/ resolves; confirm mani run build --all green; do NOT add any production logic — every empty crate has exactly one lib.rs (or main.rs) and a Cargo.toml/package.json"
  - "REVIEW stage 1 — confirm all skeleton crates and packages compile/install green, confirm workspace membership is in starter root Cargo.toml not in a parallel one (R0 — rubix is a consumer of starter, lives in the same workspace), confirm mani.yaml's lint task actually catches a 401-line synthetic violator file added under a fixture path then removed, confirm pnpm workspace links the TS packages so a cross-package import resolves (extension-ui-sdk depends on ui-core works via workspace:* even though both are empty)"
  - "stage 2 — testcontainer fixtures + CI smoke: wire rubix/agent/crates/data-postgres as an empty crate that path-deps starter-store-postgres with the testing feature enabled in its dev-dependencies, wire rubix/agent/crates/data-clickhouse as an empty crate that path-deps starter-store-clickhouse with the testing feature enabled in its dev-dependencies; land one integration test per crate that opens a testcontainer (Postgres or ClickHouse via the existing starter testing::with_database / equivalent seam), executes a no-op query (SELECT 1 / equivalent), and asserts success — this is the smoke that proves the testing seam composes correctly into rubix even with no schema; add the data-* crates to the workspace; confirm cargo test -p rubix-data-postgres -- --ignored is green against a running docker postgres (the existing starter convention is #[ignore] for testcontainer-touching tests); confirm cargo test -p rubix-data-clickhouse -- --ignored is green against a running docker clickhouse; document the docker-compose-or-equivalent prerequisites in rubix/docs/testing/SETUP.md so a contributor can boot the prerequisites in one command"
  - "stage 3 — the eight load-bearing design docs (Phase 0's main deliverable per the source SCOPE): write rubix/docs/design/OVERVIEW.md covering the repo map and dependency arrows (Rust + TS) lifted directly from the source SCOPE so the doc is the canonical reference contributors hit first; write rubix/docs/design/EVERYTHING-AS-NODE.md covering R2 in full with concrete examples (devices/points/schedules/alarms/histories/users/flows/dashboards as nodes; request-scoped locks/caches/pools/buffers as NOT nodes; the load-bearing 'who outside this subsystem would benefit from reading this?' test); write rubix/docs/design/NODE-AUTHORING.md covering how a contributor writes a NodeBehavior — manifest shape, slot writes, propagator interaction, FSM placement — referencing starter-flow-spi types where appropriate; write rubix/docs/design/KIND-MANIFEST.md covering the manifest schema in detail (kind id, version, slot schema, facets, permissions, capabilities, containment rules, placement_allowed) and the manifest's versioning semantics per R10; write rubix/docs/design/AUTH.md covering session, JWT, and Zitadel hookup — how Studio→agent auth flows and how starter-authz Phase 7 tenants/teams compose with rubix's domain ACLs; write rubix/docs/design/MIGRATIONS.md covering the platform/product split for migrations (starter-store-* owns its schemas, rubix's data-postgres owns rubix-specific tables, migration order at agent boot, the rule against cross-tree foreign keys); write rubix/docs/design/TESTS.md covering R11 — tests-with-code rule, the testcontainers convention with #[ignore], the in-memory paths for unit tests, the contract-test pattern for SPI conformance; write rubix/docs/design/VERSIONING.md covering R10 add-only-within-a-major in full with the breaking-change taxonomy from later sections of the SCOPE; each doc cites the source SCOPE rule numbers it expands on, each is under 400 lines per R1; confirm a contributor reading just these eight docs has enough to start Phase 1 without consulting the SCOPE.md itself"
  - REVIEW stage 3 — read each of the eight docs, confirm each is under 400 lines, confirm each cites the source SCOPE rules it expands on, confirm the dependency arrow doc in OVERVIEW matches the actual workspace Cargo.toml + pnpm-workspace.yaml (drift here is the Phase 1 contributor's first pothole), confirm AUTH.md and MIGRATIONS.md are the two Phase 1 entry-gate docs the source SCOPE names — they need to be most-complete because Phase 1 starts immediately against them