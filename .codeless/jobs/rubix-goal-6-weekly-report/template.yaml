name: rubix-goal-6-weekly-report
goal: |
  Light up Goal 6 (weekly-report) end-to-end. Implements the missing
  upstream durable cron scheduler in starter first (starter-cron crate +
  scheduled_flows PG table + FlowAsService schedule trigger), then wires
  rubix's analytics.query (named CH templates) + analytics.report
  (rendered via starter-export, persisted via starter-blob-fs), then
  replaces the WeeklyReportStub with a real scheduled flow that runs
  weekly and produces an HTML report blob. After this job: 5 of 6 SCOPE
  goals real; cron primitive available for every future scheduled flow;
  analytics + blob primitives wired as worked examples.

stages:
  - "phase A.1 — starter-cron crate — add crates/starter-cron/ with Cargo.toml depending on the cron crate from crates.io, time, thiserror; src/lib.rs barrel; src/next_fire.rs ~80 lines exposing pub fn next_fire(now: DateTime<Utc>, expr: &str) -> Result<DateTime<Utc>, CronError>; src/error.rs CronError enum (Parse, Past); unit tests at tests/next_fire_test.rs covering weekly cron, every-15-minutes cron, business-hours cron, and a malformed-expression error path (4 cases); cargo test -p starter-cron green; commit feat(starter-cron) cron parser + next_fire"
  - "phase A.2 — scheduled_flows PG migration — add crates/starter-store-postgres/migrations/<NNNN>_scheduled_flows.sql with the columns listed in SCOPE Phase A (id ULID PK, tenant_id, flow_id, cron_expr, next_run_at, last_run_at, last_run_status, last_run_message, enabled, created_at, created_by, UNIQUE on (tenant_id, flow_id)); add a pg_notify trigger on starter_scheduled_flows channel for INSERT and UPDATE of next_run_at / enabled; integration test under testcontainers asserts the trigger fires; commit feat(starter-store-postgres) scheduled_flows table + notify"
  - "phase A.3 — starter-flow-nodes trigger_schedule body — fill the 23-line stub at crates/starter-flow-nodes/src/trigger_schedule.rs with a real NodeBehavior impl that reads cron_expr from the node config and exposes it via the node's output slot for FlowAsService to pick up; this is a passive entry node — the actual firing comes from Phase B's tick; add tests/trigger_schedule_test.rs that registers the kind, runs a tiny flow rooted at trigger_schedule with a config carrying cron_expr=0 0 * * 0, asserts the slot exposes the expression unmodified; commit feat(starter-flow-nodes) trigger_schedule behavior"
  - "REVIEW gate — Phase A landed — handover lists the three Phase A commits with cargo test counts, confirms starter-cron parses all four test cron forms, confirms migration applies cleanly on testcontainers PG, confirms trigger_schedule no longer errors when invoked; present SCOPE OQ-1 evidence (whether starter-cron survived as a separate crate or was folded into starter-flow-spi); wait for confirmation before Phase B"
  - "phase B.1 — FlowAsService scaffold — add crates/starter-flow-surfaces/src/service.rs (~250 lines verb file) with FlowAsService struct holding Pool<Postgres> + Arc<FlowRegistry> + Arc<dyn FlowRunner> + Arc<dyn Clock>; add a Clock trait under src/clock.rs (~50 lines) with SystemClock + TestClock impls so the tick is deterministic in tests; expose register_schedule(tenant_id, flow_id, cron_expr) and unregister_schedule(tenant_id, flow_id); both methods write to scheduled_flows + emit pg_notify; unit tests at tests/clock_test.rs and tests/register_test.rs against testcontainers PG; commit feat(starter-flow-surfaces) FlowAsService register/unregister + Clock"
  - "phase B.2 — FlowAsService tick — add the tick() method to service.rs that runs every 60s, claims due rows via SELECT FOR UPDATE SKIP LOCKED LIMIT 32, dispatches each via FlowRunner::run, writes last_run_at + last_run_status + last_run_message, recomputes next_run_at via starter_cron::next_fire; add start(self) -> JoinHandle<()> spawning the tick loop; integration test tests/scheduled_flows_tick_test.rs against testcontainers PG with TestClock advancing 2 minutes, asserts two fires; commit feat(starter-flow-surfaces) tick + start"
  - "REVIEW gate — Phase B landed — handover names the two Phase B commits, shows tick test green with TestClock determinism, confirms SELECT FOR UPDATE SKIP LOCKED is correctly used (so multi-instance safe), confirms the 60s default is configurable via a constructor option; wait for confirmation before Phase C"
  - "phase C.1 — analytics.query verb + templates — implement rubix/crates/rubix-tools/src/analytics/query.rs as AnalyticsQueryTool taking { name, params } input, looking up a named template via include_dir!(./templates), binding params using ClickHouse {name:Type} syntax, running against the ChClient already threaded through tool registry; ship six templates under rubix-tools/src/analytics/templates/ per SCOPE Phase C (disk_history_weekly, alert_count_weekly, flow_run_summary_weekly, user_activity_weekly, clickhouse_writes_weekly, undo_count_weekly); add three MessageKeys (query.ran, query.unknown_template, query.bind_error) to en.json + es.json same commit; sibling integration test asserts each template runs against testcontainers CH with synthetic data; commit feat(rubix-tools) analytics.query + 6 named templates"
  - "phase C.2 — analytics.report verb — implement rubix/crates/rubix-tools/src/analytics/report.rs as AnalyticsReportTool taking { template, queries: [...], format } input, runs each named query via the dispatch registry, hands rows to starter-export per format (html / csv / json; pdf returns format_unsupported MessageKey), writes rendered bytes to starter-blob-fs::write, returns { blob_id, url, byte_count, format }; implements Reversible — revert = starter-blob-fs::delete; add three MessageKeys (report.rendered, report.empty, report.format_unsupported) en.json + es.json same commit; integration test under testcontainers PG + CH + tempdir blob backend asserts html report bytes contain expected table rows from the disk-history template; commit feat(rubix-tools) analytics.report + starter-export wiring"
  - "REVIEW gate — Phase C landed — handover names two C commits, confirms templates list matches SCOPE, confirms html report rendered against synthetic CH data carries the expected substrings, confirms Reversible is registered for analytics.report; one operator-runnable manual flow (curl tools/call analytics.query disk_history_weekly → assert JSON rows; curl tools/call analytics.report → assert blob URL); wait before Phase D"
  - "phase D.1 — weekly-report flow YAML rewrite + delete stub — delete rubix/crates/rubix-tools/src/analytics/weekly_report.rs (the WeeklyReportStub); update analytics/mod.rs to drop the stub export and add query + report; rewrite rubix/crates/rubix-flows/flows/weekly-report.yaml replacing trigger: explicit with trigger: schedule plus cron_expr 0 8 * * 1 (Monday 08:00 UTC) and replacing allowed_tools [com.rubix.weekly-report] with [analytics.query, analytics.report, rubix.alert.send, rubix.undo.last]; update rubix-skills/skills/analytics-reporter/SKILL.md present-tense; commit feat(rubix-flows+rubix-tools+rubix-skills) goal 6 wired"
  - "phase D.2 — rubix-agent boot wires FlowAsService — extend rubix-agent::main to construct FlowAsService at boot using the existing PG pool + FlowRegistry + FlowRunner + a fresh SystemClock; seed scheduled_flows on first boot from every bundled YAML carrying trigger: schedule (just weekly-report initially); call FlowAsService::start to spawn the tick task; extend AgentConfig with optional [scheduler] section (enabled default true, tick_interval_seconds default 60) in boot/config.rs; commit feat(rubix-agent) wire FlowAsService at boot"
  - "phase D.3 — Goal 6 integration test + design doc — add rubix-agent/tests/goal_6_weekly_report_test.rs that boots against testcontainers PG + CH + tempdir blob, pre-populates system_disk_history with 7 days of synthetic data, advances FlowAsService clock by 7 days to trigger one fire, asserts flow runs to completion, agent reply non-empty, html report blob lands, blob bytes contain expected per-day rows, then calls rubix.undo.last and asserts blob deleted; rewrite rubix/docs/design/reports/README.md from placeholder to present-tense per SCOPE Phase D; commit test(rubix-agent) + docs(design) goal 6 end-to-end"
  - "REVIEW gate — Phase D landed — handover names three D commits, shows goal_6 test green, shows one curl-based operator-runnable manual flow demonstrating boot → wait for scheduled fire (or trigger-now helper) → blob lands → undo deletes blob; wait before Phase E"
  - "phase E — closing docs + smoke + PR — flip THIN-SLICE.md Goals lit up table row 6 from stubbed to real with the evidence link; add docs/sessions/<today>-goal-6-landed.md with per-phase summary and the operator-runnable manual flow; add docs/design/scheduling/README.md present-tense covering the durable scheduler architecture; update docs/design/starter-changes/README.md with three new entries (starter-cron crate, scheduled_flows migration, FlowAsService); flip docs/scope/GAPS.md row 16 to addressed-in-this-job; confirm with operator that PR shape is one PR off codeless/rubix-goal-6-weekly-report reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-goal-6-weekly-report with title feat goal 6 weekly-report end-to-end + durable cron scheduler upstream and body summarising each phase with commits listed; commit chore(docs+ci) close out goal 6 + open PR"
