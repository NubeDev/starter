name: flow-nodes
goal: |
  Land hot-loadable flow node kinds via extensions per
  starter/DOCS/extensions/scope/FLOW-NODES.md. Add one new contribution
  kind to the extensions manifest (contributes.nodes), one new wire
  method (flow.node.invoke), one new adapter walker in
  starter-ext-flow, plus the DynamicNodeKindRegistry +
  CompositeNodeKindRegistry seam on starter-flow-spi. The
  load-bearing acceptance test is the com.nube.mqtt demo bundle
  hot-loaded into examples/flow-agent at runtime — cp the bundle into
  EXTENSIONS_DIR, POST /admin/extensions/reload, MQTT nodes appear in
  the palette and fire end-to-end against a mosquitto test container
  without rebuilding the host. Two slices A then B, one REVIEW gate
  between them. R-flow-node-1 through R-flow-node-8 hold by
  construction.

stages:
  - "stage 1 (slice A) — manifest + dynamic registry + flow-agent wiring (descriptors only, no proxy): land Contributes.nodes + ContributeNode on starter-ext-spi::manifest with full deny_unknown_fields and #[serde(default)] on description_file/facets/streaming/auth (AuthGate reused per R-flow-node-1); extend starter-ext-host::validate's reverse-DNS namespace walker to validate contributes.nodes[].kind against the extension id per R-flow-node-3; widen NodeDescriptor's string fields from &'static str to Cow<'static,str> per R-flow-node-2 with the const-fn new(&'static str) shim that keeps existing built-in call sites source-compatible; land DynamicNodeKindRegistry (owned descriptors + factory closures returning Arc<dyn NodeBehavior>) and CompositeNodeKindRegistry (Static first then Dynamic) in starter-flow-spi::node; mechanical Cow::Borrowed wrap of every existing NodeDescriptor::new call site in starter-flow-nodes; add contributed_node_kinds(manifest, extension_root, handle) walker in starter-ext-flow returning DynamicNodeKindEntry values carrying descriptor + a placeholder Arc<dyn NodeBehavior> that returns a typed 'no behaviour bound' error on invoke (proxy lands in stage 3); flow-agent backend: registry composition via ArcSwap, GET /api/node-kinds returning descriptor + i18n-resolved label/summary/help + absolute schema/description URLs, GET /api/node-kinds/<kind>/settings-schema and /description serve the static bundle files; flow-agent frontend: state/node-kinds-store.ts react-query over /api/node-kinds, FlowEditor palette reads from the store; ship a starter-ext-flow tests/fixtures/ block.yaml that exercises the schema; the kind is NOT yet invokable — attempting to fire returns the typed no-behaviour-bound error which is the proof that the dynamic-registry path is wired end-to-end without the supervisor wire"
  - REVIEW slice A — confirm Cow<'static,str> widening is source-compatible (existing built-in NodeDescriptor::new sites compile unchanged via the const-fn shim), confirm the reverse-DNS validator rejects a fixture extension that contributes starter.flow.mqtt (reserved prefix) and com.other.mqtt (mismatched extension id), confirm GET /api/node-kinds returns a fixture-driven kind with resolved i18n labels and absolute URLs, confirm the placeholder behaviour returns a typed error not a panic when invoked
  - "stage 2 (slice B) — process-flavour proxy + supervisor wiring + MQTT demo: land FLOW_NODE_INVOKE = flow.node.invoke string constant on starter-ext-spi::jsonrpc alongside stream_methods::*; reserve flow_node_error_codes -32050..-32099 in the same module; land ProcessNodeProxy in starter-ext-flow::process_proxy implementing NodeBehavior::invoke with invocation_id correlation (StreamId(format!('inv-{}', ulid::Ulid::new()))) per R-flow-node-5, advisory deadline_ms in params with host-side SupervisorHandle::call timeout as the hard bound, spawn_cancel_forwarder task that forwards Cancel-token trips as stream.cancel { stream_id: invocation_id } envelopes; add a stream.cancel helper on SupervisorHandle in starter-ext-supervisor so proxies don't build envelopes inline; wire the streaming-node path through the existing stream.event / stream.end / stream.error notifications (no new streaming shape per R-flow-node-1); land POST /admin/extensions/reload on flow-agent implementing the R-flow-node-6 reload algorithm — Loader::scan + validate_all + commit into a fresh ExtensionRegistry, diff against live supervisor set (added/unchanged/replaced/removed), spawn new supervisors for added/replaced, defer shutdown of replaced/removed handles until Arc::strong_count == 1 OR the per-handle grace-window cap (default 5min, configurable) elapses, ArcSwap the engine's Arc<dyn NodeKindRegistry>, publish extensions.reload SSE event on the existing flows bus; build examples/flow-agent/extensions/com.nube.mqtt/ with block.yaml (publish + subscribe nodes, publish non-streaming, subscribe streaming with IsTrigger facet), bin/mqtt-driver using rumqttc for the MQTT client and starter-jsonrpc-stdio for wire framing (one tokio::main, one flow.node.invoke dispatcher, one persistent MQTT connection per child managed across invocations — extensions are stateful processes, nodes are stateless behaviours on top), schemas/{publish,subscribe}.settings.json, docs/{extension,publish,subscribe}.md, i18n/{en,es}.json; end-to-end test: drop bundle into a tempdir EXTENSIONS_DIR, POST /admin/extensions/reload, fetch palette, create a trigger → mqtt.publish → log flow, fire it, assert published_at slot populated and a mosquitto test container received the message; also cover the cancel-mid-subscribe path (stream.cancel within 250ms, NodeError::Cancelled, NodeCancelled engine event), the supervisor-restart path (kill the child, in-flight mqtt.publish fails with NodeError::Backend, NodeFailed engine event), and the replace-while-streaming path (POST /admin/extensions/reload while a subscribe is running, in-flight stream stays alive against the old handle until normal terminate or grace cap)"
