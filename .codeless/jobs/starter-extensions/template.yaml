name: starter-extensions
goal: 'Build the starter-extensions sibling workspace per DOCS/extensions/scope/SCOPE.md — one ExtensionBehavior trait, three packaging flavours (builtin / WASM / process), one YAML manifest, one supervisor, one UI Module Federation runtime, and (R13) one contribution model that reaches every transport the host exposes (MCP, REST/SSE, CLI, gRPC, periodic workers, UI) through small feature-gated adapter crates. Designed for the third implementation: extracts the kernel that codeless and rubix-agent re-invented separately. Ship in four ordered kernel phases plus four independent adapter phases — each independently mergeable and useful — so stopping after any phase leaves a working product.'

stages:
  - 'resolve open questions in DOCS/extensions/scope/SCOPE.md — extension bundle on-disk convention (default $XDG_DATA_HOME/<binary>/extensions/<id>/, override via starter-config), admin-endpoint capability set (defer Role::ExtensionManage; ship behind Role::Admin), enable/disable persistence model (pick the DB row keyed by extension id), JSON-RPC wire-schema versioning via host_capabilities in init handshake (deferred to v0.2 first new host method). Plus the post-R13 follow-ups: confirm the JSON-RPC streaming convention (stream.event / stream.end / stream.error / stream.cancel notifications tagged with stream_id) belongs in starter-ext-spi alongside JsonRpcEnvelope so adapters reuse one shape, and confirm per-entry auth shape in the manifest (require_role / require_scope from starter-spi, applied by the adapter never by the extension). Record decisions in SCOPE.md under Decisions with revisit triggers'
  - 'REVIEW prerequisite decisions before any code lands'
  - 'Kernel Phase 1 — starter-ext-spi (contracts crate, R2 — depends only on starter-spi) with ExtensionBehavior trait, Manifest with v=1 and contributes.{tools,cli,rest,grpc,workers,ui} blocks per R13 (deny_unknown_fields), ExtensionId reverse-DNS newtype, Capability enum, LifecycleState enum, JsonRpcEnvelope + the stream.event/stream.end/stream.error/stream.cancel notification shape so streaming is one convention across adapters, Error enum. Zero runtime logic, zero I/O'
  - 'Kernel Phase 1 — starter-ext-sdk with derive(Extension) proc-macro reading block.yaml at compile time (R3 — manifest is source of truth, dispatch table generated, missing or extra handler is a compile error in the extension), requires! macro generating per-extension Ctx newtype (R6 — typed capabilities, no untyped host_call escape hatch), mutually-exclusive cargo features builtin/wasm/process with linker error on misconfiguration, builtin entry-point glue (register_static_table!), Stream<Item=Event> shape on Ctx mirroring starter-spi::ai::OnEvent + Cancel pattern'
  - 'Kernel Phase 1 — starter-ext-host with Loader::scan (per-extension errors, no short-circuit), two-phase commit (validate_all then commit), namespace ownership check (R4 — extension id and dotted descendants only, reserved sys.* and starter.* refused), capability compatibility check, ExtensionRegistry immutable after build, plus starter-ext-mcp as the first transport adapter (R13 validation — registers contributes.tools entries into starter-mcp::ToolRegistry), and examples/hello-builtin reachable end-to-end via MCP. Phase ships only when bad-manifest-is-isolated smoke test passes'
  - 'REVIEW Kernel Phase 1 — hello-builtin loads end-to-end into a host binary and is reachable from an MCP client; bad-manifest-is-isolated smoke test passes; the contribute-to-adapter pattern is proven by ext-mcp before more adapters or flavours ship'
  - 'Kernel Phase 2 — starter-ext-supervisor (the heaviest crate, gets the most attention) — spawn child binary, stdio JSON-RPC framing (Content-Length-headered, LSP/MCP-style) via starter-jsonrpc-stdio in the starter workspace (extracted, consumed by both starter-mcp and the supervisor), init handshake with manifest content-hash verification (R3), RestartPolicy (always/on_crash/never with intensity cap + exponential backoff + jitter, no supervisor groups in v0.1 per R9), Health periodic ping, EventRing bounded ring buffer per extension, SIGTERM then grace then SIGKILL shutdown. Capability enforcement at JSON-RPC wire boundary (advisory-deny per R8) with capability_violation counter. Streaming notifications (stream.event/end/error/cancel) forwarded by the supervisor without interpretation. Plus examples/hello-process — same source as hello-builtin with one cargo feature flipped'
  - 'Kernel Phase 2 — starter-ext-server admin routes only — GET /extensions, GET /extensions/<id>, GET /extensions/<id>/events (paginated + SSE upgrade for live tail), POST /extensions/<id>/enable, POST /extensions/<id>/disable (Role::Admin), GET /extensions/<id>/ui/* for Module Federation bundles (ETag-cached). REST contribution surface lives in Adapter Phase 5; this stage ships only the admin slice plus the SSE upgrade for the event-ring live tail'
  - 'REVIEW Kernel Phase 2 — extension-survives-host-restart, crash-loop-is-bounded, and capability-violation-rejected-logged-counted smoke tests pass; supervisor passes its in_memory_transport() state-machine tests; admin SSE event tail observed end-to-end'
  - 'Kernel Phase 3 — starter-ext-sdk-ts (fork of rubix-workspace/extension-ui-sdk main entry, rubix graph hooks stripped) — useHostClient typed wrapper over starter-client-ts (UI extensions never raw fetch per R11), BlockShell wrapper, useSlotContext hook, registerExtensionContributions entry. Plus starter-ext-ui (fork of rubix-workspace/extension-ui-sdk ./mf entry) — Module Federation host runtime with ExtensionSlot, useExtensionHost, registerExtensionRemote, singleton negotiation for React / react-dom / @tanstack/react-query / zustand with matching-majors load-time refusal on mismatch. Plus examples/hello-ui contributing a React panel to a named slot. Two-extensions-no-React-duplication smoke test passes'
  - 'Kernel Phase 4 (optional) — starter-ext-wasm feature-gated behind wasm — WASI-p2 component host on wasmtime, default-deny capability baseline (R8) with per-call fuel + memory + wall-clock caps configured host-side (not in the manifest), one WIT package starter-extension at 0.1.0 with stream-notification import names reserved alongside, stateless per-call instantiation in v0.1 (kv capability reserved for v0.2). Plus examples/hello-wasm — same source as the other two flavours, single cargo feature flipped'
  - 'REVIEW kernel complete — all four kernel phases shipped, one-source-three-flavours smoke test passes (single feature flip across hello-* compiles, loads and responds in builtin/process/wasm), kernel UI runtime mounts panels with no React duplication. Adapter phases start landing now and are independent of each other'
  - 'Adapter Phase 5 — starter-ext-server REST adapter — surfaces contributes.rest as merged axum::Router fragments (path-collision detection across extensions is a load error), surfaces contributes.tools as POST /tools/<id> so one tool reaches MCP and REST without two handlers (R13), per-entry auth declarations (require_role / require_scope) applied by the adapter never by the extension, input_schema validation before the extension is invoked, streaming entries with streaming=sse render Stream<Item=Event> as SSE frames (Content-Type text/event-stream, default heartbeat, retry header), streaming=ndjson renders as newline-delimited JSON, client disconnect becomes a stream.cancel notification to the child within a few hundred milliseconds (Streaming-response-cancels-promptly smoke test passes)'
  - 'Adapter Phase 6 — starter-ext-cli adapter — surfaces contributes.cli as clap::Command impls in starter-cli::CommandRegistry, synchronous JSON-RPC dispatch with configurable timeout for process and wasm flavours, streaming=stdout renders Stream<Item=Event> as line-delimited stdout (one event per line), SIGINT becomes stream.cancel. Plus examples/hello-cli — a subcommand contributed by an extension'
  - 'Adapter Phase 7 — starter-ext-workers adapter — periodic scheduler invoking contributes.workers handlers at manifest-declared interval_seconds with jitter_seconds, per-worker error backoff (on_error.retry exponential, max_attempts capped), no shared queue and no fan-out (workers are not jobs, mirroring the parent SCOPE non-goal), worker state surfaced on GET /extensions/<id> (last_run / last_error / next_due) and via the testing seam tick_now(id) for deterministic tests'
  - 'smoke tests — full sweep: one-source-three-flavours, extension-survives-host-restart, crash-loop-is-bounded, capability-violation-rejected-logged-counted, two-extensions-no-React-duplication, bad-manifest-is-isolated, LLM-facing-description-is-byte-identical-at-load-and-call-time (R7 anti-prompt-injection guarantee), Streaming-response-cancels-promptly (SSE on REST plus same handler over CLI/MCP), Same-source-streams-over-four-transports (hello-streaming example: SSE on REST, line-delimited stdout on CLI, MCP notifications/progress, gRPC server-streaming once Phase 8 lands and marked skip otherwise), extension-author-zero-extra-deps. CI matrix builds each hello-* under each enabled cargo feature so the mutually-exclusive guard is enforced'
