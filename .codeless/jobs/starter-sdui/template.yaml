name: starter-sdui
goal: |
  Port the Server-Driven UI substrate from the Rubix workspace
  (rubix-contracts/ui-ir, rubix-ui-core/src/sdui/,
  extension-sdk/sdui-builder) into starter, per
  DOCS/frontend/sdui/SCOPE.md. Ship five crates / packages
  (starter-ui-ir, starter-ui-bindings, starter-ui-builder,
  starter-sdui-routes, @nube/starter-sdui-react) plus reference
  HTTP routes behind opt-in consumer adoption, a structural
  domain-leak allowlist enforcing R3, content-hash + version
  handshake per R2, length-prefixed binding evaluation per R4,
  one /ui/action endpoint per R5, RSQL table queries per R6,
  custom renderer registry per R7 with the capability-handshake
  threat model, server-side DoS limits per R8, and the
  no-client-business-logic posture per R9. Two substantive
  divergences from Rubix: form_errors -> diagnostics at the wire
  (no back-compat) and render against starter-ui-kit shadcn
  primitives instead of rubix-ui-core. Every divergence lands in
  DOCS/frontend/sdui/DIVERGENCE.md in the same PR. ai-builder
  Phase 1 (DOCS/frontend/ai-builder/SCOPE.md) blocks on this
  job's Phase 1 schema artifact; ai-builder Phase 2 blocks on
  this job's Phase 5.

stages:
  - 'pin the five open questions in DOCS/frontend/sdui/SCOPE.md (S-D1 EntityGraph trait placement -- bias: starter-ui-bindings until a second consumer wants it; S-D2 RSQL query engine -- bias: trait + in-memory reference impl in v1, production consumers wire their own backend; S-D3 visual page editor -- defer, lands as a starter-extension when demanded; S-D4 oneOf sub-form helper placement -- bias: renderer side, server emits the active variant; S-D5 stream sentinel naming -- inherit Rubix verbatim) under a new ## Decisions section with revisit triggers. Do not edit any other SCOPE. Record decisions before any code lands'
  - 'REVIEW prerequisite decisions before any starter-sdui code lands'
  - 'Phase 1 -- starter-ui-ir port. Add crates/starter-ui-ir as a workspace member with Cargo.toml depending only on serde + serde_json + schemars + thiserror + tracing (zero I/O; CI gate via cargo tree --edges normal denylists axum, axum-core, reqwest, hyper, tokio, tokio-util, tower, tower-http, h2, http-body per R1). Port the Component enum, Bindable<T> shim, chart source / kind newtypes, and version stamp from rubix-contracts/ui-ir verbatim. Emit the JSON Schema artifact at build time so consumers (especially starter-ai-builder-prompt) can depend on the schema file before the compiled crate ships. Apply divergence D1 immediately: rename the form_errors action response variant to diagnostics with the wider { severity, code, message, field? } shape and reject form_errors at the wire (starter has not shipped, no back-compat). Add divergences D1 + D3 (three-crate split) to DOCS/frontend/sdui/DIVERGENCE.md. Unit tests cover round-trip through serde, V5 chart dual-field tolerance preserved, and JSON Schema generation deterministic across runs'
  - 'Phase 2 -- starter-ui-bindings port. Add crates/starter-ui-bindings depending on starter-ui-ir only. Port the binding grammar from rubix-agent/crates/dashboard-runtime verbatim: $target / $stack / $user / $page / $self sources, . slot-read, / child-walk, length-prefixed evaluation. Define the EntityGraph trait per the S-D1 bias (in starter-ui-bindings until a second consumer wants it promoted to SPI), with read_children + read_slot + entity_id_regex (optional, returns None for hosts without a stable id format -- needed by ai-builder R7). Implement EvalContext and the subscription-plan derivation per Rubix SDUI worked example. The "one page, N targets" test passes against a fixture entity graph: a fixture ui.page with {{$target/temp.value}} bindings resolves correctly against three distinct target nodes and the per-resolve subscription plan scopes subjects per target. Add divergence D5 (EntityGraph trait abstraction) to DIVERGENCE.md'
  - 'Phase 3 -- starter-ui-builder port. Add crates/starter-ui-builder depending on starter-ui-ir only (NOT starter-ui-bindings -- per the M4 fix in DOCS/frontend/sdui/SCOPE.md, builder strings are not compile-time-validated; resolve-time errors instead). Port the typed Rust constructors from extension-sdk/sdui-builder verbatim: page(), row(), col(), grid(), tabs(), card(), heading(), text(), badge(), kpi(), kpi_grid(), table(), line_chart(), bar_chart(), gauge(), sparkline(), form(), select(), toggle(), slider(), date_range(), ref_picker(), action_form(), dashboard(). Port the TimeSeriesSource / RowsSource newtypes so passing a RowsSource to line_chart is a compile error. Port the rsql() builder and the bindings::{target, stack, user, self_, page_state, vars} helpers. Port seed_page() idempotent upsert. Document the compile-time-vs-resolve-time contract in the crate-level docs verbatim from the SCOPE: source/kind get compile-time safety, binding strings get resolve-time errors with line-numbered diagnostics. A worked example page authored from main.rs renders end-to-end against the Phase 2 fixture entity graph. The "Builder DSL produces valid IR" smoke (every public builder function round-trips through the IR JSON Schema validator) passes'
  - 'Phase 4 -- @nube/starter-sdui-react port. Add packages/starter-sdui-react as a workspace npm package depending on react + @tanstack/react-query + zustand + @nube/starter-ui-kit + @nube/starter-ui-core. Port rubix-ui-core/src/sdui/ structure verbatim: SduiProvider, Renderer.tsx (single file, <= 800 lines TSX -- the size budget is a CI gate), SduiPage.tsx, SduiRenderPage.tsx, types.ts, registry/, applyPatch.ts, useActionResponse.ts, useSubscriptions.ts, useBoundWrite.ts, row-bind.ts, dialog-bus.ts, capability.ts. Reimplement the 16 initial component implementations (page, row, col, grid, tabs, stack, card, text, heading, badge, kpi, kpi_grid, button, link, table, form, field, select, toggle) against @nube/starter-ui-kit shadcn primitives -- NOT rubix-ui-core primitives (divergence D2). The component implementations total stays under 3000 lines target / 4000 lines red line; per-component files vary, the budget is the sum. The Renderer dispatches on node.type into the componentRegistry; the registerCustomRenderer function exposes the registry to consumers. Implement the capability handshake (SUPPORTED_IR_VERSION) that refuses to project a tree whose ir_version exceeds it (R2). Add divergence D2 (render target swap) to DIVERGENCE.md'
  - 'Phase 5 -- starter-sdui-routes crate. Add crates/starter-sdui-routes as a separate axum router crate (NOT a feature flag on starter-server -- per M6, Cargo features cannot prevent transitive compilation; the only honest opt-out is a separate crate the consumer opts into via their own Cargo.toml). Mount three routes: POST /api/v1/ui/resolve (resolve a page_ref + target_ref to a ComponentTree, response { render, subscriptions }), POST /api/v1/ui/action (dispatch a named handler from HandlerRegistry, response is the discriminated union: patch / full_render / navigate / toast / diagnostics / download / stream / none -- R5), GET /api/v1/ui/table (paginated table source backed by the QueryEngine trait, query params source_id / page / size / sort / filter -- R6). Define HandlerRegistry, QueryEngine trait, and SduiState builder. Apply server-side DoS limits per R8: each limit returns 413 with a stable what: tag; tests pin each tag. The capability handshake threat model from SCOPE R7 applies: renderer_id is treated as public, custom.props authorisation runs at the handler / resolve boundary, capability filter is vocabulary not auth. Add divergence D4 (separate routes crate) to DIVERGENCE.md. starter-server itself does NOT depend on starter-sdui-routes -- consumers mount it themselves'
  - 'REVIEW SDUI core surface frozen -- no additions or signature changes to the Component IR, EntityGraph trait, builder DSL, Renderer dispatcher, HandlerRegistry / QueryEngine traits, or the three /ui/* routes past this point. The remaining phases (extended components, smoke suite, scrub plan trigger check) build on top; they must not feed back into core shape changes. If a real need surfaces in Phase 6/7, stop and propose the core change explicitly'
  - 'Phase 6 -- remaining IR components. Port the remaining variants from rubix-ui-core: chart (with sources: Vec<ChartSource> multi-series + dual-field tolerance for source vs sources per V5 migration), sparkline, tree, timeline, markdown (with streaming subscription mode: append | replace), wizard, drawer, rich_text (delegating to tiptap/milkdown -- only the IR-adapter wrapper counts toward the LoC budget), diff (delegating to monaco-diff -- only the wrapper counts; annotations + line_action per SCOPE "Diff interactions" section), ref_picker, date_range. Implement streaming-subscription wiring in text / markdown / code / timeline per SCOPE "Streaming content" section: the server emits a sentinel stream_end with reason: done | error | timeout | gone (S-D5 inherited verbatim from Rubix); 60s server-side inactivity timeout default; on client disconnect the channel is GCd within the same window. $page chart_range round-trip for chart zoom: writing to $page.chart_range triggers re-resolve with the new range. The "DoS limit returns 413 with what: tag" smoke covers each of the seven R8 limits'
  - 'Phase 7 -- custom escape-hatch wiring. Implement the client-side custom renderer registry (registerCustomRenderer in @nube/starter-sdui-react) and the server-side capability filter that rewrites unfamiliar renderer_ids to a dangling stub before emission (R7). The fallback stub component renders a neutral placeholder without crashing the tree. The "Custom renderer falls back cleanly" smoke passes: a tree with { type: custom, renderer_id: unknown.id } renders the stub; the rest of the tree renders normally; a structured warning naming the unknown id is logged. The capability handshake threat model from SCOPE R7 is documented in the crate-level docs of starter-sdui-routes: renderer_id is public, custom.props authorisation is the handler/resolve boundarys job, capability filter is vocabulary not auth. The "Custom is a reference, not a node" distinction from SCOPE "Nodes vs IR components" section is documented in the @nube/starter-sdui-react README'
  - 'Phase 8 -- optimistic action hints + diagnostics response shape + final DoS smoke suite. Implement Action.optimistic: { target_component_id, fields } applied via React-Query setQueryData before the round-trip fires; authoritative Patch / FullRender responses replace through the same applyPatch helpers; rollback on round-trip error. Implement the diagnostics response variant per R5 (renamed from form_errors): { items: [{ severity, code, message, field? }] } with severity in { error, warning, info }; reject form_errors at the wire (starter has not shipped, no back-compat per D1). Wire all seven R8 DoS limits with stable what: tags: page_state_bytes (64 KiB), render_tree_bytes (2 MiB), tree_nodes (2000), tree_depth (32), component_types (60), handler_timeout (5s server-side enforcement, server cancels handler future at deadline and returns a diagnostics error), table_rows_per_page (500). Mark each limit row in the R8 table with its evidence column value (Inherited / unmeasured / Reused) per the M3 fix. Falsification test suite: three fixture pages (CRUD device list, PR review card with diff + inline actions, scope board with state badges + live updates) render end-to-end through one renderer with zero domain-specific strings in the renderer crates (R3)'
  - 'smoke tests + structural enforcement gates -- the merge gate. All ten SCOPE smoke tests pass in CI: (1) Domain-leak structural check (the CI script scans starter-ui-ir/src, starter-ui-bindings/src, starter-sdui-react/src for any string literal or identifier not present in the per-crate words.txt allowlist; the allowlist is the contract, the keyword denylist is defence-in-depth), (2) One page N targets (binding grammar load-bearing), (3) Capability mismatch refuses to render (R2 version handshake), (4) Action handler 404 is structured (R5 diagnostics shape), (5) Table pagination round-trip (R6), (6) Custom renderer falls back cleanly (R7), (7) DoS limit returns 413 with what: tag for each of seven limits (R8), (8) Builder DSL produces valid IR, (9) Falsification suite covers three diverse domains (CRUD + diff + state-board), (10) starter-server does not depend on starter-sdui-routes (the consumer-opt-in claim from M6). Plus the dep-tree CI gate on starter-ui-ir: cargo tree -p starter-ui-ir --edges normal must not contain axum, axum-core, reqwest, hyper, tokio, tokio-util, tower, tower-http, h2, http-body per R1 (transitive dep-graph denylist, not a Cargo.toml regex). Plus the per-crate words.txt allowlist files committed under crates/starter-ui-ir/words.txt, crates/starter-ui-bindings/words.txt, packages/starter-sdui-react/words.txt with the structural check enforced at CI. Plus the size-budget CI gate: Renderer.tsx <= 800 lines TSX single file, total component implementations <= 4000 lines red line across all components combined'
