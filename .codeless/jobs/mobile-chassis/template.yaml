name: mobile-chassis
goal: |
  Land every workspace-package change the rubix mobile plan
  depends on, in one job, before any `rubix/mobile/` code is
  scaffolded. Scope is two upstream refactors and four new
  packages (`starter-theme-tokens`, `starter-ui-kit-native`,
  `starter-ui-sdui-native`, `starter-ui-dashboard-native`),
  ordered so each phase ships independently testable in isolation,
  per `rubix/docs/scope/mobile/NEW-PACKAGES.md` and
  `rubix/docs/scope/mobile/REUSE.md`. Three REVIEW gates: (1)
  after upstream refactors — web behaviour unchanged; (2) after
  the tokens extraction — web visual review; (3) after all four
  new packages build green. The Expo app itself (`rubix/mobile/`)
  is a separate job, scheduled after this one merges.

stages:
  - "phase 0 (slice 0) — `@nube/starter-ui-sdui-react` `./headless` subpath split: (a) move `src/renderer/registry.ts` to `src/headless/registry.ts` and update every `render-*.tsx` import; (b) decouple `src/sdui-page.tsx` from the renderer barrel (today it imports `Render, listRenderers from \"./renderer/index.js\"` which side-effect-registers every web renderer) so it imports `Render, listRenderers` from `./headless/render.js` + `./headless/registry.js` instead — verified-current-state import path documented in `rubix/docs/scope/mobile/NEW-PACKAGES.md §Precondition`; (c) move `SduiProvider`, the hooks under `src/hooks/`, the transport, and `Render` into `src/headless/`; (d) add `\"./headless\": { types, import }` to `packages/starter-ui-sdui-react/package.json` exports; (e) update `src/index.ts` (root) to re-export from `./headless/index.js` for backwards-compat and continue to side-effect-register the web renderers; (f) verify that importing only `@nube/starter-ui-sdui-react/headless` does NOT bundle any `@nube/starter-ui-kit` import — add a unit/build assertion (e.g. a `dependency-cruiser` rule or a vitest that asserts the headless module graph is free of `starter-ui-kit`); web SPA (`rubix/frontend`) and the existing examples that import the root must boot unchanged"

  - "phase 1 (slice 1) — `@nube/starter-ui-core` subpath fixups so RN consumers can import the named exports listed in `rubix/docs/scope/mobile/REUSE.md` without dragging DOM-bound siblings: (a) split `src/preferences/provider.tsx` into a pure store/types/formatters module (DOM-free) and a `PreferencesProvider` React component (which today writes `document.documentElement.lang/.dir` at L218,224 — keep that behaviour identical on web); confirm web `PreferencesProvider` still mounts and toggles lang/dir; (b) audit `src/theme-editor/` — keep `localStorageThemeTransport` (transport.ts L96,L106 uses `window.localStorage`), `apply-theme`, `apply-preferences`, `generate-css`, `tailwind-css`, `parse-css-input` exactly as-is but document their web-only status in `packages/starter-ui-core/src/theme-editor/WEB-ONLY.md` listing each by name; ensure `types`, `defaults`, `presets`, the editor `store`, the `layout-preferences` store + types, `utils/color-converter`, `utils/contrast-checker` are reachable as named exports from `./theme-editor`; (c) verify the `layout-preferences.ts:81,92,104` `matchMedia` guards (`typeof window === \"undefined\" || typeof window.matchMedia !== \"function\"`) actually no-op cleanly under a node + jsdom-disabled environment (sanity test, since RN's Hermes hits the same guard branch); (d) NO new package, NO new subpath export entries unless required to make a named re-export reachable — additive only; `starter-ui-core/auth` and `starter-ui-core/query` are not touched in this phase"

  - "REVIEW slice 0+1 — web behaviour unchanged: `pnpm -w build` clean across the workspace; `pnpm -w test` green across `starter-ui-sdui-react`, `starter-ui-core`, `starter-ui-kit`, and `rubix/frontend`; rubix/frontend dev server boots and a manual smoke covers login → dashboard render → theme toggle (preferences provider still writes lang/dir) → SDUI page resolves; `git diff master -- packages/starter-ui-kit/` is empty (we have not touched the kit yet); the headless-no-DOM build assertion from phase 0 (f) passes; the WEB-ONLY surface is documented; capture transcripts of all four. This is the cheap defence against silent regression in the web SPA before any mobile-only code is written. Do not advance without explicit approval"

  - "phase 2 (slice 2) — `@nube/starter-theme-tokens` new package: scaffold `packages/starter-theme-tokens/` (peerDependencies-free, no React, no RN, no DOM, no styling runtime — pure data, ESM + CJS dual build per the workspace convention); one file per concept matching `rubix/docs/scope/mobile/NEW-PACKAGES.md §starter-theme-tokens`: `src/palette.ts` (HSL triplets, named palettes extracted from `starter-ui-kit/src/styles/globals.css` + `starter-ui-core/src/theme-editor/presets.ts`), `src/density.ts`, `src/radius.ts`, `src/type.ts`, `src/motion.ts`, `src/role.ts`, `src/index.ts` (barrel, re-exports only); add a `scripts/generate-css.ts` in `starter-ui-kit/` that reads from `@nube/starter-theme-tokens` and emits `src/styles/globals.css` at build time — the emitted file must be byte-identical to today's hand-written file (commit a regression fixture); refactor `starter-ui-core/src/theme-editor/presets.ts` to consume the same source of truth (delete its hardcoded palette tables, re-export from tokens); add `starter-theme-tokens` to root `pnpm-workspace.yaml`; web visual output unchanged is the acceptance bar"

  - "REVIEW slice 2 — manual visual review of the web kit: rubix/frontend boots; reviewer walks (a) login page, (b) main dashboard, (c) settings/preferences, (d) one flow editor screen, at three breakpoints (mobile-emulated 375px / tablet 768px / desktop 1280px) and under light + dark + two named palettes, comparing against the current master rendering side-by-side; reviewer signs off in the PR. The visual-diff CI harness is explicitly deferred to a follow-up job (defensible default: manual review for Block 1, harness in Block 2 when there are two consumers to justify the infra). The byte-identical regression fixture from phase 2 covers the source-of-truth invariant; manual review covers the rendering invariant. Do not advance to mobile-only packages without explicit approval"

  - "phase 3 (slice 3) — `@nube/starter-ui-kit-native` new package: scaffold `packages/starter-ui-kit-native/` with peerDependencies on `react`, `react-native`, `react-native-svg`, `moti`, `react-native-reanimated`; depends on `@nube/starter-theme-tokens` + `@nube/starter-ui-core/theme-editor` (named exports — uses `layout-preferences` store + types only); implement the 13 primitives listed in `rubix/docs/scope/mobile/NEW-PACKAGES.md §starter-ui-kit-native` — one file per primitive (`button.tsx`, `card.tsx`, `input.tsx`, `tabs.tsx`, `badge.tsx`, `switch.tsx`, `slider.tsx`, `select.tsx`, `sheet.tsx`, `dialog.tsx`, `spinner.tsx`, `skeleton.tsx`, `tooltip.tsx`), each ≤200 lines, prop API mirroring `starter-ui-kit` one-to-one (e.g. `<Button variant=\"outline\" size=\"sm\" onPress={…}>` mirrors web `<Button variant=\"outline\" size=\"sm\" onClick={…}>`); every primitive ships `accessibilityRole` + `accessibilityLabel` / `accessibilityHint` props wired through to the RN base element (kit acceptance criterion, NOT a polish item — reviewer is entitled to block a primitive PR that ships `Pressable` without `accessibilityRole=\"button\"`); a `useTheme()` hook reads tokens from `starter-theme-tokens` + the layout-preferences store; story-style harness under `packages/starter-ui-kit-native/example/` so a reviewer can render each primitive in isolation against light/dark/two named palettes; vitest unit tests per primitive (snapshot + a11y prop assertion); MUST NOT import `starter-ui-kit`, MUST NOT do network I/O, MUST NOT own application state; foundation is RN core + react-native-svg + moti (Tamagui / gluestack-ui swap would be a separate ADR per the NEW-PACKAGES decision, NOT a phase deviation)"

  - "phase 4 (slice 4) — `@nube/starter-ui-sdui-native` new package: scaffold `packages/starter-ui-sdui-native/` with peerDependencies on `react`, `react-native`; depends on `@nube/starter-ui-kit-native`, `@nube/starter-ui-ir`, `@nube/starter-ui-sdui-react/headless` (which exists as of phase 0); 16 renderer files matching `packages/starter-ui-sdui-react/src/renderer/index.ts` priority order one-for-one (`render-page.tsx`, `render-row.tsx`, `render-col.tsx`, `render-grid.tsx`, `render-kpi.tsx`, `render-chart.tsx`, `render-divider.tsx`, `render-tabs.tsx`, `render-table.tsx`, `render-form.tsx`, `render-select.tsx`, `render-slider.tsx`, `render-toggle.tsx`, `render-date-range.tsx`, `render-repeat.tsx`, `render-custom.tsx`), each ≤150 lines, each importing ONLY `starter-ui-kit-native` + `starter-ui-ir` types (no direct RN primitives — keeps styling consistent and renderers testable against a swap-in mock kit); single barrel `src/index.ts` that side-effect `registerRenderer(...)`s every kind on import; the 10 IR kinds the web does not register (`stack, card, text, heading, badge, kpi_grid, button, link, field, sparkline` — per `rubix/docs/scope/mobile/NEW-PACKAGES.md §Parity vs the IR Kind union`) are explicitly listed in the package README as deferred-with-web, NOT silently registered; vitest unit tests per renderer using a mock kit-native module and IR fixtures from `starter-ui-ir`; the existing `disk-overview.json` from `rubix/crates/rubix-flows/dashboards/` is the smoke fixture (uses `page, row, col, kpi, chart` + `static` slot bindings) and must render through the registered renderers in a unit test"

  - "phase 5 (slice 5) — `@nube/starter-ui-dashboard-native` new package: scaffold `packages/starter-ui-dashboard-native/` with peerDependencies on `react`, `react-native`, `react-native-svg`; depends on `@nube/starter-ui-kit-native`; RN ports of the four dashboard widgets in `packages/starter-ui-dashboard/`, identical prop APIs (so a feature consumed on web can ship on mobile by changing only the import); vitest unit tests per widget; no direct RN primitives in widget files (same discipline as sdui-native — only kit-native + svg)"

  - "REVIEW slice 3+4+5 (final) — every new package builds in isolation and as part of the workspace: `pnpm -w install`, `pnpm -w build`, `pnpm -w test`, `pnpm -w lint`, `pnpm -w typecheck` all green; `pnpm --filter @nube/starter-theme-tokens build` and `pnpm --filter @nube/starter-ui-kit-native build` and `pnpm --filter @nube/starter-ui-sdui-native build` and `pnpm --filter @nube/starter-ui-dashboard-native build` all green individually; dependency graph matches `rubix/docs/scope/mobile/NEW-PACKAGES.md §Dependency arrow` (verify with `pnpm --filter @nube/starter-ui-kit-native exec pnpm list`: no `starter-ui-kit`, no `react-dom`); the disk-overview unit smoke from phase 4 renders; the web SPA (`rubix/frontend`) still builds + tests + boots cleanly (full regression sweep across phases 0–5); final handover ships a phase ↔ test matrix and a list of what is now unblocked (the `rubix/mobile/` scaffolding job)"
