name: authz-phase-7
goal: |
  Land Phase 7 of starter-authz per
  DOCS/auth/authz/SCOPE-EXT.md — tenants (7a) with the typed
  first-class predicate that defaults-deny on missing binding,
  teams (7b) with the new `path 'contains' value` operator,
  decision audit log (7c) with the best-effort sink + 100% deny
  retention + sampled allows + retention task, REST adapter
  permission field (7d), and MCP/gRPC adapter parity (7d.2). One
  branch, six stages, one REVIEW gate after the tenants slice
  because cross-tenant data leak is the most expensive bug to
  ship. R11 through R15 hold by construction. Strictly additive:
  every Phase 1–6 deployment keeps working unchanged.

stages:
  - "stage 1 (slice 7a) — Tenants: land Principal.tenant_id (Option<String>), ResourceRef.tenant (Option<String>), ResourceSpec.tenant_scoped (bool) on starter-spi; land StoredRule.tenant_id (Option<String>) + migration on starter-authz; engine evaluates the tenant predicate BEFORE role and condition with two new typed deny reasons cross_tenant and no_tenant_binding (R11); starter-auth-users gains starter_auth_users_tenants + starter_auth_users_memberships tables with the reserved-slug list enforced at INSERT (admin, api, auth, v1, v2, static, health, metrics, openapi, extensions, mcp, tools, default, system, plus [0-9]+); the tokens table grows tenant_id NOT NULL with the (user_id, tenant_id) immutability trigger landed for both SQLite (RAISE(ABORT,...)) and Postgres (BEFORE UPDATE RAISE EXCEPTION); token-issue flow takes a tenant_id arg with the super-admin sentinel '*' allowed only for users with global Admin; (tenant_id, owner_id) immutability triggers ship on every built-in tenant-scoped table (reports, flows, pages, marts, sandboxes, sessions) per R12 with the one-shot backfill migration gated on STARTER_AUTHZ_PHASE_7_DEFAULT_TENANT (migration refuses to run if unset and prints the manual-mapping caveat from R12); membership-revoke calls token_store.revoke_for_membership in the same transaction; OAuth callback resolves tenant via ?tenant=<slug> validated against memberships (single-membership auto-selects, multi-membership renders the hand-rolled HTML 'pick one' interstitial at POST /v1/auth/oauth/select-tenant); AuthAuthenticator populates Principal.tenant_id; admin REST POST/GET /v1/tenants, GET/PATCH /v1/tenants/{id} (slug immutable, audit_allow_sample patchable), POST /v1/tenants/{id}/members, DELETE /v1/tenants/{id}/members/{user_id} (cascades token revoke in the same txn), PATCH /v1/tenants/{id}/members/{user_id}; explicitly NO DELETE /v1/tenants/{id} (deferred to ADR-tenant-deletion); examples/authz-demo updated to seed two tenants and validate the cross-tenant deny path; smoke tests cross-tenant-deny (with a role:'*' resource:'*' actions:['*'] allow rule, deny still fires WITHOUT consulting the rule), none-tenant-no_tenant_binding, multi-tenant-session-binding, global-resource-bypass (tenant_scoped=false case), token-revoked-when-membership-removed, immutability-trigger-rejects-update for both SQLite and Postgres, oauth-callback-resolves-tenant-via-query-param, oauth-callback-renders-interstitial-on-multi-membership"

  - REVIEW slice 7a — confirm the tenant predicate is provably untouchable by a wildcard rule (the cross-tenant-deny test with role:'*' resource:'*' must pass); confirm the (user_id, tenant_id) and (tenant_id, owner_id) immutability triggers fire on both SQLite and Postgres testcontainers; confirm the backfill migration lands cleanly on a Postgres+SQLite testcontainer pair under STARTER_AUTHZ_PHASE_7_DEFAULT_TENANT and refuses to run cleanly without it; confirm token-revoke-on-membership-delete is transactional (kill the test mid-transaction, assert no half-state); confirm the strictly-additive claim by running cargo test --workspace WITHOUT setting STARTER_AUTHZ_PHASE_7_DEFAULT_TENANT (a Phase 1-6 deployment with no tenants table populated stays green); read the handover and verify the OAuth callback interstitial is the hand-rolled HTML form, not an SDUI dependency

  - "stage 2 (slice 7b) — Teams: land Principal.teams (Vec<String>, slug list, not ids) on starter-spi; starter-auth-users gains starter_auth_users_teams + starter_auth_users_team_members tables with the team slug immutable after create (display_name mutable, slug is the rule-stable identity per R13); authenticator populates Principal.teams at session-mint / token-verify time from starter_auth_users_team_members; condition mini-language gains the single new operator expr := … | path 'contains' value valid ONLY when the left-hand path resolves to a JSON array (engine compile-time error otherwise, parallel to R8's loud-failure shape — NOT a silent false at evaluation); admin REST POST /v1/tenants/{id}/teams, DELETE /v1/tenants/{id}/teams/{team_id}, POST /v1/tenants/{id}/teams/{team_id}/members, DELETE /v1/tenants/{id}/teams/{team_id}/members/{user_id}; examples/authz-demo gains one team rule (team:hvac-ops, weather, refresh, allow) demonstrating that one row covers every team member; smoke tests team-grant-coverage (add user to team, refresh works without a new rule row, remove user, refresh denied immediately), team-membership-remove-takes-effect, team-rules-tenant-scoped (a team in tenant A cannot match a request in tenant B even with the right slug), engine-compile-error-when-contains-LHS-not-array"

  - "stage 3 (slice 7c) — Decision audit log: land the DecisionSink trait on starter-authz with the exact shape from R14 (#[async_trait], async fn record(&self, entry: DecisionEntry)); DecisionEntry with split rule_id (Some only when a rule matched) and reason (Some only when engine semantics drove the decision — cross_tenant, no_tenant_binding, unknown_resource, no_matching_rule) fields per the source SCOPE's 'Independent so a rule whose id happens to be cross_tenant is never confused' invariant; ship NoopDecisionSink as the default (silent drop, zero overhead matching Phase 1-6's pay-nothing-if-not-enabled) and DbDecisionSink (bounded mpsc default depth 4096 + dedicated writer task, drop with tracing::warn { dropped_count } on overflow, NEVER blocks check() — the dispatch is tokio::spawn / channel-send NOT an awaited blocking write); starter_authz_decisions migration with the four indices from the source SCOPE (tenant_id+at, subject+at, effect+at for 'find recent denies', rule_id+at for 'which rule is firing most'); tenants table grows audit_allow_sample INTEGER nullable column per-tenant override; sample policy 100% denies + 1-in-N allows (default N=100 via STARTER_AUTHZ_DECISION_ALLOW_SAMPLE env var) via deterministic hash sampling (xxhash(subject) % N == 0 using xxhash-rust, per-process random seed so two deployments don't sample identical subjects, short-circuit when N=1); per-kind sample_override map on the sink with audit_logs defaulting to 1 so audit-of-audit is not 99% lossy; audit::spawn_retention(pool, cfg) hourly task that deletes at < now() - retention in bounded batches of 10k logging the count (docstring explicitly names 'if the binary never spawns this task, the table grows without bound'); default retention 90 days via STARTER_AUTHZ_DECISION_RETAIN_DAYS; GET /v1/authz/decisions cursor-paginated by at with bounded limit, tenant-admin sees own tenant + super-admin sees everything, exempt from allow-sampling (the route's with_permission middleware uses the per-kind override map); env vars STARTER_AUTHZ_DECISION_SINK ('off'|'db' default 'off') + STARTER_AUTHZ_DECISION_RETAIN_DAYS + STARTER_AUTHZ_DECISION_ALLOW_SAMPLE; smoke tests deny-eventually-recorded (100 denies + 2s deadline + non-ordering-sensitive assertion per source SCOPE), deny-drops-cleanly-on-overflow (queue depth 4 + 1000 denies + paused writer + assert tracing::warn { dropped_count } fires and server keeps serving — contract is 'drop don't block' not a specific count), allow-sampled-at-rate (sample=10 + 1000 allows + count in [80,120] binomial spread), audit-route-not-sampled (paging /v1/authz/decisions does NOT generate sampled-away allows), retention-task-deletes-expired"

  - "stage 4 (slice 7d) — REST adapter: land AuthGate.permission (Option<{ resource: String, action: String }>) on starter-ext-spi as the SHARED field (REST, MCP, gRPC adapters all consume it uniformly per R15's manifest-shape decision); ContributeRest.auth.permission plumbed through manifest deserialization with deny_unknown_fields; rest_router::build wraps each entry whose permission is set with with_permission(resource, action) — layer order documented in code AND in the wiring point as a doc comment: with_role (outer, from require_role) → with_scope (from require_scope) → with_permission (inner, from permission) → handler with the role-outer audit consequence acknowledged (role denies don't appear as permission denies, dashboards must exclude pre-role rejections, do NOT flip layer order to fix it); permission.resource validated against ResourceRegistry::lookup(kind) at build time with RestBuildError::UnknownResource on miss (symmetric with today's UnknownRole) — broken extension refuses to mount and rest of host comes up; examples/authz-demo/src/weather.rs hand-mounting REMOVED — the manifest declares permission: { resource: weather, action: read } and permission: { resource: weather, action: refresh } inline, the old wiring becomes a /// docstring 'this is what the adapter does for you now'; smoke tests per-entry-permission-applied (reader gets 200 on read route + 403 on refresh route + grant refresh and both pass), unknown-resource-is-build-error (manifest with resource: 'doesnt_exist' makes rest_router::build return RestBuildError::UnknownResource, server logs and mounts the rest of the extensions), role+permission-compose-correctly (a user failing role gate gets the with_role 403 and the permission middleware never runs — audit log records role-deny via with_role's tracing but NO permission deny entry, this is intended per R15 audit consequence)"

  - "stage 5 (slice 7d.2) — MCP + gRPC parity: starter-ext-mcp calls engine.check() at tool-dispatch using AuthGate.permission (the same field 7d added — no manifest churn, the AuthGate field is shared); starter-ext-grpc gains its first authz layer (gRPC dispatcher today has zero authz not even require_role per the source SCOPE — this is a meaningful workstream in its own right) and invokes engine.check() keyed off per-method AuthGate; both adapters document the same layer order convention as REST; DecisionEntry gains a surface field (rest|mcp|grpc) so dashboards can distinguish where denies originated (the source SCOPE's surface-decisions-share-audit-trail test depends on this); smoke tests mcp-permission-applied (deny via MCP lands in starter_authz_decisions), grpc-permission-applied (deny via gRPC lands), surface-decisions-share-audit-trail (one deny via REST + one via MCP + one via gRPC all appear with the right surface field distinguishable); examples/authz-demo gains one MCP tool entry and one gRPC method entry both with permission: declared in the manifest demonstrating zero host-side wiring; the demo IS the canonical Phase 7 stack — tenants + teams + audit sink + extension-permission + REST/MCP/gRPC parity end to end"

  - "stage 6 (final sweep) — docs + demo + lint pass: every new public item on starter-spi/starter-authz/starter-auth-users/starter-ext-spi has a doc comment citing the relevant R-number from SCOPE-EXT.md; examples/authz-demo README updated to be the canonical Phase 7 walkthrough (single doc that shows the tenants seed + team rule + sink wiring + extension manifests with permission: + the audit endpoint paging); DOCS/auth/authz/README.md updated to point at the demo as the worked example; cargo test --workspace green; cargo clippy --workspace --all-features -- -D warnings green; cargo fmt --check green; the handover for this stage doubles as the job's exit summary listing every R-number landed, every smoke test passing, every deferred item (DELETE /v1/tenants, multi-instance cache invalidation, query pushdown, intersect operator, audit log size scaling) with a one-line pointer to where in the source SCOPE it's flagged"
