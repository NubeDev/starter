name: rubix-thin-slice
goal: |
  Finish the rubix thin slice from "U1+U2+U3 cleared, PR 1 + PR 2
  + Path B all green on master" to "the six-step manual smoke in
  rubix/docs/scope/THIN-SLICE.md §Success criterion passes end to
  end." Three remaining PRs against the
  `codeless/rubix-thin-slice-v2` branch: PR 3 MCP exposure via
  the one-line `FlowAsTool::from_registry` wiring landed in U3,
  PR 4 ClickHouse history + insights rule + alert via the
  `starter-store-clickhouse::MigrationRunner` already on master
  with per-row `tenant_id` and one hardcoded `disk_used > 90`
  Rust rule, PR 5 REST handler + `rubix-admin system disk
  [--json]` parity reaching the same `probe()` in-process. The
  pre-answered open questions T1/T2/T3/T4/T5/Q6 and the MCP-locale
  `_meta.acceptLanguage` task-local decision are locked in
  SCOPE.md §"What is already answered" — do NOT re-litigate. Do
  NOT re-do anything from the prior codeless run that was aborted
  ($2.65, branch deleted): PR 1, PR 2 part 1, PR 2 part 2 (Path
  B), and Phase 2a Postgres stores are already on master at
  `ad393ba` — touching them creates conflicts. Three work stages,
  three REVIEW gates, strictly linear.

stages:
  - "stage 1 (block 1, PR 3) — MCP exposure with EN/ES round-trip: extend rubix/crates/rubix-agent/src/main.rs (or split into a sibling boot/mcp.rs verb file if main.rs is already heavy per FILE-LAYOUT) to mount starter-mcp's `mcp_router` against a FlowRegistry containing `com.rubix.scheduled-system-check`; build the FlowAsTool via the one-line contract from U3 `let tool = FlowAsTool::from_registry(&registry, &flow_id, &rev, engine).await?;` — do NOT hand-roll a FlowAsTool builder, do NOT register tools per-flow (FlowAsTool::from_registry IS the contract); locale handling on MCP comes from U1 — `starter-mcp` binds a task-local at dispatch time, the `_meta.acceptLanguage` field on incoming MCP requests populates it, and any code that needs the caller's locale reads `starter_mcp::current_locale()` — do NOT thread a LanguageTag through call sites manually, do NOT invent a custom `initialize` extension, do NOT add `Accept-Language` parsing into rubix code (U1 already did it upstream); land rubix/crates/rubix-agent/tests/mcp_disk_test.rs that uses the new InMemoryTransport from U2 (`starter_mcp::InMemoryTransport` — replaces the prior `_private: ()` stub) to round-trip a tool call to `com.rubix.scheduled-system-check` twice — once with `_meta.acceptLanguage: en-US` asserting English Diagnostic rendering with US date format, once with `_meta.acceptLanguage: es-AR` asserting Spanish rendering with EU date format AND the correct timezone — and asserts both runs find the flow in the MCP tool catalogue with zero per-flow registration code; update rubix/docs/design/i18n-prefs/README.md to replace the speculative 'MCP-session Accept-Language initial handshake header' source description with the actual U1 mechanism (`_meta.acceptLanguage` on incoming MCP request → `starter-mcp` task-local → `current_locale()` read site), include one worked example showing the resolved LanguageTag for `es-AR`; the dev-dep pin in `starter-mcp/Cargo.toml:37-42` (working around the Phase 2c `starter-i18n` interpolate latent bug from commit f7b69fd) is OUT OF SCOPE — leave it alone; exit signals are `cargo test -p rubix-agent --test mcp_disk_test` passes for both _meta.acceptLanguage values, the bundled flow surfaces as MCP tool id `com.rubix.scheduled-system-check`, the i18n-prefs doc no longer contains the words 'Accept-Language initial handshake', and `./rubix/scripts/lint-doc-refs.sh` is clean"

  - "REVIEW block 1 — confirm the MCP tool surface comes from FlowAsTool::from_registry (one call site, not per-flow); confirm both _meta.acceptLanguage values produce distinct outputs in the test (catches a 'we render the same string regardless of locale' regression); confirm `_meta.acceptLanguage: '' ` (empty) and missing-field cases both fall back to `en` without panicking; confirm the i18n-prefs doc describes the U1 mechanism (`_meta.acceptLanguage` → task-local → `current_locale()`) with the worked example; confirm Timestamp params in the response render in the resolved timezone for `es-AR` (e.g. America/Argentina/Buenos_Aires); confirm no code comment in the new files references the forbidden doc tiers; confirm the dev-dep pin at `starter-mcp/Cargo.toml:37-42` is unchanged (Phase 2c fix is a separate job)"

  - "stage 2 (block 2, PR 4) — ClickHouse history + insights rule + alert: land rubix/crates/rubix-agent/migrations/0002_history/{up,down}.sql for the ClickHouse table `system_disk_history` with columns tenant_id (UUID), host (String), percent_used (UInt8), free_bytes (UInt64), epoch_ms (Int64), partitioned by toYYYYMM(toDateTime(epoch_ms/1000)); multi-tenant isolation is per-row `tenant_id` column (the cheapest of the three options enumerated in WAREHOUSE.md — commit this decision in rubix/docs/design/warehouse/README.md as the v0 choice with a one-paragraph rationale and a clear 'revisit trigger: a single tenant's read volume forces per-tenant tables'); use `starter-store-clickhouse::MigrationRunner` to apply 0002 (do NOT invent a parallel runner; do NOT add a direct `clickhouse` crate dep to any rubix crate — pull transitively through starter-store-clickhouse only, the official `github.com/ClickHouse/clickhouse-rs` v0.13 is already pinned upstream); after a successful probe in rubix/crates/rubix-tools/src/system/disk.rs, write one row to the history table via `starter-store-clickhouse::ChClient` passing the principal's tenant_id from the request context (or `NIL_UUID` for the in-process insights test path); land rubix/crates/rubix-tools/src/system/alert_send.rs as a log-line implementation only (`tracing::warn!` with severity + MessageKey + params; no Slack / Telegram / email — those are deferred); wire the hardcoded insights check into the disk-tool post-dispatch hook with the EXACT comment `// TODO(upstream: rule.rhai migration) — promote to starter-insights::RuleRegistry once a second rule appears.` followed by `if response.percent_used > 90 { alert_send::dispatch(...).await?; }`; rewrite rubix/docs/design/warehouse/README.md from placeholder to present-tense (covers the per-row tenant_id decision + the L1/L2/L3 ladder + the `Bool | Str` tag-types invariant); rewrite rubix/docs/design/insights/README.md from placeholder to present-tense (covers the hardcoded-rule-for-v0 stance + the promotion trigger to rule.rhai); exit signals are migration 0002 applies cleanly on a fresh CH via the MigrationRunner, a probe() call writes exactly one row to system_disk_history with the right tenant_id (not silently NULL/default), an integration test that inflates percent_used to 95 fires `rubix.system.alert_send` exactly once AND at 50 fires it zero times, the TODO comment uses the exact `(upstream: rule.rhai migration)` qualifier the linter pattern looks for, both design docs are present-tense, and `cargo tree -p rubix-agent --invert clickhouse` shows only the transitive path through starter-store-clickhouse (no direct rubix dep)"

  - "REVIEW block 2 — confirm no rubix Cargo.toml has a direct `clickhouse =` line via `grep -r '^clickhouse =' rubix/crates/*/Cargo.toml` (must be empty); confirm the per-row tenant_id is actually populated in writes (not silently NULL/default — assert in the test that the written row has the expected UUID, not zero); confirm 0002 down.sql actually rolls the table back (drop test); confirm the alert dispatch is exactly-once when the threshold is crossed (a test that calls probe() three times with percent_used=95 produces three log lines AND three changelog rows AND three history rows, not deduplicated); confirm the TODO comment carries the exact `(upstream: rule.rhai migration)` qualifier; confirm warehouse + insights docs are present-tense and reference the actual code paths; confirm `./rubix/scripts/lint-doc-refs.sh` is clean"

  - "stage 3 (block 3, PR 5) — REST + CLI parity (the final smoke seam): in rubix/crates/rubix-agent/src/main.rs (or a `routes/tools.rs` verb file if main.rs is heavy) register a REST handler per registered tool at POST /api/v1/tools/{tool_id} where the handler body is ≤20 lines and does only (1) extract input via Json<Value>, (2) call probe(req) directly via the tool registry's dispatch by id, (3) shape the Result<Value, Error> into a JSON response with status code derived from the Error variant, (4) return; the Accept-Language header drives the response's Diagnostic rendering — extract via `starter-i18n::LocaleCtx` populated by AcceptLanguageLayer, pass through `MessageBundle::render_diagnostic` when the route opts into server-side rendering (default OFF — REST clients render client-side; only `?render=server` query toggles it on, used by the integration test for the round-trip assertion); on the CLI side grow rubix/crates/rubix-agent/src/bin/rubix_admin/system/ with a verb-per-file disk.rs that calls `rubix_tools::system::disk::probe()` in-process (NOT via HTTP — the CLI is an in-process consumer, the REST round-trip is for external callers only), renders the resulting Diagnostic server-side via `MessageBundle::render_diagnostic` against the host's `LANG`, and supports `--json` to skip rendering and dump the raw Diagnostic + structured data; do NOT touch rubix-client (Q6 deferred — leave the stub alone); do NOT wire gRPC (not in the thin slice); land rubix/crates/rubix-agent/tests/rest_disk_test.rs asserting the round-trip for both `Accept-Language: en-US` and `Accept-Language: es-AR` against `?render=server`, plus a second test asserting `?render=server` is OFF by default (response carries raw Diagnostic JSON not a rendered string); land an integration test for the CLI binary asserting `rubix-admin system disk` produces sensible English output under `LANG=en_US.UTF-8` and Spanish under `LANG=es_AR.UTF-8`, and `--json` dumps a JSON object containing `summary.code` and `summary.params`; exit signals are both new integration test files pass, the REST handler is ≤20 lines (`wc -l` it; if it grew, domain logic leaked — push back into probe()), the CLI never opens a TCP connection to itself (grep CLI source for `reqwest` / hyper / TcpStream — must not appear from the rubix side), the six-step manual smoke in THIN-SLICE.md §Success criterion would now pass when the human runs it, and `./rubix/scripts/lint-doc-refs.sh` is clean"

  - "REVIEW block 3 — confirm the REST handler is genuinely ≤20 lines (`wc -l` it); confirm the `?render=server` toggle defaults OFF (a curl without the query param gets JSON Diagnostic, with the param gets a rendered string); confirm the CLI binary does not import reqwest or any HTTP client (grep its imports — only `rubix_tools::system::disk::probe` and `starter_i18n::MessageBundle` should appear from the rubix side); confirm `--json` truly dumps raw structured data not a stringified version; confirm `LANG=` (empty) on the CLI falls back to `en` not panic; confirm no code in this block touches rubix-client (Q6 deferred); confirm the rest_disk_test asserts the Accept-Language paths produce different rendered strings (catches the regression where the renderer ignored the header); confirm the human's six-step smoke from THIN-SLICE.md §Success criterion is now actually runnable end-to-end (boot, login, curl with Accept-Language, claude-desktop call, audit query, ClickHouse query) and document one paragraph in the PR description naming the exact postgres + clickhouse container versions the human can use locally"
