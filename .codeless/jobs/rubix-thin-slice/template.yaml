name: rubix-thin-slice
goal: |
  Finish the rubix thin slice per
  rubix/docs/scope/THIN-SLICE.md. Five blocks delivered as five
  PRs against the `codeless/rubix-thin-slice` branch. After this
  job the human runs the six-step manual smoke in THIN-SLICE.md
  §Success criterion and every architectural layer is live:
  cookie sessions + per-tool authz + changelog + agent-log
  (Block 2), MCP `FlowAsTool` exposure with `LANG`-driven EN/ES
  round-trip (Block 3), ClickHouse history writes per disk check
  with per-row `tenant_id` plus the hardcoded
  `disk_used > 90` → `rubix.system.alert_send` insights check
  (Block 4), REST handler + `rubix-admin system disk [--json]`
  reaching the same `probe()` (Block 5), all riding on the three
  upstream Postgres stores landed in Block 1. The four pre-
  answered open questions T1/T2/T3/T4/T5/Q6 and the MCP-locale
  decision are locked in SCOPE.md §"What is already answered" —
  do NOT re-litigate. Five work stages, four REVIEW gates,
  strictly linear.

stages:
  - "stage 1 (block 1) — upstream Postgres stores in one bundled PR: in starter/crates/starter-auth-users/ port SqliteSessionStore + SqliteTokenStore + SqliteTenantStore to Postgres mirroring the already-landed PgUserStore shape exactly (same file layout, same trait impl order, same error mapping discipline); apply the translation hazards table from SCOPE.md (sqlite GLOB → Postgres regex `~ '...'`; sqlite RAISE(ABORT, '...') → Postgres trigger function RAISE EXCEPTION '...'; sqlite integer 0/1 boolean → Postgres `boolean` round-trip; sqlite TEXT primary keys stay TEXT, do not auto-convert to UUID; error matching e.code() == Some(\"23514\") for check_violation, Some(\"23505\") for unique_violation, Some(\"23503\") for foreign_key_violation; SERIAL vs BIGSERIAL match the sqlite source — INTEGER → SERIAL, BIGINT → BIGSERIAL; Postgres requires explicit RETURNING clauses where sqlite used last_insert_rowid()); mirror every sqlite test name into a Postgres test with identical behaviour using the testcontainers pattern from starter-store-postgres; for each line that diverges from the sqlite source leave a one-sentence code comment explaining why; do NOT touch rubix/ in this stage — this is starter-only work; exit signals are cargo build green on the starter workspace, cargo test -p starter-auth-users green with the new Postgres tests, cargo clippy --workspace -- -D warnings clean, and zero forbidden doc-tier substrings (SCOPE.md / HOW-TO-CODE.md / NEW-SESSION.md / FILE-LAYOUT.md / docs/scope/ / docs/sessions/) in the diff"

  - "REVIEW block 1 — confirm all three Postgres stores compile and every sqlite test name has a passing Postgres mirror; confirm the trigger ports actually fire (a test that inserts a violating row gets the expected RAISE EXCEPTION); confirm the error-code mapping is symmetric to sqlite's (a unique-constraint failure produces the same domain error in both); confirm PgUserStore is unchanged (this PR adds, never modifies); confirm no `clickhouse` dep was accidentally added to any rubix crate; if any test name diverged from its sqlite sibling, the divergence has a one-line comment justifying it"

  - "stage 2 (block 2) — rubix bootstrap + auth + authz + Postgres migrations: land rubix/crates/rubix-agent/migrations/0001_init/{up,down}.sql carrying ONLY rubix-specific tables (tenants membership view, team membership join tables; user/session/token tables live upstream in starter from block 1, do not duplicate); wire rubix/crates/rubix-agent/src/main.rs to compose starter-auth-users with cookie sessions, starter-authz with one ResourceSpec per registered tool (start with `rubix.system.disk` → `system.read`), starter-changelog-postgres for the audit log, starter-agent-log for the per-turn projection carrying the active skill id; verify rubix/crates/rubix-agent/src/bin/rubix_admin/bootstrap_user.rs is idempotent (second run is a no-op with 0 exit, asserts via integration test in tests/bootstrap_user_test.rs) and runs against the Postgres stores from block 1; rewrite the three placeholder design docs rubix/docs/design/{auth,audit,migrations}/README.md from placeholder to present-tense describing the system as it now exists — auth doc covers the R3 identity carve-out + cookie-session flow + `sys.identity.*` system kinds, audit doc covers the changelog + agent-log wiring + the skill-id carry-through, migrations doc covers the starter-first-then-rubix boot order + the cross-tree-FK rule; no phasing language in code OR docs; exit signals are an unauthenticated REST hit on a tool route returns 401, the disk tool requires the `system.read` permission and returns 403 for a principal without it, every tool call writes one changelog row, every `agent.turn.start` writes one agent-log row carrying skill id, migrations apply cleanly in deterministic order starter → rubix on a fresh Postgres, and the three doc-design READMEs no longer contain the word 'placeholder'"

  - "REVIEW block 2 — confirm 0001_init/up.sql carries only rubix-specific tables (no duplicate users/sessions/tokens); confirm the migration order test asserts starter-first-then-rubix (a starter table not yet created before rubix migration runs fails with the expected error); confirm bootstrap_user is genuinely idempotent (run twice in the test, exit 0 both times, second run logs 'already bootstrapped' or equivalent); confirm authz gate is at the route boundary not in the domain function (probe(req) takes no Principal — that is starter-authz's job upstream); confirm the three rewritten design docs are present-tense ('rubix uses cookie sessions') not future-tense ('rubix will use'); confirm no code comment in the new files references SCOPE.md / HOW-TO-CODE.md / NEW-SESSION.md / FILE-LAYOUT.md / docs/scope/ / docs/sessions/"

  - "stage 3 (block 3) — MCP exposure with EN/ES round-trip: extend rubix/crates/rubix-agent/src/main.rs to mount the starter-mcp router and wire the FlowRegistry into it via FlowAsTool; locale handling on MCP is fixed per session by reading `LANG` from the rubix-agent process environment at startup — do NOT invent a custom MCP `initialize` extension, do NOT thread `Accept-Language` through stdio (it would not work; Claude Desktop does not send it); the rendered Diagnostic for MCP responses goes through MessageBundle::render_diagnostic against the resolved-from-`LANG` LanguageTag and a ResolvedPreferences whose timezone defaults to `UTC` when LANG carries no region info; land rubix/crates/rubix-agent/tests/mcp_disk_test.rs that calls the bundled flow `com.rubix.scheduled-system-check` via the MCP testing harness twice — once with LANG=en-US asserting English output with US date format, once with LANG=es-AR asserting Spanish output with EU date format — and asserts in both cases that the flow appears in the tool catalogue with NO per-flow MCP wiring code (FlowAsTool does the work; if you find yourself writing `register_mcp_tool!(...)` per flow you have slipped the contract); update rubix/docs/design/i18n-prefs/README.md to replace the speculative 'MCP-session Accept-Language initial handshake header' source in the locale-source list with the locked answer 'LANG env var read at process startup; per-session fixed'; exit signals are `cargo test -p rubix-agent --test mcp_disk_test` passes for both LANG values, the bundled flow surfaces as the MCP tool id `com.rubix.scheduled-system-check`, and the i18n-prefs design doc no longer contains the words 'MCP-session Accept-Language initial handshake'"

  - "REVIEW block 3 — confirm the MCP tool surface comes from FlowAsTool not from a per-flow registration; confirm both LANG values produce distinct outputs in the test (catch a 'we render the same string regardless of locale' regression); confirm `LANG=` (empty) falls back to `en` gracefully without panicking; confirm the i18n-prefs doc actually describes the LANG behaviour with at least one worked example showing the resulting LanguageTag for `es-AR`; confirm no code comment references the forbidden doc tiers; confirm Timestamp params in the response render in the resolved timezone (`UTC` if LANG has no region; `Europe/Paris` if a hypothetical `LANG=fr_FR.UTF-8` is used as a second test variant)"

  - "stage 4 (block 4) — ClickHouse history + insights rule + alert: land rubix/crates/rubix-agent/migrations/0002_history/{up,down}.sql for the ClickHouse table `system_disk_history` with columns tenant_id (UUID), host (String), percent_used (UInt8), free_bytes (UInt64), epoch_ms (Int64), partitioned by toYYYYMM(toDateTime(epoch_ms/1000)); multi-tenant isolation is per-row `tenant_id` column (the cheapest of the three options enumerated in WAREHOUSE.md — commit this decision in rubix/docs/design/warehouse/README.md as the v0 choice with a one-paragraph rationale and a clear 'revisit trigger: a single tenant's read volume forces per-tenant tables'); use starter-store-clickhouse::MigrationRunner to apply 0002 (do NOT invent a parallel runner; do NOT add a direct `clickhouse` crate dep to any rubix crate — pull transitively through starter-store-clickhouse only); after a successful probe in rubix/crates/rubix-tools/src/system/disk.rs, write one row to the history table via starter-store-clickhouse::ChClient passing the principal's tenant_id from the request context (or `NIL_UUID` for the in-process insights test path); land rubix/crates/rubix-tools/src/system/alert_send.rs as a log-line implementation only (tracing::warn! with the severity + MessageKey + params; no Slack / Telegram / email); wire the hardcoded insights check into the disk-tool post-dispatch hook with the exact comment `// TODO(upstream: rule.rhai migration) — promote to starter-insights::RuleRegistry once a second rule appears.` followed by `if response.percent_used > 90 { alert_send::dispatch(...).await?; }`; rewrite rubix/docs/design/warehouse/README.md and rubix/docs/design/insights/README.md from placeholder to present-tense (warehouse covers the per-row tenant_id decision + the L1/L2/L3 ladder + the Bool|Str tag-types invariant; insights covers the hardcoded-rule-for-v0 stance + the promotion trigger); exit signals are migration 0002 applies cleanly on a fresh CH, a probe() call writes exactly one row to system_disk_history, an integration test that inflates percent_used to 95 fires rubix.system.alert_send exactly once and at 50 fires it zero times, both design docs are present-tense"

  - "REVIEW block 4 — confirm no rubix Cargo.toml has a direct `clickhouse =` line (only the transitive path through starter-store-clickhouse is allowed); confirm the per-row tenant_id is actually populated in writes (not silently NULL/default); confirm 0002 down.sql actually rolls the table back (test it); confirm the alert dispatch is exactly-once when the threshold is crossed (an integration test that calls probe() three times with percent_used=95 must produce three log lines AND three changelog rows AND three history rows, not deduplicated); confirm the TODO comment carries the exact `(upstream: rule.rhai migration)` qualifier that the linter pattern looks for; confirm warehouse + insights docs are present-tense and reference the actual code paths"

  - "stage 5 (block 5) — REST + CLI parity (the final smoke seam): in rubix/crates/rubix-agent/src/main.rs register a REST handler per registered tool at POST /api/v1/tools/{tool_id} where the handler body is ≤20 lines and does only (1) extract input via Json<Value>, (2) call probe(req) directly via the tool registry's dispatch by id, (3) shape the Result<Value, Error> into a JSON response with status code derived from Error variant, (4) return; the Accept-Language header drives the response's Diagnostic rendering — extract via starter-i18n::LocaleCtx populated by AcceptLanguageLayer, pass through MessageBundle::render_diagnostic when the route opts into server-side rendering (default OFF — REST clients render client-side; only ?render=server query toggles it on, used by the integration test for the round-trip assertion); on the CLI side grow rubix/crates/rubix-agent/src/bin/rubix_admin/system/ with a verb-per-file disk.rs that calls rubix_tools::system::disk::probe() in-process (NOT via HTTP — the CLI is an in-process consumer, the REST round-trip is for external callers only), renders the resulting Diagnostic server-side via MessageBundle::render_diagnostic against the host's `LANG`, and supports `--json` to skip rendering and dump the raw Diagnostic + structured data; do NOT touch rubix-client (Q6 deferred — leave the stub alone); do NOT wire gRPC (not in the thin slice); land rubix/crates/rubix-agent/tests/rest_disk_test.rs asserting the round-trip for both `Accept-Language: en-US` and `Accept-Language: es-AR` against `?render=server`, plus a second test asserting `?render=server` is OFF by default (response carries raw Diagnostic JSON not a string); land an integration test for the CLI binary asserting `rubix-admin system disk` produces sensible English output under `LANG=en_US.UTF-8` and Spanish under `LANG=es_AR.UTF-8`, and `--json` dumps a JSON object containing `summary.code` and `summary.params`; exit signals are both new integration test files pass, the REST handler is ≤20 lines (if it grew, domain logic leaked — push it back into probe()), the CLI never opens a TCP connection to itself (verify via the test harness that no HTTP client is constructed), the six-step manual smoke in THIN-SLICE.md §Success criterion would now pass when the human runs it"

  - "REVIEW block 5 — confirm the REST handler is genuinely ≤20 lines (cat it and count); confirm the `?render=server` toggle defaults OFF (a curl without the query param gets JSON Diagnostic, with the param gets a rendered string); confirm the CLI binary does not import reqwest or any HTTP client (grep its imports — only `rubix_tools::system::disk::probe` and `starter_i18n::MessageBundle` should appear from the rubix side); confirm `--json` truly dumps raw structured data not a stringified version; confirm `LANG=` (empty) on the CLI falls back to `en` not panic; confirm no code in this block touches rubix-client; confirm the rest_disk_test asserts the Accept-Language paths produce different rendered strings (catches the regression where the renderer ignored the header); confirm the human's six-step smoke from THIN-SLICE.md §Success criterion is now actually runnable end-to-end (boot, login, curl with Accept-Language, claude-desktop call, audit query, ClickHouse query) and document one paragraph in the PR description naming the exact mosquitto/postgres/clickhouse container versions the human can use locally"
