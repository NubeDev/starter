name: rubix-frontend-wire
goal: |
  Wire rubix/frontend to rubix-agent end-to-end over REST + SSE with
  auth, typed hooks, and a worked SSE-driven panel. Lands SSE primitive
  upstream in @nube/starter-client-ts (R2). Creates two new sibling
  React packages — @nube/starter-client-react (Query/Auth/Provider/SSE
  hooks) and @nube/rubix-client-react (typed hooks per endpoint family).
  rubix/frontend then constructs one RubixClient, mounts the three
  providers, ships a /login route, an /extensions route consuming SSE
  for live status, and an /admin/users route exercising write+undo.
  Long-term clean; every future rubix or starter frontend reuses the
  same React-side packages without copy-paste.

stages:
  - "phase A.1 — SSE primitive in starter-client-ts — add packages/starter-client-ts/src/client/stream_json.ts (~120 lines verb file) exposing streamJson<T>(starter, path, opts?): AsyncIterable<T> using EventSource where available with withCredentials true, falling back to fetch + ReadableStream parsing; exponential backoff base 1s cap 30s jitter 10%; emits synthetic reconnecting event on retry; honours AbortController via opts.signal; CSRF unnecessary for SSE per the cookie-only contract; add sibling stream_json.test.ts using EventSource polyfill + fetch-mock asserting parsing + reconnect + abort; export from src/index.ts barrel; pnpm --filter @nube/starter-client-ts typecheck + test green; commit feat(starter-client-ts) streamJson SSE primitive"
  - "phase A.2 — starter-client-react package scaffold — create packages/starter-client-react/ with package.json name @nube/starter-client-react peer-deps react@^19 react-dom@^19 @tanstack/react-query@^5 depends on @nube/starter-client-ts workspace; tsconfig extends starter-client-ts; vitest.config; src/index.ts barrel; src/provider/starter-client-provider.tsx (~80 lines) with StarterClientProvider + useStarterClient hook; src/provider/query-provider.tsx (~40 lines) thin wrapper around QueryClientProvider with staleTime 30s gcTime 5min retry skip-on-401-403; add to pnpm-workspace.yaml; pnpm install + pnpm --filter @nube/starter-client-react typecheck green; commit feat(starter-client-react) scaffold + StarterClientProvider + QueryProvider"
  - "phase A.3 — starter-client-react auth + useEventStream — add packages/starter-client-react/src/provider/auth-provider.tsx (~150 lines) with AuthProvider wrapping useQuery against starter.me() exposing useAuth returning { user, login, logout, isAuthenticated }; login mutation calls starter.login then invalidates me query; logout calls starter.logout then resets cache; configurable unauthenticatedSlot prop rendered when me returns 401; add src/hooks/use-event-stream.ts (~120 lines) bridging streamJson via useSyncExternalStore returning { data, error, status, reconnect } where status is connecting|open|reconnecting|closed|error; stable reconnect identity; cleans up on unmount; sibling tests auth-provider.test.tsx query-provider.test.tsx use-event-stream.test.tsx via react-testing-library + MSW or custom mock EventSource; commit feat(starter-client-react) AuthProvider + useEventStream"
  - "REVIEW gate — Phase A landed — handover names three A commits, confirms cargo+pnpm test green across both starter-client-ts and starter-client-react, confirms public APIs additive (no breaking changes to existing starter-client-ts consumers like rubix-client-ts and the @nube/starter-ui-kit consumers); wait for operator confirmation before Phase B"
  - "phase B.1 — confirm extensions-wire merged + refresh OpenAPI — run git fetch origin master and git log --oneline -20 to confirm whether the rubix-extensions-wire PR has merged (it must be on master so the extensions admin REST + SSE routes are present); if NOT merged raise BLOCKED with a one-paragraph status report and halt; if merged regenerate rubix/openapi.json via the existing rubix/scripts/snapshot-openapi.sh (added by the rubix-client-ts job); run pnpm --filter @nube/rubix-client-ts codegen to refresh src/generated/index.ts; commit chore(rubix-client-ts) refresh openapi.json snapshot post-extensions if there is a diff otherwise mark git as skipped — no diff"
  - "phase B.2 — rubix-client-ts extensions endpoint + streamExtensionEvents — add packages/rubix-client-ts/src/endpoints/extensions.ts with extensionsList + extensionsGet + extensionsStart + extensionsStop + extensionsRestart + extensionsEnable + extensionsDisable (each writing endpoint uses readCsrfHeader); add streamExtensionEvents(opts?): AsyncIterable<ExtensionEvent> wrapping streamJson against /api/v1/extensions/events with ExtensionEvent as discriminated union (lifecycle|log|error) typed from codegen output; sibling extensions.test.ts covering each method; update src/endpoints/index.ts barrel; pnpm --filter @nube/rubix-client-ts typecheck + test green; commit feat(rubix-client-ts) extensions REST + SSE endpoints"
  - "phase B.3 — rubix-client-react package scaffold + provider — create packages/rubix-client-react/ with package.json name @nube/rubix-client-react peer-deps as above depends on @nube/rubix-client-ts + @nube/starter-client-react workspace; tsconfig + vitest.config; src/index.ts barrel; src/provider/rubix-client-provider.tsx exposing RubixClientProvider({ client, children }) wrapping StarterClientProvider internally + useRubixClient hook; add to pnpm-workspace.yaml; sibling rubix-client-provider.test.tsx; pnpm --filter @nube/rubix-client-react typecheck + test green; commit feat(rubix-client-react) scaffold + provider"
  - "phase B.4 — rubix-client-react read hooks (system + users + tools/list + extensions) — add src/hooks/system.ts (useDiskUsage + useDbHealth + useFlowErrors) with query keys ['rubix','system',...]; src/hooks/users.ts (useUserList + useUserCreate + useUserDisable mutations invalidating ['rubix','users']); src/hooks/mcp.ts (useToolsList); src/hooks/extensions.ts (useExtensionsList + useExtensionStart/Stop/Restart/Enable/Disable mutations); src/hooks/use-extension-events.ts (useExtensionEvents wrapping useEventStream against streamExtensionEvents returning { events, status, reconnect }); sibling .test.tsx per file covering happy + error + invalidation; commit feat(rubix-client-react) read hooks for system/users/mcp/extensions"
  - "phase B.5 — rubix-client-react remaining hooks (teams/tenants/clickhouse/flow-ops/undo/audit) — add src/hooks/teams.ts tenants.ts clickhouse.ts flow-ops.ts undo.ts audit.ts each mirroring the rubix-client-ts endpoint family shape with sibling .test.tsx; document the query-key convention ['rubix', <family>, ...] in the package README; pnpm --filter @nube/rubix-client-react typecheck + test green; commit feat(rubix-client-react) remaining hook families"
