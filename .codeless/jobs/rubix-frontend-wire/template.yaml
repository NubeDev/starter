  - "phase C.2 — frontend providers + login route + auth guard — wrap rubix/frontend/src/main.tsx in <QueryClientProvider><RubixClientProvider client={getRubixClient()}><AuthProvider unauthenticatedSlot={<LoginRoute/>}><RouterProvider .../></AuthProvider></RubixClientProvider></QueryClientProvider>; add src/routes/login.tsx rendering email/password form using starter-ui-kit primitives calling useAuth().login(...) redirecting to ?returnTo or /; per SCOPE OQ-4 use layout-level auth guard (one wrapping component around authed routes not per-route); per SCOPE OQ-3 include <ReactQueryDevtools/> behind import.meta.env.DEV; pnpm --filter @nube/rubix-frontend typecheck + test green; commit feat(rubix-frontend) providers wired + login route + auth guard"
  - "phase C.3 — dashboard real data + extensions route + users admin route + error boundary — swap the existing boot-intro / dashboard tile mock data for useDiskUsage() returning live percent; add src/routes/extensions.tsx rendering useExtensionsList() table + useExtensionEvents() live status badges + start/stop buttons calling useExtensionStart/Stop/Restart (the SSE worked example); add src/routes/admin/users.tsx with useUserList() + useUserCreate() form + useUserDisable() action plus undo button calling useUndoLast(); add src/components/error-boundary.tsx catching RubixError from queries/mutations rendering localised code via react-intl with the catalogue keys synced in C.1; pnpm --filter @nube/rubix-frontend typecheck + test green; commit feat(rubix-frontend) real dashboard + extensions + users routes + error boundary"
  - "phase C.4 — playwright e2e specs — extend rubix/frontend/e2e/ with auth.spec.ts (login → dashboard renders → logout → login route shows again); extensions.spec.ts (list renders, start button transitions row state via SSE within 5s); users.spec.ts (create flow lands, list reflects, undo via UI button reverts); each spec assumes a running rubix-agent on 127.0.0.1:8088 with the bootstrap user; document the required mani run demo prerequisite at the top of each spec; pnpm --filter @nube/rubix-frontend e2e green (against a running backend); commit test(rubix-frontend) playwright specs for auth + extensions + users"
  - "REVIEW gate — Phase C landed — handover names four C commits, shows one operator-runnable manual flow (mani run demo → pnpm --filter @nube/rubix-frontend dev → browse http://localhost:5173 → login → see live disk percent → start an extension → see row transition via SSE → create a user → undo → see list shrink); confirm before Phase D"
  - "phase D — closing docs + CI + PR — add packages/starter-client-react/README.md and packages/rubix-client-react/README.md present-tense covering provider hierarchy + hook patterns + query-key convention; append a Streaming section to packages/starter-client-ts/README.md pointing at streamJson; rewrite rubix/docs/design/frontend/README.md from placeholder to present-tense covering chassis architecture + client-ts vs client-react vs frontend layering + proxy + env conventions + SSE worked example; add rubix/docs/sessions/<today>-frontend-wired.md closing session note with per-phase summary + operator-runnable manual flow + test counts; extend the existing CI workflows to typecheck+test the two new packages and to run the three new e2e specs (the playwright job needs mani run demo or equivalent backend in the background — pattern after any existing e2e workflow if present); confirm with operator the PR shape is one PR off codeless/rubix-frontend-wire reviewed phase-by-phase; on confirmation run gh pr create --base master --head codeless/rubix-frontend-wire with title feat(rubix-frontend) wire REST + SSE end-to-end + starter-client-react + rubix-client-react upstream and body summarising each phase with commits listed; commit chore(docs+ci) close out frontend wiring + open PR"
