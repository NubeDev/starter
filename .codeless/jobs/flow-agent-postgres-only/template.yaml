name: flow-agent-postgres-only
goal: |
  Make examples/flow-agent Postgres-only per
  DOCS/storage/ADR-001-flow-agent-postgres-only.md. Port the
  starter-store-sqlite::flow module to starter-store-postgres
  (preserving the starter-flow-spi trait surface), port
  starter-prefs to Postgres so the example needs no side-SQLite,
  rewire the example, switch its tests to the existing
  testcontainers helper, and delete the example's SQLite
  migrations. Do not remove SQLite from any library crate. Five
  stages, two REVIEW gates (after slice B and after slice D).
  ADR-1 through ADR-7 hold by construction.

stages:
  - "stage 1 (slice A) — starter-store-postgres::flow, small files first: add a flow feature on crates/starter-store-postgres/Cargo.toml that enables sqlx/chrono, sqlx/json, and sqlx/uuid (audit which of these are already pulled by agent-session and only add the missing ones); land crates/starter-store-postgres/src/flow/ behind #[cfg(feature = \"flow\")] with mod.rs (re-exports mirroring starter-store-sqlite::flow), schema.rs (JSON ser/de + type-conversion helpers), flow_store.rs (PgFlowStore implementing FlowStore from starter-flow-spi), run_store.rs (PgRunStore implementing RunStore), and session_store.rs (PgSessionStore implementing SessionStore); land crates/starter-store-postgres/migrations/flow/0001_init.sql as a Postgres dialect rewrite of the SQLite twin (JSONB for body_json/graph_json, TIMESTAMPTZ NOT NULL DEFAULT NOW() for timestamps, BOOLEAN for booleans, $N placeholders, explicit ON CONFLICT target columns where used); port the SQLite suite's unit/integration tests for these three stores into crates/starter-store-postgres/tests/flow_store.rs etc. using testing::with_database() via the testing feature; export FLOW_MIGRATION_SOURCE from the new module mirroring starter-store-sqlite's pattern; do NOT touch starter-store-sqlite or any consumer crate — slice A is purely additive on starter-store-postgres"

  - "stage 2 (slice B) — port agent_session_store.rs (the 716-LOC one): port crates/starter-store-sqlite/src/flow/agent_session_store.rs to crates/starter-store-postgres/src/flow/agent_session_store.rs; this is the highest-risk file in the job — JSONB path operators (-> / ->> / jsonb_set vs SQLite json_extract / json_set with different null semantics), TIMESTAMPTZ arithmetic (NOW() + interval vs datetime('now', '+5 minutes')), and any ON CONFLICT upsert chain need explicit conflict-target columns; land crates/starter-store-postgres/migrations/agent_sessions/ as a Postgres-dialect rewrite (mirror the SQLite migration files one-for-one); confirm the existing agent-session feature on starter-store-postgres already enables what flow + agent-session need together (it should — that's why it pre-existed) and extend if not; export AGENT_SESSION_MIGRATION_SOURCE from the new module mirroring starter-store-sqlite's pattern; port the SQLite agent_session_store test suite to a parallel Postgres test file using testing::with_database(); the handover at the end of this stage MUST include a section titled 'semantics-changed queries' enumerating every query whose semantics (not just syntax) changed during the port, with a one-line justification per query — this is what the next REVIEW gate reads"

  - REVIEW slice A+B — confirm the new starter-store-postgres::flow module satisfies the starter-flow-spi traits with no public-API drift; confirm cargo test -p starter-store-postgres --features 'flow agent-session testing' -- --ignored is green; read the 'semantics-changed queries' section in handover.md and verify each justification is sound (drift here compounds in every later slice); confirm starter-store-sqlite is unchanged (git diff against master on that crate is empty)

  - "stage 3 (slice C) — starter-prefs Postgres backend: add a postgres feature on crates/starter-prefs/Cargo.toml parallel to the existing sqlite feature (consumers can pick one or both); implement crates/starter-prefs/src/store/postgres.rs (or whatever mirrors the SQLite layout — read the existing structure first) with PgPrefsStore exposing the same public methods and error semantics as SqlitePrefsStore; land crates/starter-prefs/migrations/postgres/ as a dialect rewrite of the SQLite migrations; if the prefs schema has SQLite-specific tricks (rowid semantics, INTEGER affinity quirks) the audit in stage 1's handover identified, handle them explicitly — do not silently change semantics; port the SQLite test suite to a parallel Postgres test file; confirm cargo test -p starter-prefs --features sqlite (existing tests) still green and cargo test -p starter-prefs --features postgres (new tests) green; do NOT touch examples/flow-agent yet — slice C is library-only"

  - "stage 4 (slice D) — rewire examples/flow-agent: change one file at a time and compile after every file to use the type-error trail as a safety net; examples/flow-agent/Cargo.toml — drop starter-store-sqlite, drop sqlx's sqlite feature, add starter-store-postgres = { workspace = true, features = [\"flow\", \"agent-session\"] }, add sqlx postgres feature, switch starter-prefs features from [\"routes\", \"sqlite\"] to [\"routes\", \"postgres\"]; rewrite examples/flow-agent/migrations/flow_agent/0001_init.sql in Postgres dialect (JSONB graph_json/tools_json/trace_json, TIMESTAMPTZ NOT NULL DEFAULT NOW() created_at/updated_at/started_at/finished_at, $N placeholders, explicit ON CONFLICT targets); examples/flow-agent/src/store.rs — SqlitePool → PgPool in all three structs (FlowStore, AgentStore, RunStore), rewrite every query placeholder ?N → $N, swap timestamp bindings to chrono::DateTime<Utc>, swap JSON column bindings to serde_json::Value; examples/flow-agent/src/main.rs — remove DEFAULT_DATABASE_URL, require DATABASE_URL with a clear error message naming the env var verbatim, swap starter_store_sqlite::pool → starter_store_postgres::pool; examples/flow-agent/src/server.rs — SqliteAgentSessionStore → PgAgentSessionStore, SqlitePrefsStore → PgPrefsStore; examples/flow-agent/src/migrations.rs — switch migration sources to the new Postgres modules; switch examples/flow-agent/tests/agent_tool_bridge.rs and examples/flow-agent/tests/insights_agent_tools.rs from sqlite::memory: to starter_store_postgres::testing::with_database, mark #[ignore] consistent with other Postgres tests; cargo run -p flow-agent against a local docker postgres must boot cleanly; cargo test -p flow-agent -- --ignored must pass against the testcontainers helper"

  - REVIEW slice D — confirm flow-agent builds, boots, and passes its #[ignore] test suite end-to-end against a real Postgres; capture a manual smoke transcript in handover.md (docker run postgres, cargo run -p flow-agent, create a flow via REST, fire it, see SSE land — full transcript); enumerate every SQLite artefact about to be deleted in slice E; this gate exists because deletion is irreversible without revert and the goal is single-backend, not 90% single-backend

  - "stage 5 (slice E) — deletion and final sweep: confirm cargo tree -p flow-agent -e features | grep -i sqlite returns nothing reachable from flow-agent; confirm cargo metadata --format-version 1 shows no transitive sqlx-sqlite reachable from the flow-agent crate node; remove any orphan files in examples/flow-agent/migrations/flow_agent/ that the Postgres rewrite left behind; if the audit at stage 1 identified other SQLite-only constants/types in flow-agent's source that the rewire left dangling, remove them now; cargo test --workspace green; cargo clippy --workspace --all-features -- -D warnings green; cargo fmt --check green; end-to-end smoke transcript (boot + create flow + fire flow + SSE) captured in the final handover; the handover for this stage doubles as the job's exit summary — what was ported, what queries changed semantics, what was left in starter-store-sqlite, what follow-ups (e.g. SPI conformance test suite) are deferred"
