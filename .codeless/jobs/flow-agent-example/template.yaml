name: flow-agent-example
goal: |
  Finish the flow-agent example at `examples/flow-agent/`. Phase 1
  already shipped (Rust binary boots, REST + SQLite + SPA scaffold
  in commit 83e48e8). This job carries the work from there to a
  polished end-to-end demo: a visual flow editor, a live AI agent
  chat surface, and an agent-as-tool bridge — all over SSE + REST
  with no login, on top of the existing starter-flow + starter-ai
  + starter-ui-* libraries. The Apple-modern shadcn aesthetic in
  the example SCOPE F6 checklist is the last pass; functional
  correctness comes first.

stages:
  - 'stage 1 — wire `<FlowCanvas>` in `examples/flow-agent/frontend/src/pages/FlowEditor.tsx` against the existing `GET /api/flows/{id}` + `PUT /api/flows/{id}` endpoints. Build a `NodeKindRegistry` at module scope seeded with `BUILTIN_NODE_KINDS` from `@nube/starter-ui-flow`. The editor: (a) loads the flow via react-query; (b) feeds the graph + `onChange` into `<FlowCanvas>`; (c) tracks a dirty flag; (d) exposes a Save button that PUTs with the current `version` and refetches; (e) surfaces optimistic-lock 409 as a non-destructive toast (keep edits, reload server graph behind a confirm). Include a minimal `<NodePalette>` strip across the top of the canvas so a user can insert nodes; persist node `position` round-trips through `graph_json`. No engine wiring yet — saving a graph with a `trigger`/`ai-agent`/`log` set is fine. `pnpm typecheck` green; manual smoke: create a flow, place three nodes, connect them, reload, see the same graph.'
  - 'stage 2 — replace the `fire_flow` stub in `examples/flow-agent/src/rest.rs` with a real run via `starter-flow`. Add `src/flow_engine.rs`: (a) parse the stored `graph_json` into a `FlowTopology` (matching the structural pattern used by `examples/notes/src/flow_demo.rs`); (b) own a shared `StaticTriggerChannelRegistry`, `StaticAiRunnerRegistry` (Claude runner registered under `anthropic.claude`), and `StaticToolRegistry`; (c) expose `fire(flow_id, payload)` returning a `RunId` + a stream of `RunEvent`s. The REST handler records the run in the existing `runs` table, fires the trigger, drives the engine to completion in a spawned task, and pumps `RunEvent::{RunStarted, NodeStatus, EdgeActive, RunFinished}` onto `EventHub.runs`. Terminal status persists via `RunStore::record_finished`. If the graph has no trigger or fails to materialise a `FlowTopology`, return 422 with a clear error. `cargo build -p flow-agent` green; manual smoke: `curl -X POST /api/flows/{id}/fire -d {"payload":{"prompt":"hi"}}` against a trigger→ai-agent→log graph returns 202; `GET /api/flows/{id}/runs` shows the run move from `running` to `ok` (or `error`).'
  - 'stage 3 — wire the existing `GET /api/flows/{id}/events` SSE channel into the editor. In `FlowEditor.tsx`, subscribe via `useSse` to that endpoint and reduce events into a `RunOverlay`-shaped state: `nodes: Record<NodeId, "running" | "ok" | "error">` and `activeEdges: Set<EdgeId>`. Pass it as `<FlowCanvas overlay={overlay} />`. Add a "Run" button next to Save that POSTs `/fire` and shows the live overlay; clear the overlay on `RunFinished` after a 1s grace so the user sees the terminal frame. Show recent runs (last 10) in a side panel below the canvas with status badge + timestamp from `GET /api/flows/{id}/runs`. `pnpm typecheck` green; manual smoke: fire a flow, watch edges animate + nodes shift colour, see the run land in the panel.'
  - 'stage 4 — agents chat surface. Backend: add `POST /api/agents/{id}/run` (SSE response) in `rest.rs` driven by a new `src/ai_runtime.rs` module that resolves the agent''s `provider` → `AiRunner` via `starter-ai::registry::Registry::with_defaults()` and streams Anthropic/Claude deltas as `{type:"text",text}` / `{type:"tool-call",...}` / `[DONE]` SSE frames — matching the default `createSseAdapter` parser in `@nube/starter-ui-chat`. Frontend: replace the Phase 1 stub in `AgentChat.tsx` with `<Chat adapter={createSseAdapter({url})} />` from `@nube/starter-ui-chat`. Conversations are not persisted yet — react-query cache only. Settings page surfaces a read-only list of detected providers (Claude CLI session, `ANTHROPIC_API_KEY`, `OPENAI_API_KEY`) so the user can see why an agent failed if the provider is unavailable. `cargo build -p flow-agent` + `pnpm typecheck` green; manual smoke: create a Claude agent, send "say hi", see streamed tokens.'
  - 'REVIEW — gate before the agent-as-tool bridge. Confirm in the handover: (1) the SSE chat stream is robust under disconnects (browser tab backgrounded, network blip); (2) the run-event overlay does not leak subscribers across navigations; (3) the surface area named in stages 1–4 matches what the example SCOPE.md describes — no scope drift. The user reads the handover, OKs, and the runner advances to the bridge stage. If anything looks off, fix in a follow-up stage 5b before stage 5 proper.'
  - 'stage 5 — agent-as-tool bridge. In `src/ai_runtime.rs`, before each agent run, read all flows from `FlowStore::list()` and synthesise an `AiTool` per flow with `name = format!("flow:{}", flow.id)`, `description = flow.description.unwrap_or(flow.name)`, and an `input_schema` derived from the flow''s trigger payload shape (start permissive — `{type:"object",additionalProperties:true}` is fine if shape inference is hard). Pass the synthesised tool set to the `AiRunner` only if the agent''s `tools` array contains `flow:*` entries (or `flow:<id>` matches). When the agent emits a tool call against a `flow:*` name, the runtime calls into `flow_engine::fire` with the tool-call arguments as the payload, awaits the run''s terminal output, and returns it as the tool result string. Agent-fired runs land on the same `EventHub.runs` channel — opening that flow in the editor shows the live overlay. Unit-style integration test in `examples/flow-agent/tests/agent_tool_bridge.rs` against a recording AI runner: an agent with `tools=["flow:<id>"]` of a `trigger.explicit → log` flow successfully invokes the flow and receives the log output. `cargo test -p flow-agent` green; manual smoke: create a flow that just logs its input, create an agent with that flow as a tool, ask it to "run my flow with input ''hello''", see the tool call happen and the log output return.'
  - 'stage 6 — sidebar primitive upstream + nested tree. (a) Add a `Sidebar` primitive to `@nube/starter-ui-kit` at `packages/starter-ui-kit/src/components/ui/sidebar.tsx` (≤ 400 lines), exporting `Sidebar`, `SidebarProvider`, `SidebarHeader`, `SidebarContent`, `SidebarGroup`, `SidebarGroupLabel`, `SidebarItem`, and `SidebarTree` for nested expand/collapse — composing existing radix `Collapsible` and `ScrollArea` primitives. Sidebar open/collapsed state lives in a cookie (`sidebar_state`) per `SIDEBAR.md` §1. Add the primitive to `src/index.ts` exports. (b) Replace the Phase 1 flat sidebar in `examples/flow-agent/frontend/src/layout/Sidebar.tsx` with a nested tree: top-level `Flows` and `Agents` groups, each expandable, with live items driven by react-query + the existing `GET /api/events` SSE channel (`FlowCreated` / `FlowRenamed` / `FlowDeleted` / `Agent*` events). (c) Persist expanded group paths + active section in `useUiStore` via `partialize` per `SIDEBAR.md` §2–§3 (single localStorage key `"fa-ui"`). (d) Collapse to icon-rail at ≤ 1024 px width. `pnpm typecheck` green across `starter-ui-kit` and the example; manual smoke: expand Flows, refresh, still expanded; create a flow elsewhere, see it appear in the sidebar without polling.'
  - 'stage 7 — F6 visual polish. Tick every box in `examples/flow-agent/SCOPE.md` §"F6 acceptance checklist": frosted-glass sticky topbar at 56 px; sidebar icon-rail at ≤ 1024 px; tree caret 90° rotation with 150 ms ease-out; selected nav uses `bg-accent/60` (never solid primary); cards `rounded-xl shadow-sm border-border/60`; no raw hex colours in TSX; system font stack; macOS-style chat bubble alignment (user right, assistant left, 70 % max width); FlowCanvas background uses `--background` token; empty states have centred illustration slot + one-line helper + primary action. Add a `README.md` to `examples/flow-agent/` documenting `cargo run -p flow-agent` + `pnpm --filter flow-agent-frontend dev`. `pnpm typecheck`, `cargo build -p flow-agent`, and `cargo clippy -p flow-agent -- -D warnings` all green; manual visual check in both light and dark mode.'
