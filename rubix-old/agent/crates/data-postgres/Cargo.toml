[package]
name        = "rubix-data-postgres"
description = "rubix agent — Postgres data layer. Phase-0 skeleton; path-deps starter-store-postgres so future rubix schemas land alongside the starter dimension / flow stores."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Phase-0 contract (Stage 2):
#  * Production dep: starter-store-postgres (pool + namespaced
#    migrations + paging — the same building blocks Phase 1+ will
#    use to land rubix-owned schemas).
#  * Dev dep: starter-store-postgres with the `testing` feature
#    enabled so the integration test under tests/ can call
#    `starter_store_postgres::testing::with_database()` to boot a
#    real Postgres testcontainer. Keeping the testing feature in
#    dev-deps only means downstream consumers of this crate pay
#    zero testcontainer compile cost.
[dependencies]
starter-store-postgres = { workspace = true }

[dev-dependencies]
starter-store-postgres = { workspace = true, features = ["testing"] }
sqlx                   = { workspace = true, features = ["postgres", "macros", "runtime-tokio"] }
tokio                  = { workspace = true, features = ["macros", "rt-multi-thread"] }
