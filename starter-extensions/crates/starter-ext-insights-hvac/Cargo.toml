[package]
name        = "starter-ext-insights-hvac"
description = "Insights rule pack — HVAC. pmv.comfort@1, setpoint.drift@1, short-cycle@1 + hvac.quality.* flags. Per DOCS/Insights/SCOPE.md Phase 3."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Rule packs depend on `starter-spi` only (D1).
[dependencies]
starter-spi = { workspace = true }
async-trait = { workspace = true }
serde_json  = { workspace = true }
chrono      = { version = "0.4", default-features = false, features = ["clock"] }
