[package]
name        = "starter-ext-spi"
description = "starter-extensions — contracts crate. Wire types, traits, manifest schema. Zero runtime logic, zero I/O."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# R2: this crate is the lowest-common-denominator of the
# starter-extensions workspace. It depends only on `starter-spi`
# (the cross-workspace seam, see DOCS/extensions/scope/SCOPE.md
# "Relationship to starter") plus pure-type third-party building blocks.
# No HTTP, no SQL, no process spawning, no async runtime, no I/O.
[dependencies]
starter-spi = { workspace = true }

serde       = { workspace = true }
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
thiserror   = { workspace = true }
semver      = { workspace = true }

[dev-dependencies]
serde_json  = { workspace = true }
serde_yaml  = { workspace = true }
