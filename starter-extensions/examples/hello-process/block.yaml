v: 1
id: com.acme.hello
version: 0.1.0
display_name: "Hello (process)"
description_file: docs/README.md
authors: ["ap@nube-io.com"]

# SCOPE R1 / "One source, three flavours": the trait impl matches
# hello-builtin verbatim. Only `runtime.kind` and `runtime.bin` change.
runtime:
  kind: process
  bin: hello-process

supervision:
  restart: on_crash
  max_restarts: 5
  within_seconds: 60
  backoff: { initial_ms: 200, max_ms: 30000, jitter: true }
  health:  { interval_ms: 5000, timeout_ms: 2000 }
  shutdown_grace_ms: 5000

contributes:
  tools:
    - id: com.acme.hello.echo
      input_schema:  schemas/echo_in.json
      output_schema: schemas/echo_out.json
      description_file: docs/echo.md
