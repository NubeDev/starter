[package]
name        = "starter-i18n"
description = "starter — internationalisation: catalog loader, language negotiation, translate bundle. See DOCS/user/scope/SCOPE.md Phase 3."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Workspace policy posture: default-features = []. A consumer that does
# not opt into `routes` gets the locale-negotiation + catalog-loader
# core only; no axum / no tower. Diagnostics rewriter lands at
# Phase 5 behind its own (default-off) `diagnostics` feature.
[features]
default = []
# `routes` pulls in the REST surface (GET /v1/i18n/catalogs/{lang},
# GET /v1/i18n/manifest) plus the Accept-Language tower middleware.
# Owned by SCOPE.md Phase 3 + the "API surface" block.
routes = ["dep:axum", "dep:http", "dep:tower", "dep:futures", "dep:async-trait"]
# `units` enables the `DiagnosticParam::Quantity` render branch in
# the typed interpolator. Consumers that emit Quantity-typed
# diagnostic params (rubix's MCP + CLI surfaces, any caller of
# `MessageBundle::render_diagnostic` with prefs-aware Quantity
# formatting) turn this on; pure-string consumers leave it off and
# pay zero extra deps.
units = ["starter-spi/units"]
# `preferences` enables `MessageBundle::render_diagnostic` — the
# prefs-aware renderer that converts canonical Quantity params into
# the caller's preferred unit and Timestamp params into the
# caller's timezone + date/time format. Implies `units`; pulls
# `chrono` + `chrono-tz` for timezone-aware formatting.
preferences = [
    "units",
    "starter-spi/preferences",
    "dep:chrono",
    "dep:chrono-tz",
]
# Phase 5 — scope-limited diagnostics rewriter (opt-in response
# extension). Builds on the same axum / tower stack as `routes`;
# also pulls in `http-body-util` + `bytes` because the rewriter
# buffers and re-emits the response body in the narrow case where
# a handler opts in via the `DiagnosticBody` extension. Default-off
# per SCOPE D-5.1; binaries that ship the rewriter typically also
# enable `routes` so the `Accept-Language` middleware threads a
# `LocaleCtx` upstream.
diagnostics = [
    "dep:axum",
    "dep:http",
    "dep:tower",
    "dep:futures",
    "dep:async-trait",
    "dep:http-body-util",
    "dep:bytes",
]

[dependencies]
starter-spi = { workspace = true, features = ["i18n"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
utoipa      = { workspace = true }
tracing     = { workspace = true }

# BCP-47 parsing. Used by `locale::pick_language` for the family /
# fallback walk (per SCOPE R5). `starter-spi` exposes `LanguageTag`
# but the negotiation logic needs to introspect the underlying
# `LanguageIdentifier`, so we depend on the same crate directly.
icu_locale_core = { workspace = true }

# Catalog fingerprinting for content-hash URLs (SCOPE Phase 3 +
# "Decisions" — sha256 hex prefix, 16 chars).
sha2 = { workspace = true }

# Catalog loader / bundle error types (`CatalogError`).
thiserror = { workspace = true }

# `routes` feature deps — only compiled when the `routes` feature is
# active.
axum        = { workspace = true, optional = true }
http        = { workspace = true, optional = true }
tower       = { workspace = true, optional = true }
futures     = { workspace = true, optional = true }
async-trait = { workspace = true, optional = true }

# `preferences` feature deps — timezone-aware timestamp formatting
# in `MessageBundle::render_diagnostic`. Both are pulled by the
# `preferences` feature flag above.
chrono      = { workspace = true, optional = true }
chrono-tz   = { workspace = true, optional = true }

# `diagnostics` feature deps — body buffering for the opt-in
# rewriter. Both are also pulled in transitively by axum, but
# declaring them here keeps the dep-graph honest.
http-body-util = { version = "0.1", optional = true }
bytes          = { workspace = true, optional = true }

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
http-body-util = "0.1"
# Stage 21 — `tests/add_a_language.rs` drives the `routes` feature's
# Router via tower::ServiceExt and decodes JSON bodies. These are
# already pulled in as feature-gated deps above; declaring them under
# `[dev-dependencies]` keeps the integration test buildable when the
# `routes` feature is enabled at test time.
tower      = { workspace = true }
http       = { workspace = true }
axum       = { workspace = true }
serde_json = { workspace = true }

[lints]
workspace = true
