[package]
name        = "starter-smoke-tests"
description = "starter — Stage 9 smoke tests for the starter-tool-* / starter-service-* family. Exercises the five design checks from DOCS/tools/scope/SCOPE.md against every shipped provider crate. No public API; the only build artefact is the test binaries under `tests/`."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish     = false

# Lives in the workspace but ships nothing — `lib.rs` is empty.
# Everything load-bearing is under `tests/`, where each smoke test from
# the SCOPE doc gets its own integration-test binary so a failure
# names the specific design check that broke.
[lib]
path = "src/lib.rs"

# Dev-dependencies only: smoke tests load every shipped provider crate
# but consumers of the workspace never depend on `smoke-tests` itself.
# `starter-spi` re-exports `SecretString`, so we never name `secrecy`
# here — R5 applies to smoke tests too.
[dev-dependencies]
starter-spi              = { workspace = true }
starter-secrets-file     = { workspace = true }
starter-secrets-keyring  = { workspace = true }
starter-tool-slack       = { workspace = true }
starter-service-slack    = { workspace = true }
starter-tool-telegram    = { workspace = true }
starter-service-telegram = { workspace = true }
starter-tool-gmail       = { workspace = true }

# Phase 3 stage 9 — Flow SCOPE smokes. The four smokes wire together
# the Phase 3 surface (`FlowAsTool` / `FlowAsService`), the engine,
# the SQLite SPI store (real, behind the default-off `flow` feature),
# and the four wire transports per D-F3.6.
starter-flow             = { workspace = true }
starter-flow-spi         = { workspace = true }
starter-flow-surfaces    = { workspace = true }
starter-store-sqlite     = { workspace = true, features = ["flow", "testing"] }
starter-mcp              = { workspace = true, features = ["testing"] }
starter-grpc             = { workspace = true, features = ["testing"] }
starter-jsonrpc-stdio    = { workspace = true }
starter-server           = { workspace = true, features = ["testing"] }

tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "process"] }
async-trait = { workspace = true }
prometheus  = { workspace = true }
serde_json  = { workspace = true }
tempfile    = "3"
sqlx        = { workspace = true, features = ["sqlite", "macros", "runtime-tokio"] }
futures     = { workspace = true }
tonic       = { workspace = true }
tower       = { workspace = true }
axum        = { workspace = true }
tokio-stream = "0.1"
http-body-util = "0.1"
