[package]
name        = "starter-server"
description = "starter — axum app builder, OpenAPI emission, SSE helpers, testing harness."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi           = { workspace = true }
starter-observability = { workspace = true }
axum                  = { workspace = true }
tokio                 = { workspace = true }
tower                 = { workspace = true }
tower-http            = { workspace = true }
http                  = { workspace = true }
utoipa                = { workspace = true }
serde                 = { workspace = true }
serde_json            = { workspace = true }
tracing               = { workspace = true }
futures               = { workspace = true }
bytes                 = { workspace = true }
async-trait           = { workspace = true }
uuid                  = { workspace = true }
prometheus            = { workspace = true }

[features]
default = []
# Exposes `starter_server::testing` — opt-in so production builds don't
# pull the harness.
testing = []

[dev-dependencies]
tokio              = { workspace = true, features = ["macros", "rt-multi-thread"] }
reqwest            = { workspace = true }
http-body-util     = "0.1"
tracing-subscriber = { workspace = true }
# Stage 21 — `tests/australian_operator.rs` builds an in-process
# axum app exercising the Accept-Units middleware end-to-end. The
# integration test needs the same shapes the middleware crate already
# pulls in (tower::ServiceExt for `oneshot`, async-trait for the
# `PrefsResolverFor` stub, serde derives for the query DTO).
tower       = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
starter-spi = { workspace = true }
