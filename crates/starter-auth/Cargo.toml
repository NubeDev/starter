[package]
name        = "starter-auth"
description = "starter — default Authenticator: argon2 passwords, cookie sessions for browsers, API tokens for machines."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
axum        = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
# Backend pools — both gated. A consumer picks one or both via the
# `sqlite` / `postgres` features below.
sqlx        = { workspace = true, optional = true }

[features]
# Off by default so a consumer who pulls `starter-auth = "0.1"` opts
# into a backend explicitly.
default  = []
sqlite   = ["sqlx", "sqlx/sqlite"]
postgres = ["sqlx", "sqlx/postgres"]
