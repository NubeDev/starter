[package]
name        = "starter-service-telegram"
description = "starter — inbound Telegram Service implementing the Bot API long-poll. Sibling crate to starter-tool-telegram; see DOCS/tools/scope/SCOPE.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# R7 (observability is required) + R8 (no transitive vendor SDKs in
# starter-spi) — the only starter-side deps are starter-spi and
# starter-observability. Everything else is third-party.
[dependencies]
starter-spi           = { workspace = true }
starter-observability = { workspace = true }

reqwest     = { workspace = true }
tokio       = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "sync", "time"] }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
prometheus  = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
wiremock = "0.6"
