[package]
name        = "starter-store-warehouse"
description = "starter — typed building blocks (client, namespaced migrations, typed write paths) over the official `clickhouse` Rust crate. Owns the warehouse L1/L2 history tables and the entities_dict bridge per ADR-003."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# ADR-003 pins the official `clickhouse` Rust crate (HTTP +
# RowBinary). `klickhouse` is explicitly NOT used. `chrono` and
# `serde` features mirror what the typed row structs need.
# `rustls-tls-webpki-roots` keeps the TLS path on rustls (no
# OpenSSL) and matches what the rest of the workspace uses for
# `reqwest`.
clickhouse  = { version = "0.13", default-features = false, features = ["lz4", "chrono", "uuid"] }

# Stage 2 of warehouse-engine-swap: sqlx + Postgres so the
# `tsdb` submodule can drive TimescaleDB via PgPool. The legacy
# ClickHouse paths above stay in-tree until Stage 3 deletes them.
sqlx        = { workspace = true, features = ["postgres", "macros", "migrate", "chrono", "json", "uuid"] }
futures     = "0.3"

starter-tags = { workspace = true }

tokio       = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
chrono      = { workspace = true }
uuid        = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }

# `testing` feature — testcontainers + the community ClickHouse
# module plus the Postgres module (TimescaleDB image runs through
# the generic-image escape hatch on the Postgres module). Pinned to
# testcontainers 0.23 + testcontainers-modules 0.11 to match the
# Postgres twin (`starter-store-postgres`).
testcontainers         = { version = "0.23", optional = true }
testcontainers-modules = { version = "0.11", features = ["clickhouse", "postgres"], optional = true }

[features]
default = []
# Pulls testcontainers and exposes both `testing::with_clickhouse`
# and `testing::with_timescale` helpers that mirror
# `starter_store_postgres::testing::with_database`.
testing = ["dep:testcontainers", "dep:testcontainers-modules"]

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tokio-test = "0.4"

[lints]
workspace = true
