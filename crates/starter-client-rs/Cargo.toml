[package]
name        = "starter-client-rs"
description = "starter — Rust HTTP client mirroring starter-server's surface. Shares spi types; zero starter-server dep."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true, features = ["preferences"] }
reqwest     = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }

[features]
default = []
# `mock` exposes a builder for recorded responses, used by CLI tests
# and any consumer wanting to test against a captured server.
mock    = []

[lints]
workspace = true
