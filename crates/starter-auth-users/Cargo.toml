[package]
name        = "starter-auth-users"
description = "starter — multi-user Authenticator: argon2 passwords, cookie sessions for browsers, API tokens for machines."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi   = { workspace = true }
axum          = { workspace = true }
async-trait   = { workspace = true }
serde         = { workspace = true }
serde_json    = { workspace = true }
tracing       = { workspace = true }
thiserror     = { workspace = true }
chrono        = { workspace = true }
uuid          = { workspace = true }
rand          = { workspace = true }
base64        = { workspace = true }
sha2          = { workspace = true }
password-auth = { workspace = true }
http          = { workspace = true }
tower         = { workspace = true }
futures       = { workspace = true }
utoipa        = { workspace = true }

# Backend pools — both gated. A consumer picks one via the
# `sqlite` / `postgres` features below.
sqlx                   = { workspace = true, optional = true }
starter-store-sqlite   = { workspace = true, optional = true }
starter-store-postgres = { workspace = true, optional = true }

[features]
# Off by default so a consumer opts into a backend explicitly. The
# `starter-auth-token` crate is the mutually-exclusive counterpart;
# SCOPE 228–232 says consumers wire exactly one of the two.
default  = []
sqlite   = ["dep:sqlx", "sqlx/sqlite", "dep:starter-store-sqlite"]
postgres = ["dep:sqlx", "sqlx/postgres", "dep:starter-store-postgres"]

[dev-dependencies]
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread"] }
starter-store-sqlite  = { workspace = true, features = ["testing"] }
starter-server        = { workspace = true, features = ["testing"] }
starter-observability = { workspace = true }
starter-ui-theme      = { workspace = true }
prometheus            = { workspace = true }
reqwest               = { workspace = true, features = ["json", "cookies"] }
sqlx                  = { workspace = true, features = ["sqlite", "macros", "migrate"] }
