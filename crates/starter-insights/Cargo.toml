[package]
name        = "starter-insights"
description = "starter — Insights capability. RuleRegistry, QualityFlagRegistry, rule.rust + verdict.join node bodies. Per DOCS/Insights/SCOPE.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi      = { workspace = true }
starter-flow-spi = { workspace = true }
async-trait      = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
tracing          = { workspace = true }
chrono           = { workspace = true }
uuid             = { workspace = true }
tokio            = { workspace = true, features = ["sync", "rt", "macros"] }

# Optional sqlite persistence — verdict log + tag index only (Phase 1).
sqlx                 = { workspace = true, features = ["sqlite", "macros", "migrate"], optional = true }
starter-store-sqlite = { workspace = true, optional = true }

[features]
default = []
# Phase 1 persistence: verdict log + tag index only. No rollups, no
# derivation cache yet (those land in Phase 2+).
sqlite = ["dep:sqlx", "dep:starter-store-sqlite"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlx  = { workspace = true, features = ["sqlite", "macros", "migrate"] }
starter-store-sqlite = { workspace = true, features = ["testing"] }
# IoT rule pack — used by the Phase 1 smoke test that reproduces
# the canonical IoT row end-to-end. Imported via path (not
# workspace dep) because `starter-ext-insights-iot` lives in the
# sibling `starter-extensions` workspace.
starter-ext-insights-iot = { path = "../../starter-extensions/crates/starter-ext-insights-iot", version = "0.1.0" }
