[package]
name        = "starter-warehouse"
description = "starter — warehouse capability crate (W1–W16). Owns the warehouse flow node kinds, REST surface, mart/cleaner/sandbox DDL generators, dimension freshness envelope, catalog GC + audit, and the MCP tool surface. Default-off behind the `warehouse` cargo feature."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
# Tag layer + storage seam (W4 / W11 / W12).
starter-tags             = { workspace = true }
starter-store-postgres   = { workspace = true, features = ["dimensions"], optional = true }
starter-store-clickhouse = { workspace = true, optional = true }
clickhouse = { version = "0.13", default-features = false, features = ["lz4", "chrono"], optional = true }
# Flow SPI (W9).
starter-flow-spi   = { workspace = true, optional = true }
starter-flow-nodes = { workspace = true, optional = true }
# REST surface (W11 envelope, W14 structured 400, W15 manual GC trigger).
starter-server = { workspace = true, optional = true }
starter-authz  = { workspace = true, optional = true }
sqlx           = { workspace = true, features = ["postgres", "macros", "chrono", "json"], optional = true }
axum    = { workspace = true, optional = true }
tower   = { workspace = true, optional = true }
http    = { workspace = true, optional = true }
tokio   = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
tokio-stream = { workspace = true, optional = true }
futures = { workspace = true, optional = true }

# Catalog hashing (W5 `definition_hash`).
sha2  = { workspace = true }
hex   = { version = "0.4" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono     = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
async-trait = { workspace = true }
uuid       = { workspace = true }

[features]
default = []

# The capability is opt-in. Pulls the dimensions-enabled Postgres
# store, the ClickHouse store, the flow SPI, and the REST surface.
warehouse = [
    "dep:starter-store-postgres",
    "dep:starter-store-clickhouse",
    "dep:starter-flow-spi",
    "dep:starter-flow-nodes",
    "dep:starter-server",
    "dep:starter-authz",
    "dep:axum",
    "dep:tower",
    "dep:http",
    "dep:tokio",
    "dep:tokio-stream",
    "dep:futures",
    "dep:sqlx",
    "dep:clickhouse",
]

# Integration tests + testcontainer-backed assertions.
testing = [
    "warehouse",
    "starter-store-postgres/testing",
    "starter-store-clickhouse/testing",
]

# AI agent / MCP tool surface (SCOPE "AI agent / MCP").
mcp = ["warehouse"]

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time"] }
serde_json = { workspace = true }
# Explorer smoke + no-write-path tests drive the axum router via
# `tower::ServiceExt::oneshot` and inspect the response body.
tower            = { workspace = true }
http-body-util   = "0.1"
starter-spi      = { workspace = true }
starter-authz    = { workspace = true }
starter-store-clickhouse = { workspace = true, features = ["testing"] }
