[package]
name        = "starter-spi"
description = "starter — service provider interface. Wire types, errors, traits. Zero internal deps."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# R2: zero internal deps. Only third-party building blocks for the
# type system. No HTTP, no SQL, no runtime logic.
[dependencies]
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
async-trait = { workspace = true }
uuid        = { workspace = true }
chrono      = { workspace = true }
# `bytes::Bytes` and `futures::stream::BoxStream` are the carriers
# the `BlobStore` trait uses for streaming put/get. Both are tiny
# and already in the workspace tree via tokio/axum/aws-sdk-s3 down
# the dep graph; naming them here keeps the spi self-contained
# rather than relying on a transitive feature.
bytes       = { workspace = true }
futures     = { workspace = true }
# Needed for the `mpsc::Sender<Event>` shape `AiRunner::run` uses to
# stream events. The `sync` channel module is pure data structures;
# we just inherit whatever feature set the workspace sets.
tokio       = { workspace = true, features = ["sync", "time", "rt", "macros"] }

# OpenAPI schema derivation. R7: utoipa is the single source of truth
# for wire types; the TS client is codegen'd from the document this
# crate's DTOs produce.
utoipa = { workspace = true }

# `Service`-side additions per DOCS/tools/scope/SCOPE.md.
#
# `prometheus::Registry` is plumbed through `ServiceContext` so provider
# crates register their own metrics against the consumer's registry
# (R7). `secrecy::SecretString` is re-exported at the crate root so
# provider crates don't pull `secrecy` directly (R5). `tracing` is used
# by the `Vec<Arc<dyn EventSink>>` fan-out helper to log-and-continue on
# per-sink errors (D4).
prometheus  = { workspace = true }
secrecy     = { workspace = true }
tracing     = { workspace = true }

# R4 of DOCS/user/scope/SCOPE.md: "Conversion factors are delegated
# to `uom` internally. The registry is the thin serialisable veneer;
# we never hand-write conversion math." Used only by the
# `starter_spi::units` module. Optional + feature-gated per
# F-0.1 of `.codeless/jobs/starter-prefs-i18n/SCOPE.md`: the Phase 0
# landing must not leak `uom` into `starter-flow-spi`'s dep tree.
uom         = { workspace = true, optional = true }

# BCP-47 language-tag parsing — used only by the `starter_spi::i18n`
# module per the SCOPE Library-choices table. Optional + feature-gated
# for the same F-0.1 reason as `uom` above.
icu_locale_core = { workspace = true, optional = true }

[features]
# `broadcast` ships the blanket `EventSink for tokio::sync::broadcast::Sender<E>`
# impl. Default-on so `cargo add starter-spi` gets the ergonomic happy
# path (Decision D2). An embedded consumer that wants `Service`/
# `EventSink` without the broadcast machinery disables default features
# and brings its own sink impl.
default   = ["broadcast"]
broadcast = []

# F-0.1: `units`, `i18n`, and `preferences` are off by default so the
# starter-flow-spi dep tree (which only needs `starter-spi`'s core
# `Service` / `Tool` / `Ai` / error shapes) does not pull `uom` or
# `icu_locale_core`. Crates that need the preferences DTOs
# (`starter-prefs`, `starter-server`'s units middleware, etc.) opt in
# via `starter-spi = { workspace = true, features = ["preferences"] }`.
#
# `preferences` depends on `units` because `ResolvedPreferences` /
# `PreferencesPatch` carry typed `Unit` fields (`temperature_unit`,
# `pressure_unit`, …).
units       = ["dep:uom"]
i18n        = ["dep:icu_locale_core"]
preferences = ["units"]

# Gates `starter_spi::changelog`. Off by default so consumers that
# don't use audit / undo / clipboard pay nothing for the seam.
# See `DOCS/backend/undo-redo/SCOPE.md`.
changelog   = []

[lints]
workspace = true
