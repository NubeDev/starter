[package]
name        = "starter-clipboard"
description = "starter — server-side, principal-scoped clipboard backing copy/paste/duplicate via Reversible."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi       = { workspace = true, features = ["changelog"] }
starter-changelog = { workspace = true }

async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
tokio       = { workspace = true, features = ["sync"] }
axum           = { workspace = true }
starter-server = { workspace = true }
starter-undo   = { workspace = true }
uuid        = { workspace = true }
utoipa         = { workspace = true }
