[package]
name        = "starter-ui-ir"
description = "Server-Driven UI Component IR — zero-I/O wire contract ported from rubix-contracts/ui-ir. See DOCS/frontend/sdui/SCOPE.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true

# The JSON Schema artifact ships as `schema/starter-ui-ir.schema.json`,
# regenerated by `cargo run --bin emit_schema` (see `src/bin/emit_schema.rs`).
# `tests/schema_artifact.rs` asserts the file on disk matches what the
# emitter produces today, so any IR change without a schema regeneration
# fails CI. Consumers — notably `starter-ai-builder-prompt`, which
# blocks on this artifact per the job model — read the committed file
# directly and never need to compile this crate just to read its shape.

[dependencies]
# R1 (DOCS/frontend/sdui/SCOPE.md) — zero I/O deps only. A
# `cargo tree -p starter-ui-ir --edges normal` denylist in CI
# guards against axum / reqwest / hyper / tokio / tower / h2 /
# http-body sneaking in via a feature flag on a transitive crate.
serde       = { workspace = true }
serde_json  = { workspace = true }
schemars    = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }


[lints]
workspace = true
