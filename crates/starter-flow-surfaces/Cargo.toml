[package]
name        = "starter-flow-surfaces"
description = "starter-flow — Flow ↔ Tool/Service wrappers. FlowAsTool, FlowAsService. Skeleton today; lands in Phase 3."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Phase 1: empty skeleton. The FlowAsTool / FlowAsService wrappers
# (analogues of starter-agent-surfaces) land in Phase 3 alongside
# persistence per DOCS/flow/scope/SCOPE.md.
#
# Both deps carry `default-features = false` per workspace policy so
# this crate never silently re-enables an upstream default feature
# just by being on the dep graph.
[dependencies]
starter-flow     = { workspace = true }
starter-flow-spi = { workspace = true, default-features = false }
starter-spi      = { workspace = true, default-features = false }

async-trait = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["macros", "sync", "rt", "time"] }
tracing     = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true, features = ["derive"] }

# Stage 8 (D-F3.12): blake3 content hash for the `FlowAsService`
# dedup-key fallback when an `EventSink::dedup_key` impl returns
# `None`. Direct dep (not workspace) — `starter-flow-surfaces` is
# the only crate that needs it today; promotes to a workspace dep
# the first time a second consumer appears.
blake3 = "1"

# YAML loader for FlowRegistry::register_yaml (see
# docs/design/starter-changes/README.md Phase 2b U3). Aligns
# with the optional dep already used by starter-flow-watch.
serde_yaml = "0.9"

# Phase B.1 (Goal 6 — durable scheduler). `service::FlowAsService`
# under `src/service.rs` writes `starter_scheduled_flows` rows
# through the starter-store-postgres `Pool` wrapper, validates
# cron expressions via `starter-cron::next_fire`, and stamps
# ULID-shaped TEXT primary keys. See
# `.codeless/jobs/rubix-goal-6-weekly-report/SCOPE.md` Phase B.
starter-cron           = { workspace = true }
starter-store-postgres = { workspace = true }
sqlx   = { workspace = true, features = ["postgres", "macros", "chrono", "uuid"] }
chrono = { workspace = true }
uuid   = { workspace = true, features = ["v4"] }
ulid   = "1"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
prometheus = { workspace = true }
async-trait = { workspace = true }
serde_json = { workspace = true }
schemars = { workspace = true }
tempfile = "3"
# Phase B.1 register_test.rs — ephemeral PG via testcontainers.
starter-store-postgres = { workspace = true, features = ["testing"] }
sqlx  = { workspace = true, features = ["postgres", "macros", "runtime-tokio", "chrono"] }
chrono = { workspace = true }
uuid   = { workspace = true, features = ["v4"] }

[lints]
workspace = true
