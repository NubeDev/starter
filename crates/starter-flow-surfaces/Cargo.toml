[package]
name        = "starter-flow-surfaces"
description = "starter-flow — Flow ↔ Tool/Service wrappers. FlowAsTool, FlowAsService. Skeleton today; lands in Phase 3."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Phase 1: empty skeleton. The FlowAsTool / FlowAsService wrappers
# (analogues of starter-agent-surfaces) land in Phase 3 alongside
# persistence per DOCS/flow/scope/SCOPE.md.
#
# Both deps carry `default-features = false` per workspace policy so
# this crate never silently re-enables an upstream default feature
# just by being on the dep graph.
[dependencies]
starter-flow     = { workspace = true }
starter-flow-spi = { workspace = true, default-features = false }
starter-spi      = { workspace = true, default-features = false }

async-trait = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["macros", "sync", "rt", "time"] }
tracing     = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "sync", "time"] }
