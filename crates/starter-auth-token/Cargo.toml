[package]
name        = "starter-auth-token"
description = "starter — single-owner Authenticator: first-boot claim flow over a static owner bearer token."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
axum        = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
thiserror   = { workspace = true }
chrono      = { workspace = true }
base64      = { workspace = true }
rand        = { workspace = true }
sha2        = { workspace = true }
subtle      = { workspace = true }
uuid        = { workspace = true }

# Backend pool — feature-gated. SCOPE: a single concrete backend per
# consumer build.
starter-store-sqlite   = { workspace = true, optional = true }
starter-store-postgres = { workspace = true, optional = true }
sqlx                   = { workspace = true, optional = true }

[features]
default = []
# Pick exactly one of the backend features below in the consumer.
sqlite   = ["dep:starter-store-sqlite", "dep:sqlx", "sqlx/sqlite"]
postgres = ["dep:starter-store-postgres", "dep:sqlx", "sqlx/postgres"]

[dev-dependencies]
tokio = { workspace = true }
starter-store-sqlite = { workspace = true, features = ["testing"] }
sqlx  = { workspace = true, features = ["sqlite", "macros", "migrate"] }
