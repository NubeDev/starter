[package]
name        = "starter-flow"
description = "starter-flow — THE engine. Slot propagator, GraphStore impl, NodeKindRegistry, run lifecycle. Module skeleton today; engine lands in Phases 2/3/7."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Phase 1 of DOCS/flow/scope/SCOPE.md: this crate ships a module
# skeleton — `graph`, `registry`, `propagator`, `engine`, `run`,
# `state` — each pointing at an empty file with only a SCOPE pointer
# + Phase-N marker doc comment. The engine internals land in
# Phases 2/3/7.
#
# `default-features = []` on `starter-flow-spi` upholds the workspace
# minimal-by-default policy (a consumer who does not want flows pays
# nothing — locked in stage 0).
[dependencies]
starter-flow-spi = { workspace = true }
# Phase 3 stage 5: `FlowRunner` constructs a `Principal` when calling
# the SPI `RunStore::start` lifecycle hook. The Principal struct +
# `Role` enum live in `starter-spi` (re-exported in part through
# `starter-flow-spi`); the explicit dep keeps the constructor
# grep-visible from this crate.
starter-spi      = { workspace = true }
# `serde_json::Value` for the Principal `extra` field.
serde_json       = { workspace = true }
# R2: the propagator is a synchronous loop driven from a tokio
# runtime. The workspace tokio dep already enables `rt-multi-thread`,
# `macros`, `sync`, `signal`; the explicit feature list is kept here
# so the requirement is grep-visible from this crate's manifest.
# `sync` underwrites the in-memory `GraphStore` impl (`RwLock` +
# `broadcast`).
tokio            = { workspace = true, features = ["rt-multi-thread", "sync"] }
# `tokio_stream::wrappers::BroadcastStream` is the bridge from the
# per-store `broadcast::Sender` to the SPI `SubscriptionStream`
# (`BoxStream<GraphEventEnvelope>`).
tokio-stream     = { workspace = true }
# Per-write `tracing` span on `write_slot` (R2 observability).
tracing          = { workspace = true }
async-trait      = { workspace = true }
futures          = { workspace = true }
# Typed error surface for the in-engine registries (stage 5).
thiserror        = { workspace = true }
# Hot-reload (DOCS/flow/scope/hot-reload.md): blake3 is the content
# hash powering HR1's idempotent short-circuit on canonical bodies;
# arc-swap is the wait-free primitive HR2's `ActiveTopology` rides
# on (D-HR1). `serde` is needed by the typed `FlowBody` parser
# (HR3's body classifier and HR1's resolver share that struct).
blake3           = { workspace = true }
arc-swap         = { workspace = true }
serde            = { workspace = true }
# MEMORY.md §M9 / Phase M-E: the `Engine::sweep_agent_session_retention`
# entry-point takes a `chrono::DateTime<Utc>` cutoff so hosts can pin
# a deterministic clock; the SPI `RetentionPolicy` types embed
# `chrono::Duration`. Replay-module dev tests already used chrono.
chrono           = { workspace = true }

[dev-dependencies]
# Pull `macros` for `#[tokio::test]` and `time` for the lag/yield
# helpers used by the in-memory-store unit tests.
tokio            = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
# Phase 2 stage 5 SCOPE Smoke "One write chokepoint" attaches a
# tracing Layer that counts `write_slot` spans whose `node_id` /
# `slot_name` fields match the test's target slot. Pulled into
# dev-deps only — the production crate stays free of any subscriber
# implementation.
tracing-subscriber = { workspace = true }
# Hot-reload HR-1 resolver tests use a small test-only kind whose
# `Settings` derives `JsonSchema` to verify
# `validate_settings` is invoked through the publish chokepoint.
schemars         = { workspace = true }
serde            = { workspace = true }
# Replay-module unit tests construct in-memory `Turn` / `Artifact`
# fixtures, which need `chrono::Utc::now()` timestamps. Dev-only —
# the production replay code carries timestamps through, never
# manufactures them.
chrono           = { workspace = true }
# Replay-module fake-store impl is `#[async_trait]`.
async-trait      = { workspace = true }

[lints]
workspace = true
