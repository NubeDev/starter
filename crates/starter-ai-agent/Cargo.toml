[package]
name        = "starter-ai-agent"
description = "Runner-agnostic single-turn LLM ⇄ tool agent loop. Owns the AgentLoop primitive; downstream consumers wrap it in a NodeBehavior (see starter-flow-node-loop) or call it directly."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["sync", "macros"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
