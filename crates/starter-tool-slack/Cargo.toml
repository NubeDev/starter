[package]
name        = "starter-tool-slack"
description = "starter — outbound Slack Tool wrapping chat.postMessage. Sibling crate selected by Cargo dependency; see DOCS/tools/scope/SCOPE.md."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# R7 (observability is required) + R8 (no transitive vendor SDKs in
# starter-spi) — the only starter-side deps are starter-spi and
# starter-observability. Everything else is third-party.
[dependencies]
starter-spi           = { workspace = true }
starter-observability = { workspace = true }

reqwest     = { workspace = true }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tracing     = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
prometheus  = { workspace = true }

[dev-dependencies]
tokio    = { workspace = true, features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"

[lints]
workspace = true
