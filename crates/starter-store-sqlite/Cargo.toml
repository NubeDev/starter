[package]
name        = "starter-store-sqlite"
description = "starter — typed building blocks (pool, namespaced migrations, paging) over sqlx + SQLite."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
sqlx        = { workspace = true, features = ["sqlite", "macros", "migrate"] }
base64      = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

# `flow` feature deps. The flow store implementations live behind a
# default-off feature so consumers that don't run the starter-flow
# engine pay no dependency or compile cost for them (D-F3.3, D-F3.7).
starter-flow-spi = { workspace = true, optional = true }
chrono           = { workspace = true, optional = true }
uuid             = { workspace = true, optional = true }

# `skill-approvals` feature deps. Phase 5 of the starter-skills
# rollout: a SQLite-backed `ApprovalStore` impl for the
# `starter-skills` trait. Default-on so the common operator path
# (skills enabled) needs no extra `--features` invocation; consumers
# that do not run the ai-agent / skills stack disable it with
# `--no-default-features` to skip both the dep and the migration.
starter-skills = { workspace = true, optional = true }

[features]
default = ["skill-approvals"]
# Exposes `starter_store_sqlite::testing` with an in-memory pool
# factory. Opt-in so production builds skip the harness.
testing = []
# Compiles the `flow` module with SQLite-backed `FlowStore`,
# `RunStore`, and `SessionStore` implementations of the
# `starter-flow-spi` contracts. Default-off per D-F3.3 / D-F3.7 so
# the starter-store-sqlite dependency baseline is unchanged for
# every existing consumer.
flow = ["dep:starter-flow-spi", "dep:chrono", "dep:uuid"]
# Compiles the `skills` module with a SQLite-backed
# `SkillApprovalStore` implementation of the `starter-skills`
# `ApprovalStore` trait. Default-on (Phase 5 stage spec); flip off
# with `--no-default-features` to skip the table + the
# `starter-skills` dep entirely. `dep:starter-flow-spi` is pulled
# in transitively because `starter-skills` already depends on it,
# but we declare it explicitly here too so the impl module compiles
# without the `flow` feature being on.
skill-approvals = ["dep:starter-skills", "dep:starter-flow-spi"]

[dev-dependencies]
tokio    = { workspace = true }
tempfile = "3"
