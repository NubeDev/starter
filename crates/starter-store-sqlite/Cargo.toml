[package]
name        = "starter-store-sqlite"
description = "starter — typed building blocks (pool, namespaced migrations, paging) over sqlx + SQLite."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
sqlx        = { workspace = true, features = ["sqlite", "macros", "migrate"] }
base64      = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

[features]
default = []
# Exposes `starter_store_sqlite::testing` with an in-memory pool
# factory. Opt-in so production builds skip the harness.
testing = []

[dev-dependencies]
tokio = { workspace = true }
