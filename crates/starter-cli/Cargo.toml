[package]
name        = "starter-cli"
description = "starter — clap building blocks. A library, not a binary. Consumer composes their own binary from these + their own commands."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi       = { workspace = true }
starter-client-rs = { workspace = true }
clap              = { workspace = true }
rpassword         = { workspace = true }
async-trait       = { workspace = true }
serde             = { workspace = true }
serde_json        = { workspace = true }
thiserror         = { workspace = true }
tokio             = { workspace = true }
tracing           = { workspace = true }

[dev-dependencies]
starter-server        = { workspace = true, features = ["testing"] }
starter-observability = { workspace = true }
tokio                 = { workspace = true, features = ["macros", "rt-multi-thread"] }
prometheus            = { workspace = true }
utoipa                = { workspace = true }
