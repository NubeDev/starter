[package]
name        = "starter-store-postgres"
description = "starter — typed building blocks (pool, namespaced migrations, paging) over sqlx + Postgres."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
sqlx        = { workspace = true, features = ["postgres", "macros", "migrate"] }
base64      = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }

[features]
default = []
# `testing` requires the `testcontainers` ecosystem; gated to keep
# regular builds light.
testing = []
