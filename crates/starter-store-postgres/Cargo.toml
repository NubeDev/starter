[package]
name        = "starter-store-postgres"
description = "starter — typed building blocks (pool, namespaced migrations, paging) over sqlx + Postgres."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi = { workspace = true }
sqlx        = { workspace = true, features = ["postgres", "macros", "migrate"] }
base64      = { workspace = true }
serde_json  = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
# MEMORY.md Phase M-B — agent-session timestamps surface as
# `chrono::DateTime<Utc>` on the SPI types. Pulled in unconditionally
# (small, leaf-level) so the optional `agent-session` feature does
# not have to re-export the sqlx chrono feature itself.
chrono      = { workspace = true }

# `testing` feature pulls testcontainers + the postgres module so a
# call to `testing::with_database()` spins up an ephemeral container,
# waits for healthy, and returns a connected Pool. Off by default —
# pulls Docker-client crates and adds compile time. Pinned to
# testcontainers 0.23 + testcontainers-modules 0.11 (the current
# coordinated majors; SCOPE's "0.x vs 0.20+" question was a stale
# read — 0.20+ doesn't exist, the live ecosystem is 0.23 / 0.11).
testcontainers         = { version = "0.23", optional = true }
testcontainers-modules = { version = "0.11", features = ["postgres"], optional = true }
tokio                  = { workspace = true, optional = true }

# `skill-approvals` feature deps. Phase 5 of the starter-skills
# rollout: a Postgres-backed `ApprovalStore` impl. Default-on so the
# common operator path needs no extra `--features` invocation;
# consumers that don't need skills disable with
# `--no-default-features` to skip both the dep and the migration.
starter-skills   = { workspace = true, optional = true }
starter-flow-spi = { workspace = true, optional = true }

# `flow` feature deps. `starter-flow-spi` is the trait surface;
# `uuid` is needed for parsing the stringly-stored revision/run/
# session ids back into typed handles. `chrono` is already pulled
# in unconditionally above (used by the agent-session feature) so
# the `sqlx/chrono` feature flag is enough — no extra dep here.
uuid = { workspace = true, optional = true }

[features]
default = ["skill-approvals"]
testing = ["dep:testcontainers", "dep:testcontainers-modules", "dep:tokio"]
# Compiles the `skills` module with a Postgres-backed
# `SkillApprovalStore` implementation of the `starter-skills`
# `ApprovalStore` trait. Default-on per stage 9 spec; flip off with
# `--no-default-features` to skip the table + the `starter-skills`
# dep entirely.
skill-approvals = ["dep:starter-skills", "dep:starter-flow-spi"]
# MEMORY.md Phase M-B — Postgres-backed `AgentSessionStore` impl.
# Default-off so consumers that don't need agent surfaces (the
# common minimal binary) carry zero cost. Pulls
# `starter-flow-spi` for the trait + types, plus the sqlx
# `chrono` + `json` features for `TIMESTAMPTZ` / `JSONB` binding.
agent-session = ["dep:starter-flow-spi", "sqlx/chrono", "sqlx/json"]
# Compiles the `flow` module with Postgres-backed `FlowStore`,
# `RunStore`, and `SessionStore` implementations of the
# `starter-flow-spi` contracts. Postgres twin of the SQLite crate's
# `flow` feature (D-F3.3 / D-F3.7). Default-off so consumers that
# do not run the starter-flow engine pay no extra deps. Pulls
# `starter-flow-spi` for the trait + types, `uuid` for id parsing,
# and the sqlx `chrono` + `json` + `uuid` features for
# `TIMESTAMPTZ` / `JSONB` / native-UUID binding (uuid is on for
# parity with the SQLite crate even though the schema stores ids
# as `TEXT`).
flow = ["dep:starter-flow-spi", "dep:uuid", "sqlx/chrono", "sqlx/json", "sqlx/uuid"]

[dev-dependencies]
sqlx  = { workspace = true, features = ["postgres", "macros", "migrate", "runtime-tokio"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
