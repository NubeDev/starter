[package]
name        = "starter-undo"
description = "starter — per-actor undo/redo cursor over the changelog. Dispatches through a Reversible registry."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi       = { workspace = true, features = ["changelog"] }
starter-changelog = { workspace = true }

async-trait = { workspace = true }
serde       = { workspace = true }
thiserror   = { workspace = true }
tokio       = { workspace = true, features = ["sync"] }
tracing     = { workspace = true }
axum           = { workspace = true }
starter-server = { workspace = true }
utoipa         = { workspace = true }
