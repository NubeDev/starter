[package]
name        = "starter-mcp"
description = "starter — MCP stdio server scaffold. Consumer registers Tool impls; this crate runs the protocol."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi           = { workspace = true }
starter-i18n          = { workspace = true }
starter-jsonrpc-stdio = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["io-std", "io-util"] }
tracing     = { workspace = true }
thiserror   = { workspace = true }

# `http` feature exposes an `axum::Router` so consumers can serve MCP
# over POST /mcp alongside the rest of their starter-server routes.
# Off by default — pure-stdio consumers don't need to drag axum in.
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

# `skills` feature exposes the `skills_bridge` module that wraps an
# approved `starter_skills::Skill` in a `Tool`. Off by default — pure
# MCP consumers without skills don't drag starter-skills in.
starter-skills = { workspace = true, optional = true }

[features]
default = []
testing = []
http    = ["dep:axum", "dep:http"]
skills  = ["dep:starter-skills"]

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum           = { workspace = true }
http           = { workspace = true }
starter-server = { workspace = true, features = ["testing"] }
# `starter-server` (dev-dep above) enables `starter-spi/preferences`,
# which turns on `DiagnosticParam::Quantity`. Force `starter-i18n`'s
# matching `preferences` feature in the same dev graph so its
# interpolator handles that variant — otherwise cargo's feature
# unification leaves a non-exhaustive match in `interpolate.rs`.
starter-i18n   = { workspace = true, features = ["preferences"] }
reqwest        = { workspace = true, features = ["json"] }

[lints]
workspace = true
