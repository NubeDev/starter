[package]
name        = "starter-mcp"
description = "starter — MCP stdio server scaffold. Consumer registers Tool impls; this crate runs the protocol."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

[dependencies]
starter-spi           = { workspace = true }
starter-jsonrpc-stdio = { workspace = true }
async-trait = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
tokio       = { workspace = true, features = ["io-std", "io-util"] }
tracing     = { workspace = true }
thiserror   = { workspace = true }

# `http` feature exposes an `axum::Router` so consumers can serve MCP
# over POST /mcp alongside the rest of their starter-server routes.
# Off by default — pure-stdio consumers don't need to drag axum in.
axum = { workspace = true, optional = true }
http = { workspace = true, optional = true }

[features]
default = []
testing = []
http    = ["dep:axum", "dep:http"]

[dev-dependencies]
tokio          = { workspace = true, features = ["macros", "rt-multi-thread"] }
axum           = { workspace = true }
http           = { workspace = true }
starter-server = { workspace = true, features = ["testing"] }
reqwest        = { workspace = true, features = ["json"] }
