[package]
name        = "starter-flow-nodes"
description = "starter-flow — built-in node kinds (ai-agent, tool-call, transform, branch, merge, gate, subflow, trigger.*, http-out, log, sleep). Skeleton today."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true

# Phase 1: empty skeleton — each module file declares only the kind id
# constant. NodeBehavior impls land in Phase 4 (ai-agent) and Phase 5
# (the remainder) per DOCS/flow/scope/SCOPE.md.
[dependencies]
starter-flow-spi = { workspace = true, default-features = false }
# Phase 2 stage 3 (transform body) onward: node-kind bodies are async
# trait impls that emit tracing spans and surface typed errors over
# the `NodeBehavior` seam. These deps are unconditional — the
# `cfg(feature = "...")` gates on each module keep the build green
# when a consumer pays for none of the kinds.
async-trait = { workspace = true }
thiserror   = { workspace = true }
tracing     = { workspace = true }
# `tool-call` (stage 4) calls `Tool::invoke` through an
# `Arc<dyn ToolRegistry>` whose value type is `starter_spi::Tool` and
# forwards `serde_json::Value` input/output verbatim. Unconditional so
# the crate's no-feature `cargo check` still resolves the trait the
# registry names — the `cfg(feature = "tool-call")` gate on
# `pub mod tool_call` in `src/lib.rs` keeps the module itself opt-in.
starter-spi = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
# `tool-call` (stage 4) races the tool's future against the run's
# `Cancel` inside a `tokio::select!`. Gated as `optional` so consumers
# that don't opt into `tool-call` pay no tokio surface at compile time.
tokio = { workspace = true, optional = true, features = ["macros", "sync", "rt"] }

[dev-dependencies]
# `#[tokio::test]` for the async unit tests + the engine crate for the
# integration test that wraps a transform in a `FlowRunner` to confirm
# `FlowEvent::NodeFailed` surfaces end-to-end (the propagator's
# `Err → NodeFailed` wiring lives in `starter-flow`).
tokio        = { workspace = true, features = ["rt-multi-thread", "sync", "macros", "time"] }
starter-flow = { workspace = true }
# The `log` body's unit tests install a tracing-subscriber layer that
# captures emitted events under the `starter.flow.log` target and
# asserts the (level, value-debug) shape.
tracing-subscriber = { workspace = true }

[features]
# Default-off per the workspace policy: a consumer enables only the
# kinds it needs. The `all-kinds` aggregate flips every built-in on at
# once for `cargo check --features=all-kinds` and for downstream crates
# that want the full set (e.g. the engine's integration tests, the
# `starter-flow-surfaces` smoke tests).
default = []

transform         = []
tool-call         = ["dep:tokio"]
ai-agent          = ["dep:tokio"]
branch            = []
merge             = []
gate              = []
subflow           = []
trigger-explicit  = ["dep:tokio"]
trigger-event     = []
trigger-schedule  = []
trigger-webhook   = []
http-out          = []
log               = ["dep:tokio"]
sleep             = ["dep:tokio"]

all-kinds = [
    "transform",
    "tool-call",
    "ai-agent",
    "branch",
    "merge",
    "gate",
    "subflow",
    "trigger-explicit",
    "trigger-event",
    "trigger-schedule",
    "trigger-webhook",
    "http-out",
    "log",
    "sleep",
]
