name: ci

on:
  pull_request:
  push:
    branches: [master, main]

# Cancel superseded runs on the same ref. Keeps the queue from
# stacking up when PRs see rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the test runner deterministic; sccache and incremental
  # don't pay for themselves in CI because each job starts cold.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (check / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct key per workflow file so a Cargo.toml edit
          # doesn't share cache with an unrelated workflow run.
          shared-key: workspace

      - name: fmt
        run: cargo fmt --all -- --check

      - name: check (all features)
        run: cargo check --workspace --all-features

      - name: clippy (all features, -D warnings)
        run: cargo clippy --workspace --all-features --tests -- -D warnings

      - name: test (default features)
        run: cargo test --workspace --no-fail-fast

      # Feature-gated tests don't run under the default `--workspace`
      # invocation because sqlx tooling isn't pulled in without the
      # backend feature. Run them explicitly so the auth flows are
      # exercised on every PR.
      - name: test (starter-auth-token, sqlite feature)
        run: cargo test -p starter-auth-token --features sqlite --no-fail-fast

      - name: test (starter-auth-users, sqlite feature)
        run: cargo test -p starter-auth-users --features sqlite --no-fail-fast

      - name: test (starter-server, testing feature)
        run: cargo test -p starter-server --features testing --no-fail-fast

      - name: test (starter-mcp, http feature)
        run: cargo test -p starter-mcp --features http --no-fail-fast

      # Postgres testcontainers run is a separate job (needs Docker on
      # the runner — GitHub-hosted ubuntu-latest has it by default).
      # Marked `--ignored` so it never runs accidentally in
      # plain-`cargo test` invocations.
      - name: test (starter-store-postgres, testing feature, --ignored)
        run: cargo test -p starter-store-postgres --features testing -- --ignored

  pnpm:
    name: pnpm (build / typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: typecheck
        run: pnpm -r run typecheck

      - name: test
        run: pnpm -r run test

      - name: build
        run: pnpm -r run build

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      # rustsec/audit-check reads .cargo/audit.toml for the ignore list
      # + threshold settings. Failures are real vulnerabilities only;
      # unmaintained warnings show in the job log without gating PRs.
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  openapi-drift:
    name: openapi / ts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Source of truth: the openapi snapshot test in starter-auth-users.
      # If a handler or DTO changed without `UPDATE_SNAPSHOTS=1`, this
      # fails before we ever get to the TS side.
      - name: openapi snapshot up to date
        run: cargo test -p starter-auth-users --features sqlite --test openapi_snapshot

      - name: regenerate ts client
        run: pnpm --filter @nube/starter-client-ts run codegen

      - name: fail on drift
        run: git diff --exit-code packages/starter-client-ts/src/generated/index.ts
