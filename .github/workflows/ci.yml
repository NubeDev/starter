name: ci

on:
  pull_request:
  push:
    branches: [master, main]

# Cancel superseded runs on the same ref. Keeps the queue from
# stacking up when PRs see rapid pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the test runner deterministic; sccache and incremental
  # don't pay for themselves in CI because each job starts cold.
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: rust (check / clippy / test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          # Distinct key per workflow file so a Cargo.toml edit
          # doesn't share cache with an unrelated workflow run.
          shared-key: workspace

      - name: fmt
        run: cargo fmt --all -- --check

      - name: check (all features)
        run: cargo check --workspace --all-features

      - name: clippy (all features, -D warnings)
        run: cargo clippy --workspace --all-features --tests -- -D warnings

      - name: test (default features)
        run: cargo test --workspace --no-fail-fast

      # Feature-gated tests don't run under the default `--workspace`
      # invocation because sqlx tooling isn't pulled in without the
      # backend feature. Run them explicitly so the auth flows are
      # exercised on every PR.
      - name: test (starter-auth-token, sqlite feature)
        run: cargo test -p starter-auth-token --features sqlite --no-fail-fast

      - name: test (starter-auth-users, sqlite feature)
        run: cargo test -p starter-auth-users --features sqlite --no-fail-fast

      - name: test (starter-auth-oauth, sqlite feature)
        run: cargo test -p starter-auth-oauth --features sqlite --no-fail-fast

      - name: test (starter-server, testing feature)
        run: cargo test -p starter-server --features testing --no-fail-fast

      - name: test (starter-mcp, http feature)
        run: cargo test -p starter-mcp --features http --no-fail-fast

      # The `ai-agent` node-kind body is default-off in
      # starter-flow-nodes (per the workspace policy: a consumer
      # enables only the kinds it needs). Its on-mount
      # resource-hash-mismatch smoke (Phase 4b stage 7 of the
      # starter-skills job) lives behind that feature flag, so it
      # would otherwise never run in the default `cargo test
      # --workspace` invocation. Pin it here so DOCS/agent/SKILLS.md
      # smoke #7 ("Resource hash mismatch aborts the run") is a
      # PR-blocking signal.
      - name: test (starter-flow-nodes, ai-agent feature)
        run: cargo test -p starter-flow-nodes --features ai-agent --no-fail-fast

      # Postgres testcontainers run is a separate job (needs Docker on
      # the runner — GitHub-hosted ubuntu-latest has it by default).
      # Marked `--ignored` so it never runs accidentally in
      # plain-`cargo test` invocations.
      - name: test (starter-store-postgres, testing feature, --ignored)
        run: cargo test -p starter-store-postgres --features testing -- --ignored

  pnpm:
    name: pnpm (build / typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: public API surface (snapshots)
        # Catches accidental additions/removals from the `src/index.ts`
        # of any package in `packages/*`. Fix or run `pnpm api:update`
        # locally and commit the diff. See `packages/README.md`.
        run: pnpm api:check

      - name: no '@/' alias imports in packages/*/src
        # `@/…` aliases work in the source package but break for any
        # downstream workspace consumer that doesn't share its tsconfig
        # paths mapping. Always use relative imports inside a package.
        run: pnpm check:no-alias-imports

      - name: typecheck
        run: pnpm -r run typecheck

      - name: test
        run: pnpm -r run test

      - name: build
        run: pnpm -r run build

  spi-dep-baseline:
    # Smoke test 1 of DOCS/tools/scope/SCOPE.md, lifted into a
    # CI gate so a provider crate's deps cannot sneak into
    # `starter-spi`'s transitive closure without the PR turning red.
    # See Decision D1 — the baseline is updated only in the same
    # commit that changes `starter-spi`'s own direct dependencies.
    name: starter-spi dep baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: check baseline
        run: scripts/check-spi-dep-baseline.sh

  sdui-gates:
    # Stage 12 of DOCS/frontend/sdui/SCOPE.md — the SDUI merge gate.
    # Five structural checks that the SCOPE pins as load-bearing:
    #
    #   1. R3 allowlist (scripts/check-sdui-domain-leak.sh) — every
    #      identifier in the three renderer-side / contract-side
    #      crates must appear in the per-crate words.txt allowlist.
    #      The allowlist is the contract; the in-repo r3-no-domain-leak
    #      vitest is the defence-in-depth keyword denylist.
    #
    #   2. R1 dep-tree (scripts/check-sdui-ir-deps.sh) — starter-ui-ir's
    #      transitive normal closure must not pull I/O / runtime crates
    #      (axum, reqwest, hyper, tokio, tower, h2, http-body, ...).
    #
    #   3. Consumer-opt-in (scripts/check-sdui-routes-isolation.sh) —
    #      starter-server must not transitively depend on
    #      starter-sdui-routes / starter-ui-* (M6 / D4).
    name: sdui structural gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace
      - name: R3 — words.txt allowlist
        run: scripts/check-sdui-domain-leak.sh
      - name: R1 — starter-ui-ir transitive dep gate
        run: scripts/check-sdui-ir-deps.sh
      - name: M6 / D4 — starter-server has no SDUI deps
        run: scripts/check-sdui-routes-isolation.sh

  skills-dep-isolation:
    # Stage 12 of the starter-skills job (DOCS/agent/SKILLS.md +
    # per-job SCOPE.md): `cargo tree -p starter-skills --edges
    # normal` must not pull in any provider SDK. LlmSkillSelector
    # talks to providers only through `AiRunner`, which lives in
    # `starter-spi`; a provider SDK landing in starter-skills's
    # normal-deps closure would breach agent R2 and silently spread
    # provider deps to every downstream consumer.
    #
    # This is a CI gate, not an after-the-fact audit — the offending
    # PR is the one that turns red, before the dep tree ever reaches
    # the broader workspace.
    name: starter-skills dep isolation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - name: check skills dep isolation
        run: scripts/check-skills-dep-isolation.sh

  rubix-extensions:
    # The `rubix/extensions/` sibling cargo workspace is intentionally
    # excluded from the rubix root workspace (so example-extension
    # `workspace = true` aliases resolve against the sibling root, not
    # rubix's). That means the main `rust` job above never touches it.
    # This job builds it explicitly so a broken extension binary fails
    # the PR. See rubix/extensions/README.md.
    name: rubix-extensions (cargo build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: rubix-extensions

      - name: build (rubix/extensions workspace)
        run: cargo build --manifest-path rubix/extensions/Cargo.toml --workspace

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      # rustsec/audit-check reads .cargo/audit.toml for the ignore list
      # + threshold settings. Failures are real vulnerabilities only;
      # unmaintained warnings show in the job log without gating PRs.
      - name: cargo audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  openapi-drift:
    name: openapi / ts drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: install toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: rust cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: workspace

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      # Source of truth: the openapi snapshot test in starter-auth-users.
      # If a handler or DTO changed without `UPDATE_SNAPSHOTS=1`, this
      # fails before we ever get to the TS side.
      - name: openapi snapshot up to date
        run: cargo test -p starter-auth-users --features sqlite --test openapi_snapshot

      - name: regenerate ts client
        run: pnpm --filter @nube/starter-client-ts run codegen

      - name: fail on drift
        run: git diff --exit-code packages/starter-client-ts/src/generated/index.ts

  example-admin-e2e:
    name: example-admin (Playwright)
    # Smoke E2E for the lighthouse consumer of the design-system
    # packages. Catches the class of bug where `pnpm dev` boots but
    # the gear icon does nothing — the original `@/` import vs.
    # workspace consumer mismatch we lived through during Stage 2.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: install
        run: pnpm install --frozen-lockfile

      - name: install playwright browsers
        run: pnpm --filter @nube/example-admin exec playwright install --with-deps chromium

      - name: e2e
        run: pnpm --filter @nube/example-admin run e2e

      - name: upload trace on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: example-admin-playwright-report
          path: |
            examples/admin/test-results
            examples/admin/playwright-report
          if-no-files-found: ignore
