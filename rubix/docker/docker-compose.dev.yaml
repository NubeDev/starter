# Local-dev compose for the rubix demo.
#
# One TimescaleDB instance, one database (`rubix`) holding both the
# OLTP tables (sessions, authz, flows, dashboards, undo changelog)
# and the warehouse hypertables (raw_events, samples, events,
# documents) + continuous aggregates. Timescale is just a Postgres
# extension — there is no reason to run a second container.
#
# Port 5433 is bound to 127.0.0.1 only so a laptop running this does
# not expose itself to the LAN, and is non-standard so an existing
# local Postgres on 5432 is left alone.
#
# Matches `rubix/dev/agent.toml` byte-for-byte. If you change the
# port, user, or db here, change it there too.

services:
  postgres:
    image: timescale/timescaledb-ha:pg16
    shm_size: 1gb
    environment:
      POSTGRES_USER: rubix
      POSTGRES_PASSWORD: rubix-dev
      POSTGRES_DB: rubix
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rubix_postgres_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubix -d rubix"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rubix_postgres_data:
