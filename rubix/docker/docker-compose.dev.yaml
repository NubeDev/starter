# Local-dev compose for the rubix six-step thin-slice demo.
#
# Brings up only the two stores the rubix-agent binary talks to:
#   * Postgres 16   — sessions, authz, changelog, agent-log
#   * TimescaleDB   — warehouse history (L1/L2/L3) per the Stage 2
#                     swap target in
#                     `rubix/docs/proposal/warehouse-engine-swap.md`.
#                     Stage 1 still drives this service with the
#                     ClickHouse dialect; the Phase-2 swap repoints
#                     `starter-store-warehouse` at this container.
#
# Both ports are bound to 127.0.0.1 only so a laptop running this
# does not expose itself to the LAN. Ports are non-standard
# (5433/5434) so an already-running local Postgres instance on the
# canonical port is left alone.
#
# Matches `rubix/dev/agent.toml` byte-for-byte. If you change a
# port, user, or db here, change it there too.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: rubix
      POSTGRES_PASSWORD: rubix-dev
      POSTGRES_DB: rubix
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - rubix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubix -d rubix"]
      interval: 5s
      timeout: 3s
      retries: 20

  timescaledb:
    image: timescale/timescaledb-ha:pg16
    environment:
      POSTGRES_USER: rubix
      POSTGRES_PASSWORD: rubix-dev
      POSTGRES_DB: warehouse
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - rubix_warehouse_data:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rubix -d warehouse"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  rubix_postgres_data:
  rubix_warehouse_data:
