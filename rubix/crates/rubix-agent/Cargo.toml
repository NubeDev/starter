[package]
name = "rubix-agent"
default-run = "rubix-agent"
description = "The rubix backend binary. Composes every starter-* capability with the rubix tools, skills, and flows for the six goals. Per SCOPE R5: main.rs only wires; domain logic lives in rubix-tools or starter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rubix-agent"
path = "src/main.rs"

# Admin CLI sibling binary. Verb-per-file under `src/bin/rubix_admin/`.
# See docs/design/auth/README.md for the bootstrap-user contract.
[[bin]]
name = "rubix-admin"
path = "src/bin/rubix_admin/main.rs"

[dependencies]
rubix-spi    = { workspace = true }
rubix-tools  = { workspace = true }
rubix-skills = { workspace = true }
rubix-flows  = { workspace = true }
rubix-client = { workspace = true }
rubix-store-postgres = { workspace = true }

# Starter platform pieces wired in by the binary. Many are Phase 0
# placeholders — Phase 1+ activates the additional surfaces.
starter-spi              = { workspace = true, features = ["i18n", "preferences"] }
starter-config           = { workspace = true }
starter-observability    = { workspace = true }
starter-server           = { workspace = true }
# `flow` feature pulls in `PgFlowStore`, `PgRunStore`,
# `PgNodeStateStore`, and the `FLOW_MIGRATION_SOURCE` migrator.
# Per `rubix/docs/scope/sqlite-to-postgres.md` rubix consolidates
# all flow persistence onto Postgres; this replaces the previous
# `starter-store-sqlite` flow wiring.
starter-store-postgres   = { workspace = true, features = ["flow"] }
starter-changelog        = { workspace = true }
starter-changelog-postgres = { workspace = true }
# Postgres-backed undo cursor + per-actor `LocalActor` substrate.
# The `postgres` feature pulls the `PgUndoCursor` impl and its
# migration source; the boot wiring in `main.rs` constructs the
# `UndoSubstrate` from these pieces.
starter-undo              = { workspace = true, features = ["postgres"] }
starter-authz             = { workspace = true }
starter-auth-users         = { workspace = true, features = ["postgres"] }
starter-i18n              = { workspace = true, features = ["units", "preferences", "routes"] }
starter-mcp               = { workspace = true, features = ["http"] }
starter-store-warehouse  = { workspace = true }
starter-warehouse-explorer = { workspace = true }
starter-flow              = { workspace = true }
starter-flow-spi          = { workspace = true }
starter-flow-surfaces     = { workspace = true }
starter-ai                = { workspace = true, features = ["provider-claude"] }
starter-ai-agent          = { workspace = true }
starter-flow-node-loop    = { workspace = true }
# Built-in node kinds used to seed `FlowKindsTool` at boot — the
# `rubix.flow_ops.kinds` verb snapshots `kind_id` + `config_schema`
# off each behaviour. See src/registry.rs.
starter-flow-nodes        = { workspace = true, features = ["counter", "log", "trigger-schedule", "tool-call"] }
# SDUI substrate — IR + binding evaluator + the resolve/action/table router.
# Consumed by `boot::sdui::build_sdui_router` per docs/design/sdui/host-glue.md.
starter-ui-ir             = { workspace = true }
starter-ui-bindings       = { workspace = true }
starter-sdui-routes       = { workspace = true }

# Extension-host primitives. The `starter-extensions/` sibling
# workspace is excluded from this workspace (parent `Cargo.toml`'s
# `exclude = [...]`) per SCOPE R8, so the crates land here as plain
# path-deps. Versions / sqlx feature surface match upstream.
starter-ext-spi       = { path = "../../../starter-extensions/crates/starter-ext-spi" }
starter-ext-sdk       = { path = "../../../starter-extensions/crates/starter-ext-sdk" }
starter-ext-host      = { path = "../../../starter-extensions/crates/starter-ext-host" }
starter-ext-server    = { path = "../../../starter-extensions/crates/starter-ext-server" }
starter-ext-supervisor = { path = "../../../starter-extensions/crates/starter-ext-supervisor" }
starter-ext-store-pg  = { path = "../../../starter-extensions/crates/starter-ext-store-pg" }
starter-ext-mcp       = { path = "../../../starter-extensions/crates/starter-ext-mcp" }
# Adapter that surfaces extension-contributed flow node kinds (and,
# in later upstream slices, flows + skills) into the host's
# `NodeKindRegistry`. Consumed by `boot::extensions_flow`; the
# walker logic itself lives upstream per SCOPE R2.
starter-ext-flow      = { path = "../../../starter-extensions/crates/starter-ext-flow" }
# Used by `extensions::host_methods` to back the
# `http.request` host method (outbound HTTP) and `fs.read`
# (base64 wire encoding of file bytes).
reqwest               = { workspace = true }
base64                = { workspace = true }
# Concrete `SecretStore` impl wired at boot for the
# `secrets.get` host method.
starter-secrets-keyring = { workspace = true }
thiserror             = { workspace = true }
# `sqlite` feature stays on for two reasons: (a) dev-dependencies
# below still pull `starter-store-sqlite` for hermetic SPI-contract
# tests, and (b) `boot/flow_runtime.rs` opens the legacy
# `~/.rubix/node_state.db` read-only at boot to migrate any
# in-flight rows into the new PG `node_state` table. Drop only
# when both go away (see `rubix/docs/scope/sqlite-to-postgres.md`
# Block 4).
sqlx                      = { workspace = true, features = ["postgres", "sqlite", "runtime-tokio", "uuid", "chrono"] }
tokio-stream              = { workspace = true }
uuid                      = { workspace = true }
include_dir               = "0.7"
futures                   = { workspace = true }

axum    = { workspace = true }
clap    = { workspace = true }
utoipa  = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
jsonschema  = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
tower-http  = { workspace = true, features = ["cors", "fs"] }

# Async + utility
# `sync` is needed for `tokio::sync::broadcast`, which backs
# `extensions::event_bus::RubixEventBus`.
tokio   = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "sync"] }
tracing = { workspace = true }
anyhow  = { workspace = true }

# Blob store — used by rubix.analytics.report in registry.rs.
starter-blob-fs = { workspace = true }

[dev-dependencies]
starter-mcp              = { workspace = true, features = ["http", "testing"] }
starter-changelog-sqlite = { workspace = true }
starter-store-sqlite     = { workspace = true, features = ["testing", "flow"] }
starter-store-postgres   = { workspace = true, features = ["testing"] }
starter-store-warehouse = { workspace = true, features = ["testing"] }
starter-blob-fs          = { workspace = true }
bytes                    = { workspace = true }
tempfile                 = "3"
starter-flow-nodes       = { workspace = true, features = ["counter"] }
rubix-store-postgres     = { workspace = true }
sqlx                     = { workspace = true, features = ["postgres", "macros", "runtime-tokio"] }
async-trait              = { workspace = true }
tokio                    = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
tower                    = { workspace = true }

[features]
default = []
# Forward to starter-observability so the tokio-console layer is
# wired in `boot::init_tracing`. Requires the workspace to be
# built with `RUSTFLAGS="--cfg tokio_unstable"`; see the
# `agent-console` make target.
tokio-console = ["starter-observability/tokio-console"]

[lints]
workspace = true
