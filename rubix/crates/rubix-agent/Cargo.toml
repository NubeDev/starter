[package]
name = "rubix-agent"
default-run = "rubix-agent"
description = "The rubix backend binary. Composes every starter-* capability with the rubix tools, skills, and flows for the six goals. Per SCOPE R5: main.rs only wires; domain logic lives in rubix-tools or starter."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "rubix-agent"
path = "src/main.rs"

# Admin CLI sibling binary. Verb-per-file under `src/bin/rubix_admin/`.
# See docs/design/auth/README.md for the bootstrap-user contract.
[[bin]]
name = "rubix-admin"
path = "src/bin/rubix_admin/main.rs"

[dependencies]
rubix-spi    = { workspace = true }
rubix-tools  = { workspace = true }
rubix-skills = { workspace = true }
rubix-flows  = { workspace = true }
rubix-client = { workspace = true }

# Starter platform pieces wired in by the binary. Many are Phase 0
# placeholders — Phase 1+ activates the additional surfaces.
starter-spi              = { workspace = true, features = ["i18n", "preferences"] }
starter-config           = { workspace = true }
starter-observability    = { workspace = true }
starter-server           = { workspace = true }
starter-store-postgres   = { workspace = true }
starter-changelog        = { workspace = true }
starter-changelog-postgres = { workspace = true }
starter-authz             = { workspace = true }
starter-auth-users         = { workspace = true, features = ["postgres"] }
starter-i18n              = { workspace = true, features = ["units", "preferences", "routes"] }
starter-mcp               = { workspace = true, features = ["http"] }
starter-store-clickhouse  = { workspace = true }
starter-flow              = { workspace = true }
starter-flow-spi          = { workspace = true }
starter-flow-surfaces     = { workspace = true }
starter-ai                = { workspace = true, features = ["provider-claude"] }
starter-ai-agent          = { workspace = true }
starter-flow-node-loop    = { workspace = true }

axum    = { workspace = true }
clap    = { workspace = true }
async-trait = { workspace = true }
chrono      = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }

# Async + utility
tokio   = { workspace = true, features = ["rt-multi-thread", "macros", "signal"] }
tracing = { workspace = true }
anyhow  = { workspace = true }

[dev-dependencies]
starter-mcp              = { workspace = true, features = ["http", "testing"] }
starter-changelog-sqlite = { workspace = true }
starter-store-sqlite     = { workspace = true, features = ["testing"] }
starter-store-clickhouse = { workspace = true, features = ["testing"] }
starter-undo             = { workspace = true }
async-trait              = { workspace = true }
tokio                    = { workspace = true, features = ["macros", "rt-multi-thread", "process", "io-util", "time"] }
tower                    = { workspace = true }
