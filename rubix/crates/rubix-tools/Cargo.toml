[package]
name = "rubix-tools"
description = "Rubix-specific tool implementations (impl starter_spi::Tool) grouped by the six goals: dashboard, user, flow_ops, clickhouse, system, analytics. Per SCOPE R5: dispatch logic only — DTOs and descriptors live in rubix-spi."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rubix-spi = { workspace = true }
starter-spi = { workspace = true, features = ["i18n", "units"] }
async-trait = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
starter-tool-sysdiag = { workspace = true }

# flow_ops.kinds reads `NodeBehavior::config_schema()` / `kind_id()`
# off the node-kind trait when constructing a kinds snapshot via
# `FlowKindsTool::from_behaviors`. See src/flow_ops/kinds.rs.
# Also used by dashboard.page_set to funnel operator slot writes
# through the R2 chokepoint `GraphStore::write_slot`.
starter-flow-spi          = { workspace = true }

# flow-programmer verbs validate YAML through `rubix_flows::yaml::RubixFlowYaml`
# and `rubix_flows::convert`. See docs/design/flows/.
rubix-flows               = { workspace = true }

# History side of the warehouse. Pulled in so the disk verb can
# write a `system_disk_history` row after a successful probe and
# so the dispatcher can re-export the `MigrationRunner` consumers
# need to apply `rubix/0002_history`. No direct `clickhouse` crate
# dep — that lives transitively under starter-store-clickhouse.
starter-store-clickhouse = { workspace = true }
uuid                      = { workspace = true }

# undo goal — Reversible-aware dispatch wrapper + rubix.undo.last verb.
# See docs/design/undo/.
starter-undo              = { workspace = true }
starter-changelog         = { workspace = true }

# dashboard.create re-asserts the `rubix.dashboard.page` ResourceSpec
# on the authz registry per write (Phase C.2 of `dashboards`).
starter-authz             = { workspace = true }

# analytics.query bundles its named SQL templates via `include_dir!`
# at compile time — same pattern as `rubix-flows` and `rubix-skills`.
# See src/analytics/templates/.
include_dir               = "0.7"

# analytics.report stitches several named queries into one rendered
# artifact via starter-export and persists the bytes through any
# `starter_spi::blob::BlobStore` (in practice `starter-blob-fs`).
# See src/analytics/report.rs.
starter-export            = { workspace = true, features = ["html", "csv", "json"] }
bytes                     = { workspace = true }

[dev-dependencies]
# analytics.report integration test writes the rendered bytes to a
# tempdir-backed FsBlobStore. Pulled into dev only — the verb itself
# is BlobStore-trait-only, so production wiring can swap in any
# backend without touching this crate's compile graph.
starter-blob-fs    = { workspace = true }
tempfile           = "3"
futures            = { workspace = true }
chrono             = { workspace = true }
# Recorded-LLM round-trip harness for the system.disk verb. Pulls
# the ai-agent node body + the starter `RecordingAiRunner` fake so
# the tool exercise the same NodeBehavior::invoke seam production
# uses. See docs/design/tools/.
starter-ai         = { workspace = true, features = ["testing"] }
# testcontainers-based ClickHouse harness for the analytics.query
# integration test. See tests/analytics_query_test.rs.
starter-store-clickhouse = { workspace = true, features = ["testing"] }
starter-flow       = { workspace = true }
starter-flow-nodes = { workspace = true, features = ["ai-agent", "tool-call", "counter"] }
