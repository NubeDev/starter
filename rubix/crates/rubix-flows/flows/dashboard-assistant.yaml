# Bundled rubix flow — Goal 1 (dashboard authoring).
#
# Rooted at a single `ai-agent` node. Per SCOPE R7 the flow itself
# auto-surfaces as an MCP tool via FlowAsTool; the agent loop reaches
# the seven `rubix.dashboard.*` verbs + `rubix.undo.last` through the
# `tool_registry_snapshot` boot/mcp/register.rs threads in. See
# rubix/docs/scope/dashboards/06-ai-builder.md.
id: com.rubix.dashboard-assistant
description: |
  Operator + AI co-authored SDUI dashboards. The agent reads the
  current page (rubix.dashboard.get), proposes a new revision
  (rubix.dashboard.update / .create), can list, duplicate, delete
  pages, and mutate one runtime slot (rubix.dashboard.page_set).
  `rubix.undo.last` reverses the last reversible write so the
  operator can roll back a bad suggestion without leaving the chat.
trigger: explicit

nodes:
  - id: agent
    kind: ai-agent
    config:
      session_policy: continue
      skill_hint: com.rubix.dashboard-builder
      cost_cap: 0.50_usd
      allowed_tools:
        # First entry is the zero-arg "primary tool" picked by
        # boot/mcp/register.rs::primary_tool_for_root — must be a
        # read verb so the agent has something to narrate on an
        # empty MCP call.
        - rubix.dashboard.list
        - rubix.dashboard.get
        - rubix.dashboard.create
        - rubix.dashboard.update
        - rubix.dashboard.duplicate
        - rubix.dashboard.delete
        - rubix.dashboard.page_set
        - rubix.undo.last

links: []
