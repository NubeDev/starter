# Bundled rubix flow — see SCOPE Phase plan for which phase wires this.
id: com.rubix.user-admin
description: |
  user-admin flow rooted at an ai-agent node. Auto-surfaces as an MCP
  tool via FlowAsTool (no per-flow MCP wiring per SCOPE R7).
trigger: explicit

nodes:
  - id: agent
    kind: ai-agent
    config:
      session_policy: continue
      skill_hint: com.rubix.user-admin
      cost_cap: 0.50_usd
      allowed_tools:
        - rubix.user.create
        - rubix.user.disable
        - rubix.user.list
        - rubix.team.create
        - rubix.team.assign
        - rubix.tenant.list
        - rubix.undo.last

links: []
