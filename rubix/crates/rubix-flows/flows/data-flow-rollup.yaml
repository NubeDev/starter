# Stage 05 rollup flow — drives `rubix.warehouse.rollup_15m` every
# 5 minutes. Each tick materialises 15-minute buckets from L2
# (rubix.meter_readings_1m) into L3 (rubix.meter_readings_15m)
# over a 30-minute lookback window. L3 is ReplacingMergeTree so
# repeated passes refine the same bucket rather than duplicating.
#
# See rubix/docs/sessions/data-flow/05-dashboard-at-scale.md for
# the success bar this flow underpins (server-side downsampling
# so the 30-day dashboard ships ≤9000 rows to the browser).
id: com.rubix.data-flow.rollup
description: |
  Stage 05 L3 rollup. Schedule fires every 5 minutes; rollup_15m
  tool inserts 15-minute buckets into rubix.meter_readings_15m
  over a 30-minute lookback window. Idempotent thanks to
  ReplacingMergeTree dedup on (tenant_id, meter_id, bucket_start).
trigger: schedule
cron_expr: "0 */5 * * * *"

nodes:
  - id: tick
    kind: starter.flow.trigger.schedule
    config:
      cron_expr: "0 */5 * * * *"
  - id: rollup
    kind: starter.flow.tool-call
    config:
      tool_id: "rubix.warehouse.rollup_15m"
      tool_input:
        lookback_minutes: 30
  - id: emit
    kind: starter.flow.log
    config:
      level: info

links:
  - { from: "tick.fire",      to: "rollup.in" }
  - { from: "rollup.output",  to: "emit.value" }
