# Bundled rubix flow — see SCOPE Phase plan for which phase wires this.
id: com.rubix.clickhouse-ruler
description: |
  clickhouse-ruler flow rooted at an ai-agent node. Auto-surfaces as an MCP
  tool via FlowAsTool (no per-flow MCP wiring per SCOPE R7).
trigger: explicit

nodes:
  - id: agent
    kind: ai-agent
    config:
      session_policy: continue
      skill_hint: com.rubix.clickhouse-ruler
      cost_cap: 0.50_usd
      allowed_tools:
        - rubix.clickhouse.rule.write
        - rubix.clickhouse.mart.create
        - rubix.clickhouse.retention.set
        - rubix.undo.last

links: []
