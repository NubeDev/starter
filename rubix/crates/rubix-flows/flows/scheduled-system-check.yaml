# Bundled rubix flow — Goal 5: background system health.
#
# Trigger is `explicit` for now; the cron-schedule node kind that
# would let this run on a timer is tracked in
# docs/design/starter-changes/.

id: com.rubix.scheduled-system-check
description: |
  Inspect rubix host health and alert if a threshold is crossed.
trigger: explicit

nodes:
  - id: check
    kind: ai-agent
    config:
      session_policy: fresh
      skill_hint: com.rubix.system-checker
      cost_cap: 0.10_usd
      allowed_tools:
        - rubix.system.disk
        - rubix.system.db
        - rubix.system.flow_errors
        - rubix.alert.send

links: []
