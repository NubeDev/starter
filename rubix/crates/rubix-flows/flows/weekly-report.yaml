# Bundled rubix flow — see SCOPE Phase plan for which phase wires this.
id: com.rubix.weekly-report
description: |
  analytics-reporter flow rooted at an ai-agent node. Auto-surfaces as an MCP
  tool via FlowAsTool (no per-flow MCP wiring per SCOPE R7).
trigger: explicit

nodes:
  - id: agent
    kind: ai-agent
    config:
      session_policy: continue
      skill_hint: com.rubix.analytics-reporter
      cost_cap: 0.50_usd
      # Goal 6 is deferred. Primary tool dispatch returns
      # Diagnostic { code: rubix.goal.not_wired }. Replace with
      # the real analytics verbs once the report sink lands. See
      # rubix-tools/src/analytics/weekly_report.rs and
      # docs/design/reports/README.md.
      allowed_tools:
        - com.rubix.weekly-report

links: []
