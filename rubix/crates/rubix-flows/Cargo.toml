[package]
name = "rubix-flows"
description = "Bundled flow YAML files for the six rubix goals. Each flow is rooted at an ai-agent node. Content crate: YAML shipped via include_dir!, with a load helper that registers the bundle into a FlowRegistry. Per SCOPE R7: every bundled flow auto-surfaces as an MCP tool via FlowAsTool — no per-flow MCP wiring."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
include_dir = "0.7"
anyhow      = { workspace = true }
serde       = { workspace = true, features = ["derive"] }
serde_json  = { workspace = true }
serde_yaml  = "0.9"
thiserror   = { workspace = true }

# Typed flow body + id types. The loader projects the
# human-authored YAML surface into starter-flow's typed shape so
# the agent binary can register each entry with the host's
# FlowRegistry on boot. rubix-flows stays a small content crate;
# starter-flow is the typed projection it converts into.
starter-flow     = { workspace = true }
starter-flow-spi = { workspace = true }

[lints]
workspace = true
