# Sample rubix-agent config for the local thin-slice demo.
#
# Install once:
#     cp rubix/dev/agent.toml ~/.config/rubix/agent.toml
#
# Or point the binary at it directly:
#     RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent
#
# Values match `rubix/docker/docker-compose.dev.yaml` byte-for-byte.
# Loaded by `rubix_agent::boot::config::AgentConfig::load` with the
# precedence: defaults < this file < RUBIX_* env < flags.

bind = "0.0.0.0:8088"
# Single TimescaleDB-enabled Postgres holds both OLTP tables and
# warehouse hypertables. `warehouse_url` is intentionally absent —
# the warehouse boot shares this pool via `WarehouseClient::from_pool`.
database_url = "postgres://rubix:rubix-dev@127.0.0.1:5433/rubix"

secrets_path = "rubix/dev/secrets.age"

# Which AI runner `boot::ai::build_runner` constructs at startup.
# Defaults to the local `claude` CLI on PATH (zero-config; the
# binary manages its own auth via `claude login`). The `anthropic`
# REST branch is deferred for v0 — see
# crates/starter-ai-agent/LONG-TERM.md for the staged plan.
# ai_provider = "claude-cli"

# Extension-host knobs (rubix-extensions-wire Phase C).
#
# `dev_dirs` is the list of developer source trees, scanned read-only.
# Bundles found here are stamped `BundleOrigin::Dev`; the uninstall
# handler will disable + purge their *data* but never delete the source
# files. Default `["rubix/extensions"]` — the in-repo workspace shipping
# `com.rubix.example`.
#
# `installs_dir` is where `POST /api/v1/extensions/install` unpacks
# uploaded tarballs. Leave it unset to use the OS default
# (`$XDG_DATA_HOME/rubix/extensions/installed/` on Linux); override
# explicitly in production (e.g. `/var/lib/rubix/extensions/installed`).
#
# `autostart_enabled_records = true` re-spawns supervisors for every
# extension the PG store marks Enabled before the HTTP listener opens
# — integration tests that drive lifecycle explicitly should set this
# to false.
[extensions]
enabled = true
dev_dirs = ["rubix/extensions"]
# installs_dir = "/var/lib/rubix/extensions/installed"
autostart_enabled_records = true

# Insights-gate thresholds. The disk verb's post-dispatch hook
# fires `rubix.alert.send` once `percent_used` crosses
# `disk_warn_threshold`. Default `90` matches the v0 hardcoded
# constant; lower it (e.g. `50`) to exercise the alert path on
# hosts that never reach 90% used.
# [insights]
# disk_warn_threshold = 90
