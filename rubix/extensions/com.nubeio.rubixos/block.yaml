# `com.nubeio.rubixos` — Rubix-OS / Nube-iO BMS data extension.
#
# Owns the warehouse tables that hold a Nube-iO Rubix-OS Postgres
# dump (points / devices / networks / tags / histories). The host
# creates the tables empty at boot via `boot::extension_tables`
# (prefixing each with `com_nubeio_rubixos__` and prepending
# `tenant_id TEXT`); the bundled `scripts/load-dump.sh` then
# pg_restores the upstream dump into a staging schema and bulk-
# INSERTs into the host-owned tables, turning `histories` into a
# Timescale hypertable before the load.
#
# Per SCOPE R8 the only dependency is `starter-ext-sdk`.

id: com.nubeio.rubixos
v: 1
version: 0.1.0
display_name: Nube-iO Rubix-OS BMS
runtime:
  kind: process
  bin: rubix-nubeio-rubixos-extension

# Health-check cadence for the supervisor that owns this process.
#
# WHY 10s (not the 2s default): this extension fronts an adopted
# ~955M-row TimescaleDB on a memory-starved box (12MB work_mem).
# `health` is answered on a non-blocking path in the child, so a ping
# is normally acknowledged in milliseconds regardless of query load —
# but a cold dashboard burst can briefly saturate the runtime, and a
# 2s timeout was tight enough to false-positive under that spike and
# kill a healthy-but-busy child (orphaning every in-flight request to
# the 95s jsonrpc ceiling — the "dashboard hangs" symptom).
#
# The real load amplifier — N identical concurrent queries each hitting
# the DB — is now fixed at the source by single-flight coalescing in
# `starter-cache` (one backing load per key; the rest wait), so this no
# longer needs to absorb a thundering herd. 10s is a modest backstop:
# generous enough to never kill a merely-busy child, tight enough to
# still catch a genuinely wedged one promptly. interval 5s keeps
# liveness detection responsive.
supervision:
  health:
    interval_ms: 5000
    timeout_ms: 10000

capabilities:
  # The Rubix-OS dump itself is still loaded out-of-band by
  # `scripts/load-dump.sh`. The write grant below is owned solely by
  # the barcode/provisioning feature (the `bc_*` tables) — see
  # BARCODE.md §11. Removing that feature = removing this grant.
  - kind: warehouse_write
    tables:
      - bc_templates
      - bc_sites
      - bc_locations
      - bc_devices
      - bc_points
      - bc_widgets
      - bc_pages
      - bc_alarms
      - bc_provision_log
  - kind: warehouse_read
    tables:
      - com_nubeio_rubixos__histories
      - com_nubeio_rubixos__points
      - com_nubeio_rubixos__device_tags
      - com_nubeio_rubixos__device_meta_tags
      - com_nubeio_rubixos__network_tags
      - com_nubeio_rubixos__network_meta_tags
      - com_nubeio_rubixos__point_tags
      - com_nubeio_rubixos__point_meta_tags
      # Barcode/provisioning read surface (BARCODE.md §5).
      - com_nubeio_rubixos__bc_templates
      - com_nubeio_rubixos__bc_sites
      - com_nubeio_rubixos__bc_locations
      - com_nubeio_rubixos__bc_devices
      - com_nubeio_rubixos__bc_points
      - com_nubeio_rubixos__bc_widgets
      - com_nubeio_rubixos__bc_pages
      - com_nubeio_rubixos__bc_alarms
      - com_nubeio_rubixos__bc_provision_log

contributes:
  tools:
    - id: com.nubeio.rubixos.echo
      input_schema: kinds/echo_in.json
      output_schema: kinds/echo_out.json
      description_file: kinds/echo.md

    # Browser-facing proxy over WarehouseReadHandle. Refuses any
    # template outside this extension's namespace.
    - id: com.nubeio.rubixos.warehouse_query
      input_schema: kinds/warehouse_query_in.json
      output_schema: kinds/warehouse_query_out.json
      description_file: kinds/warehouse_query.md

    # ----------------------------------------------------------------
    # Barcode / scan-to-dashboard provisioning (BARCODE.md). Every
    # tool is `bc_*`-named so the whole feature is removable: delete
    # these entries + their kinds/bc_* schemas + the bc_* handlers in
    # process/src/provision/ and the energy/water surface is untouched.
    # ----------------------------------------------------------------
    - id: com.nubeio.rubixos.bc_decode
      input_schema: kinds/bc_decode_in.json
      output_schema: kinds/bc_decode_out.json
      description_file: kinds/bc_decode.md
    - id: com.nubeio.rubixos.bc_provision
      input_schema: kinds/bc_provision_in.json
      output_schema: kinds/bc_provision_out.json
      description_file: kinds/bc_provision.md
    - id: com.nubeio.rubixos.bc_device_update
      input_schema: kinds/bc_device_update_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_device.md
    - id: com.nubeio.rubixos.bc_device_decommission
      input_schema: kinds/bc_device_decommission_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_device.md
    - id: com.nubeio.rubixos.bc_device_assign_page
      input_schema: kinds/bc_device_assign_page_in.json
      output_schema: kinds/bc_device_assign_page_out.json
      description_file: kinds/bc_device.md
    - id: com.nubeio.rubixos.bc_site_create
      input_schema: kinds/bc_site_create_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_site.md
    - id: com.nubeio.rubixos.bc_location_create
      input_schema: kinds/bc_location_create_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_site.md
    - id: com.nubeio.rubixos.bc_page_create
      input_schema: kinds/bc_page_create_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_page.md
    - id: com.nubeio.rubixos.bc_page_update
      input_schema: kinds/bc_page_update_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_page.md
    - id: com.nubeio.rubixos.bc_page_delete
      input_schema: kinds/bc_page_delete_in.json
      output_schema: kinds/bc_page_delete_out.json
      description_file: kinds/bc_page.md
    - id: com.nubeio.rubixos.bc_template_upsert
      input_schema: kinds/bc_template_upsert_in.json
      output_schema: kinds/bc_write_out.json
      description_file: kinds/bc_template.md
    - id: com.nubeio.rubixos.bc_label_render
      input_schema: kinds/bc_label_render_in.json
      output_schema: kinds/bc_label_render_out.json
      description_file: kinds/bc_label.md

  warehouse_tables:
    # ------------------------------------------------------------------
    # Time-series — the main payload (17M+ rows in production dumps).
    # The host CREATEs this as a plain table; `scripts/load-dump.sh`
    # converts it to a Timescale hypertable on `timestamp` before
    # inserting from the staging schema.
    # ------------------------------------------------------------------
    - name: histories
      order_by: [timestamp, point_uuid]
      columns:
        - { name: point_uuid, type: "TEXT" }
        - { name: host_uuid,  type: "TEXT" }
        - { name: value,      type: "NUMERIC",     default: "NULL" }
        - { name: timestamp,  type: "TIMESTAMPTZ" }

    # Catalog of points (a "point" is one BMS data tag — temperature
    # sensor, setpoint, etc.). Shape mirrors `public.points` from the
    # Rubix-OS dump.
    - name: points
      order_by: [host_uuid, uuid]
      columns:
        - { name: uuid,                 type: "TEXT" }
        - { name: name,                 type: "TEXT", default: "NULL" }
        - { name: description,          type: "TEXT", default: "NULL" }
        - { name: device_uuid,          type: "TEXT", default: "NULL" }
        - { name: device_name,          type: "TEXT", default: "NULL" }
        - { name: device_description,   type: "TEXT", default: "NULL" }
        - { name: network_uuid,         type: "TEXT", default: "NULL" }
        - { name: network_name,         type: "TEXT", default: "NULL" }
        - { name: network_description,  type: "TEXT", default: "NULL" }
        - { name: global_uuid,          type: "TEXT", default: "NULL" }
        - { name: host_uuid,            type: "TEXT" }
        - { name: host_name,            type: "TEXT", default: "NULL" }
        - { name: host_description,     type: "TEXT", default: "NULL" }
        - { name: group_uuid,           type: "TEXT", default: "NULL" }
        - { name: group_name,           type: "TEXT", default: "NULL" }
        - { name: group_description,    type: "TEXT", default: "NULL" }
        - { name: location_uuid,        type: "TEXT", default: "NULL" }
        - { name: location_name,        type: "TEXT", default: "NULL" }
        - { name: location_description, type: "TEXT", default: "NULL" }

    # ------------------------------------------------------------------
    # Tags + meta-tags (key/value pairs on devices / networks / points).
    # ------------------------------------------------------------------
    - name: device_tags
      order_by: [host_uuid, device_uuid]
      columns:
        - { name: host_uuid,   type: "TEXT" }
        - { name: device_uuid, type: "TEXT" }
        - { name: tag,         type: "TEXT" }

    - name: device_meta_tags
      order_by: [host_uuid, device_uuid, key]
      columns:
        - { name: host_uuid,   type: "TEXT" }
        - { name: device_uuid, type: "TEXT" }
        - { name: key,         type: "TEXT" }
        - { name: value,       type: "TEXT", default: "NULL" }

    - name: network_tags
      order_by: [host_uuid, network_uuid]
      columns:
        - { name: host_uuid,    type: "TEXT" }
        - { name: network_uuid, type: "TEXT" }
        - { name: tag,          type: "TEXT" }

    - name: network_meta_tags
      order_by: [host_uuid, network_uuid, key]
      columns:
        - { name: host_uuid,    type: "TEXT" }
        - { name: network_uuid, type: "TEXT" }
        - { name: key,          type: "TEXT" }
        - { name: value,        type: "TEXT", default: "NULL" }

    - name: point_tags
      order_by: [host_uuid, point_uuid]
      columns:
        - { name: host_uuid,  type: "TEXT" }
        - { name: point_uuid, type: "TEXT" }
        - { name: tag,        type: "TEXT" }

    - name: point_meta_tags
      order_by: [host_uuid, point_uuid, key]
      columns:
        - { name: host_uuid,  type: "TEXT" }
        - { name: point_uuid, type: "TEXT" }
        - { name: key,        type: "TEXT" }
        - { name: value,      type: "TEXT", default: "NULL" }

    # ------------------------------------------------------------------
    # Continuous-aggregate rollups (see scripts/post-load.sql). These
    # are NOT plain tables — they are Timescale materialized views over
    # `histories`, created by `post-load.sql` after the bulk load. They
    # are registered here so the host's per-call warehouse_tables[]
    # allowlist gate covers templates that reference them (e.g.
    # `history_bucketed_1m`).
    #
    # `kind: continuous_aggregate` opts this entry out of the host's
    # boot-time `CREATE TABLE IF NOT EXISTS` step. Creation is owned
    # by the extension's `scripts/post-load.sql` so we never race the
    # materialised view with a plain stub. The column list mirrors the
    # SELECT in post-load.sql for documentation / admin-introspection.
    - name: histories_1m
      kind: continuous_aggregate
      order_by: [tenant_id, point_uuid, bucket]
      columns:
        - { name: point_uuid,   type: "TEXT" }
        - { name: host_uuid,    type: "TEXT" }
        - { name: bucket,       type: "TIMESTAMPTZ" }
        - { name: avg_value,    type: "DOUBLE PRECISION", default: "NULL" }
        - { name: min_value,    type: "DOUBLE PRECISION", default: "NULL" }
        - { name: max_value,    type: "DOUBLE PRECISION", default: "NULL" }
        - { name: sample_count, type: "BIGINT",           default: "NULL" }

    # ------------------------------------------------------------------
    # Barcode / scan-to-dashboard provisioning catalog (BARCODE.md §4).
    # All `bc_*`-prefixed and disjoint from the read-only dump tables
    # above. The host CREATEs each as `com_nubeio_rubixos__bc_<name>`
    # with `tenant_id TEXT` prepended at column 0; the extension never
    # writes `tenant_id`. Dropping these nine entries + the write grant
    # removes the whole feature (BARCODE.md §11).
    # ------------------------------------------------------------------
    - name: bc_templates
      order_by: [template]
      columns:
        - { name: template,     type: "TEXT" }
        - { name: version,      type: "INT",         default: "1" }
        - { name: display_name, type: "TEXT",        default: "NULL" }
        - { name: network,      type: "TEXT",        default: "NULL" }
        - { name: category,     type: "TEXT",        default: "NULL" }
        - { name: icon,         type: "TEXT",        default: "NULL" }
        - { name: yaml,         type: "TEXT" }
        - { name: points_json,  type: "JSONB",       default: "NULL" }
        - { name: widget_group_json, type: "JSONB",  default: "NULL" }
        - { name: updated_at,   type: "TIMESTAMPTZ", default: "now()" }

    - name: bc_sites
      order_by: [site_id]
      columns:
        - { name: site_id,    type: "TEXT" }
        - { name: name,       type: "TEXT",        default: "NULL" }
        - { name: created_at, type: "TIMESTAMPTZ", default: "now()" }

    - name: bc_locations
      order_by: [site_id, location_id]
      columns:
        - { name: location_id, type: "TEXT" }
        - { name: site_id,     type: "TEXT" }
        - { name: name,        type: "TEXT",        default: "NULL" }
        - { name: created_at,  type: "TIMESTAMPTZ", default: "now()" }

    - name: bc_pages
      order_by: [site_id, location_id, page_id]
      columns:
        - { name: page_id,    type: "TEXT" }
        # A page is a dashboard that belongs to one site and (optionally)
        # one location within it, so the client browses
        # "Site → Location → its pages". Both ids are nullable: legacy
        # pages predating these columns read as unassigned, and a page
        # may be pinned to a site without a specific location.
        - { name: site_id,     type: "TEXT",        default: "NULL" }
        - { name: location_id, type: "TEXT",        default: "NULL" }
        - { name: name,        type: "TEXT",        default: "NULL" }
        - { name: created_at,  type: "TIMESTAMPTZ", default: "now()" }

    - name: bc_devices
      order_by: [site_id, device_id]
      columns:
        - { name: device_id,   type: "TEXT" }
        - { name: template,    type: "TEXT" }
        - { name: name,        type: "TEXT", default: "NULL" }
        - { name: network,     type: "TEXT", default: "NULL" }
        - { name: address,     type: "TEXT", default: "NULL" }
        - { name: default_ip,  type: "TEXT", default: "NULL" }
        - { name: hw_rev,      type: "TEXT", default: "NULL" }
        - { name: site_id,     type: "TEXT", default: "NULL" }
        - { name: location_id, type: "TEXT", default: "NULL" }
        - { name: page_id,     type: "TEXT", default: "NULL" }
        - { name: status,      type: "TEXT", default: "'provisioned'" }
        - { name: provisioned_at, type: "TIMESTAMPTZ", default: "now()" }

    - name: bc_points
      order_by: [device_id, point_id]
      columns:
        - { name: point_id,  type: "TEXT" }
        - { name: device_id, type: "TEXT" }
        - { name: point_key, type: "TEXT" }
        - { name: name,      type: "TEXT",    default: "NULL" }
        - { name: unit,      type: "TEXT",    default: "NULL" }
        - { name: kind,      type: "TEXT",    default: "NULL" }
        - { name: widget,    type: "TEXT",    default: "NULL" }
        - { name: writable,  type: "BOOL",    default: "false" }
        - { name: trend_on,  type: "BOOL",    default: "false" }
        - { name: alarm_on,  type: "BOOL",    default: "false" }
        - { name: trend_interval, type: "TEXT", default: "NULL" }

    - name: bc_widgets
      order_by: [page_id, device_id, slot]
      columns:
        - { name: widget_id, type: "TEXT" }
        - { name: page_id,   type: "TEXT" }
        - { name: device_id, type: "TEXT" }
        - { name: point_id,  type: "TEXT", default: "NULL" }
        - { name: widget,    type: "TEXT" }
        - { name: slot,      type: "INT",  default: "0" }
        - { name: role,      type: "TEXT", default: "NULL" }
        - { name: title,     type: "TEXT", default: "NULL" }

    - name: bc_alarms
      order_by: [device_id, alarm_id]
      columns:
        - { name: alarm_id,  type: "TEXT" }
        - { name: device_id, type: "TEXT" }
        - { name: point_id,  type: "TEXT" }
        - { name: point_key, type: "TEXT", default: "NULL" }
        - { name: predicate, type: "TEXT" }
        - { name: severity,  type: "TEXT", default: "NULL" }
        - { name: message,   type: "TEXT", default: "NULL" }
        - { name: enabled,   type: "BOOL", default: "true" }

    - name: bc_provision_log
      order_by: [at, event_id]
      columns:
        - { name: event_id,  type: "TEXT" }
        - { name: device_id, type: "TEXT", default: "NULL" }
        - { name: event,     type: "TEXT" }
        - { name: step,      type: "TEXT", default: "NULL" }
        - { name: detail,    type: "TEXT", default: "NULL" }
        - { name: at,        type: "TIMESTAMPTZ", default: "now()" }

  # Named warehouse-read templates. Per R7 each `sql_file` is
  # captured verbatim for audit and resolved by name at the host;
  # the SPI never templates the SQL at runtime. `$caller_tenant_id`
  # is bound by the host from the operator session and cannot be
  # spoofed by the caller.
  warehouse_templates:
    - name: com.nubeio.rubixos.points_list
      params_schema: kinds/points_list_params.json
      sql_file:      kinds/points_list.sql
      tables: [com_nubeio_rubixos__points]

    - name: com.nubeio.rubixos.points_search
      params_schema: kinds/points_search_params.json
      sql_file:      kinds/points_search.sql
      tables: [com_nubeio_rubixos__points]

    - name: com.nubeio.rubixos.points_by_device
      params_schema: kinds/points_by_device_params.json
      sql_file:      kinds/points_by_device.sql
      tables: [com_nubeio_rubixos__points]

    - name: com.nubeio.rubixos.devices_overview
      params_schema: kinds/devices_overview_params.json
      sql_file:      kinds/devices_overview.sql
      tables: [com_nubeio_rubixos__points]

    - name: com.nubeio.rubixos.networks_overview
      params_schema: kinds/networks_overview_params.json
      sql_file:      kinds/networks_overview.sql
      tables: [com_nubeio_rubixos__points]

    - name: com.nubeio.rubixos.hosts_overview
      params_schema: kinds/hosts_overview_params.json
      sql_file:      kinds/hosts_overview.sql
      tables: [com_nubeio_rubixos__points]

    # Histories — single-point recent samples (raw).
    - name: com.nubeio.rubixos.history_recent
      params_schema: kinds/history_recent_params.json
      sql_file:      kinds/history_recent.sql
      tables: [com_nubeio_rubixos__histories]

    # Histories — time-bucketed aggregate for charting. Uses
    # Timescale's `time_bucket()`; the loader script creates the
    # hypertable so this resolves on real-sized data without table
    # scans.
    - name: com.nubeio.rubixos.history_bucketed
      params_schema: kinds/history_bucketed_params.json
      sql_file:      kinds/history_bucketed.sql
      tables: [com_nubeio_rubixos__histories]

    # KPIs for the overview dashboard (counts + freshness).
    - name: com.nubeio.rubixos.histories_summary
      params_schema: kinds/histories_summary_params.json
      sql_file:      kinds/histories_summary.sql
      tables: [com_nubeio_rubixos__histories]

    # Histories — pre-aggregated 1-minute rollup (Timescale CAGG).
    # Same shape as `history_bucketed`, but sourced from
    # `com_nubeio_rubixos__histories_1m` (installed by
    # scripts/post-load.sql). Use for charts that span more than a
    # few hours — a 24h window hits ~1,440 rows instead of
    # potentially millions of raw samples.
    - name: com.nubeio.rubixos.history_bucketed_1m
      params_schema: kinds/history_bucketed_1m_params.json
      sql_file:      kinds/history_bucketed_1m.sql
      tables: [com_nubeio_rubixos__histories_1m]

    # ----------------------------------------------------------------
    # Energy & Water dashboard templates. `meters_list` filters the
    # points catalog down to electrical or water meters by the
    # Rubix-OS point-tags (`meter` + `elec`/`water` + optional
    # channel like `power`/`energy`/`reading`). The other two
    # aggregate the histories hypertable across an arbitrary set
    # of meter point_uuids (per-site totals + per-bucket series).
    # ----------------------------------------------------------------
    - name: com.nubeio.rubixos.meters_list
      params_schema: kinds/meters_list_params.json
      sql_file:      kinds/meters_list.sql
      tables:
        - com_nubeio_rubixos__points
        - com_nubeio_rubixos__point_tags
        - com_nubeio_rubixos__point_meta_tags

    - name: com.nubeio.rubixos.usage_site_totals
      params_schema: kinds/usage_site_totals_params.json
      sql_file:      kinds/usage_site_totals.sql
      tables:
        - com_nubeio_rubixos__histories
        - com_nubeio_rubixos__points

    - name: com.nubeio.rubixos.usage_bucketed
      params_schema: kinds/usage_bucketed_params.json
      sql_file:      kinds/usage_bucketed.sql
      tables: [com_nubeio_rubixos__histories]

    - name: com.nubeio.rubixos.usage_per_meter
      params_schema: kinds/usage_per_meter_params.json
      sql_file:      kinds/usage_per_meter.sql
      tables:
        - com_nubeio_rubixos__histories
        - com_nubeio_rubixos__points

    # ----------------------------------------------------------------
    # Barcode / provisioning reads (BARCODE.md §6). These back the
    # admin panel and phone PWA. `bc_*`-named so removable with the
    # rest of the feature.
    # ----------------------------------------------------------------
    - name: com.nubeio.rubixos.bc_templates_list
      params_schema: kinds/bc_templates_list_params.json
      sql_file:      kinds/bc_templates_list.sql
      tables: [com_nubeio_rubixos__bc_templates]

    # Single-template read INCLUDING the raw YAML body (the list
    # template omits it to keep list reads light). Backs the template
    # editor and the provision engine's template load.
    - name: com.nubeio.rubixos.bc_template_yaml
      params_schema: kinds/bc_template_yaml_params.json
      sql_file:      kinds/bc_template_yaml.sql
      tables: [com_nubeio_rubixos__bc_templates]

    - name: com.nubeio.rubixos.bc_sites_list
      params_schema: kinds/bc_sites_list_params.json
      sql_file:      kinds/bc_sites_list.sql
      tables: [com_nubeio_rubixos__bc_sites]

    - name: com.nubeio.rubixos.bc_locations_list
      params_schema: kinds/bc_locations_list_params.json
      sql_file:      kinds/bc_locations_list.sql
      tables: [com_nubeio_rubixos__bc_locations]

    - name: com.nubeio.rubixos.bc_pages_list
      params_schema: kinds/bc_pages_list_params.json
      sql_file:      kinds/bc_pages_list.sql
      tables: [com_nubeio_rubixos__bc_pages]

    - name: com.nubeio.rubixos.bc_devices_list
      params_schema: kinds/bc_devices_list_params.json
      sql_file:      kinds/bc_devices_list.sql
      tables: [com_nubeio_rubixos__bc_devices]

    - name: com.nubeio.rubixos.bc_device_get
      params_schema: kinds/bc_device_get_params.json
      sql_file:      kinds/bc_device_get.sql
      tables: [com_nubeio_rubixos__bc_devices]

    - name: com.nubeio.rubixos.bc_points_by_device
      params_schema: kinds/bc_points_by_device_params.json
      sql_file:      kinds/bc_points_by_device.sql
      tables: [com_nubeio_rubixos__bc_points]

    - name: com.nubeio.rubixos.bc_widgets_by_page
      params_schema: kinds/bc_widgets_by_page_params.json
      sql_file:      kinds/bc_widgets_by_page.sql
      tables: [com_nubeio_rubixos__bc_widgets]

    - name: com.nubeio.rubixos.bc_alarms_by_device
      params_schema: kinds/bc_alarms_by_device_params.json
