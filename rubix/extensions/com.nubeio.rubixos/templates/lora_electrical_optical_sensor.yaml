template: lora_electrical_optical_sensor
version: 1
display_name: LoRa Electrical Optical Sensor
network: lora
category: sensor
icon: zap

points:
  # Raw optical pulse count from the energy meter (1 pulse = 1 Wh).
  - key: energy_pulse
    name: Energy Pulse Count
    unit: pulses
    kind: counter
    widget: counter
    trend: { default: true, interval: "5m" }

  # Energy derived from the pulse count (1 pulse = 1 watt).
  - key: energy_watts
    name: Energy
    unit: W
    kind: analog
    widget: stat
    trend: { default: true, interval: "5m" }

  - key: battery
    name: Battery
    unit: "%"
    kind: analog
    widget: battery
    trend: { default: false }
    alarm:
      default: true
      rules:
        - { when: "< 20", severity: warning,  message: "Low battery" }
        - { when: "< 5",  severity: critical, message: "Battery critical" }

widget_group:
  layout: card
  title: "{{device.name}}"
  primary: energy_watts
  secondary: [energy_pulse, battery]
