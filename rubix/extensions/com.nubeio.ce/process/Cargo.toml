# `com.nubeio.ce` — process flavour binary.
#
# Member of the sibling `rubix/extensions/` cargo workspace. Picks
# up `starter-ext-sdk` from the upstream `starter-extensions/`
# workspace via a path dep, honouring SCOPE R2 / R8.
#
# Path-dep hop is the same as `com.nubeio.rubixos`:
#   ..           -> com.nubeio.ce/
#   ../..        -> rubix/extensions/
#   ../../..     -> rubix/
#   ../../../../ -> repo root

[package]
name        = "rubix-nubeio-ce-extension"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true

[[bin]]
name = "rubix-nubeio-ce-extension"
path = "src/main.rs"

[dependencies]
starter-ext-sdk = { path = "../../../../starter-extensions/crates/starter-ext-sdk", default-features = false, features = ["process"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "macros", "io-std", "io-util", "time"] }
