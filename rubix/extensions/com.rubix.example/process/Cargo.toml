# Reference rubix extension — process flavour.
#
# Member of the `rubix/extensions/` cargo workspace (sibling to the
# rubix root workspace; see rubix/extensions/Cargo.toml). Picks up
# `starter-ext-sdk` from the upstream `starter-extensions/` workspace
# via a path dep, honouring SCOPE.md R2 (rubix → starter-extensions,
# never the other way).
#
# See rubix/docs/design/extensions/README.md for the full block
# authoring guide.

[package]
name        = "rubix-example-extension"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true

[[bin]]
name = "rubix-example-extension"
path = "src/main.rs"

[dependencies]
# Pulled in by path from the sibling `starter-extensions/` workspace.
# The relative hop is `../../../../starter-extensions/crates/starter-ext-sdk`:
#   ..        -> com.rubix.example/
#   ../..     -> rubix/extensions/
#   ../../..  -> rubix/
#   ../../../../ -> repo root
# The `process` feature is the flavour this binary will eventually
# adopt (Phase B.2+); declaring it here keeps the dep resolution
# honest even while `src/main.rs` is still a placeholder.
starter-ext-sdk = { path = "../../../../starter-extensions/crates/starter-ext-sdk", default-features = false, features = ["process"] }
