# Reference rubix extension — the layout template for third-party authors.
#
# This block contributes one extra tool, one skill, and one flow into
# the host's shared registries via the upstream `starter-ext-flow`
# adapter, composed in `rubix-agent`'s `boot::extensions_flow`.
#
# Per SCOPE R8: extensions depend ONLY on `starter-ext-sdk` (the
# upstream SDK) — never path-dep rubix-domain, rubix-tools,
# rubix-agent, or anything in starter/crates/.

id: com.rubix.example
v: 1
version: 0.1.0
display_name: Rubix Example Extension
runtime:
  kind: process
  bin: rubix-example-extension
