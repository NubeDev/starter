# Reference rubix extension — the layout template for third-party authors.
#
# Per SCOPE Phase 5: this block contributes one extra tool, one skill,
# and one flow into the host's shared registries via starter-ext-flow
# (planned upstream — see docs/design/STARTER-CHANGES.md).
#
# Per SCOPE R8: extensions depend ONLY on rubix-extensions-sdk (the
# planned SDK) — never path-dep rubix-domain, rubix-tools, rubix-agent,
# or anything in starter/crates/.

id: com.rubix.example
version: 0.1.0
runtime:
  kind: process
  bin: rubix-example-extension

contributes:
  tools:
    - id: com.rubix.example.echo
      handler: EchoTool

  skills:
    - dir: skills/

  flows:
    - id: com.rubix.example.assistant
      flow_file: flows/example-assistant.yaml
      auth: { require_role: Reader }

  # Phase D.2 — ship one UI panel so the frontend host-provider page in
  # `packages/test-ui-5` has something to render into the `main` slot.
  # `entry` resolves to the federation bundle at install time; for the
  # in-tree typecheck path the panel ships as `ui/main.tsx` and the
  # build script (added in Phase E) emits `ui/remoteEntry.js`.
  ui:
    entry: ui/remoteEntry.js
    exposes:
      - { name: Main, module: "./main", slot: main }
