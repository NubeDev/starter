# Reference rubix extension — the layout template for third-party authors.
#
# This block contributes one extra tool, one skill, and one flow into
# the host's shared registries via the upstream `starter-ext-flow`
# adapter, composed in `rubix-agent`'s `boot::extensions_flow`.
#
# Per SCOPE R8: extensions depend ONLY on `starter-ext-sdk` (the
# upstream SDK) — never path-dep rubix-domain, rubix-tools,
# rubix-agent, or anything in starter/crates/.

id: com.rubix.example
v: 1
version: 0.1.0
display_name: Rubix Example Extension
runtime:
  kind: process
  bin: rubix-example-extension

# What this extension contributes to the host.
#
# Every section is optional and additive (see
# `starter-extensions/crates/starter-ext-spi/src/manifest.rs::Contributes`).
# Field shapes follow the upstream SPI's `#[serde(deny_unknown_fields)]`
# structs — a typo here is a load-time error, never a silent ignore.
# Runtime grants. Operator-supplied allowlists; an empty list is a
# legal neutralised grant (the extension loads but every call refuses).
# The cleaner-rule adapter runs the `customer_quality` tool inside the
# host process, so even the rule path needs `warehouse_write` only for
# the ingest tool, not for the rule itself.
capabilities:
  - kind: warehouse_write
    # Unprefixed names — the host resolves each to
    # `com_rubix_example__<name>` before issuing the INSERT.
    tables: [customers, products]
  - kind: warehouse_read
    # The read grant cross-checks against each invoked template's
    # `TemplateSpec.tables` allowlist (i.e. an extension that asks
    # for `events` from a template whose grant was `[samples]` is
    # refused at the supervisor gate).
    tables:
      - com_rubix_example__customers
      - com_rubix_example__products

contributes:
  # MCP-style tools (consumed by `starter-ext-mcp-adapter`).
  # The handler body lives in `process/src/main.rs`; each tool id is
  # mangled into the handler name (e.g. `com.rubix.example.csv_ingest`
  # → `handle_com_rubix_example_csv_ingest`) by the
  # `register_process_main!` macro.
  tools:
    # Reference: byte-for-byte echo. Kept so the smoke tests around
    # this extension keep working.
    - id: com.rubix.example.echo
      input_schema: kinds/echo_in.json
      output_schema: kinds/echo_out.json
      description_file: kinds/echo.md

    # Ingest datablist-shaped CSV rows into the extension-owned
    # warehouse tables (customers, products). The host stamps
    # `tenant_id` before the INSERT so extensions cannot spoof
    # cross-tenant writes.
    - id: com.rubix.example.csv_ingest
      input_schema: kinds/csv_ingest_in.json
      output_schema: kinds/csv_ingest_out.json
      description_file: kinds/csv_ingest.md

    # Per-row data-quality detector for the customers table. The
    # cleaner's `ToolAnomalyRule` adapter dispatches this tool with
    # `{ row, window_tail }` and interprets the response as a
    # RuleOutcome — see contributes.anomaly_rules[] below.
    - id: com.rubix.example.customer_quality
      input_schema: kinds/customer_quality_in.json
      output_schema: kinds/customer_quality_out.json
      description_file: kinds/customer_quality.md

    # Thin proxy over `ctx.warehouse_read().query(template, params)`
    # for the bundled Module-Federation UI panel. The UI cannot reach
    # `WarehouseReadHandle` directly from the browser, so it goes
    # via this tool's `/api/v1/tools/com.rubix.example.warehouse_query`
    # endpoint. Only templates this extension itself contributes are
    # accepted (the handler refuses anything outside the
    # `com.rubix.example.*` namespace before calling into the host).
    - id: com.rubix.example.warehouse_query
      input_schema: kinds/warehouse_query_in.json
      output_schema: kinds/warehouse_query_out.json
      description_file: kinds/warehouse_query.md

    # CRUD over the `products` table. The host's
    # WarehouseWriteHandle exposes `insert` / `update` / `delete`;
    # these three tools are thin proxies the UI calls. Reads go
    # through `warehouse_query` + the `products_list` template.
    - id: com.rubix.example.products_create
      input_schema: kinds/products_create_in.json
      output_schema: kinds/products_write_out.json
      description_file: kinds/products_crud.md
    - id: com.rubix.example.products_update
      input_schema: kinds/products_update_in.json
      output_schema: kinds/products_write_out.json
      description_file: kinds/products_crud.md
    - id: com.rubix.example.products_delete
      input_schema: kinds/products_delete_in.json
      output_schema: kinds/products_write_out.json
      description_file: kinds/products_crud.md

  # Warehouse tables the extension owns. The host issues
  # `CREATE TABLE IF NOT EXISTS com_rubix_example__<name>` at boot
  # for each entry, prepending a `tenant_id String` column at
  # position 0 (the extension must NOT declare it).
  #
  # Column types are passed verbatim into DDL — target Postgres /
  # TimescaleDB via starter-store-warehouse (see ADR-004).
  warehouse_tables:
    # NOTE: the host's `boot::extension_tables` runs DDL against
    # Postgres (see crates/rubix-agent/src/boot/extension_tables.rs).
    # Column types are passed verbatim into the CREATE TABLE — use
    # Postgres type names here.
    - name: customers
      order_by: [customer_id]
      columns:
        - { name: customer_id,       type: "TEXT" }
        - { name: first_name,        type: "TEXT",        default: "NULL" }
        - { name: last_name,         type: "TEXT",        default: "NULL" }
        - { name: company,           type: "TEXT",        default: "NULL" }
        - { name: city,              type: "TEXT",        default: "NULL" }
        - { name: country,           type: "TEXT",        default: "NULL" }
        - { name: email,             type: "TEXT",        default: "NULL" }
        - { name: subscription_date, type: "DATE",        default: "NULL" }
        - { name: website,           type: "TEXT",        default: "NULL" }
        - { name: ingested_at,       type: "TIMESTAMPTZ", default: "now()" }

    - name: products
      order_by: [internal_id]
      columns:
        - { name: internal_id,  type: "TEXT" }
        - { name: name,         type: "TEXT" }
        - { name: brand,        type: "TEXT",             default: "NULL" }
        - { name: category,     type: "TEXT",             default: "NULL" }
        - { name: price,        type: "DOUBLE PRECISION", default: "NULL" }
        - { name: currency,     type: "TEXT",             default: "NULL" }
        - { name: stock,        type: "INTEGER",          default: "NULL" }
        - { name: availability, type: "TEXT",             default: "NULL" }
        - { name: color,        type: "TEXT",             default: "NULL" }
        - { name: size,         type: "TEXT",             default: "NULL" }
        - { name: ingested_at,  type: "TIMESTAMPTZ",      default: "now()" }

  # Named warehouse-read templates the extension adds to the host's
  # `TemplateRegistry`. R7: the host loads `params_schema` + `sql_file`
  # at commit time; the SQL body is captured into `TemplateSpec.sql`
  # for audit and is NEVER templated at runtime — the host integration
  # crate (`rubix-agent`) is the resolver.
  warehouse_templates:
    - name: com.rubix.example.customers_by_country
      params_schema: kinds/customers_by_country_params.json
      sql_file: kinds/customers_by_country.sql
      tables: [com_rubix_example__customers]
    - name: com.rubix.example.customers_sample
      params_schema: kinds/customers_sample_params.json
      sql_file: kinds/customers_sample.sql
      tables: [com_rubix_example__customers]
    - name: com.rubix.example.products_low_stock
      params_schema: kinds/products_low_stock_params.json
      sql_file: kinds/products_low_stock.sql
      tables: [com_rubix_example__products]
    - name: com.rubix.example.products_list
      params_schema: kinds/products_list_params.json
      sql_file: kinds/products_list.sql
      tables: [com_rubix_example__products]

  # Anomaly-rule contributions (Phase B5). Each entry names a tool
  # the same extension exports above; the host wraps the dispatch in
  # a `ToolAnomalyRule` adapter and appends it to the cleaner's
  # `RuleRegistry` AFTER the three builtins (NaN → Spike → Stuck), so
  # this rule only sees rows that passed the numeric-quality gates.
  anomaly_rules:
    - id: com.rubix.example.customer_quality
      tool_id: com.rubix.example.customer_quality
      priority: 100

  # `SKILL.md` bundle root(s). Each entry names a directory whose
  # immediate children are `<id>/SKILL.md` bundles. The adapter folds
  # each bundle into the host's `SkillRegistry` quarantined regardless
  # of frontmatter trust (DOCS/agent/SKILLS.md R-skills-3).
  skills:
    - dir: skills

  # Flow node-kind contributions (DOCS/extensions/scope/FLOW-NODES.md).
  # The kernel binds slice-A's placeholder behaviour today; slice-B's
  # `ProcessNodeProxy` will route `flow.node.invoke` to the same child.
  nodes:
    - kind: com.rubix.example.echo
      settings_schema: kinds/echo_node_settings.json
      description_file: kinds/echo.md
      facets: [transform]

  # Module-Federation UI entry. The `entry` path is served by
  # `starter-ext-server` at `/extensions/<id>/ui/*`. The `name` of
  # each `exposes[]` row must match an export from the federated
  # module declared in `ui-src/vite.config.ts`.
  #
  # `slot:` is a free-form string in the starter SPI — the rubix
  # frontend renders the following slots today:
  #   - `main`    → `<ExtensionSlot id="main"/>` on the /extensions route
  #   - `sidebar` → `<ExtensionSlot id="sidebar"/>` inside `AppSidebar`
  ui:
    entry: ui/remoteEntry.js
    exposes:
      - name: Main
        module: "./Main"
        slot: main
      # Nav-tree contribution mounted into `<ExtensionSlot id="sidebar-nav"/>`.
      # Renders the `Extension Name -> tab -> nested tab` hierarchy in
      # the AppSidebar alongside the host's static / live NavGroups.
      - name: NavTree
        module: "./NavTree"
        slot: sidebar-nav
      # Compact panel mounted into `<ExtensionSlot id="sidebar"/>` in
      # `rubix/frontend/src/components/layout/app-sidebar.tsx`. The
      # `slot` field is a free-form string in the starter SPI — any
      # value works as long as the host renders a matching slot.
      - name: Sidebar
        module: "./Sidebar"
        slot: sidebar
