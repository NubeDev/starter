name: rubix_flutter
description: Rubix Flutter client
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State + DI
  flutter_riverpod: ^3.0.0
  riverpod_annotation: ^3.0.0

  # Navigation
  go_router: ^14.0.0

  # Network
  dio: ^5.7.0
  pretty_dio_logger: ^1.4.0
  # Web SSE needs fetch() + ReadableStream (dio web adapter buffers).
  web: ^1.0.0

  # Models
  freezed_annotation: ^3.0.0
  json_annotation: ^4.9.0

  # Database — drift
  drift: ^2.28.0
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.0

  # Secure credential storage
  flutter_secure_storage: ^9.2.0

  # Non-sensitive prefs
  shared_preferences: ^2.3.0

  # Platform metadata
  package_info_plus: ^8.0.0
  intl: ^0.20.0
  wifi_scan: ^0.4.1+2
  mobile_scanner: ^7.2.0

  # Typography — Geist (matches the React app via @theme --font-sans).
  google_fonts: ^6.2.1

  # Iconography — Lucide icon set replaces Material Symbols so the UI
  # stops looking like a Google product.
  lucide_icons: ^0.257.0

  # Animation — Flutter's answer to Framer Motion. Declarative .animate()
  # API for staggers, springs, slides, fades, shimmers. Used by the app
  # shell (sidebar/tab bar entrance + active indicator) and the router
  # page transitions.
  flutter_animate: ^4.5.0

  # Charts — sparklines, area, donut. MIT, themable, used by the Live
  # Dashboard surface. See lib/shared/widgets/dashboard/.
  fl_chart: ^0.69.0

  # Generated OpenAPI Dio client (regen via `make api-client`).
  rubix_api:
    path: packages/rubix_api

  # SDUI renderer — typed component tree projector against
  # /api/v1/ui/resolve. See packages/rubix_sdui/docs/PROOF.md.
  rubix_sdui:
    path: packages/rubix_sdui

  # Repository interfaces + DTOs shared with the web-mode REST server
  # at packages/rubix_server. See README → "Web vs native data layer".
  rubix_data:
    path: packages/rubix_data

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Lints
  very_good_analysis: ^6.0.0
  riverpod_lint: ^3.0.0

  # Codegen
  build_runner: ^2.4.13
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  drift_dev: ^2.28.0
  riverpod_generator: ^3.0.0

  # Testing
  mocktail: ^1.0.0

  # Asset generators
  flutter_launcher_icons: ^0.13.0
  flutter_native_splash: ^2.4.0

  # OpenAPI client codegen — invoked via `make api-client`. Generates a
  # standalone Dart/Dio package at `packages/rubix_api/` from
  # `../openapi.json` (kept in sync by the backend). Hand-edits to the
  # generated package are forbidden.
  openapi_generator_cli: ^6.1.0

flutter:
  generate: true
  uses-material-design: true
