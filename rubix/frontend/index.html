<!doctype html>
<html lang="en" data-theme="nube">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rubix · Agent Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&family=Inter:wght@300;400;500;600;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <!-- Importmap for extension `remoteEntry.js` bundles loaded via
         dynamic `import()`. The host publishes its React instance on
         `globalThis.__rubixReact*` in `main.tsx`, and these shims
         re-export from those globals so extensions that externalise
         `react` / `react-dom` / `react/jsx-runtime` get the host's
         instance — required for SDK hooks (`useContext`) to work
         across the host↔extension boundary. -->
    <script type="importmap">
      {
        "imports": {
          "react": "/shims/react.mjs",
          "react-dom": "/shims/react-dom.mjs",
          "react-dom/client": "/shims/react-dom-client.mjs",
          "react/jsx-runtime": "/shims/react-jsx-runtime.mjs"
        }
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
