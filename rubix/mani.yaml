# rubix — task surface for the rubix subtree.
#
# R13: drive everything through mani. Contributors discover tasks via
# `mani run --list`; CI calls the same task names. Tasks run from the
# `rubix/` directory but the workspace root is the parent `starter`
# repo (Cargo workspace lives there per Q2 of the Phase-0 SCOPE).

projects:
  rubix:
    path: .
    desc: rubix subtree — Phase 0 skeleton (see SCOPE.md and docs/design/).
    tags: [rubix, active]

tasks:
  status:
    desc: Compact git status filtered to rubix paths.
    cmd: git -C .. status --short -- rubix/

  build:
    desc: |
      Build everything rubix owns:
        * cargo build for the rubix Rust crates (workspace lives at
          the parent starter/ — `-p` flags scope the build);
        * pnpm install + build for the rubix TS workspace.
      `--all` semantics are inherent — there is no per-crate variant.
    cmd: |
      set -euo pipefail
      cd ..
      cargo build \
        -p rubix-spi \
        -p rubix-graph \
        -p rubix-engine \
        -p rubix-kinds-registry \
        -p rubix-agent \
        -p rubix-agent-sdk \
        -p rubix-agent-client-rs
      cd rubix
      pnpm install --frozen-lockfile=false
      pnpm -r --if-present run build || true

  test:
    desc: |
      Run rubix Rust tests + TS tests. The data-postgres /
      data-clickhouse crates land in Stage 2; once present, their
      smoke tests run under `cargo test -- --ignored`.
    cmd: |
      set -euo pipefail
      cd ..
      cargo test \
        -p rubix-spi \
        -p rubix-graph \
        -p rubix-engine \
        -p rubix-kinds-registry \
        -p rubix-agent \
        -p rubix-agent-sdk \
        -p rubix-agent-client-rs
      cd rubix
      pnpm -r --if-present run test || true

  lint:
    desc: |
      Lint pass. Two gates:
        (1) the workspace clippy/fmt invariants for the rubix crates;
        (2) the R1 400-line-per-file budget — every tracked file under
            rubix/ must be ≤ 400 lines. The check below is intentionally
            simple so future phases cannot quietly regress it.
    cmd: |
      set -euo pipefail
      # (1) Rust gates
      cd ..
      cargo fmt --check \
        -p rubix-spi \
        -p rubix-graph \
        -p rubix-engine \
        -p rubix-kinds-registry \
        -p rubix-agent \
        -p rubix-agent-sdk \
        -p rubix-agent-client-rs
      cargo clippy --all-features \
        -p rubix-spi \
        -p rubix-graph \
        -p rubix-engine \
        -p rubix-kinds-registry \
        -p rubix-agent \
        -p rubix-agent-sdk \
        -p rubix-agent-client-rs \
        -- -D warnings
      cd rubix
      # (2) R1 400-line-per-file budget. Walks every tracked file
      #     under rubix/ and fails fast on the first overrun, naming
      #     the offender so authors get an actionable error.
      bad=0
      while IFS= read -r f; do
        # Skip binary blobs and lockfiles where line-count is meaningless.
        case "$f" in
          *.lock|*.png|*.jpg|*.jpeg|*.gif|*.ico|*.pdf|*.bin|*.wasm) continue ;;
        esac
        lines=$(wc -l < "../$f")
        if [ "$lines" -gt 400 ]; then
          echo "R1 violation: ../$f has $lines lines (>400)" >&2
          bad=1
        fi
      done < <(git -C .. ls-files rubix/)
      if [ "$bad" -ne 0 ]; then
        exit 1
      fi
      echo "R1 line-budget OK"

  commit:
    desc: |
      Stage all + commit with $MSG. Refuses an empty/unset MSG.
      Mirrors codeless-workspace/mani.yaml's contract so JOB-LOOP
      ticks invoke it identically.
    env:
      MSG: ""
    cmd: |
      if [ -z "$MSG" ]; then
        echo "error: MSG env var is required" >&2
        exit 2
      fi
      git add -A
      if git diff --cached --quiet; then
        echo "nothing to commit"
        exit 0
      fi
      git commit -m "$MSG"
