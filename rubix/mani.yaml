# rubix task orchestration.
#
# Per SCOPE: `mani run build --all`, `mani run test --all`, and
# `mani run status --all` are the canonical daily commands. Add new
# workflows here first, then document.

projects:
  rubix:
    path: .
    desc: |
      rubix backend product (six crates + extension example).
      See SCOPE.md for the load-bearing R-rules.

tasks:
  build:
    desc: Build every rubix workspace member.
    cmd: cargo build -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent

  test:
    desc: Run every rubix test suite (unit + integration).
    cmd: cargo test -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent

  fmt:
    desc: Format rubix Rust code.
    cmd: cargo fmt --package rubix-spi --package rubix-tools --package rubix-skills --package rubix-flows --package rubix-client --package rubix-agent

  clippy:
    desc: Lint every rubix crate.
    cmd: cargo clippy -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent -- -D warnings

  status:
    desc: Show git status for the rubix tree.
    cmd: git status --short rubix/

  run:
    desc: |
      Boot the rubix-agent against the local thin-slice config at
      rubix/dev/agent.toml (matches docker/docker-compose.dev.yaml).
    cmd: RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent

  dev-deps:
    desc: |
      Bring up the Postgres + warehouse (TimescaleDB) pair the
      thin-slice demo needs, bound to 127.0.0.1 on non-standard
      ports. (Pre-2026-05-27 this booted ClickHouse; see ADR-004.)
    cmd: docker compose -f docker/docker-compose.dev.yaml up -d

  dev-deps-down:
    desc: Tear down the thin-slice Postgres + warehouse pair.
    cmd: docker compose -f docker/docker-compose.dev.yaml down

  bootstrap:
    desc: |
      Create or reconcile the op@example.com bootstrap operator
      against the local dev DB. Idempotent — second run is a no-op
      with exit 0.
    cmd: RUBIX_DSN=postgres://rubix:rubix-dev@127.0.0.1:5433/rubix cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user --email op@example.com --password rubix-dev-passwd

  demo:
    desc: |
      First-boot aggregate for the six-step thin-slice demo:
      check the agent port is free, bring up Postgres + warehouse
      (TimescaleDB), wait until they accept connections (30s
      ceiling), seed the bootstrap operator, then boot the
      rubix-agent.
    cmd: |
      if ss -tlnp 2>/dev/null | grep -q '127.0.0.1:8088 '; then
        echo "rubix demo: 127.0.0.1:8088 is already in use by another process." >&2
        echo "  Likely a leftover rubix-agent from a prior session — stop it with:" >&2
        echo "    pkill -f target/debug/rubix-agent" >&2
        exit 1
      fi
      docker compose -f docker/docker-compose.dev.yaml up -d
      ./scripts/wait-for-deps.sh
      RUBIX_DSN=postgres://rubix:rubix-dev@127.0.0.1:5433/rubix cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user --email op@example.com --password rubix-dev-passwd
      RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent

  healthz:
    desc: Hit the Phase 0 health endpoint.
    cmd: curl -sf http://127.0.0.1:8080/healthz

  bootstrap-user:
    desc: |
      Create or reconcile the first admin user via the rubix-admin
      sibling binary. Reads RUBIX_DSN, RUBIX_BOOTSTRAP_EMAIL,
      RUBIX_BOOTSTRAP_PASSWORD from the environment. Idempotent:
      re-running with the same email + admin role is a no-op. See
      docs/design/auth/README.md for the bootstrap contract.
    cmd: RUBIX_DSN=postgres://rubix:rubix-dev@127.0.0.1:5433/rubix cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user

  mcp-stdio:
    desc: |
      Ad-hoc local launch of the rubix-admin MCP stdio transport
      against the dev Postgres. Mirrors what Claude Desktop spawns;
      see rubix/dev/claude-desktop.example.json for the host-side
      snippet. RUBIX_PRINCIPAL_EMAIL selects the actor.
    cmd: RUBIX_DSN=postgres://rubix:rubix-dev@127.0.0.1:5433/rubix RUBIX_CONFIG=rubix/dev/agent.toml RUBIX_PRINCIPAL_EMAIL=op@example.com cargo run -p rubix-agent --bin rubix-admin -- mcp

  lint-doc-refs:
    desc: Enforce the doc-tier rule on every rubix Rust source file.
    cmd: ./rubix/scripts/lint-doc-refs.sh

  warehouse-seed:
    desc: |
      Seed the local warehouse with a small demo fixture
      (demo_buildings / demo_meters / demo_samples) so the
      explorer at http://127.0.0.1:3030/warehouse/explorer is
      non-empty on a fresh dev box. Idempotent: re-running the
      seed drops + recreates the tables.

      Defaults to CH_EXPLORER_URL=http://127.0.0.1:8124 to match
      docker-compose.dev.yaml; override the env var to point
      anywhere else. (Env var name is legacy — kept until the
      ch-explorer example is renamed; see ADR-004.)
    cmd: |
      : "${CH_EXPLORER_URL:=http://127.0.0.1:8124}"
      export CH_EXPLORER_URL
      cargo run -p ch-explorer-example -- seed

  warehouse-explorer:
    desc: |
      Boot the ch-explorer example binary against the local dev
      warehouse. Serves the SPA at
      http://127.0.0.1:3030/warehouse/explorer and the read-only
      API at /api/warehouse/*. Run `mani run warehouse-seed`
      first on a fresh box, and
      `pnpm -F @nube/starter-ui-ch-explorer build` if dist/ is
      empty. (Crate/package names retain the `ch-` prefix as a
      historical artefact of the ClickHouse era; renames pending.)
    cmd: |
      : "${CH_EXPLORER_URL:=http://127.0.0.1:8124}"
      export CH_EXPLORER_URL
      cargo run -p ch-explorer-example -- serve
