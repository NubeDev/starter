# rubix task orchestration.
#
# Per SCOPE: `mani run build --all`, `mani run test --all`, and
# `mani run status --all` are the canonical daily commands. Add new
# workflows here first, then document.

projects:
  rubix:
    path: .
    desc: |
      rubix backend product (six crates + extension example).
      See SCOPE.md for the load-bearing R-rules.

tasks:
  build:
    desc: Build every rubix workspace member.
    cmd: cargo build -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent

  test:
    desc: Run every rubix test suite (unit + integration).
    cmd: cargo test -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent

  fmt:
    desc: Format rubix Rust code.
    cmd: cargo fmt --package rubix-spi --package rubix-tools --package rubix-skills --package rubix-flows --package rubix-client --package rubix-agent

  clippy:
    desc: Lint every rubix crate.
    cmd: cargo clippy -p rubix-spi -p rubix-tools -p rubix-skills -p rubix-flows -p rubix-client -p rubix-agent -- -D warnings

  status:
    desc: Show git status for the rubix tree.
    cmd: git status --short rubix/

  run:
    desc: |
      Boot the rubix-agent against the local thin-slice config at
      rubix/dev/agent.toml (matches docker/docker-compose.dev.yaml).
    cmd: RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent

  dev-deps:
    desc: |
      Bring up the Postgres + ClickHouse pair the thin-slice demo
      needs, bound to 127.0.0.1 on non-standard ports.
    cmd: docker compose -f docker/docker-compose.dev.yaml up -d

  dev-deps-down:
    desc: Tear down the thin-slice Postgres + ClickHouse pair.
    cmd: docker compose -f docker/docker-compose.dev.yaml down

  bootstrap:
    desc: |
      Create or reconcile the op@example.com bootstrap operator
      against the local dev DB. Idempotent — second run is a no-op
      with exit 0.
    cmd: cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user --email op@example.com --password rubix-dev

  demo:
    desc: |
      First-boot aggregate for the six-step thin-slice demo:
      bring up Postgres + ClickHouse, wait until they accept
      connections (30s ceiling), seed the bootstrap operator,
      then boot the rubix-agent.
    cmd: |
      docker compose -f docker/docker-compose.dev.yaml up -d
      ./scripts/wait-for-deps.sh
      cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user --email op@example.com --password rubix-dev
      RUBIX_CONFIG=rubix/dev/agent.toml cargo run -p rubix-agent

  healthz:
    desc: Hit the Phase 0 health endpoint.
    cmd: curl -sf http://127.0.0.1:8080/healthz

  bootstrap-user:
    desc: |
      Create or reconcile the first admin user via the rubix-admin
      sibling binary. Reads RUBIX_DSN, RUBIX_BOOTSTRAP_EMAIL,
      RUBIX_BOOTSTRAP_PASSWORD from the environment. Idempotent:
      re-running with the same email + admin role is a no-op. See
      docs/design/auth/README.md for the bootstrap contract.
    cmd: cargo run -p rubix-agent --bin rubix-admin -- bootstrap-user

  mcp-stdio:
    desc: |
      Ad-hoc local launch of the rubix-admin MCP stdio transport
      against the dev Postgres. Mirrors what Claude Desktop spawns;
      see rubix/dev/claude-desktop.example.json for the host-side
      snippet. RUBIX_PRINCIPAL_EMAIL selects the actor.
    cmd: RUBIX_CONFIG=rubix/dev/agent.toml RUBIX_PRINCIPAL_EMAIL=op@example.com cargo run -p rubix-agent --bin rubix-admin -- mcp

  lint-doc-refs:
    desc: Enforce the doc-tier rule on every rubix Rust source file.
    cmd: ./rubix/scripts/lint-doc-refs.sh
