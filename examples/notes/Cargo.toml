[package]
name        = "starter-notes"
description = "Demo consumer: notes app proving CLI / REST / gRPC / MCP extension on starter-* libraries with zero starter modifications."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish     = false

[[bin]]
name = "notes"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
# Everything from starter is consumed as a library. No path-edits in
# the starter crates were needed to land any feature in this demo.
starter-spi           = { workspace = true }
starter-server        = { workspace = true }
starter-store-sqlite  = { workspace = true }
starter-auth-token    = { workspace = true, features = ["sqlite"] }
starter-mcp           = { workspace = true, features = ["http"] }
starter-observability = { workspace = true }
starter-cli           = { workspace = true }
starter-client-rs     = { workspace = true }
starter-ui-theme      = { workspace = true, features = ["sqlite"] }

# Prefs + i18n — needed by the Phase-4 prefs/i18n surface this example
# proves end-to-end. `routes` mounts the REST surface
# (GET/PATCH /v1/me/preferences, GET /v1/i18n/manifest, …); `sqlite`
# brings the prefs store implementation. See `user-pref.md` Stage 1.
starter-prefs         = { workspace = true, features = ["routes", "sqlite"] }
starter-i18n          = { workspace = true, features = ["routes"] }

# Extension hosting — cross-workspace path deps to `starter-extensions`.
# Per SCOPE.md R3 this mirrors what a third-party consumer would do once
# the crates are published; the path form works today without publishing.
starter-ext-host      = { path = "../../starter-extensions/crates/starter-ext-host", version = "0.1.0" }
starter-ext-server    = { path = "../../starter-extensions/crates/starter-ext-server", version = "0.1.0" }
starter-ext-mcp       = { path = "../../starter-extensions/crates/starter-ext-mcp", version = "0.1.0" }
starter-ext-grpc      = { path = "../../starter-extensions/crates/starter-ext-grpc", version = "0.1.0" }
starter-ext-sdk       = { path = "../../starter-extensions/crates/starter-ext-sdk", version = "0.1.0", features = ["builtin"] }

# Standard web stack.
axum         = { workspace = true }
clap         = { workspace = true }
prometheus   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true, features = ["sqlite", "macros", "migrate", "runtime-tokio"] }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tracing      = { workspace = true }
utoipa       = { workspace = true }
anyhow       = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }

# gRPC — consumer-owned. Starter has no opinion on tonic; this demo
# stands up its own gRPC surface alongside the REST routes to prove
# the point.
tonic        = { workspace = true }
prost        = { workspace = true }

# Stream adapter: consumer-side glue from `tokio::sync::broadcast` to
# the `futures::Stream` shape that `starter_server::sse::from_stream`
# accepts. Same pattern any consumer would use.
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = { workspace = true }

# Consumer-owned HTTP client. Proves you don't have to extend
# starter-client-rs to talk to your own endpoints — just use reqwest
# directly. (starter-client-rs is still used for the shipped
# `health` / `openapi` subcommands via `register_starter_defaults`.)
reqwest      = { workspace = true, features = ["json"] }

# Flow demo (Phase 5 starter-flow-phase5-demo job): wires a
# trigger.explicit → ai-agent → log flow against the local Claude
# Code CLI runner. The demo lives in `src/flow_demo.rs` and mounts
# `POST /api/flows/codeless-demo/fire` onto the existing router.
starter-flow       = { workspace = true }
starter-flow-spi   = { workspace = true }
starter-flow-nodes = { workspace = true, features = ["ai-agent", "trigger-explicit", "log"] }
starter-ai         = { workspace = true, features = ["provider-claude"] }

[build-dependencies]
tonic-build  = { workspace = true }

[dev-dependencies]
starter-server  = { workspace = true, features = ["testing"] }

[lints]
workspace = true
