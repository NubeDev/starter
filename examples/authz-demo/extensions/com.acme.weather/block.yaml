v: 1
id: com.acme.weather
version: 0.1.0
display_name: "Weather"
description_file: docs/README.md
authors: ["authz-demo"]

# Builtin runtime: the host's `server.rs` registers a `BuiltinTable`
# entry for `com.acme.weather` with one closure that handles both
# the forecast read and the refresh write.
runtime:
  kind: builtin
  crate_name: authz_demo_weather

contributes:
  rest:
    # READ endpoint — gated by the host PolicyEngine via the manifest's
    # `auth.permission` field (SCOPE-EXT R15 / Phase 7d). The REST
    # adapter wraps the handler in `with_permission("weather", "read")`
    # automatically; no host-side hand-mounting is required.
    - id: com.acme.weather.forecast
      method: GET
      path: /weather/forecast
      description_file: docs/forecast.md
      response_schema: schemas/forecast_out.json
      auth:
        permission:
          resource: weather
          action:   read

    # READ/WRITE endpoint — same shape with `("weather", "refresh")`.
    - id: com.acme.weather.refresh
      method: POST
      path: /weather/refresh
      description_file: docs/refresh.md
      response_schema: schemas/refresh_out.json
      auth:
        permission:
          resource: weather
          action:   refresh

  # Phase 7d.2 (SCOPE-EXT §5) — MCP tool entry. The `auth.permission`
  # field is the SAME one the REST entries above declare; the MCP
  # adapter wraps tool dispatch in `AuthzedToolBinding` so a
  # `(weather, read)` deny lands in `starter_authz_decisions` with
  # `surface = "mcp"`. Zero host-side wiring beyond passing the
  # engine into `register_tools_with_engine`.
  tools:
    - id: com.acme.weather.forecast_tool
      input_schema: schemas/forecast_in.json
      output_schema: schemas/forecast_out.json
      description_file: docs/forecast_tool.md
      auth:
        permission:
          resource: weather
          action:   read

  # Phase 7d.2 (SCOPE-EXT §5) — gRPC method entry. Same field shape;
  # the gRPC adapter consults `engine.check` inside
  # `with_surface("grpc", …)` before dispatch when the consumer
  # wires `ExtensionGrpcService::with_authz`.
  grpc:
    - id: com.acme.weather.forecast_rpc
      service: weather.v1.Weather
      method:  Current
      proto: proto/weather.proto
      description_file: docs/forecast_rpc.md
      auth:
        permission:
          resource: weather
          action:   read
