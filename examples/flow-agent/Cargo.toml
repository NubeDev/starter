[package]
name        = "flow-agent"
description = "Demo: flow editor + AI agent chat on starter-* libraries. SSE + REST, no login."
version.workspace      = true
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish     = false

[[bin]]
name = "flow-agent"
path = "src/main.rs"

[lib]
path = "src/lib.rs"

[dependencies]
starter-spi             = { workspace = true }
starter-server          = { workspace = true }
starter-store-postgres  = { workspace = true, features = ["flow", "agent-session"] }
# Warehouse capability (W1–W16), opt-in.
#
# Per ADR-001, flow-agent's OLTP store is Postgres-only. The
# warehouse capability is a separate (tag-driven analytics) seam
# that flow-agent can opt into via this cargo feature — its
# Postgres connection is reused for the `dimensions` catalog and a
# ClickHouse client is constructed from `CLICKHOUSE_URL` etc.
# When `warehouse` is OFF the binary boots exactly as before.
starter-warehouse        = { workspace = true, features = ["warehouse"], optional = true }
starter-store-warehouse = { workspace = true, optional = true }
starter-observability   = { workspace = true }
starter-cache           = { workspace = true }

# Prefs + i18n (US English + Spanish, US/metric/imperial units,
# timezone-aware date/time). flow-agent has no real auth so we mount
# these behind `starter_server::auth::with_anonymous_principal` —
# every request resolves to the same local-operator principal.
starter-prefs         = { workspace = true, features = ["routes", "postgres"] }
starter-i18n          = { workspace = true, features = ["routes"] }

# Flow engine + nodes (Phase 3+).
starter-flow       = { workspace = true }
starter-flow-spi   = { workspace = true }
starter-flow-nodes = { workspace = true, features = ["ai-agent", "trigger-explicit", "log"] }

# Hot-reloadable node-kind registry per
# `DOCS/extensions/scope/FLOW-NODES.md` slice A: the composite
# `Static + Dynamic` registry is published behind an `ArcSwap` so
# slice B's `POST /admin/extensions/reload` can swap the dynamic half
# in place without disrupting `GET /api/node-kinds` readers.
arc-swap = { version = "1" }
schemars = { workspace = true }

# Extension-contributed flow node-kind adapter
# (`DOCS/extensions/scope/FLOW-NODES.md` slice A): brings the
# `contributed_node_kinds` walker + `UnboundNodeBehavior` placeholder
# the dynamic-registry seam plugs into. Path-dep across the
# `starter` ↔ `starter-extensions` workspace boundary mirrors the
# `starter-insights` ↔ `starter-ext-insights-*` arrows.
starter-ext-flow       = { path = "../../starter-extensions/crates/starter-ext-flow", version = "0.1.0" }
starter-ext-spi        = { path = "../../starter-extensions/crates/starter-ext-spi", version = "0.1.0" }
starter-ext-host       = { path = "../../starter-extensions/crates/starter-ext-host", version = "0.1.0" }
starter-ext-supervisor = { path = "../../starter-extensions/crates/starter-ext-supervisor", version = "0.1.0" }

# AI providers (Phase 4+).
starter-ai = { workspace = true, features = ["provider-claude", "provider-anthropic"] }

# Web stack.
axum         = { workspace = true }
prometheus   = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }
sqlx         = { workspace = true, features = ["postgres", "macros", "migrate", "runtime-tokio"] }
tokio        = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "signal"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = { workspace = true }
tracing      = { workspace = true }
utoipa       = { workspace = true }
anyhow       = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
chrono       = { workspace = true }
uuid         = { workspace = true }

[features]
default = []
# Opt-in: mount the starter-warehouse REST surface
# (`/api/marts`, `/api/sandboxes`, `/api/warehouse/{status,gc,audit}`)
# alongside flow-agent's existing routes. Requires a ClickHouse
# endpoint at `CLICKHOUSE_URL` (default `http://127.0.0.1:8123`).
warehouse = ["dep:starter-warehouse", "dep:starter-store-warehouse"]

[dev-dependencies]
starter-server         = { workspace = true, features = ["testing"] }
starter-ai             = { workspace = true, features = ["provider-claude", "provider-anthropic", "testing"] }
starter-store-postgres = { workspace = true, features = ["testing"] }
tower                  = { workspace = true, features = ["util"] }
http-body-util         = "0.1"
tempfile               = "3"

[lints]
workspace = true
