[package]
name        = "mqtt-driver"
description = "Process-flavour driver for the com.nube.mqtt flow-agent extension (DOCS/extensions/scope/FLOW-NODES.md slice B)."
version     = "0.1.0"
edition.workspace      = true
license.workspace      = true
repository.workspace   = true
rust-version.workspace = true
publish     = false

# The binary lands at `target/<profile>/mqtt-driver`. The bundle's
# `block.yaml` expects `bin/mqtt-driver` so the host loader can
# spawn it; the example Makefile copies the build artefact into the
# bundle's `bin/` after build. Splitting the crate from the bundle
# layout keeps cargo happy (one Cargo.toml per crate, the bundle
# stays a pure on-disk shape).
[[bin]]
name = "mqtt-driver"
path = "src/main.rs"

[dependencies]
# JSON-RPC stdio framing — same crate the supervisor uses on its
# end so framing can never drift between the two sides.
starter-jsonrpc-stdio = { path = "../../../../crates/starter-jsonrpc-stdio", version = "0.1.0" }

# MQTT client.
rumqttc     = "0.24"

# Async runtime + stdio.
tokio       = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
futures     = { workspace = true }

# JSON shapes mirror the host's wire types; we deliberately do NOT
# pull `starter-ext-spi` here — the driver is a stand-alone binary
# the user could re-implement in any language, and pulling spi
# would defeat that. The wire shapes (FLOW_NODE_INVOKE, stream.*)
# are stable constants documented in
# DOCS/extensions/scope/FLOW-NODES.md.
serde       = { workspace = true }
serde_json  = { workspace = true }
anyhow      = { workspace = true }
tracing     = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
