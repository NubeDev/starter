[package]
name    = "iot-anomaly-detector"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# Worked-example port (Warehouse SCOPE post-review walkthrough).
#
# The binary is a thin flow driver: MQTT messages flow into
# `tap.write` against the warehouse capability, a cleaner promotes
# raw_events → samples, and `mart.read` drives the anomaly verdict.
# The binary **must not** reach ClickHouse directly — all CH I/O
# is routed through `starter-warehouse` → `starter-store-clickhouse`.
# `cargo tree -p iot-anomaly-detector | grep -i clickhouse` should
# show the clickhouse crate reachable only via `starter-store-clickhouse`,
# never as a direct `clickhouse = "…"` entry on this crate.

[[bin]]
name = "iot-anomaly-detector"
path = "src/main.rs"

[dependencies]
# Warehouse capability + storage seams. Pulled with the
# `warehouse` feature ON so the runtime + dim freshness + W14
# filter validation are all available.
starter-warehouse        = { workspace = true, features = ["warehouse"] }
starter-store-postgres   = { workspace = true, features = ["dimensions"] }
starter-store-clickhouse = { workspace = true }
starter-tags             = { workspace = true }

# MQTT subscribe: same version the demo bundle under
# `examples/flow-agent/extensions/com.nube.mqtt` uses.
rumqttc  = "0.24"

# Runtime + glue.
tokio    = { workspace = true, features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
serde    = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
anyhow   = { workspace = true }
chrono   = { workspace = true }
tracing  = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
