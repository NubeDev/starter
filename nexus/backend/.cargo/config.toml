# ArkFlow's `arkflow-plugin` links `rdkafka` (the Kafka connector), whose
# cmake-vendored librdkafka build needs the system `curl/curl.h` header and
# `libcurl` at link time. On hosts without `libcurl4-openssl-dev` installed,
# drop the dev headers into `~/.local/{include,lib}` and these paths let the
# build find them without root. Where the distro package is installed normally,
# the extra search paths are harmless.
#
# This is the operational cost of Risk #4 (ArkFlow's connector deps): the plugin
# crate has no feature gates to exclude Kafka, so the whole backend inherits its
# native build requirements until that is fixed upstream.
[env]
CPATH = { value = "/home/user/.local/include", relative = false, force = false }
LIBRARY_PATH = { value = "/home/user/.local/lib", relative = false, force = false }
