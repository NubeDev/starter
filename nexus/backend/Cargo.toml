# Nexus backend — its own cargo workspace (a sibling of the root starter
# workspace, excluded from it). The separate lockfile keeps the backend's
# DataFusion/Arrow resolution from perturbing the root workspace.
[workspace]
resolver = "2"
members = [
    "crates/nexus-spi",
    "crates/nexus-engine",
    "crates/nexus-store",
    "crates/nexus-api",
    "crates/nexus-ai",
    "crates/nexus-skills",
]

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"

[workspace.dependencies]
# In-repo nexus crates (path deps within this workspace).
nexus-spi    = { path = "crates/nexus-spi" }
nexus-engine = { path = "crates/nexus-engine" }
nexus-store  = { path = "crates/nexus-store" }
nexus-ai     = { path = "crates/nexus-ai" }
nexus-skills = { path = "crates/nexus-skills" }

# Starter crates consumed from the root workspace via path deps. Path
# dependencies cross workspace boundaries freely; these are NOT forked.
starter-spi            = { path = "../../crates/starter-spi" }
starter-server         = { path = "../../crates/starter-server" }
starter-prefs          = { path = "../../crates/starter-prefs" }
starter-auth-users     = { path = "../../crates/starter-auth-users" }
starter-authz          = { path = "../../crates/starter-authz" }
starter-store-postgres = { path = "../../crates/starter-store-postgres" }
starter-config         = { path = "../../crates/starter-config" }
starter-observability  = { path = "../../crates/starter-observability" }
# WS-12 audit/undo: reuse the platform changelog read-side query API and the
# per-actor undo service + Reversible registry. nexus ships its own tenant-aware
# recorder/changelog over a tenant-scoped `nexus_changes` table (RLS), but the
# `Change`/`ChangeFilter`/`ReversibleRegistry`/`UndoService`/`PgUndoCursor` types
# are consumed unchanged.
starter-changelog      = { path = "../../crates/starter-changelog" }
starter-undo           = { path = "../../crates/starter-undo" }

# WS-14 extensions runtime. The `starter-extensions` kernel is a separate
# sibling cargo workspace (excluded from the root `starter` workspace), but its
# crates are consumed here by path the same way the `starter-*` crates are.
# These crates depend on `starter-spi`/`starter-server`/`starter-authz` via the
# *same* physical path deps nexus uses (`../../crates/...`), so Cargo unifies
# them to one copy and the `Authenticator`/`Role`/`Router<S>` types match across
# the seam.
starter-ext-spi        = { path = "../../starter-extensions/crates/starter-ext-spi" }
starter-ext-host       = { path = "../../starter-extensions/crates/starter-ext-host" }
starter-ext-server     = { path = "../../starter-extensions/crates/starter-ext-server" }
starter-ext-supervisor = { path = "../../starter-extensions/crates/starter-ext-supervisor" }
starter-ext-store-pg   = { path = "../../starter-extensions/crates/starter-ext-store-pg" }

# DataFusion / Arrow — the engine's vectorised core. Pinned to 47 (the version
# the native pipeline was cut over against). Free to bump post-cutover, before
# federation (RW-05) leans on newer sqlparser fixes.
datafusion = "47"

# Web + async stack — versions matched to the starter crates so the shared axum
# Router / utoipa OpenApi types unify across the dependency graph.
axum         = { version = "0.8", features = ["macros"] }
tower        = "0.5"
tower-http   = { version = "0.6", features = ["cors", "trace"] }
utoipa       = { version = "5", features = ["axum_extras", "uuid", "chrono"] }
tokio        = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "time"] }
tokio-util   = { version = "0.7", features = ["rt"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures      = "0.3"

sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "macros", "migrate", "uuid", "chrono", "json"] }

serde      = { version = "1", features = ["derive"] }
serde_json = "1"
# Declarative kind packs (WS-10): YAML manifest + JSON-Schema param validation.
# Both versions are the ones already resolved in the graph (via zag-agent), so
# adding them as direct deps pulls nothing new.
serde_yaml = "0.9"
jsonschema = { version = "0.29", default-features = false }
uuid       = { version = "1", features = ["v4", "serde"] }
chrono     = { version = "0.4", default-features = false, features = ["serde", "clock"] }

async-trait = "0.1"
thiserror   = "1"
tracing     = "0.1"

# MQTT client for the optional `mqtt` datasource connector (WS-08b). Pulled in
# only when the `mqtt` feature is enabled — OFF by default per HOW-TO-CODE §9, so
# a build without device connectors carries none of its transitive deps. `url`
# off keeps the surface to the broker host/port/credentials nexus already models.
rumqttc = { version = "0.24", default-features = false, features = ["use-rustls"] }

# Crypto for the R6 envelope encryption and R8 stream-token signing.
aes-gcm = "0.10"
hmac    = "0.12"
sha2    = "0.10"
rand    = "0.8"
base64  = "0.22"

# Test-only.
testcontainers         = "0.23"
testcontainers-modules = { version = "0.11", features = ["postgres"] }
reqwest                = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tracing-subscriber     = { version = "0.3", features = ["env-filter"] }
