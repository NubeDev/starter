[package]
name = "nexus-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nexus control plane — Axum binary composing auth/authz/product routers over the engine and store."
default-run = "nexus-api"

[dependencies]
nexus-spi.workspace = true
nexus-engine.workspace = true
nexus-store.workspace = true
# The `agent` feature pulls in the zag tier so sessions can drive the local
# coding-agent CLIs (Claude Code, Codex, Gemini, Ollama) using their own auth —
# no provider API key needed. The `inference` (genai) tier stays on by default
# for raw-provider backends.
nexus-ai = { workspace = true, features = ["agent"] }
nexus-skills.workspace = true

# `preferences` (which pulls `units`) is enabled so handlers can name the
# `ResolvedPreferences` / `Quantity` / `Unit` types for WS-11 units conversion.
# `changelog` gates the `Change`/`Actor`/`Reversible` types WS-12 records with.
starter-spi = { workspace = true, features = ["preferences", "changelog"] }
starter-server.workspace = true
# WS-12 audit/undo: the read-side query API + the undo service, registry,
# `record_if_reversible` helper, undo router, and Postgres redo cursor. The
# tenant-aware recorder/changelog live in nexus-store; these are reused as-is.
starter-changelog.workspace = true
starter-undo = { workspace = true, features = ["postgres"] }
# WS-11: reuse the platform preference store (PG) + three-layer resolver rather
# than reinventing them. `postgres` enables `PgPrefsStore`. The nexus routes pin
# the workspace to the caller's tenant (so isolation is not the spoofable starter
# `?org=`), so the starter `routes`/`middleware` features are deliberately off.
starter-prefs = { workspace = true, features = ["postgres"] }
starter-auth-users = { workspace = true, features = ["postgres"] }
starter-authz = { workspace = true, features = ["postgres"] }
starter-store-postgres.workspace = true
starter-config.workspace = true
starter-observability.workspace = true

# WS-14 extensions runtime. `starter-ext-server` mounts the admin router
# (`/extensions/*`) over nexus's `starter-server` auth stack; `-host` scans +
# seals the manifest registry at boot; `-supervisor` keeps process-flavour
# extensions running (+ reaper); `-store-pg` persists enablement; `-spi` carries
# the shared `Manifest`/`ExtensionId`/`Capability` types.
starter-ext-spi.workspace = true
starter-ext-host.workspace = true
starter-ext-server.workspace = true
starter-ext-supervisor.workspace = true
starter-ext-store-pg.workspace = true

axum.workspace = true
tower.workspace = true
tower-http.workspace = true
utoipa.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
futures.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
# WS-10 kinds: parse the YAML pack manifest and validate caller params against
# each kind's JSON Schema before binding.
serde_yaml.workspace = true
jsonschema.workspace = true
uuid.workspace = true
chrono.workspace = true

async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# R8 stream-token signing.
hmac.workspace = true
sha2.workspace = true
base64.workspace = true

# Alert webhook + Slack notification delivery.
reqwest.workspace = true

# Alert email (SMTP) notification delivery. rustls TLS keeps the build free of a
# system OpenSSL dependency.
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1-rustls-tls", "pool", "hostname"] }

[features]
# Pulls in the starter-server test harness (TestApp) and the testcontainers
# Postgres helper for HTTP integration tests. Off by default so production
# builds stay lean.
testing = ["starter-server/testing", "starter-store-postgres/testing", "nexus-store/testing"]

[[bin]]
name = "nexus-api"
path = "src/main.rs"

# Dumps the OpenAPI document to stdout/file for the frontend codegen. Kept as a
# separate bin so the contract can be regenerated without starting the server.
[[bin]]
name = "nexus-openapi"
path = "src/bin/openapi.rs"

# Idempotent bootstrap: seed an admin tenant + user + admin grant into a fresh
# database. Run via `make seed`.
[[bin]]
name = "seed-admin"
path = "src/bin/seed_admin.rs"

[dev-dependencies]
reqwest.workspace = true
sqlx.workspace = true
tokio = { workspace = true, features = ["test-util", "io-util", "net"] }
tokio-util = { workspace = true, features = ["io"] }
futures.workspace = true
starter-store-postgres.workspace = true

[[test]]
name = "routes_query_run"
path = "tests/routes/query/run_test.rs"

[[test]]
name = "routes_datasources_query_e2e"
