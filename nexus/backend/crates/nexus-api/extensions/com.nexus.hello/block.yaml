v: 1
id: com.nexus.hello
version: 0.1.0
display_name: "Nexus Hello"
description_file: docs/README.md
authors: ["ap@nube-io.com"]

# The simplest flavour: `builtin` has no process to supervise — the value here
# is the *contributions*, not a running binary. This extension demonstrates the
# WS-14 backend-contribution path end to end:
#
#   - `contributes.warehouse_templates[]` → nexus query-kinds (the dispatcher's
#     third source). On boot they are linted and materialised into
#     `nexus_extension_query_kinds`; a `POST /query { kind: "com.nexus.hello.ping" }`
#     resolves and runs them; `DELETE /extensions/com.nexus.hello?purge=true`
#     removes them via the query-kind cleanup provider.
#   - `contributes.ui` → a federation panel the FE host mounts into the sidebar
#     slot. `ui/remoteEntry.js` is BUILT from `ui-src/` (vite library mode, React
#     external — resolved to the host's instance via the importmap in
#     nexus/ui/index.html). Rebuild with `pnpm -C ui-src build`; the panel runs
#     this extension's own contributed kind and renders the result, proving the
#     whole loop.
runtime:
  kind: builtin
  crate_name: nexus_hello_ext

contributes:
  warehouse_templates:
    # A self-contained kind that needs no fixture table: it echoes a greeting and
    # the server clock. `tables: []` means the lint requires no
    # `$caller_tenant_id` predicate, so the example is robust on a fresh DB.
    - name: com.nexus.hello.ping
      params_schema: kinds/ping_params.json
      sql_file: kinds/ping.sql
      tables: []
    # A second kind taking a param, to show schema validation flows through the
    # same path file-pack kinds use.
    - name: com.nexus.hello.echo
      params_schema: kinds/echo_params.json
      sql_file: kinds/echo.sql
      tables: []

  ui:
    entry: ui/remoteEntry.js
    exposes:
      - { name: HelloPanel, module: "./Panel", slot: sidebar }
