# Built-in datasource-kinds pack (WS-10 §4.1B declaration format).
#
# Each entry declares a connector *type* as files: a JSON-Schema config, which
# config fields are secrets, how connectivity is tested before save, and (for a
# query connector) the SQL dialect its time macros render in. Adding a connector
# is a manifest entry + a thin per-protocol builder, not a Rust enum edited
# across DTOs, forms, and the registry. Field names mirror the query-kind
# manifest mental model.
datasource_kinds:
  # The first and (today) only queryable connector. Mirrors the existing
  # Postgres-shaped datasource record; declared here so the catalogue is uniform
  # and a future config-form is schema-driven rather than hard-coded.
  - name: postgres
    surface: query
    config_schema: postgres_config.json
    secret_fields: [password]
    dialect: postgres
    test:
      mode: query
      query: SELECT 1
    description: SQL database queried over Postgres (DataFusion sql input).

  # A live device-telemetry source. MQTT is a stream connector: it feeds live
  # panels and flows by subscribing to a topic, not an ad-hoc `POST /query`
  # target. Its connect probe (open a session + immediately close) needs the
  # `mqtt` cargo feature (rumqttc), which is OFF by default per HOW-TO-CODE §9.
  - name: mqtt
    surface: stream
    config_schema: mqtt_config.json
    secret_fields: [password]
    test:
      mode: connect
    description: MQTT broker subscription for live device telemetry (stream source).

  # An Eclipse Zenoh subscription source (RW-09). Like MQTT it is a stream
  # connector — it feeds live panels and flows by subscribing to a key
  # expression, not an ad-hoc `POST /query` target. Holds no secret today
  # (endpoint + key only). Its connect probe (open a session + scout, bounded
  # timeout) needs the engine's `zenoh` cargo feature, OFF by default per
  # roadmap §8, mirroring the MQTT feature gate.
  - name: zenoh
    surface: stream
    config_schema: zenoh_config.json
    test:
      mode: connect
    description: Eclipse Zenoh key-expression subscription for live telemetry (stream source).

  # File-backed query connectors for federation (RW-05). A Parquet/CSV file is a
  # read-only `POST /query` target the engine reads natively (DataFusion file
  # input) and can join against a SQL datasource in one federated statement. It
  # holds no secret — the config is a server-local path — so its probe is a
  # `connect` (open/stat the file), not a credentialed round-trip.
  - name: parquet
    surface: query
    config_schema: parquet_config.json
    test:
      mode: connect
    description: Parquet file read natively by the engine (federated query input).

  - name: csv
    surface: query
    config_schema: csv_config.json
    test:
      mode: connect
    description: CSV file read natively by the engine (federated query input).
