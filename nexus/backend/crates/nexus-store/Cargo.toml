[package]
name = "nexus-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nexus persistence — sqlx/Postgres with RLS, tenant transactions, envelope-encrypted secrets."

[dependencies]
nexus-spi.workspace = true
starter-spi.workspace = true
starter-store-postgres.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true
futures.workspace = true

async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

# R6 envelope encryption.
aes-gcm.workspace = true
rand.workspace = true
base64.workspace = true

[features]
# Mirrors starter-store-postgres: gates the testcontainers harness so the heavy
# docker-backed deps stay out of normal builds.
testing = ["starter-store-postgres/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util", "macros", "rt-multi-thread"] }
sqlx.workspace = true
testcontainers.workspace = true
testcontainers-modules.workspace = true

[[test]]
name = "query_run"
path = "tests/query/run_test.rs"

# Pure binder tests — no database, so deliberately not behind the `testing`
# feature: these run in a normal `cargo test`.
[[test]]
name = "query_bind"
path = "tests/query/bind_test.rs"

[[test]]
name = "tenant_pool_leak"
path = "tests/tenant/pool_leak_test.rs"

[[test]]
name = "datasource_crud"
path = "tests/datasource/crud_test.rs"

[[test]]
name = "datasource_postgres_connect"
path = "tests/datasource/postgres/connect_test.rs"

[[test]]
name = "dashboard_crud"
path = "tests/dashboard/crud_test.rs"

[[test]]
name = "flow_crud"
path = "tests/flow/crud_test.rs"

[[test]]
name = "alert_crud"
path = "tests/alert/crud_test.rs"

[[test]]
name = "tag_crud"
path = "tests/tag/crud_test.rs"
