[package]
name = "nexus-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Nexus persistence — sqlx/Postgres with RLS, tenant transactions, envelope-encrypted secrets."

[dependencies]
nexus-spi.workspace = true
starter-spi.workspace = true
starter-store-postgres.workspace = true

sqlx.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
chrono.workspace = true

async-trait.workspace = true
thiserror.workspace = true
tracing.workspace = true

# R6 envelope encryption.
aes-gcm.workspace = true
rand.workspace = true
base64.workspace = true

[features]
# Mirrors starter-store-postgres: gates the testcontainers harness so the heavy
# docker-backed deps stay out of normal builds.
testing = ["starter-store-postgres/testing"]

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
testcontainers.workspace = true
testcontainers-modules.workspace = true
