# `com.nexus.hello` — process flavour. A real supervised child the host
# spawns, health-checks, restarts, and reports live stats for (the genuine
# "load/unload an extension" experience, vs. a builtin config bundle).
#
# Member of the `nexus/extensions/` sibling workspace; path-deps on
# `starter-ext-sdk` with the `process` feature (the stdio JSON-RPC entry-point
# glue). The built binary is installed next to `block.yaml` as the manifest's
# `runtime.bin`, where the supervisor execs it.
[package]
name        = "nexus-hello-extension"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true

[[bin]]
name = "nexus-hello-extension"
path = "src/main.rs"

[dependencies]
starter-ext-sdk = { path = "../../../../starter-extensions/crates/starter-ext-sdk", default-features = false, features = ["process"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "time"] }
