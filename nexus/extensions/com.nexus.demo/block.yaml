v: 1
id: com.nexus.demo
version: 0.1.0
display_name: "Nexus Demo"
description_file: docs/README.md
authors: ["ap@nube-io.com"]

# A fuller WS-14 example than `com.nexus.hello`: where hello proves the
# minimal contribution loop, this one demonstrates a real **page** an
# extension owns — reached from a sidebar nav item, rendered in the host's
# main content area as a shadcn-styled dashboard.
#
# Mechanism (ported from rubix's `com.nubeio.rubixos`):
#   - `DemoNav`  → `slot: sidebar-nav` — a nav entry. Its `<a href>` points at
#     `/x/com.nexus.demo`; the host's sidebar interceptor turns the click into
#     SPA navigation.
#   - `Main`     → `slot: main` — the page body. The host route `/x/:extId/*`
#     mounts it into the content area and forwards the path tail as the slot
#     route, so `Main` dispatches its own sub-pages via `useExtensionRoute()`.
#
# Still `builtin` (no process to supervise) — the value is the contributions,
# not a running binary. The query-kinds + insight below back the page's data.
runtime:
  kind: builtin
  crate_name: nexus_demo_ext

contributes:
  warehouse_templates:
    # Self-contained kind (no fixture table): echoes a greeting + server clock,
    # so the page has live data to render on a fresh DB.
    - name: com.nexus.demo.ping
      params_schema: kinds/ping_params.json
      sql_file: kinds/ping.sql
      tables: []
    # A param-taking kind, to show schema validation on the same path.
    - name: com.nexus.demo.echo
      params_schema: kinds/echo_params.json
      sql_file: kinds/echo.sql
      tables: []

  insights:
    - name: com.nexus.demo.zscore
      script_file: insights/zscore.rhai
      params_schema: insights/zscore_params.json

  ui:
    entry: ui/remoteEntry.js
    exposes:
      # The full page, mounted by the host's `/x/:extId/*` route.
      - { name: Main, module: "./Main", slot: main }
      # The sidebar nav entry that links to that page.
      - { name: DemoNav, module: "./Nav", slot: sidebar-nav }
