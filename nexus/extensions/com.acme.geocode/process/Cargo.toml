# `com.acme.geocode` — process flavour. The WS-18 callee: serves a `lookup` tool
# that another extension invokes via `extension.call`.
[package]
name        = "acme-geocode-extension"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
publish.workspace      = true
rust-version.workspace = true

[[bin]]
name = "acme-geocode-extension"
path = "src/main.rs"

[dependencies]
starter-ext-sdk = { path = "../../../../starter-extensions/crates/starter-ext-sdk", default-features = false, features = ["process"] }
tokio = { version = "1", default-features = false, features = ["rt", "macros", "io-std", "io-util", "time"] }
