# Standalone POC — intentionally outside the repo's root workspace.
[workspace]

[package]
name = "nexus-arkflow-poc"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "POC backend that embeds the ArkFlow engine and exposes a config-builder API"

[dependencies]
# Vendored + trimmed (see vendor/arkflow/crates/arkflow-plugin/Cargo.toml header):
# the heavy native connectors are disabled so the POC builds toolchain-free.
arkflow-core = { path = "../vendor/arkflow/crates/arkflow-core" }
arkflow-plugin = { path = "../vendor/arkflow/crates/arkflow-plugin" }

axum = "0.7"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.6", features = ["cors", "trace"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# Matches the DataFusion (and therefore Arrow) version ArkFlow pins, so the
# RecordBatch we receive in the collector sink is the same arrow type.
datafusion = "47"

once_cell = "1"
uuid = { version = "1", features = ["v4"] }
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = "0.3"
